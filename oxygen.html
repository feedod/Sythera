          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") this.pullRemote();
          });
        },
        purchaseAccess() {
          if (this.paying) return;
          haptic();
          this.paying = true;
          tg.openInvoice(INVOICE_URL, (status) => this.onInvoiceClosed(status));
        },
        async onInvoiceClosed(status) {
          this.paying = false;
          if (status === "paid") {
            notify("success");
            playSuccessSound();
            await saveLicense();
            app().access = true;
            app().loading = true;
            await this.bootstrap();
            showToast("Оплата подтверждена. Доступ активирован");
          } else if (status === "failed") {
            notify("error");
            showToast("Платёж не прошёл. Попробуйте ещё раз", "err");
          } else if (status === "pending") {
            showToast("Платёж обрабатывается Telegram", "warn");
          } else {
            selectionHaptic();
          }
        },
        validateActiveTab() {
          if (this.activeTab !== "all" && !this.dateTabs.some((t) => t.key === this.activeTab))
            this.activeTab = "all";
          if (this.activeCat !== "all" && !this.catTabs.some((t) => t.key === this.activeCat))
            this.activeCat = "all";
        },
        hydrateInfo() {
          if (!app().settings.fetchInfo) return;
          const run = () => {
            for (const item of app().items) {
              if (!item.infoAt) resolveInfo(item.id, item.code);
            }
          };
          if ("requestIdleCallback" in window) requestIdleCallback(run, { timeout: 1200 });
          else queueMicrotask(run);
        },
        applyTheme() {
          const dark = tg.colorScheme === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          tg.setHeaderColor("secondary_bg_color");
          tg.setBackgroundColor("secondary_bg_color");
          tg.setBottomBarColor("secondary_bg_color");
          app().items = app().items.map((item) => ({ ...item, bcOk: false, bcErr: false }));
        },
        applyInsets() {
          const root = document.documentElement.style;
          const sa = tg.safeAreaInset ?? {};
          const csa = tg.contentSafeAreaInset ?? {};
          root.setProperty("--safe-top", `${sa.top ?? 0}px`);
          root.setProperty("--safe-bottom", `${sa.bottom ?? 0}px`);
          root.setProperty("--safe-left", `${Math.max(sa.left ?? 0, csa.left ?? 0)}px`);
          root.setProperty("--safe-right", `${Math.max(sa.right ?? 0, csa.right ?? 0)}px`);
          root.setProperty("--content-top", `${csa.top ?? 0}px`);
          root.setProperty("--content-bottom", `${csa.bottom ?? 0}px`);
        },
        updateClosingConfirmation() {
          if (app().items.length) tg.enableClosingConfirmation();
          else tg.disableClosingConfirmation();
        },
        backHandler: null,
        updateBackButton() {
          const needed = this.sheetOpen || this.editorOpen || this.searchFocused;
          if (needed && !this.backHandler) {
            this.backHandler = () => {
              if (this.editorOpen) this.closeEditor();
              else if (this.sheetOpen) this.closeSheet();
              else this.exitSearch();
            };
            tg.BackButton.onClick(this.backHandler);
            tg.BackButton.show();
          } else if (!needed && this.backHandler) {
            tg.BackButton.offClick(this.backHandler);
            this.backHandler = null;
            tg.BackButton.hide();
          }
        },
        openSheet() {
          haptic();
          const el = this.$refs.sheet;
          el.style.translate = "";
          el.style.setProperty("--sheet-dim", "1");
          el.classList.remove("is-dragging");
          this.sheetOpen = true;
          el.showModal();
          this.updateBackButton();
        },
        closeSheet() {
          const el = this.$refs.sheet;
          this.sheetOpen = false;
          el.style.translate = "";
          el.style.setProperty("--sheet-dim", "1");
          el.classList.remove("is-dragging");
          if (el.open) el.close();
          this.updateBackButton();
        },
        onSheetNativeClose() {
          this.sheetOpen = false;
          this.updateBackButton();
        },
        bindSheet(el) {
          if (el.dataset.bound) return;
          el.dataset.bound = "1";
          const gesture = new TinyGesture(el, {
            threshold: (type) => (type === "y" ? 8 : Infinity),
          });
          const state = { y: 0, lastY: 0, lastT: 0, vel: 0, active: false };
          const apply = (y) => {
            state.y = y;
            el.style.translate = `0 ${y}px`;
            el.style.setProperty("--sheet-dim", String(Math.max(0.2, 1 - y / 420)));
          };
          gesture.on("panstart", () => {
            for (const a of el.getAnimations()) a.cancel();
            state.y = 0;
            state.lastY = 0;
            state.lastT = performance.now();
            state.vel = 0;
            state.active = false;
          });
          gesture.on("panmove", () => {
            const my = gesture.touchMoveY ?? 0;
            const mx = gesture.touchMoveX ?? 0;
            if (!state.active) {
              if (my < 10 || Math.abs(mx) > Math.abs(my)) return;
              state.active = true;
              el.classList.add("is-dragging");
            }
            const y = Math.max(0, my);
            const now = performance.now();
            const dt = now - state.lastT;
            if (dt > 0) state.vel = state.vel * 0.55 + ((y - state.lastY) / dt) * 0.45;
            state.lastY = y;
            state.lastT = now;
            if (y > 108 && state.lastY <= 108) selectionHaptic();
            apply(y);
          });
          gesture.on("panend", () => {
            if (!state.active) return;
            el.classList.remove("is-dragging");
            const flick = state.vel > 0.65;
            if (state.y > 108 || flick) {
              this.dismissSheet(state.y);
              return;
            }
            const from = state.y;
            const anim = el.animate(
              [{ translate: `0 ${from}px` }, { translate: "0 0" }],
              { duration: reduceMotion ? 120 : 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" },
            );
            anim.finished
              .then(() => {
                anim.cancel();
                apply(0);
              })
              .catch(() => apply(0));
          });
        },
        async dismissSheet(from = 0) {
          const el = this.$refs.sheet;
          const height = el.getBoundingClientRect().height || 420;
          haptic();
          await el
            .animate(
              [{ translate: `0 ${from}px` }, { translate: `0 ${height + 24}px` }],
              { duration: reduceMotion ? 120 : 260, easing: "cubic-bezier(0.32, 0.72, 0, 1)", fill: "forwards" },
            )
            .finished.catch(() => {});
          this.closeSheet();
        },
        async toggleFetchInfo() {
          selectionHaptic();
          const next = !app().settings.fetchInfo;
          app().settings = { fetchInfo: next };
          await saveSettings(app().settings);
          if (next) this.hydrateInfo();
        },
        openChannel() {
          haptic();
          tg.openTelegramLink(CHANNEL_URL);
        },
        async pullRemote() {
          const remote = await cloudLoad();
          if (!Array.isArray(remote)) return;
          const decorated = remote.map(sanitizeRecord).filter(Boolean);
          const incoming = mergeItems(decorated, []);
          const incomingSig = signature(incoming);
          if (incomingSig === lastRemoteSig || incomingSig === signature(app().items)) return;
          lastRemoteSig = incomingSig;
          const before = signature(app().items);
          app().items = mergeItems(app().items, incoming);
          if (signature(app().items) === before) return;
          schedulePersist();
          showToast("Список обновлён с другого устройства");
        },
        openEditor(item) {
          haptic();
          this.editDraft = {
            id: item.id,
            name: item.name ?? "",
            category: item.category ?? "",
            store: item.store ?? "",
          };
          this.editorOpen = true;
          this.$refs.editor.showModal();
          this.updateBackButton();
        },
        closeEditor() {
          this.editorOpen = false;
          if (this.$refs.editor.open) this.$refs.editor.close();
          tg.hideKeyboard();
          this.updateBackButton();
        },
        onEditorClose() {
          this.editorOpen = false;
          this.updateBackButton();
        },
        saveEditor() {
          const draft = this.editDraft;
          const name = draft.name.trim() || null;
          const category = draft.category.trim() || null;
          const store = draft.store.trim() || null;
          app().items = app().items.map((item) =>
            item.id === draft.id
              ? {
                  ...item,
                  name,
                  category,
                  store,
                  nameUser: Boolean(name),
                  categoryUser: Boolean(category),
                }
              : item,
          );
          schedulePersist();
          this.closeEditor();
          showToast("Карточка сохранена");
          notify("success");
        },
        refreshInfo(item) {
          haptic();
          item.infoAt = null;
          resolveInfo(item.id, item.code);
          showToast("Обновляем данные…");
        },
        async exportList() {
          haptic();
          const text = app()
            .items.map((i) =>
              [i.name, i.code, i.price ? `${i.price} ₽` : null, i.date, i.store, i.category]
                .filter(Boolean)
                .join(" · "),
            )
            .join("\n");
          if (!text) {
            showToast("Список пуст", "warn");
            return;
          }
          try {
            if (navigator.share) {
              await navigator.share({ title: "Control", text });
              return;
            }
            await navigator.clipboard.writeText(text);
            showToast("Список скопирован");
            notify("success");
          } catch (error) {
            if (Error.isError(error) && error.name === "AbortError") return;
            await this.copyText(text);
          }
        },
        addHome() {
          haptic();
          tg.addToHomeScreen();
          tg.checkHomeScreenStatus?.((status) => {
            this.homeStatus = status || this.homeStatus;
            if (status === "added") showToast("Ярлык добавлен");
          });
        },
        withTransition(fn) {
          if (document.startViewTransition && !reduceMotion) {
            document.startViewTransition(() => {
              fn();
              return this.$nextTick();
            });
          } else {
            fn();
          }
        },
        selectTab(key) {
          if (this.activeTab === key) return;
          selectionHaptic();
          scrollTo({ top: 0, behavior: reduceMotion ? "instant" : "smooth" });
          this.withTransition(() => {
            this.activeTab = key;
          });
        },
        selectCat(key) {
          if (this.activeCat === key) return;
          selectionHaptic();
          this.withTransition(() => {
            this.activeCat = key;
          });
        },
        onSearchFocus() {
          this.searchFocused = true;
          scrollTo({ top: 0, behavior: reduceMotion ? "instant" : "smooth" });
          this.updateBackButton();
        },
        onContentTap(event) {
          if (event.target.closest("button, input, canvas, .well, dialog")) return;
          if (this.searchFocused && document.activeElement === this.$refs.searchInput) {
            this.$refs.searchInput.blur();
            tg.hideKeyboard();
          }
        },
        clearSearch() {
          this.query = "";
          this.debouncedQuery = "";
          this.searchDebounced?.cancel();
          this.$refs.searchInput?.focus();
        },
        exitSearch() {
          this.query = "";
          this.debouncedQuery = "";
          this.searchDebounced?.cancel();
          this.searchFocused = false;
          this.$refs.searchInput?.blur();
          tg.hideKeyboard();
          this.updateBackButton();
        },
        toggleMultiScan() {
          selectionHaptic();
          this.multiScan = !this.multiScan;
        },
        pruneGestures() {
          for (const g of [...gestures]) {
            if (g.element && !g.element.isConnected) {
              g.destroy();
              gestures.delete(g);
            }
          }
        },
        mountCard(wrapper, id) {
          if (freshIds.has(id)) {
            freshIds.delete(id);
            enterCard(wrapper);
          }
          const card = wrapper.querySelector(".card");
          if (!card || wrapper.hasAttribute("data-gesture")) return;
          wrapper.setAttribute("data-gesture", "");
          const gesture = new TinyGesture(card, {
            threshold: (type) => (type === "x" ? 10 : Infinity),
          });
          gestures.add(gesture);
          const state = { base: 0, x: 0, lastX: 0, lastT: 0, vel: 0, active: false };
          gesture.on("panstart", () => {
            const current = readX(card);
            for (const a of card.getAnimations()) a.cancel();
            state.base = current;
            state.x = current;
            state.lastX = current;
            state.lastT = performance.now();
            state.vel = 0;
            state.active = false;
            card.style.transform = current ? `translateX(${current}px)` : "";
          });
          gesture.on("panmove", () => {
            const mx = gesture.touchMoveX ?? 0;
            const my = gesture.touchMoveY ?? 0;
            if (!state.active) {
              if (Math.abs(mx) < 8 || Math.abs(my) > Math.abs(mx)) return;
              state.active = true;
              card.style.willChange = "transform";
            }
            const x = rubberBand(state.base + mx, REVEAL);
            const now = performance.now();
            const dt = now - state.lastT;
            if (dt > 0) state.vel = state.vel * 0.6 + ((x - state.lastX) / dt) * 0.4;
            state.lastX = x;
            state.lastT = now;
            state.x = x;
            card.style.transform = `translateX(${x}px)`;
            const amt = Math.min(1, Math.abs(x) / REVEAL);
            wrapper.style.setProperty("--reveal", String(amt));
            wrapper.style.setProperty("--reveal-del", String(x < 0 ? amt : 0));
            wrapper.style.setProperty("--reveal-edit", String(x > 0 ? amt : 0));
          });
          gesture.on("panend", () => {
            card.style.willChange = "";
            if (!state.active) {
              if (!state.base) card.style.transform = "";
              return;
            }
            const width = wrapper.getBoundingClientRect().width || 320;
            const flickDel = state.vel < -1 && state.x < -REVEAL * 0.5;
            const flickEdit = state.vel > 1 && state.x > REVEAL * 0.5;
            if (state.x < -width * 0.4 || flickDel) {
              this.removeItem(id, state.vel);
              return;
            }
            if (state.x > width * 0.4 || flickEdit) {
              const item = app().items.find((i) => i.id === id);
              const anim = springX(card, state.x, 0, state.vel * 1000);
              anim.finished
                .then(() => {
                  anim.cancel();
                  card.style.transform = "";
                  wrapper.style.setProperty("--reveal-del", "0");
                  wrapper.style.setProperty("--reveal-edit", "0");
                })
                .catch(() => {});
              if (item) this.openEditor(item);
              return;
            }
            const anim = springX(card, state.x, 0, state.vel * 1000);
            anim.finished
              .then(() => {
                anim.cancel();
                card.style.transform = "";
                wrapper.style.setProperty("--reveal-del", "0");
                wrapper.style.setProperty("--reveal-edit", "0");
              })
              .catch(() => {});
          });
        },
        scannerOpen: false,
        onScannerClosed: null,
        openScanner() {
          if (this.scannerOpen) return;
          this.scannerOpen = true;
          haptic();
          tg.showScanQrPopup(
            {
              text: this.multiScan
                ? "Мультискан. Наведите камеру на QR-код ценника"
                : "Наведите камеру на QR-код ценника",
            },
            (result) => {
              if (!result) {
                this.scannerOpen = false;
                return true;
              }
              return this.processScan(result);
            },
          );
          this.onScannerClosed = () => {
            this.scannerOpen = false;
            tg.offEvent("scanQrPopupClosed", this.onScannerClosed);
            this.onScannerClosed = null;
          };
          tg.onEvent("scanQrPopupClosed", this.onScannerClosed);
        },
        closeScanner() {
          tg.closeScanQrPopup();
          this.scannerOpen = false;
        },
        processScan(raw) {
          const parsed = parseCEN(raw);
          if (!parsed) {
            notify("error");
            haptic("medium");
            if (this.multiScan) return false;
            showToast("Поддерживаются только коды в формате CEN", "err");
            this.closeScanner();
            return true;
          }
          const incomingPrice = formatPrice(parsed.price);
          const incomingTicketTs = ticketDateToTs(parsed.date);
          const existing = app().items.find((i) => i.code === parsed.code);
          if (!existing) {
            notify("success");
            haptic();
            playSuccessSound();
            this.insertItem(parsed, incomingPrice, incomingTicketTs);
            if (this.multiScan) return false;
            showToast(`Код ${parsed.code} добавлен`);
            this.closeScanner();
            return true;
          }
          const sameDate = (existing.ticketTs ?? null) === (incomingTicketTs ?? null);
          const samePrice = (existing.price ?? null) === (incomingPrice ?? null);
          const changed = this.updateItem(existing, parsed, incomingPrice, incomingTicketTs);
          if (!changed && sameDate && samePrice) {
            notify("warning");
            haptic("medium");
            if (this.multiScan) return false;
            showToast(`Код ${parsed.code} уже в списке`, "warn");
            this.closeScanner();
            return true;
          }
          notify("success");
          haptic();
          playSuccessSound();
          if (this.multiScan) return false;
          showToast(`Карточка ${parsed.code} обновлена`);
          this.closeScanner();
          return true;
        },
        updateItem(existing, parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history = (existing.history ?? []).slice();
          let changed = false;
          if (incomingPrice && parsed.date && incomingTicketTs != null) {
            const idx = history.findIndex((h) => h.ticketTs === incomingTicketTs);
            const entry = { price: incomingPrice, date: parsed.date, ticketTs: incomingTicketTs, ts: now };
            if (idx === -1) {
              history.push(entry);
              changed = true;
            } else if (history[idx].price !== incomingPrice) {
              history[idx] = entry;
              changed = true;
            }
          }
          history.sort((a, b) => a.ticketTs - b.ticketTs);
          const latest = history.at(-1) ?? null;
          const priceChanged = (existing.price ?? null) !== (latest ? latest.price : existing.price);
          const dateChanged = (existing.date ?? null) !== (latest ? latest.date : existing.date);
          const rawChanged = (existing.raw ?? null) !== parsed.raw;
          if (priceChanged || dateChanged || rawChanged) changed = true;
          if (!changed) return false;
          app().items = sortItems(
            app().items.map((i) =>
              i.id === existing.id
                ? {
                    ...i,
                    raw: parsed.raw,
                    history,
                    price: latest ? latest.price : i.price,
                    date: latest ? latest.date : i.date,
                    ticketTs: latest ? latest.ticketTs : i.ticketTs,
                    ts: now,
                  }
                : i,
            ),
          );
          schedulePersist();
          this.flash(existing.id);
          return true;
        },
        flash(id) {
          this.$nextTick(() => {
            const card = document.querySelector(`.card[data-card-id="${cssEscape(id)}"]`);
            if (card) flashCard(card);
          });
        },
        insertItem(parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history =
            incomingPrice && parsed.date && incomingTicketTs != null
              ? [{ price: incomingPrice, date: parsed.date, ticketTs: incomingTicketTs, ts: now }]
              : [];
          const item = createItem({
            code: parsed.code,
            raw: parsed.raw,
            price: incomingPrice,
            date: parsed.date,
            ticketTs: incomingTicketTs,
            history,
            ts: now,
          });
          freshIds.add(item.id);
          const next = [item, ...app().items];
          if (!app().items.length) this.withTransition(() => { app().items = next; });
          else app().items = next;
          schedulePersist();
          resolveInfo(item.id, parsed.code);
          if (this.multiScan) this.flash(item.id);
        },
        async removeItem(id, velocity = 0) {
          const item = app().items.find((i) => i.id === id);
          if (!item) return;
          haptic("medium");
          const wrapper = document.querySelector(`.swipe[data-id="${cssEscape(id)}"]`);
          const card = wrapper?.querySelector(".card");
          if (wrapper && card) {
            const width = wrapper.getBoundingClientRect().width || 320;
            const current = readX(card);
            for (const a of card.getAnimations()) a.cancel();
            const distance = width + current;
            const speed = Math.max(0.9, Math.abs(velocity));
            const duration = reduceMotion ? 120 : Math.max(120, Math.min(240, distance / speed));
            await card
              .animate(
                [
                  { transform: `translateX(${current}px)`, opacity: 1 },
                  { transform: `translateX(${-width}px)`, opacity: 0.4 },
                ],
                { duration, easing: "cubic-bezier(0.2, 0, 0.6, 1)", fill: "forwards" },
              )
              .finished.catch(() => {});
            const height = wrapper.getBoundingClientRect().height;
            await wrapper
              .animate(
                [
                  { blockSize: `${height}px`, marginBlockStart: "10px", opacity: 1 },
                  { blockSize: "0px", marginBlockStart: "0px", opacity: 0 },
                ],
                { duration: reduceMotion ? 120 : 180, easing: EASE, fill: "forwards" },
              )
              .finished.catch(() => {});
          }
          const snapshot = createItem(structuredClone(toStored(item)));
          app().items = app().items.filter((i) => i.id !== id);
          schedulePersist();
          pendingUndo = snapshot;
          showToast("Удалено", "ok", { label: "Отменить", run: () => this.undoDelete() }, UNDO_MS);
        },
        undoDelete() {
          if (!pendingUndo) return;
          const item = pendingUndo;
          pendingUndo = null;
          clearTimeout(toastTimer);
          hideToast();
          haptic();
          freshIds.add(item.id);
          app().items = mergeItems(app().items, [item]);
          schedulePersist();
        },
        async clearAll() {
          haptic("medium");
          if (!(await confirmDialog("Удалить все записи? Действие необратимо."))) return;
          this.closeSheet();
          pendingUndo = null;
          this.withTransition(() => {
            this.activeTab = "all";
            app().items = [];
          });
          schedulePersist();
          showToast("История очищена");
          notify("success");
        },
        async copyText(text) {
          haptic();
          try {
            await navigator.clipboard.writeText(text);
            showToast("Скопировано");
            notify("success");
          } catch {
            showToast("Не удалось скопировать", "err");
            notify("error");
          }
        },
        async shareBarcode(item) {
          haptic();
          try {
            const bwip = await loadBwip();
            const canvas = document.createElement("canvas");
            bwip.toCanvas(canvas, {
              bcid: item.code.length === 8 ? "ean8" : "ean13",
              text: item.code,
              scale: 6,
              height: 20,
              includetext: true,
              textxalign: "center",
              paddingwidth: 16,
              paddingheight: 12,
              backgroundcolor: "FFFFFF",
            });
            const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
            const file = new File([blob], `${item.code}.png`, { type: "image/png" });
            if (navigator.canShare?.({ files: [file] })) {
              await navigator.share({ files: [file] });
              return;
            }
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
            showToast("Изображение скопировано");
            notify("success");
          } catch (error) {
            if (Error.isError(error) && error.name === "AbortError") return;
            await this.copyText(item.code);
          }
        },
      }));

      Alpine.start();
    </script>
  </body>
