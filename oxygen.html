<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="importmap">
      {
        "imports": {
          "alpinejs": "https://esm.sh/alpinejs",
          "valibot": "https://esm.sh/valibot",
          "p-retry": "https://esm.sh/p-retry",
          "p-queue": "https://esm.sh/p-queue",
          "p-throttle": "https://esm.sh/p-throttle",
          "fuse.js": "https://esm.sh/fuse.js",
          "dayjs": "https://esm.sh/dayjs",
          "dayjs/plugin/relativeTime": "https://esm.sh/dayjs/plugin/relativeTime",
          "dayjs/plugin/customParseFormat": "https://esm.sh/dayjs/plugin/customParseFormat",
          "dayjs/locale/ru": "https://esm.sh/dayjs/locale/ru",
          "@bwip-js/browser": "https://esm.sh/@bwip-js/browser",
          "tinygesture": "https://esm.sh/tinygesture"
        }
      }
    </script>
    <style>
            @layer reset, tokens, base, layout, components, utilities, keyframes;
      @layer reset {
          *,
          *::before,
          *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
          }
          button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
          }
          ul,
          ol {
            list-style: none;
          }
          canvas {
            display: block;
          }
        }

        @layer tokens {
          :root {
            --bg: var(--tg-theme-secondary-bg-color, #efeff4);
            --surface: var(
              --tg-theme-section-bg-color,
              var(--tg-theme-bg-color, #ffffff)
            );
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #2481cc);
            --on-accent: var(--tg-theme-button-text-color, #ffffff);
            --error: var(--tg-theme-destructive-text-color, #ff3b30);
            --success: #34c759;
            --warning: #ff9500;
            --separator: var(
              --tg-theme-section-separator-color,
              color-mix(in srgb, var(--text) 12%, transparent)
            );
            --pressed: color-mix(in srgb, var(--text) 7%, transparent);
            --fill: color-mix(in srgb, var(--text) 6%, transparent);
            --paper: #ffffff;
            --paper-edge: color-mix(in srgb, #000 8%, transparent);
            --radius: 12px;
            --radius-lg: 16px;
            --font-sans: ui-rounded, system-ui, -apple-system, "Segoe UI",
              sans-serif;
            --font-mono: ui-monospace, "SF Mono", monospace;
            --ease: cubic-bezier(0.2, 0, 0, 1);
            --dur: 200ms;
            --dur-fast: 120ms;
            --safe-top: 0px;
            --safe-bottom: 0px;
            --safe-left: 0px;
            --safe-right: 0px;
            --content-top: 0px;
            --content-bottom: 0px;
            --header-inset: max(
              calc(var(--safe-top) + var(--content-top)),
              env(safe-area-inset-top, 0px)
            );
            --footer-inset: max(
              calc(var(--safe-bottom) + var(--content-bottom)),
              env(safe-area-inset-bottom, 0px)
            );
            --inset-left: max(var(--safe-left), env(safe-area-inset-left, 0px));
            --inset-right: max(
              var(--safe-right),
              env(safe-area-inset-right, 0px)
            );
            --action-bar: 76px;
          }
          html.dark {
            --bg: var(--tg-theme-secondary-bg-color, #000000);
            --surface: var(
              --tg-theme-section-bg-color,
              var(--tg-theme-bg-color, #1c1c1e)
            );
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8d8d93);
            --success: #30d158;
            --warning: #ff9f0a;
            --paper-edge: color-mix(in srgb, #fff 10%, transparent);
          }
          @media (prefers-reduced-motion: reduce) {
            :root {
              --dur: 120ms;
              --dur-fast: 120ms;
            }
          }
        }

        @layer base {
          html {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            font-size: 16px;
          }
          body {
            display: flex;
            flex-direction: column;
            min-block-size: var(--tg-viewport-stable-height, 100dvh);
            padding-inline: var(--inset-left) var(--inset-right);
            overflow-x: clip;
            overscroll-behavior-y: none;
            scrollbar-width: none;
          }
          body::-webkit-scrollbar {
            display: none;
          }
          [x-cloak] {
            display: none !important;
          }
          ::view-transition-old(root),
          ::view-transition-new(root) {
            animation-duration: var(--dur);
          }
        }

        @layer layout {
          .page {
            display: flex;
            flex-direction: column;
            flex: 1;
            inline-size: 100%;
            max-inline-size: 28rem;
            margin-inline: auto;
            padding-inline: 1rem;
          }
          .page--center {
            justify-content: center;
            min-block-size: var(--tg-viewport-stable-height, 100dvh);
            padding-block: calc(var(--header-inset) + 1rem)
              calc(var(--footer-inset) + 1rem);
          }
          .content {
            flex: 1;
            padding-block: 0.5rem
              calc(var(--footer-inset) + var(--action-bar) + 1rem);
          }
        }

        @layer components {
          .top-bar {
            position: sticky;
            inset-block-start: 0;
            z-index: 30;
            margin-inline: -1rem;
            padding-inline: 1rem;
            padding-block-start: var(--header-inset);
            background: color-mix(in srgb, var(--bg) 84%, transparent);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            backdrop-filter: blur(20px) saturate(1.6);
          }
          .top-bar::after {
            content: "";
            position: absolute;
            inset-inline: 0;
            inset-block-end: 0;
            block-size: 1px;
            background: var(--separator);
            opacity: 0;
            transition: opacity var(--dur) var(--ease);
          }
          .top-bar--collapsed::after {
            opacity: 1;
          }
          .nav {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-block-size: 44px;
          }
          .nav__title {
            position: absolute;
            inset-inline: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur) var(--ease);
          }
          .top-bar--collapsed .nav__title {
            opacity: 1;
          }
          .large-title {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 260ms var(--ease);
          }
          .large-title__inner {
            min-block-size: 0;
            overflow: hidden;
            padding-block-end: 0.5rem;
            opacity: 1;
            transition: opacity var(--dur) var(--ease);
          }
          .large-title--collapsed {
            grid-template-rows: 0fr;
          }
          .large-title--collapsed .large-title__inner {
            opacity: 0;
          }
          .large-title__text {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
          }
          .large-title__sub {
            font-size: 13px;
            color: var(--hint);
          }

          .search {
            display: block;
            padding-block: 0.25rem 0.5rem;
          }
          .search__field {
            position: relative;
            display: flex;
            align-items: center;
            min-block-size: 40px;
          }
          .search__icon {
            position: absolute;
            inset-inline-start: 10px;
            color: var(--hint);
            pointer-events: none;
          }
          .search__input {
            inline-size: 100%;
            block-size: 40px;
            padding: 0 40px 0 34px;
            border: 0;
            border-radius: 10px;
            background: var(--fill);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 16px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            -webkit-appearance: none;
            appearance: none;
          }
          .search__input::placeholder {
            color: var(--hint);
          }
          .search__input::-webkit-search-cancel-button {
            display: none;
          }
          .search__clear {
            position: absolute;
            inset-inline-end: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            inline-size: 44px;
            block-size: 40px;
            color: var(--hint);
          }
          .search__cancel {
            flex-shrink: 0;
            min-block-size: 44px;
            padding-inline-start: 12px;
            color: var(--accent);
            font-size: 16px;
          }

          .tabs {
            display: flex;
            gap: 4px;
            margin-inline: -1rem;
            padding-inline: 1rem;
            overflow-x: auto;
            scrollbar-width: none;
          }
          .tabs::-webkit-scrollbar {
            display: none;
          }
          .tab {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            min-block-size: 44px;
            padding-inline: 2px;
            transition: transform var(--dur-fast) var(--ease);
          }
          .tab:active {
            transform: scale(0.97);
          }
          .tab__pill {
            display: inline-flex;
            align-items: center;
            block-size: 32px;
            padding-inline: 14px;
            border-radius: 999px;
            background: var(--fill);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            transition:
              background var(--dur) var(--ease),
              color var(--dur) var(--ease);
          }
          .tab--on .tab__pill {
            background: var(--accent);
            color: var(--on-accent);
          }

          .surface {
            background: var(--surface);
            border-radius: var(--radius-lg);
          }

          .paywall {
            padding: 2.25rem 1.5rem 1.75rem;
            text-align: center;
          }
          .paywall__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            inline-size: 72px;
            block-size: 72px;
            border-radius: 22px;
            background: color-mix(in srgb, var(--accent) 10%, transparent);
            color: var(--accent);
          }
          .paywall__greeting {
            margin-block-start: 1.25rem;
            font-size: 15px;
            color: var(--hint);
          }
          .paywall__title {
            margin-block-start: 0.25rem;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-wrap: balance;
          }
          .paywall__list {
            margin-block-start: 1.5rem;
            text-align: start;
          }
          .paywall__list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-block: 10px;
            font-size: 15px;
            line-height: 1.4;
          }
          .paywall__list li + li {
            border-block-start: 1px solid var(--separator);
          }
          .paywall__list svg {
            flex-shrink: 0;
            margin-block-start: 2px;
            color: var(--accent);
          }
          .paywall__note {
            margin-block-start: 1rem;
            font-size: 13px;
            line-height: 1.4;
            color: var(--hint);
            text-wrap: balance;
          }

          .primary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            inline-size: 100%;
            min-block-size: 50px;
            padding-inline: 20px;
            border-radius: var(--radius);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 17px;
            font-weight: 600;
            transition:
              transform var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
          }
          .primary-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
          }
          .primary-btn:disabled {
            opacity: 0.55;
            pointer-events: none;
          }
          .paywall .primary-btn {
            margin-block-start: 1.5rem;
          }

          .empty {
            padding: 2.5rem 1.5rem 1rem;
            text-align: center;
          }
          .empty__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            inline-size: 72px;
            block-size: 72px;
            border-radius: 22px;
            background: var(--fill);
            color: var(--hint);
          }
          .empty__title {
            margin-block-start: 1.25rem;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
          }
          .empty__steps {
            margin-block-start: 1.25rem;
            text-align: start;
          }
          .empty__step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-block: 10px;
            font-size: 15px;
            line-height: 1.4;
            color: var(--text);
          }
          .empty__step + .empty__step {
            border-block-start: 1px solid var(--separator);
          }
          .empty__num {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            inline-size: 24px;
            block-size: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 13px;
            font-weight: 600;
          }
          .empty__promo {
            margin-block-start: 0.75rem;
            inline-size: 100%;
            min-block-size: 44px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 500;
          }

          .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-block-start: 0.5rem;
            padding: 12px 4px 10px;
          }
          .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
          }
          .stat + .stat {
            border-inline-start: 1px solid var(--separator);
          }
          .stat__value {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
          }
          .stat__label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--hint);
            text-transform: uppercase;
          }

          .date-head {
            padding: 1.5rem 1rem 0.25rem;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--hint);
            text-transform: uppercase;
          }
          .cat-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.875rem 0.25rem 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--hint);
          }
          .cat-head__dot {
            flex-shrink: 0;
            inline-size: 6px;
            block-size: 6px;
            border-radius: 50%;
            background: var(--accent);
          }
          .cat-head__label {
            min-inline-size: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          .cat-head::after {
            content: "";
            flex: 1;
            min-inline-size: 1rem;
            block-size: 1px;
            background: var(--separator);
          }

          .entry {
            content-visibility: auto;
            contain-intrinsic-block-size: auto 220px;
          }
          .swipe {
            position: relative;
            margin-block-start: 10px;
            border-radius: var(--radius-lg);
            overflow: hidden;
          }
          .swipe__bg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-inline-end: 28px;
            background: var(--error);
            color: #fff;
            opacity: var(--reveal, 0);
          }
          .swipe__bg svg {
            transform: scale(calc(0.7 + var(--reveal, 0) * 0.3));
          }
          .card {
            position: relative;
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            touch-action: pan-y;
          }
          .card__head {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            padding: 12px 4px 8px 16px;
          }
          .card__text {
            flex: 1;
            min-inline-size: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
          }
          .card__name {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            text-align: start;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
            color: var(--text);
            transition: opacity var(--dur-fast) var(--ease);
          }
          .card__code {
            min-block-size: 24px;
            text-align: start;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.04em;
            color: var(--hint);
            transition: opacity var(--dur-fast) var(--ease);
          }
          .card__code--lead {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.06em;
          }
          .card__name:active,
          .card__code:active {
            opacity: 0.5;
          }
          .card__meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 6px;
            margin-block-start: 2px;
            font-size: 13px;
            color: var(--hint);
          }
          .card__meta > * + *::before {
            content: "·";
            margin-inline-end: 6px;
            color: var(--hint);
          }
          .meta__price {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text);
          }
          .meta__price--down {
            color: var(--success);
          }
          .meta__price--up {
            color: var(--error);
          }
          .meta__date {
            color: var(--warning);
            font-variant-numeric: tabular-nums;
          }
          .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            inline-size: 44px;
            block-size: 44px;
            border-radius: 50%;
            color: var(--hint);
            transition:
              background var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease);
          }
          .icon-btn:active {
            background: var(--pressed);
            transform: scale(0.97);
          }
          .card__more svg {
            transition: transform var(--dur) var(--ease);
          }
          .card__more--open svg {
            transform: rotate(180deg);
          }

          .details {
            margin-inline: 16px;
            border-block-start: 1px solid var(--separator);
            padding-block: 4px;
          }
          .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-block-size: 44px;
            padding-block: 6px;
            font-size: 15px;
          }
          .row + .row {
            border-block-start: 1px solid var(--separator);
          }
          .row dt {
            flex-shrink: 0;
            color: var(--hint);
          }
          .row dd {
            min-inline-size: 0;
            text-align: end;
            overflow-wrap: anywhere;
            color: var(--text);
          }
          .row--mono dd {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.02em;
            -webkit-user-select: text;
            user-select: text;
          }
          .row--tap {
            inline-size: 100%;
            text-align: start;
          }
          .row--tap:active {
            opacity: 0.6;
          }
          .row--stack {
            flex-direction: column;
            align-items: stretch;
          }
          .row--stack dd {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: start;
          }
          .hist {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--hint);
          }
          .hist b {
            font-weight: 600;
            color: var(--text);
          }
          .hist--up b {
            color: var(--error);
          }
          .hist--down b {
            color: var(--success);
          }

          .well {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 16px 12px;
            padding: 12px 16px;
            min-block-size: 88px;
            border-radius: 10px;
            border: 1px solid var(--paper-edge);
            background: var(--paper);
            color: #6b6b70;
          }
          .well canvas {
            inline-size: 100%;
            max-inline-size: 260px;
            block-size: auto;
            image-rendering: pixelated;
          }
          .well--qr {
            margin-block-start: 0;
            min-block-size: 176px;
          }
          .well--qr canvas {
            inline-size: 160px;
            block-size: 160px;
          }
          .well__skeleton {
            position: absolute;
            inset: 12px 16px;
            border-radius: 6px;
            background: linear-gradient(90deg, #f1f1f1 25%, #e4e4e4 50%, #f1f1f1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
          }
          .well__error {
            font-size: 13px;
            font-weight: 500;
          }
          .card__foot {
            display: flex;
            border-block-start: 1px solid var(--separator);
          }
          .text-btn {
            flex: 1;
            min-block-size: 44px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 500;
            transition: background var(--dur-fast) var(--ease);
          }
          .text-btn + .text-btn {
            border-inline-start: 1px solid var(--separator);
          }
          .text-btn:active {
            background: var(--pressed);
          }

          .skeleton-card {
            margin-block-start: 10px;
            padding: 14px 16px 16px;
          }
          .sk {
            border-radius: 6px;
            background: linear-gradient(
              90deg,
              var(--fill) 25%,
              color-mix(in srgb, var(--text) 11%, transparent) 50%,
              var(--fill) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
          }
          .sk--title {
            block-size: 18px;
            inline-size: 62%;
          }
          .sk--sub {
            block-size: 13px;
            inline-size: 38%;
            margin-block-start: 8px;
          }
          .sk--well {
            block-size: 88px;
            margin-block-start: 14px;
            border-radius: 10px;
          }

          .no-results {
            padding: 2.5rem 1.5rem;
            margin-block-start: 0.5rem;
            text-align: center;
          }
          .no-results__title {
            font-size: 17px;
            font-weight: 600;
          }
          .no-results__sub {
            margin-block-start: 4px;
            font-size: 15px;
            color: var(--hint);
          }

          .action-bar {
            position: fixed;
            inset-inline: 0;
            inset-block-end: 0;
            z-index: 40;
            padding: 12px max(1rem, var(--inset-right))
              calc(var(--footer-inset) + 12px) max(1rem, var(--inset-left));
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            backdrop-filter: blur(20px) saturate(1.6);
            border-block-start: 1px solid var(--separator);
          }
          .action-bar__inner {
            display: flex;
            gap: 10px;
            inline-size: 100%;
            max-inline-size: 26rem;
            margin-inline: auto;
          }
          .multi-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            inline-size: 50px;
            block-size: 50px;
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--accent);
            transition:
              background var(--dur) var(--ease),
              color var(--dur) var(--ease),
              transform var(--dur-fast) var(--ease);
          }
          .multi-btn:active {
            transform: scale(0.97);
          }
          .multi-btn--on {
            background: var(--accent);
            color: var(--on-accent);
          }

          .toast-host {
            position: fixed;
            z-index: 60;
            inset-inline: 1rem;
            inset-block-end: calc(var(--footer-inset) + var(--action-bar) + 12px);
            display: flex;
            justify-content: center;
            pointer-events: none;
          }
          .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            max-inline-size: 26rem;
            min-block-size: 44px;
            padding: 8px 8px 8px 14px;
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow:
              0 1px 2px color-mix(in srgb, #000 8%, transparent),
              0 8px 24px color-mix(in srgb, #000 16%, transparent);
            pointer-events: auto;
          }
          .toast svg {
            flex-shrink: 0;
          }
          .toast__msg {
            min-inline-size: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 500;
            padding-inline-end: 6px;
          }
          .toast__action {
            flex-shrink: 0;
            min-block-size: 32px;
            padding-inline: 12px;
            border-radius: 8px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
          }
          .toast__action:active {
            background: var(--pressed);
          }
          .toast-t {
            transition:
              opacity var(--dur) var(--ease),
              transform var(--dur) var(--ease);
          }
          .toast-hidden {
            opacity: 0;
            transform: translateY(12px);
          }

          .sheet-root {
            display: contents;
          }
          .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: color-mix(in srgb, #000 40%, transparent);
          }
          .sheet {
            position: fixed;
            inset-inline: 0;
            inset-block-end: 0;
            z-index: 51;
            inline-size: 100%;
            max-inline-size: 28rem;
            margin-inline: auto;
            padding: 8px 1rem calc(var(--footer-inset) + 1rem);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            background: var(--bg);
          }
          .sheet__grabber {
            inline-size: 36px;
            block-size: 5px;
            margin-inline: auto;
            border-radius: 3px;
            background: color-mix(in srgb, var(--text) 20%, transparent);
          }
          .sheet__title {
            padding-block: 14px 8px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
          }
          .group {
            margin-block-start: 12px;
            padding-inline: 16px;
          }
          .group .row {
            padding-block: 8px;
          }
          .row__text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-inline-size: 0;
          }
          .row__title {
            font-size: 17px;
            color: var(--text);
          }
          .row__sub {
            font-size: 13px;
            line-height: 1.35;
            color: var(--hint);
          }
          .row--danger .row__title {
            color: var(--error);
          }
          .row--tap.row--link .row__title {
            color: var(--accent);
          }
          .switch {
            position: relative;
            flex-shrink: 0;
            inline-size: 51px;
            block-size: 31px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--text) 18%, transparent);
            transition: background var(--dur) var(--ease);
          }
          .switch::after {
            content: "";
            position: absolute;
            inset-block-start: 2px;
            inset-inline-start: 2px;
            inline-size: 27px;
            block-size: 27px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px color-mix(in srgb, #000 22%, transparent);
            transition: transform var(--dur) var(--ease);
          }
          .switch--on {
            background: var(--success);
          }
          .switch--on::after {
            transform: translateX(20px);
          }
          .sheet__note {
            margin-block-start: 14px;
            padding-inline: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: var(--hint);
          }
          .sheet-t {
            transition:
              opacity var(--dur) var(--ease),
              transform 260ms var(--ease);
          }
          .sheet-hidden {
            transform: translateY(100%);
          }
          .fade-t {
            transition: opacity var(--dur) var(--ease);
          }
          .fade-hidden {
            opacity: 0;
          }
        }

        @layer utilities {
          .anim-fade {
            animation: fade-in var(--dur) var(--ease) both;
          }
          .anim-rise {
            animation: rise 260ms var(--ease) both;
          }
          .visually-hidden {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            overflow: hidden;
            clip-path: inset(50%);
          }
        }

        @layer keyframes {
          @keyframes fade-in {
            from {
              opacity: 0;
            }
            to {
              opacity: 1;
            }
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(10px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes shimmer {
            from {
              background-position: 200% 0;
            }
            to {
              background-position: -200% 0;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            @keyframes rise {
              from {
                opacity: 0;
              }
              to {
                opacity: 1;
              }
            }
          }
        }
    </style>
