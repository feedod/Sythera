<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#efeff4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <title>Control</title>
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin />
    <link rel="modulepreload" href="https://esm.sh/alpinejs@3" />
    <link rel="modulepreload" href="https://esm.sh/valibot@1" />
    <link rel="modulepreload" href="https://esm.sh/fuse.js@7" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script type="importmap">
      {
        "imports": {
          "alpinejs": "https://esm.sh/alpinejs@3",
          "valibot": "https://esm.sh/valibot@1",
          "p-retry": "https://esm.sh/p-retry@7",
          "p-queue": "https://esm.sh/p-queue@8",
          "p-throttle": "https://esm.sh/p-throttle@8",
          "fuse.js": "https://esm.sh/fuse.js@7",
          "@bwip-js/browser": "https://esm.sh/@bwip-js/browser@4",
          "tinygesture": "https://esm.sh/tinygesture@3"
        }
      }
    </script>
    <style>
      @layer reset, tokens, base, layout, components, utilities, motion;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
        }
        button {
          font: inherit;
          color: inherit;
          background: none;
          border: 0;
          cursor: pointer;
          touch-action: manipulation;
          -webkit-touch-callout: none;
          transition: scale 180ms cubic-bezier(0.22, 1, 0.36, 1),
            opacity 180ms cubic-bezier(0.22, 1, 0.36, 1),
            filter 180ms cubic-bezier(0.22, 1, 0.36, 1),
            background-color var(--dur) var(--ease),
            color var(--dur) var(--ease),
            box-shadow var(--dur) var(--ease);
        }
        button:active,
        button.is-down {
          scale: 0.97;
        }
        ul,
        ol {
          list-style: none;
        }
        canvas {
          display: block;
        }
        dialog {
          border: 0;
          padding: 0;
          max-inline-size: none;
          max-block-size: none;
          color: inherit;
          background: transparent;
        }
        dialog::backdrop {
          background: color-mix(in oklab, #000 42%, transparent);
        }
      }

      @property --reveal {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }

      @layer tokens {
        :root {
          color-scheme: light dark;
          --bg: var(--tg-theme-secondary-bg-color, light-dark(#efeff4, #000));
          --surface: var(
            --tg-theme-section-bg-color,
            var(--tg-theme-bg-color, light-dark(#fff, #1c1c1e))
          );
          --text: var(--tg-theme-text-color, light-dark(#000, #fff));
          --hint: var(--tg-theme-hint-color, light-dark(#8e8e93, #8d8d93));
          --accent: var(--tg-theme-button-color, #2481cc);
          --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
          --on-accent: var(--tg-theme-button-text-color, #fff);
          --error: var(--tg-theme-destructive-text-color, light-dark(#ff3b30, #ff453a));
          --success: light-dark(oklch(0.7 0.19 145), oklch(0.75 0.18 145));
          --warning: light-dark(oklch(0.75 0.18 55), oklch(0.78 0.16 60));
          --separator: var(
            --tg-theme-section-separator-color,
            color-mix(in oklab, var(--text) 12%, transparent)
          );
          --pressed: color-mix(in oklab, var(--text) 8%, transparent);
          --fill: color-mix(in oklab, var(--text) 7%, transparent);
          --paper: #fff;
          --paper-edge: color-mix(in oklab, #000 10%, transparent);
          --glass: color-mix(in oklab, var(--surface) 78%, transparent);
          --glass-bg: color-mix(in oklab, var(--bg) 78%, transparent);
          --glass-stroke: light-dark(
            color-mix(in oklab, #fff 40%, transparent),
            color-mix(in oklab, #fff 9%, transparent)
          );
          --glass-shine: light-dark(
            linear-gradient(180deg, color-mix(in oklab, #fff 18%, transparent), transparent 28%),
            linear-gradient(180deg, color-mix(in oklab, #fff 7%, transparent), transparent 30%)
          );
          --shadow-sm: 0 1px 1px color-mix(in oklab, #000 4%, transparent);
          --shadow-md: 0 4px 18px color-mix(in oklab, #000 8%, transparent);
          --shadow-lg: 0 10px 32px color-mix(in oklab, #000 14%, transparent);
          --radius: 18px;
          --radius-lg: 24px;
          --radius-xl: 32px;
          --corner: squircle;
          --font-sans: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
          --font-mono: ui-monospace, "SF Mono", "Menlo", monospace;
          --ease: cubic-bezier(0.2, 0, 0, 1);
          --dur: 200ms;
          --dur-fast: 120ms;
          --safe-top: var(--tg-safe-area-inset-top, 0px);
          --safe-bottom: var(--tg-safe-area-inset-bottom, 0px);
          --safe-left: var(--tg-safe-area-inset-left, 0px);
          --safe-right: var(--tg-safe-area-inset-right, 0px);
          --content-top: var(--tg-content-safe-area-inset-top, 0px);
          --content-bottom: var(--tg-content-safe-area-inset-bottom, 0px);
          --header-inset: max(calc(var(--safe-top) + var(--content-top)), env(safe-area-inset-top, 0px));
          --footer-inset: max(
            calc(var(--safe-bottom) + var(--content-bottom)),
            env(safe-area-inset-bottom, 0px)
          );
          --inset-left: max(var(--safe-left), env(safe-area-inset-left, 0px));
          --inset-right: max(var(--safe-right), env(safe-area-inset-right, 0px));
          --action-bar: 92px;
        }
        @media (prefers-reduced-motion: reduce) {
          :root {
            --dur: 1ms;
            --dur-fast: 1ms;
          }
        }
      }

      @layer base {
        html {
          background: var(--bg);
          color: var(--text);
          font-family: var(--font-sans);
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          font-size: 16px;
          interpolate-size: allow-keywords;
          hanging-punctuation: first last;
        }
        body {
          display: flex;
          flex-direction: column;
          min-block-size: var(--tg-viewport-stable-height, 100dvh);
          padding-inline: var(--inset-left) var(--inset-right);
          overflow-x: clip;
          overscroll-behavior: none;
          scrollbar-width: none;
        }
        body::-webkit-scrollbar {
          display: none;
        }
        [x-cloak] {
          display: none !important;
        }
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: var(--dur);
        }
      }

      @layer layout {
        .page {
          display: flex;
          flex-direction: column;
          flex: 1;
          inline-size: 100%;
          max-inline-size: 27.5rem;
          margin-inline: auto;
          padding-inline: 1.1rem;
        }
        .page--center {
          justify-content: center;
          min-block-size: var(--tg-viewport-stable-height, 100dvh);
          padding-block: calc(var(--header-inset) + 1rem) calc(var(--footer-inset) + 1rem);
        }
        .content {
          flex: 1;
          padding-block: 0.35rem calc(var(--footer-inset) + var(--action-bar) + 0.75rem);
        }
      }

      @layer components {
        .top-bar {
          position: sticky;
          inset-block-start: 0;
          z-index: 30;
          margin-inline: -1.1rem;
          padding-inline: 1.1rem;
          padding-block-start: var(--header-inset);
          background: var(--glass-bg);
          -webkit-backdrop-filter: blur(28px) saturate(1.85);
          backdrop-filter: blur(28px) saturate(1.85);
          &::after {
            content: "";
            position: absolute;
            inset-inline: 1.1rem;
            inset-block-end: 0;
            block-size: 1px;
            background: var(--glass-stroke);
            opacity: 0;
            transition: opacity var(--dur) var(--ease);
          }
          &.top-bar--collapsed::after {
            opacity: 0.7;
          }
        }
        .nav {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          min-block-size: 44px;
        }
        .nav__title {
          font-size: 17px;
          font-weight: 600;
          letter-spacing: -0.01em;
          opacity: 0;
          transition: opacity var(--dur) var(--ease);
          .top-bar--collapsed & {
            opacity: 1;
          }
        }
        .large-title {
          display: grid;
          grid-template-rows: 1fr;
          transition: grid-template-rows 260ms var(--ease);
          &.large-title--collapsed {
            grid-template-rows: 0fr;
          }
        }
        .large-title__inner {
          min-block-size: 0;
          overflow: hidden;
          padding-block-end: 0.5rem;
          opacity: 1;
          transition: opacity var(--dur) var(--ease);
          .large-title--collapsed & {
            opacity: 0;
          }
        }
        .large-title__text {
          font-size: 36px;
          font-weight: 760;
          letter-spacing: -0.045em;
          line-height: 1.05;
          text-wrap: balance;
          text-box: trim-both cap alphabetic;
        }
        .large-title__sub {
          margin-block-start: 6px;
          font-size: 13px;
          font-weight: 500;
          color: var(--hint);
          letter-spacing: 0.01em;
        }
        .search {
          display: block;
          padding-block: 0.25rem 0.5rem;
        }
        .search__field {
          position: relative;
          display: flex;
          align-items: center;
          min-block-size: 40px;
        }
        .search__icon {
          position: absolute;
          inset-inline-start: 10px;
          color: var(--hint);
          pointer-events: none;
        }
        .search__input {
          inline-size: 100%;
          block-size: 42px;
          padding: 0 40px 0 36px;
          border: 1px solid var(--glass-stroke);
          border-radius: 999px;
          corner-shape: squircle;
          background: color-mix(in oklab, var(--fill) 80%, var(--surface));
          color: var(--text);
          font: 16px/1.2 var(--font-sans);
          outline: none;
          appearance: none;
          user-select: text;
          &::placeholder {
            color: var(--hint);
          }
          &::-webkit-search-cancel-button {
            display: none;
          }
        }
        .search__clear {
          position: absolute;
          inset-inline-end: 0;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          inline-size: 44px;
          block-size: 40px;
          color: var(--hint);
        }
        .search__cancel {
          flex-shrink: 0;
          min-block-size: 44px;
          padding-inline-start: 12px;
          color: var(--accent);
          font-size: 16px;
        }
        .tabs {
          display: flex;
          gap: 6px;
          margin-inline: -1.1rem;
          padding-inline: 1.1rem;
          overflow-x: auto;
          scrollbar-width: none;
          &::-webkit-scrollbar {
            display: none;
          }
        }
        .tab {
          flex-shrink: 0;
          display: inline-flex;
          align-items: center;
          min-block-size: 44px;
          padding-inline: 2px;
          transition: scale var(--dur-fast) var(--ease);
          &:active {
            scale: 0.97;
          }
        }
        .tab__pill {
          display: inline-flex;
          align-items: center;
          block-size: 34px;
          padding-inline: 15px;
          border-radius: 999px;
          background: color-mix(in oklab, var(--fill) 88%, var(--surface));
          color: var(--text);
          font-size: 14px;
          font-weight: 600;
          white-space: nowrap;
          border: 1px solid transparent;
          transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
            border-color var(--dur) var(--ease);
          .tab--on & {
            background: var(--accent);
            color: var(--on-accent);
            border-color: color-mix(in oklab, #fff 22%, transparent);
          }
        }
        .surface {
          background: var(--surface);
          border-radius: var(--radius-lg);
          corner-shape: var(--corner);
          border: 0;
        }
        .paywall {
          padding: 2.5rem 1.4rem 1.6rem;
          text-align: center;
        }
        .paywall__icon,
        .empty__icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          inline-size: 76px;
          block-size: 76px;
          border-radius: 26px;
        }
        .paywall__icon {
          background: var(--accent-soft);
          color: var(--accent);
          corner-shape: squircle;
        }
        .paywall__greeting {
          margin-block-start: 1.25rem;
          font-size: 15px;
          color: var(--hint);
        }
        .paywall__title {
          margin-block-start: 0.4rem;
          font-size: 24px;
          font-weight: 750;
          letter-spacing: -0.035em;
          text-wrap: balance;
          text-box: trim-both cap alphabetic;
        }
        .paywall__list {
          margin-block-start: 1.5rem;
          text-align: start;
          li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-block: 10px;
            font-size: 15px;
            line-height: 1.4;
          }
          li + li {
            border-block-start: 1px solid var(--separator);
          }
          svg {
            flex-shrink: 0;
            margin-block-start: 2px;
            color: var(--accent);
          }
        }
        .paywall__note {
          margin-block-start: 1rem;
          font-size: 13px;
          line-height: 1.4;
          color: var(--hint);
          text-wrap: pretty;
        }
        .primary-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          inline-size: 100%;
          min-block-size: 52px;
          padding-inline: 22px;
          border-radius: 999px;
          corner-shape: squircle;
          background: var(--accent);
          color: var(--on-accent);
          font-size: 17px;
          font-weight: 650;
          &:active,
          &.is-down {
            scale: 0.97;
            filter: brightness(0.92);
          }
          &:disabled {
            opacity: 0.55;
            pointer-events: none;
          }
          .paywall & {
            margin-block-start: 1.5rem;
          }
        }
        .empty {
          padding: 2.5rem 1.5rem 1rem;
          text-align: center;
        }
        .empty__icon {
          background: var(--fill);
          color: var(--hint);
        }
        .empty__title {
          margin-block-start: 1.25rem;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.02em;
          text-box: trim-both cap alphabetic;
        }
        .empty__lead {
          margin-block-start: 0.55rem;
          padding-inline: 0.5rem;
          font-size: 15px;
          line-height: 1.45;
          color: var(--hint);
          text-wrap: pretty;
        }
        .empty__promo {
          margin-block-start: 0.75rem;
          inline-size: 100%;
          min-block-size: 44px;
          color: var(--accent);
          font-size: 15px;
          font-weight: 500;
          &:active,
          &.is-down {
            scale: 0.98;
            opacity: 0.7;
          }
        }
        .stats {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          margin-block-start: 0.35rem;
          padding: 14px 6px 12px;
        }
        .stat {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
        }
        .stat + .stat {
          border-inline-start: 1px solid var(--separator);
        }
        .stat__value {
          font-family: var(--font-mono);
          font-size: 19px;
          font-weight: 650;
          font-variant-numeric: tabular-nums;
          line-height: 1;
        }
        .stat__label {
          font-size: 11px;
          font-weight: 500;
          letter-spacing: 0.03em;
          color: var(--hint);
          text-transform: uppercase;
        }
        .date-head {
          padding: 1.5rem 1rem 0.25rem;
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 0.03em;
          color: var(--hint);
          text-transform: uppercase;
        }
        .cat-head {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 0.875rem 0.25rem 0;
          font-size: 13px;
          font-weight: 600;
          color: var(--hint);
          &::after {
            content: "";
            flex: 1;
            min-inline-size: 1rem;
            block-size: 1px;
            background: var(--separator);
          }
        }
        .cat-head__dot {
          flex-shrink: 0;
          inline-size: 6px;
          block-size: 6px;
          border-radius: 50%;
          background: var(--accent);
        }
        .cat-head__label {
          min-inline-size: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .entry {
          content-visibility: auto;
          contain-intrinsic-block-size: auto 220px;
        }
        .swipe {
          position: relative;
          margin-block-start: 12px;
          border-radius: var(--radius-lg);
          corner-shape: var(--corner);
          overflow: hidden;
        }
        .swipe__bg {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          color: #fff;
          svg {
            scale: calc(0.72 + var(--reveal, 0) * 0.28);
          }
        }
        .swipe__bg--del {
          justify-content: flex-end;
          padding-inline-end: 28px;
          background: var(--error);
          opacity: var(--reveal-del, 0);
        }
        .swipe__bg--edit {
          justify-content: flex-start;
          padding-inline-start: 28px;
          background: var(--accent);
          opacity: var(--reveal-edit, 0);
        }
        .card {
          position: relative;
          background: var(--surface);
          border-radius: var(--radius-lg);
          corner-shape: var(--corner);
          overflow: hidden;
          touch-action: pan-y;
          container-type: inline-size;
          container-name: card;
        }
        .card__head {
          display: flex;
          align-items: flex-start;
          gap: 4px;
          padding: 14px 6px 10px 16px;
        }
        .card__text {
          flex: 1;
          min-inline-size: 0;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 2px;
        }
        .card__name,
        .card__code {
          text-align: start;
          transition: opacity var(--dur-fast) var(--ease);
          &:active {
            opacity: 0.5;
          }
        }
        .card__name {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          overflow: hidden;
          overflow-wrap: anywhere;
          font-size: 17px;
          font-weight: 600;
          letter-spacing: -0.01em;
          line-height: 1.3;
        }
        .card__code {
          min-block-size: 24px;
          font-family: var(--font-mono);
          font-size: 13px;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.04em;
          color: var(--hint);
        }
        .card__code--lead {
          font-size: 17px;
          font-weight: 600;
          color: var(--text);
          letter-spacing: 0.06em;
        }
        .card__meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 0 6px;
          margin-block-start: 2px;
          font-size: 13px;
          color: var(--hint);
          > * + *::before {
            content: "·";
            margin-inline-end: 6px;
          }
        }
        .meta__price {
          font-weight: 600;
          font-variant-numeric: tabular-nums;
          color: var(--text);
        }
        .meta__price--down {
          color: var(--success);
        }
        .meta__price--up {
          color: var(--error);
        }
        .meta__date {
          color: var(--warning);
          font-variant-numeric: tabular-nums;
        }
        .icon-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          inline-size: 44px;
          block-size: 44px;
          border-radius: 50%;
          color: var(--hint);
          transition: background var(--dur-fast) var(--ease), scale var(--dur-fast) var(--ease);
          &:active {
            background: var(--pressed);
            scale: 0.97;
          }
        }
        .card__more svg {
          transition: rotate var(--dur) var(--ease);
        }
        .card__more--open svg {
          rotate: 180deg;
        }
        .details {
          margin-inline: 16px;
          border-block-start: 1px solid var(--separator);
          padding-block: 4px;
        }
        .row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          min-block-size: 44px;
          padding-block: 6px;
          font-size: 15px;
        }
        .row + .row {
          border-block-start: 1px solid var(--separator);
        }
        .row dt {
          flex-shrink: 0;
          color: var(--hint);
        }
        .row dd {
          min-inline-size: 0;
          text-align: end;
          overflow-wrap: anywhere;
        }
        .row--mono dd {
          font-family: var(--font-mono);
          font-size: 13px;
          letter-spacing: 0.02em;
          user-select: text;
        }
        .row--tap {
          inline-size: 100%;
          text-align: start;
          &:active {
            opacity: 0.6;
          }
        }
        .row--stack {
          flex-direction: column;
          align-items: stretch;
          dd {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: start;
          }
        }
        .hist {
          display: flex;
          justify-content: space-between;
          font-family: var(--font-mono);
          font-size: 13px;
          font-variant-numeric: tabular-nums;
          color: var(--hint);
          b {
            font-weight: 600;
            color: var(--text);
          }
        }
        .hist--up b {
          color: var(--error);
        }
        .hist--down b {
          color: var(--success);
        }
        .well {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 4px 14px 12px;
          padding: 14px 16px;

          }

          position: absolute;
          inset: 12px 16px;
          border-radius: 6px;
          background: linear-gradient(90deg, #f1f1f1 25%, #e4e4e4 50%, #f1f1f1 75%);

        .well__error {
          font-size: 13px;
          font-weight: 500;
        }
        .card__foot {

          border-block-start: 1px solid var(--separator);
        }
        .text-btn {
          flex: 1;
          min-block-size: 44px;
          color: var(--accent);
          font-size: 15px;
          font-weight: 500;

            border-inline-start: 1px solid var(--separator);
          }
          &:active,
          &.is-down {
            background: var(--pressed);
            scale: 0.99;
          }
        }
        .skeleton-card {
          margin-block-start: 10px;
          padding: 14px 16px 16px;
        }
        .sk {
          border-radius: 6px;
          background: linear-gradient(
            90deg,
            var(--fill) 25%,
            color-mix(in oklab, var(--text) 11%, transparent) 50%,
            var(--fill) 75%
          );
          background-size: 200% 100%;
          animation: shimmer 1.4s ease-in-out infinite;
        }
        .sk--title {
          block-size: 18px;
          inline-size: 62%;
        }
        .sk--sub {
          block-size: 13px;
          inline-size: 38%;
          margin-block-start: 8px;
        }
        .sk--well {
          block-size: 88px;
          margin-block-start: 14px;
          border-radius: 10px;
        }
        .no-results {
          padding: 2.5rem 1.5rem;
          margin-block-start: 0.5rem;
          text-align: center;
        }
        .no-results__title {
          font-size: 17px;
          font-weight: 600;
        }
        .no-results__sub {
          margin-block-start: 4px;
          font-size: 15px;
          color: var(--hint);
        }
        .action-bar {
          position: fixed;
          inset-inline: max(0.85rem, var(--inset-left)) max(0.85rem, var(--inset-right));
          inset-block-end: calc(var(--footer-inset) + 10px);
          z-index: 40;
          padding: 0;
          background: transparent;
          border: 0;
        }
        .action-bar__inner {
          display: flex;
          gap: 8px;
          inline-size: 100%;
          max-inline-size: 26rem;
          margin-inline: auto;
          padding: 8px;
          border-radius: 30px;
          corner-shape: squircle;
          background: var(--glass);
          -webkit-backdrop-filter: blur(28px) saturate(1.9);
          backdrop-filter: blur(28px) saturate(1.9);
          border: 1px solid var(--glass-stroke);
          box-shadow: var(--shadow-md), inset 0 1px 0 color-mix(in oklab, #fff 16%, transparent);
        }
        .multi-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          inline-size: 52px;
          block-size: 52px;
          border-radius: 18px;
          corner-shape: squircle;
          background: color-mix(in oklab, var(--surface) 82%, transparent);
          color: var(--accent);
          transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
            scale var(--dur-fast) var(--ease);
          &:active {
            scale: 0.96;
          }
          &:active,
          &.is-down {
            scale: 0.92;
          }
          &.multi-btn--on {
            background: var(--accent);
            color: var(--on-accent);
          }
        }
        .toast-host {
          position: fixed;
          z-index: 60;
          inset-inline: 1rem;
          inset-block-end: calc(var(--footer-inset) + var(--action-bar) + 8px);
          display: flex;
          justify-content: center;
          pointer-events: none;
        }
        .toast {
          display: flex;
          align-items: center;
          gap: 10px;
          max-inline-size: 26rem;
          min-block-size: 44px;
          padding: 8px 8px 8px 14px;
          border-radius: 999px;
          corner-shape: squircle;
          box-shadow: var(--shadow-lg);
          border: 1px solid var(--glass-stroke);
          backdrop-filter: blur(24px) saturate(1.6);
          background: var(--glass);
          pointer-events: auto;
          transition: display var(--dur) allow-discrete, opacity var(--dur) var(--ease),
            translate var(--dur) var(--ease);
          svg {
            flex-shrink: 0;
          }
        }
        .toast__msg {
          min-inline-size: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: 15px;
          font-weight: 500;
          padding-inline-end: 6px;
        }
        .toast__action {
          flex-shrink: 0;
          min-block-size: 32px;
          padding-inline: 12px;
          border-radius: 8px;
          color: var(--accent);
          font-size: 15px;
          font-weight: 600;
          &:active {
            background: var(--pressed);
          }
        }
        .sheet {
          inset: auto 0 0;
          inline-size: 100%;
          max-inline-size: 28rem;
          margin-inline: auto;
          padding: 10px 1rem calc(var(--footer-inset) + 1.15rem);
          border-radius: var(--radius-xl) var(--radius-xl) 0 0;
          corner-shape: squircle squircle square square;
          background: color-mix(in oklab, var(--bg) 88%, var(--surface));
          color: var(--text);
          border: 0;
          box-shadow: 0 -8px 40px color-mix(in oklab, #000 18%, transparent);
          --sheet-dim: 1;
          will-change: transform;
          translate: 0 100%;
          transition: display 260ms allow-discrete, overlay 260ms allow-discrete,
            translate 260ms var(--ease);
          &:open {
            translate: 0 0;
          }
          &::backdrop {
            background: color-mix(in oklab, #000 42%, transparent);
            opacity: 0;
            transition: display 260ms allow-discrete, overlay 260ms allow-discrete,
              opacity var(--dur) var(--ease);
          }
          &:open::backdrop {
            opacity: var(--sheet-dim, 1);
          }
          &.is-dragging {
            transition: none;
          }
        }
        .sheet__handle {
          display: flex;
          justify-content: center;
          padding-block: 8px 2px;
          touch-action: none;
        }
        .sheet__grabber {
          inline-size: 40px;
          block-size: 5px;
          border-radius: 999px;
          background: color-mix(in oklab, var(--text) 22%, transparent);
        }
        .sheet__title {
          padding-block: 14px 8px;
          text-align: center;
          font-size: 17px;
          font-weight: 600;
        }
        .group {
          margin-block-start: 12px;
          padding-inline: 16px;
          .row {
            padding-block: 8px;
          }
        }
        .row__text {
          display: flex;
          flex-direction: column;
          gap: 2px;
          min-inline-size: 0;
        }
        .row__title {
          font-size: 17px;
        }
        .row__sub {
          font-size: 13px;
          line-height: 1.35;
          color: var(--hint);
        }
        .row--danger .row__title {
          color: var(--error);
        }
        .row--link .row__title {
          color: var(--accent);
        }
        .switch {
          position: relative;
          flex-shrink: 0;
          inline-size: 51px;
          block-size: 31px;
          border-radius: 999px;
          background: color-mix(in oklab, var(--text) 18%, transparent);
          transition: background var(--dur) var(--ease);
          &::after {
            content: "";
            position: absolute;
            inset-block-start: 2px;
            inset-inline-start: 2px;
            inline-size: 27px;
            block-size: 27px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px color-mix(in oklab, #000 22%, transparent);
            transition: translate var(--dur) var(--ease);
          }
          &.switch--on {
            background: var(--success);
            &::after {
              translate: 20px 0;
            }
          }
        }
        .sheet__note {
          margin-block-start: 14px;
          padding-inline: 16px;
          font-size: 13px;
          line-height: 1.4;
          color: var(--hint);
        }
        .field {
          display: flex;
          flex-direction: column;
          gap: 6px;
          padding-block: 10px;
        }
        .field + .field {
          border-block-start: 1px solid var(--separator);
        }
        .field__label {
          font-size: 13px;
          color: var(--hint);
        }
        .field__input {
          inline-size: 100%;
          min-block-size: 44px;
          border: 0;
          background: transparent;
          color: var(--text);
          font: 17px/1.3 var(--font-sans);
          outline: none;
          user-select: text;
        }
        .sheet__actions {
          margin-block-start: 16px;
          padding-inline: 4px;
        }
        .meta__delta {
          font-weight: 600;
          font-variant-numeric: tabular-nums;
        }
      }

      @layer utilities {
        .anim-fade {
          animation: fade-in var(--dur) var(--ease) both;
        }
        .anim-rise {
          animation: rise 260ms var(--ease) both;
        }
      }

      @layer motion {
        @keyframes fade-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes rise {
          from {
            opacity: 0;
            translate: 0 10px;
          }
          to {
            opacity: 1;
            translate: 0 0;
          }
        }
        @keyframes shimmer {
          from {
            background-position: 200% 0;
          }
          to {
            background-position: -200% 0;
          }
        }
        @starting-style {
          .anim-rise,
          .anim-fade {
            opacity: 0;
          }
          .sheet:open {
            translate: 0 100%;
          }
          .sheet:open::backdrop {
            opacity: 0;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .anim-rise,
          .anim-fade,
          .sk,
          .well__skeleton {
            animation: none !important;
          }
        }
      }
    </style>

    <script type="module">
      import Alpine from "alpinejs";
      import * as v from "valibot";
      import pRetry from "p-retry";
      import PQueue from "p-queue";
      import pThrottle from "p-throttle";
      import Fuse from "fuse.js";
      import TinyGesture from "tinygesture";

      const tg = window.Telegram.WebApp;
      const ALLOWED_IDS = new Set([8594529905, 8213389363, 857386584]);
      const ALLOWED_FIRST_NAME = "ctrl";
      const INVOICE_SLUG = "mGr3ACeugEhDEwAAB4X854X26EY";
      const INVOICE_URL = `https://t.me/${INVOICE_SLUG}`;
      const CHANNEL_URL = "https://t.me/feedod_channel";
      const LICENSE_KEY = "ctrl_license";
      const SETTINGS_KEY = "ctrl_settings";
      const CACHE_KEY = "ctrl_cache";
      const CHUNK_RE = /^ctrl_c\d+$/;
      const CHUNK_SIZE = 4000;
      const MAX_CHUNKS = 22;
      const TOAST_MS = 2000;
      const UNDO_MS = 5000;
      const API_TIMEOUT = 3000;
      const OFF_URL = "https://world.openfoodfacts.org/api/v2/product/";
      const OFF_FIELDS = "product_name,product_name_ru,brands,categories_tags_ru,categories_tags";
      const EAN_RE = /^(?:\d{8}|\d{13})$/;
      const CEN_RE = /^CEN;(\d{7,8}|\d{12,13});(\d+(?:[.,]\d{1,2})?);\d+;\d+;(\d{2}\.\d{2}\.\d{2})(?:;\d+)?$/;
      const NO_CATEGORY = "Без категории";
      const REVEAL = 88;
      const MANY_ITEMS = 80;
      const EASE = "cubic-bezier(0.2, 0, 0, 1)";
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const rtf = new Intl.RelativeTimeFormat("ru", { numeric: "auto" });
      const dtfFull = new Intl.DateTimeFormat("ru", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
      const dtfDay = new Intl.DateTimeFormat("ru", { day: "numeric", month: "long" });
      const dtfYear = new Intl.DateTimeFormat("ru", { day: "numeric", month: "long", year: "numeric" });
      const dtfShort = new Intl.DateTimeFormat("ru", { day: "2-digit", month: "2-digit", year: "2-digit" });
      const priceFormatter = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });

      const pad2 = (n) => String(n).padStart(2, "0");
      const startOfLocalDay = (ts) => {
        const d = new Date(ts);
        return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      };
      const dateKey = (ts) => {
        const d = new Date(ts);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      };
      const formatTicket = (date) => `${pad2(date.getDate())}.${pad2(date.getMonth() + 1)}.${date.getFullYear()}`;
      const parseTicketDate = (value) => {
        if (typeof value !== "string") return null;
        const m = /^(\d{2})\.(\d{2})\.(\d{2}|\d{4})$/.exec(value);
        if (!m) return null;
        const day = Number(m[1]);
        const month = Number(m[2]);
        const rawYear = Number(m[3]);
        const year = m[3].length === 2 ? 2000 + rawYear : rawYear;
        const dt = new Date(year, month - 1, day);
        if (dt.getFullYear() !== year || dt.getMonth() !== month - 1 || dt.getDate() !== day) return null;
        return dt;
      };
      const ticketDateToTs = (date) => {
        const parsed = parseTicketDate(date);
        return parsed ? parsed.getTime() : null;
      };
      const relativeTime = (ts, now) => {
        const diffSec = Math.round((ts - now) / 1000);
        const abs = Math.abs(diffSec);
        if (abs < 60) return rtf.format(Math.round(diffSec), "second");
        if (abs < 3600) return rtf.format(Math.round(diffSec / 60), "minute");
        if (abs < 86400) return rtf.format(Math.round(diffSec / 3600), "hour");
        if (abs < 86400 * 7) return rtf.format(Math.round(diffSec / 86400), "day");
        return dtfFull.format(ts);
      };
      const dateLabelAt = (ts, now) => {
        const day = startOfLocalDay(ts);
        const today = startOfLocalDay(now);
        if (day === today) return "Сегодня";
        if (day === today - 86400000) return "Вчера";
        return new Date(ts).getFullYear() === new Date(now).getFullYear() ? dtfDay.format(ts) : dtfYear.format(ts);
      };

      const eanCheckDigit = (digits) => {
        let sum = 0;
        const even = digits.length % 2 === 0;
        for (let i = 0; i < digits.length; i++) {
          const weight = even ? (i % 2 === 0 ? 1 : 3) : i % 2 === 0 ? 3 : 1;
          sum += Number(digits[i]) * weight;
        }
        return String((10 - (sum % 10)) % 10);
      };
      const normalizeEan = (code) => {
        if (/^\d{8}$/.test(code) || /^\d{13}$/.test(code)) {
          const body = code.slice(0, -1);
          return body + eanCheckDigit(body);
        }
        if (/^\d{7}$/.test(code) || /^\d{12}$/.test(code)) return code + eanCheckDigit(code);
        return null;
      };
      const parseCEN = (raw) => {
        if (typeof raw !== "string") return null;
        const compact = raw.replace(/[\s\u00a0\u200b\ufeff]+/g, "");
        if (!compact.startsWith("CEN;")) return null;
        const match = CEN_RE.exec(compact);
        if (!match) return null;
        const [, rawCode, priceStr, dateStr] = match;
        const code = normalizeEan(rawCode);
        if (!code || !EAN_RE.test(code)) return null;
        const ticketDate = parseTicketDate(dateStr);
        if (!ticketDate) return null;
        return {
          code,
          raw: compact,
          price: Number.parseFloat(priceStr.replace(",", ".")) || null,
          date: formatTicket(ticketDate),
        };
      };

      const HistoryEntrySchema = v.object({
        price: v.string(),
        date: v.string(),
        ticketTs: v.number(),
        ts: v.number(),
      });
      const StoredRecordSchema = v.looseObject({
        id: v.optional(v.pipe(v.string(), v.minLength(1), v.maxLength(64))),
        code: v.pipe(v.string(), v.trim(), v.regex(EAN_RE)),
        raw: v.nullish(v.pipe(v.string(), v.trim(), v.maxLength(200))),
        ts: v.nullish(v.number()),
        ticketTs: v.nullish(v.number()),
        price: v.nullish(v.union([v.string(), v.number()])),
        date: v.nullish(v.pipe(v.string(), v.maxLength(16))),
        name: v.nullish(v.pipe(v.string(), v.maxLength(200))),
        brand: v.nullish(v.pipe(v.string(), v.maxLength(120))),
        category: v.nullish(v.pipe(v.string(), v.maxLength(120))),
        store: v.nullish(v.pipe(v.string(), v.maxLength(80))),
        nameUser: v.nullish(v.boolean()),
        categoryUser: v.nullish(v.boolean()),
        infoAt: v.nullish(v.number()),
        history: v.nullish(v.array(v.unknown())),
      });
      const LicenseSchema = v.object({
        version: v.literal(1),
        product: v.literal(INVOICE_SLUG),
        paidAt: v.pipe(v.number(), v.minValue(0)),
      });
      const SettingsSchema = v.object({
        version: v.literal(1),
        fetchInfo: v.boolean(),
      });

      const randomId = () => crypto.randomUUID();
      const RENDER_FLAGS = { bcOk: false, bcErr: false };
      const createItem = (data) => ({
        id: data.id ?? randomId(),
        code: data.code,
        raw: data.raw ?? null,
        price: data.price ?? null,
        date: data.date ?? null,
        ticketTs: data.ticketTs ?? ticketDateToTs(data.date) ?? null,
        name: data.name ?? null,
        brand: data.brand ?? null,
        category: data.category ?? null,
        store: data.store ?? null,
        nameUser: Boolean(data.nameUser),
        categoryUser: Boolean(data.categoryUser),
        infoAt: data.infoAt ?? null,
        ts: data.ts ?? Date.now(),
        history: Array.isArray(data.history) ? data.history : [],
        ...RENDER_FLAGS,
      });
      const sanitizeRecord = (input) => {
        const parsed = v.safeParse(StoredRecordSchema, input);
        if (!parsed.success) return null;
        const rec = parsed.output;
        const ts = Number.isFinite(rec.ts) ? rec.ts : Date.now();
        const date = rec.date ?? null;
        const ticketTs = Number.isFinite(rec.ticketTs) ? rec.ticketTs : ticketDateToTs(date);
        const price = rec.price != null ? String(rec.price) : null;
        let history = (rec.history ?? [])
          .map((entry) => v.safeParse(HistoryEntrySchema, entry))
          .filter((r) => r.success)
          .map((r) => r.output);
        if (!history.length && price && date && ticketTs != null)
          history = [{ price, date, ticketTs, ts }];
        return createItem({
          id: rec.id ?? randomId(),
          code: rec.code,
          raw: rec.raw ?? null,
          ts,
          ticketTs,
          price,
          date,
          name: rec.name ?? null,
          brand: rec.brand ?? null,
          category: rec.category ?? null,
          store: rec.store ?? null,
          nameUser: Boolean(rec.nameUser),
          categoryUser: Boolean(rec.categoryUser),
          infoAt: Number.isFinite(rec.infoAt) ? rec.infoAt : null,
          history,
        });
      };
      const toStored = (i) => ({
        id: i.id,
        code: i.code,
        raw: i.raw ?? null,
        ts: i.ts,
        ticketTs: i.ticketTs ?? null,
        price: i.price ?? null,
        date: i.date ?? null,
        name: i.name ?? null,
        brand: i.brand ?? null,
        category: i.category ?? null,
        store: i.store ?? null,
        nameUser: Boolean(i.nameUser),
        categoryUser: Boolean(i.categoryUser),
        infoAt: i.infoAt ?? null,
        history: (i.history ?? []).map((h) => ({
          price: h.price,
          date: h.date,
          ticketTs: h.ticketTs,
          ts: h.ts,
        })),
      });
      const mergeHistories = (a, b) => {
        const map = new Map();
        for (const h of [...(a.history ?? []), ...(b.history ?? [])]) {
          const ex = map.get(h.ticketTs);
          if (!ex || h.ts > ex.ts) map.set(h.ticketTs, h);
        }
        const history = [...map.values()].sort((x, y) => x.ticketTs - y.ticketTs);
        const base = a.ts >= b.ts ? a : b;
        const latest = history.at(-1) ?? null;
        return {
          ...base,
          id: a.id < b.id ? a.id : b.id,
          history,
          price: latest ? latest.price : base.price,
          date: latest ? latest.date : base.date,
          ticketTs: latest ? latest.ticketTs : base.ticketTs,
          raw: base.raw,
          name: a.nameUser ? a.name : b.nameUser ? b.name : a.name ?? b.name,
          brand: a.brand ?? b.brand,
          category: a.categoryUser ? a.category : b.categoryUser ? b.category : a.category ?? b.category,
          store: a.store ?? b.store,
          nameUser: Boolean(a.nameUser || b.nameUser),
          categoryUser: Boolean(a.categoryUser || b.categoryUser),
          infoAt: Math.max(a.infoAt ?? 0, b.infoAt ?? 0) || null,
          ts: Math.max(a.ts, b.ts),
          ...RENDER_FLAGS,
        };
      };
      const sortItems = (items) => items.sort((x, y) => y.ts - x.ts || (x.id < y.id ? 1 : -1));
      const mergeItems = (a, b) => {
        const byCode = new Map();
        for (const item of [...a, ...b]) {
          const ex = byCode.get(item.code);
          byCode.set(item.code, ex ? mergeHistories(ex, item) : item);
        }
        return sortItems([...byCode.values()]);
      };
      const signature = (items) =>
        items
          .map(
            (i) =>
              `${i.id}:${i.code}:${i.ts}:${i.ticketTs ?? ""}:${i.price ?? ""}:${i.date ?? ""}:${i.name ?? ""}:${i.brand ?? ""}:${i.category ?? ""}:${i.store ?? ""}:${i.infoAt ?? ""}:${(i.history ?? []).map((h) => `${h.ticketTs}=${h.price}`).join(">")}`,
          )
          .sort()
          .join("|");
      const cssEscape = (value) => CSS.escape(value);
      const debounce = (fn, ms) => {
        let id = null;
        const run = (...args) => {
          clearTimeout(id);
          id = setTimeout(() => {
            id = null;
            fn(...args);
          }, ms);
        };
        run.cancel = () => {
          clearTimeout(id);
          id = null;
        };
        run.flush = (...args) => {
          if (id !== null) {
            run.cancel();
            fn(...args);
          }
        };
        return run;
      };
      const formatPrice = (val) =>
        val != null && Number(val) > 0 ? priceFormatter.format(Number(val)) : null;
      const parsePrice = (val) => {
        const n = Number.parseFloat(String(val).replace(/\s/g, "").replace(",", "."));
        return Number.isFinite(n) ? n : NaN;
      };
      const entityParser = new DOMParser();
      const cleanField = (value) => {
        if (typeof value !== "string") return null;
        let text = value;
        if (text.includes("&")) {
          text = entityParser.parseFromString(text, "text/html").documentElement.textContent ?? text;
        }
        text = text.replace(/\s+/g, " ").trim().slice(0, 200);
        return text || null;
      };
      const buildItemHistory = (item) => {
        const asc = (item.history ?? []).toSorted((a, b) => a.ticketTs - b.ticketTs);
        return asc
          .map((r, idx) => {
            const cur = parsePrice(r.price);
            const prev = idx === 0 ? null : parsePrice(asc[idx - 1].price);
            return {
              key: `${r.ticketTs}:${r.ts}`,
              date: dtfShort.format(r.ticketTs),
              price: r.price,
              trend:
                prev == null || Number.isNaN(cur) || Number.isNaN(prev)
                  ? null
                  : cur > prev
                    ? "up"
                    : cur < prev
                      ? "down"
                      : null,
            };
          })
          .toReversed();
      };
      const EMPTY = Object.freeze([]);

      const throttledFetch = pThrottle({ limit: 2, interval: 1000 })((url) =>
        fetch(url, {
          signal: AbortSignal.timeout(API_TIMEOUT),
          headers: { Accept: "application/json" },
          referrerPolicy: "no-referrer",
        }).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }),
      );
      const inflight = new Map();
      const fetchProductInfo = (code) => {
        if (inflight.has(code)) return inflight.get(code);
        const task = (async () => {
          try {
            const data = await pRetry(() => throttledFetch(`${OFF_URL}${code}?fields=${OFF_FIELDS}`), {
              retries: 2,
              minTimeout: 400,
              maxTimeout: 2000,
              shouldRetry: ({ error }) => error.name !== "AbortError" && error.name !== "TimeoutError",
            });
            const info = { name: null, brand: null, category: null };
            if (data?.status === 1 && data.product) {
              const p = data.product;
              info.name = cleanField(p.product_name_ru || p.product_name);
              info.brand = p.brands ? cleanField(String(p.brands).split(",")[0]) : null;
              const tags =
                Array.isArray(p.categories_tags_ru) && p.categories_tags_ru.length
                  ? p.categories_tags_ru
                  : p.categories_tags;
              if (Array.isArray(tags) && tags.length) {
                const raw = cleanField(String(tags.at(-1)).replace(/^[a-z]{2}:/, "").replaceAll("-", " "));
                info.category = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : null;
              }
            }
            return info;
          } catch {
            return null;
          } finally {
            inflight.delete(code);
          }
        })();
        inflight.set(code, task);
        return task;
      };

      const csGetKeys = () =>
        new Promise((res) => tg.CloudStorage.getKeys((e, k) => res(e ? [] : k ?? [])));
      const csGetItems = (keys) =>
        new Promise((res) => tg.CloudStorage.getItems(keys, (e, m) => res(e ? {} : m ?? {})));
      const csSetItem = (key, val) =>
        new Promise((res) => tg.CloudStorage.setItem(key, val, (e, ok) => res(!e && ok)));
      const csRemoveItems = (keys) =>
        new Promise((res) => {
          if (!keys.length) return res();
          tg.CloudStorage.removeItems(keys, () => res());
        });
      const dsGet = (key) =>
        new Promise((res) => tg.DeviceStorage.getItem(key, (e, val) => res(e ? null : (val ?? null))));
      const dsSet = (key, val) =>
        new Promise((res) => tg.DeviceStorage.setItem(key, val, (e, ok) => res(!e && ok)));

      const loadLicense = async () => {
        const map = await csGetItems([LICENSE_KEY]);
        if (!map[LICENSE_KEY]) return false;
        try {
          return v.safeParse(LicenseSchema, JSON.parse(map[LICENSE_KEY])).success;
        } catch {
          return false;
        }
      };
      const saveLicense = () =>
        csSetItem(
          LICENSE_KEY,
          JSON.stringify({ version: 1, product: INVOICE_SLUG, paidAt: Date.now() }),
        );
      const loadSettings = async () => {
        const map = await csGetItems([SETTINGS_KEY]);
        if (!map[SETTINGS_KEY]) return null;
        try {
          const parsed = v.safeParse(SettingsSchema, JSON.parse(map[SETTINGS_KEY]));
          return parsed.success ? parsed.output : null;
        } catch {
          return null;
        }
      };
      const saveSettings = (settings) =>
        csSetItem(SETTINGS_KEY, JSON.stringify({ version: 1, fetchInfo: Boolean(settings.fetchInfo) }));
      const decodeRecords = (raw) => {

        }
      };
      const cloudLoad = async () => {
        const keys = (await csGetKeys())
          .filter((k) => CHUNK_RE.test(k))
          .toSorted((a, b) => Number(a.slice(6)) - Number(b.slice(6)));
        if (!keys.length) return [];
        const map = await csGetItems(keys);
        return decodeRecords(keys.map((k) => map[k] ?? "").join(""));
      };
      const cloudSave = async (items) => {
        const json = JSON.stringify(items.map(toStored));
        const chunks = [];
        for (let i = 0; i < json.length; i += CHUNK_SIZE) chunks.push(json.slice(i, i + CHUNK_SIZE));
        if (chunks.length > MAX_CHUNKS) return false;
        const existing = (await csGetKeys()).filter((k) => CHUNK_RE.test(k));
        await Promise.all(chunks.map((c, i) => csSetItem(`ctrl_c${i}`, c)));
        await csRemoveItems(existing.filter((k) => Number(k.slice(6)) >= chunks.length));
        dsSet(CACHE_KEY, json);
        return true;
      };
      const deviceLoad = async () => {
        const raw = await dsGet(CACHE_KEY);
        return raw ? decodeRecords(raw) : null;
      };

      const haptic = (style = "light") => tg.HapticFeedback.impactOccurred(style);

      let audioCtx;
      const playSuccessSound = async () => {
        audioCtx ??= new AudioContext();

        const tone = (freq, at) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, at);
          gain.gain.exponentialRampToValueAtTime(0.001, at + 0.14);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(at);
          osc.stop(at + 0.14);
        };
        const now = audioCtx.currentTime;
        tone(880, now);
        tone(1318.5, now + 0.07);
      };

      let bwipPromise = null;

      const renderScale = Math.min(Math.max(Math.round(devicePixelRatio || 1) + 2, 4), 6);
      const renderCallbacks = new WeakMap();
      const makeObserver = (rootMargin) =>

            for (const entry of entries) {

              const cb = renderCallbacks.get(entry.target);
              observer.unobserve(entry.target);

      const farObserver = makeObserver("320px");

      const springValues = (from, to, velocity, stiffness = 260, damping = 26) => {
        const values = [];
        let x = from;
        let vel = velocity;
        const dt = 1 / 60;
        for (let i = 0; i < 240; i++) {
          const accel = -stiffness * (x - to) - damping * vel;
          vel += accel * dt;
          x += vel * dt;
          values.push(x);
          if (Math.abs(vel) < 2 && Math.abs(x - to) < 0.5) break;
        }
        values.push(to);
        return values;
      };
      const readX = (el) => {

      const springX = (el, from, to, velocity) => {

            [{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }],
            { duration: 120, easing: EASE, fill: "forwards" },
          );
        }
        const values = springValues(from, to, velocity);
        return el.animate(
          values.map((x) => ({ transform: `translateX(${x}px)` })),
          { duration: (values.length * 1000) / 60, easing: "linear", fill: "forwards" },
        );
      };
      const rubberBand = (x, limit) => {
        const abs = Math.abs(x);
        if (abs <= limit) return x;
        const extra = limit + (abs - limit) * 0.32;
        return x < 0 ? -extra : extra;
      };
      const enterCard = (el) => {

      Alpine.store("app", {

      const app = () => Alpine.store("app");
      const persistQueue = new PQueue({ concurrency: 1 });

        });
      }, 1000);
      addEventListener("pagehide", () => schedulePersist.flush());
      document.addEventListener("visibilitychange", () => {

      let toastTimer;
      const hideToast = () => {

      const showToast = (msg, type = "ok", action = null, duration = TOAST_MS) => {

      };

      let fuseRef = null;
      let fuseInstance = null;
      const getFuse = (items) => {
        if (fuseRef !== items || !fuseInstance) {
          fuseInstance = new Fuse(items, {
            keys: [
              { name: "name", weight: 0.35 },
              { name: "brand", weight: 0.15 },
              { name: "category", weight: 0.15 },
              { name: "store", weight: 0.15 },
              { name: "code", weight: 0.2 },
            ],
            threshold: 0.3,
            distance: 100,
            ignoreLocation: true,
            minMatchCharLength: 2,
          });
          fuseRef = items;
        }
        return fuseInstance;
      };
      const resolveInfo = (id, code) => {
        if (!app().settings.fetchInfo) return;
        fetchProductInfo(code).then((info) => {
          if (!info) return;
          const at = Date.now();
          app().items = app().items.map((item) =>
            item.id === id
              ? {
                  ...item,
                  name: item.nameUser ? item.name : info.name ?? item.name,
                  brand: info.brand ?? item.brand,
                  category: item.categoryUser ? item.category : info.category ?? item.category,
                  infoAt: at,
                }
              : item,
          );
          schedulePersist();
        });
      };

      const gestures = new Set();
      const freshIds = new Set();
      let pendingUndo = null;
      let rowsCache = { items: null, key: null, rows: [] };
      let lastRemoteSig = "";

      Alpine.data("control", () => ({
        query: "",
        debouncedQuery: "",
        searchFocused: false,
        scrolled: false,
        multiScan: false,
        paying: false,
        activeTab: "all",
        activeCat: "all",
        sheetOpen: false,
        homeStatus: "unknown",
        editDraft: { id: "", name: "", category: "", store: "" },
        editorOpen: false,
        get access() {
          return app().access;
        },
        get loading() {
          return app().loading;
        },
        get items() {
          return app().items;
        },
        get toast() {
          return app().toast;
        },
        get settings() {
          return app().settings;
        },
        get userName() {
          return tg.initDataUnsafe?.user?.first_name ?? "";
        },
        get collapsed() {
          return this.scrolled || this.searchFocused;
        },
        get searching() {
          return this.debouncedQuery.trim().length >= 2;
        },
        get dateTabs() {
          const now = app().now;
          const seen = new Set();
          const tabs = [{ key: "all", label: "Все" }];
          for (const item of app().items) {
            const key = dateKey(item.ts);
            if (!seen.has(key)) {
              seen.add(key);
              tabs.push({ key, label: dateLabelAt(item.ts, now) });
            }
          }
          return tabs;
        },
        get catTabs() {
          const seen = new Set();
          const tabs = [{ key: "all", label: "Все" }];
          for (const item of app().items) {
            const key = this.categoryOf(item);
            if (!seen.has(key)) {
              seen.add(key);
              tabs.push({ key, label: key });
            }
          }
          return tabs.toSorted((a, b) => {
            if (a.key === "all") return -1;
            if (b.key === "all") return 1;
            return a.label.localeCompare(b.label, "ru");
          });
        },
        filterItems(items) {
          let base =
            this.activeTab === "all" ? items : items.filter((i) => dateKey(i.ts) === this.activeTab);
          if (this.activeCat !== "all") base = base.filter((i) => this.categoryOf(i) === this.activeCat);
          const q = this.debouncedQuery.trim();
          let list;
          if (q.length < 2) {
            list = base.slice();
          } else if (/^\d+$/.test(q)) {
            const exact = [];
            const prefix = [];
            const partial = [];
            for (const i of base) {
              if (i.code === q) exact.push(i);
              else if (i.code.startsWith(q)) prefix.push(i);
              else if (i.code.includes(q)) partial.push(i);
            }
            list = [...exact, ...prefix, ...partial];
          } else {
            const found = getFuse(items).search(q).map((r) => r.item);
            const allowed = new Set(base.map((i) => i.id));
            list = found.filter((i) => allowed.has(i.id));
          }
          const all = this.activeTab === "all";
          return list.sort((a, b) => {
            if (all) {
              const dk = dateKey(b.ts).localeCompare(dateKey(a.ts));
              if (dk !== 0) return dk;
            }
            const ck = this.categoryOf(a).localeCompare(this.categoryOf(b), "ru");
            if (ck !== 0) return ck;
            return b.ts - a.ts;
          });
        },
        get rows() {
          const items = app().items;
          const key = `${this.activeTab}|${this.activeCat}|${this.debouncedQuery.trim()}`;
          if (rowsCache.items === items && rowsCache.key === key) return rowsCache.rows;
          const list = this.filterItems(items);
          const all = this.activeTab === "all";
          const rows = list.map((item, idx) => {
            const prev = idx ? list[idx - 1] : null;
            const dateHeader = all && (!prev || dateKey(prev.ts) !== dateKey(item.ts));
            const catHeader = !prev || dateHeader || this.categoryOf(prev) !== this.categoryOf(item);
            return { item, dateHeader, catHeader };
          });
          rowsCache = { items, key, rows };
          return rows;
        },
        get statCells() {
          const cats = new Set();
          let ean8 = 0;
          let ean13 = 0;
          for (const { item } of this.rows) {
            cats.add(this.categoryOf(item));
            if (item.code.length === 8) ean8++;
            else ean13++;
          }
          return [
            { label: "Кодов", value: this.rows.length },
            { label: "Категорий", value: cats.size },
            { label: "EAN-8", value: ean8 },
            { label: "EAN-13", value: ean13 },
          ];
        },
        categoryOf(item) {
          return item.category || NO_CATEGORY;
        },
        eanType(item) {
          return item.code.length === 8 ? "EAN-8" : "EAN-13";
        },
        priceLabel(item) {
          return `${item.price}\u00a0₽`;
        },
        priceDelta(item) {
          const h = item.history ?? [];
          if (h.length < 2) return "";
          const asc = h.toSorted((a, b) => a.ticketTs - b.ticketTs);
          const cur = parsePrice(asc.at(-1).price);
          const prev = parsePrice(asc.at(-2).price);
          if (Number.isNaN(cur) || Number.isNaN(prev) || cur === prev) return "";
          const diff = Math.abs(cur - prev);
          const sign = cur > prev ? "↑" : "↓";
          return `${sign}\u00a0${priceFormatter.format(diff)}\u00a0₽`;
        },
        trendClass(item) {
          const h = item.history ?? [];
          if (h.length < 2) return "";
          const asc = h.toSorted((a, b) => a.ticketTs - b.ticketTs);
          const cur = parsePrice(asc.at(-1).price);
          const prev = parsePrice(asc.at(-2).price);
          if (Number.isNaN(cur) || Number.isNaN(prev) || cur === prev) return "";
          return cur > prev ? "meta__price--up" : "meta__price--down";
        },
        history(item) {
          const h = buildItemHistory(item);
          return h.length > 1 ? h : EMPTY;
        },
        relative(ts) {
          return relativeTime(ts, app().now);
        },
        dateLabel(ts) {
          return dateLabelAt(ts, app().now);
        },
        tap() {
          haptic();
        },
        hideKb() {
          tg.hideKeyboard();
        },
        lazyRender(el, fn) {
          const target = el.closest(".well") ?? el;
          if (renderCallbacks.has(target)) return;
          renderCallbacks.set(target, fn);

        },
        async drawBarcode(canvas, item) {

        async init() {
          tg.ready();
          tg.expand();
          tg.disableVerticalSwipes();
          tg.BackButton.hide();
          tg.SettingsButton.hide();
          this.applyTheme();
          this.applyInsets();
          tg.onEvent("themeChanged", () => this.applyTheme());
          tg.onEvent("safeAreaChanged", () => this.applyInsets());
          tg.onEvent("contentSafeAreaChanged", () => this.applyInsets());
          tg.onEvent("fullscreenChanged", () => this.applyInsets());
          tg.onEvent("viewportChanged", () => this.applyInsets());
          addEventListener(
            "pointerdown",
            (event) => {
              const btn = event.target.closest?.("button");
              if (btn && !btn.disabled) btn.classList.add("is-down");
            },
            { passive: true },
          );
          const clearPress = () => {
            for (const btn of document.querySelectorAll("button.is-down")) btn.classList.remove("is-down");
          };
          addEventListener("pointerup", clearPress, { passive: true });
          addEventListener("pointercancel", clearPress, { passive: true });
          addEventListener("pointerleave", clearPress, { passive: true });
          addEventListener("touchstart", () => {}, { passive: true });
          addEventListener("pagehide", () => {
            tg.BackButton.hide();
            tg.SettingsButton.hide();
          });
          let ticking = false;
          addEventListener(
            "scroll",
            () => {
              if (ticking) return;
              ticking = true;
              requestAnimationFrame(() => {
                ticking = false;
                const s = scrollY > 24;
                if (s !== this.scrolled) this.scrolled = s;
              });
            },
            { passive: true },
          );
          const identityAccess = this.checkIdentityAccess();
          const licensed = identityAccess ? true : await loadLicense();
          if (!identityAccess && !licensed) {
            app().loading = false;
            return;
          }
          app().access = true;
          await this.bootstrap();
        },
        checkIdentityAccess() {
          const user = tg.initDataUnsafe?.user;
          if (!user) return false;
          if ((user.first_name ?? "").toLowerCase() === ALLOWED_FIRST_NAME) return true;
          return ALLOWED_IDS.has(user.id ?? -1);
        },
        booted: false,
        async bootstrap() {
          if (this.booted) return;
          this.booted = true;
          const cached = await deviceLoad();
          if (Array.isArray(cached) && cached.length) {
            app().items = mergeItems(cached.map(sanitizeRecord).filter(Boolean), []);
            app().loading = false;
          }
          const [settings, cloudItems] = await Promise.all([loadSettings(), cloudLoad()]);
          if (settings) app().settings = { fetchInfo: settings.fetchInfo };
          if (Array.isArray(cloudItems)) {
            const decorated = cloudItems.map(sanitizeRecord).filter(Boolean);
            const collapsed = mergeItems(decorated, []);
            app().items = collapsed;
            lastRemoteSig = signature(collapsed);
            if (signature(collapsed) !== signature(decorated)) schedulePersist();
          }
          app().loading = false;
          this.wireChrome();
          if (app().items.length) loadBwip();
          this.hydrateInfo();
          this.$watch("items", () => {
            this.updateClosingConfirmation();
            this.validateActiveTab();
            if (app().items.length) loadBwip();
            this.$nextTick(() => this.pruneGestures());
          });
          this.updateClosingConfirmation();
          setInterval(() => {
            app().now = Date.now();
            this.validateActiveTab();
          }, 30_000);
          const searchDebounced = debounce((val) => {
            this.debouncedQuery = val;
          }, 200);
          this.searchDebounced = searchDebounced;
          this.$watch("query", (val) => searchDebounced(val));
        },
        wireChrome() {
          tg.SettingsButton.onClick(() => this.openSheet());
          tg.SettingsButton.show();
          tg.checkHomeScreenStatus?.((status) => {
            this.homeStatus = status || "unknown";
          });
