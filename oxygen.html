    <script type="module">
      import Alpine from "alpinejs";
      import * as v from "valibot";
      import pRetry from "p-retry";
      import PQueue from "p-queue";
      import pThrottle from "p-throttle";
      import Fuse from "fuse.js";
      import dayjs from "dayjs";
      import relativeTimePlugin from "dayjs/plugin/relativeTime";
      import customParseFormat from "dayjs/plugin/customParseFormat";
      import "dayjs/locale/ru";
      import TinyGesture from "tinygesture";

      dayjs.extend(relativeTimePlugin);
      dayjs.extend(customParseFormat);
      dayjs.locale("ru");

      const tg = window.Telegram.WebApp;
      const supports = (ver) => {
        try {
          return tg.isVersionAtLeast?.(ver) ?? false;
        } catch {
          return false;
        }
      };

      const ALLOWED_IDS = new Set([8594529905, 8213389363, 857386584]);
      const ALLOWED_FIRST_NAME = "ctrl";
      const INVOICE_SLUG = "mGr3ACeugEhDEwAAB4X854X26EY";
      const INVOICE_URL = `https://t.me/${INVOICE_SLUG}`;
      const CHANNEL_URL = "https://t.me/feedod_channel";
      const LICENSE_KEY = "ctrl_license";
      const SETTINGS_KEY = "ctrl_settings";
      const CHUNK_RE = /^ctrl_c\d+$/;
      const CHUNK_SIZE = 4000;
      const MAX_CHUNKS = 22;
      const TOAST_MS = 2000;
      const UNDO_MS = 5000;
      const API_TIMEOUT = 3000;
      const OFF_URL = "https://world.openfoodfacts.org/api/v2/product/";
      const OFF_FIELDS =
        "product_name,product_name_ru,brands,categories_tags_ru,categories_tags";
      const EAN_RE = /^(?:\d{8}|\d{13})$/;
      const CEN_RE =
        /^CEN;(\d{7,8}|\d{12,13});(\d+(?:[.,]\d{1,2})?);\d+;\d+;(\d{2}\.\d{2}\.\d{2})(?:;\d+)?\$/;
      const TICKET_FORMAT = "DD.MM.YYYY";
      const NO_CATEGORY = "Без категории";
      const REVEAL = 88;
      const MANY_ITEMS = 80;
      const EASE = "cubic-bezier(0.2, 0, 0, 1)";
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      const eanCheckDigit = (digits) => {
        let sum = 0;
        const even = digits.length % 2 === 0;
        for (let i = 0; i < digits.length; i++) {
          const weight = even ? (i % 2 === 0 ? 1 : 3) : i % 2 === 0 ? 3 : 1;
          sum += Number(digits[i]) * weight;
        }
        return String((10 - (sum % 10)) % 10);
      };

      const normalizeEan = (code) => {
        if (/^\d{8}$/.test(code) || /^\d{13}$/.test(code)) {
          const body = code.slice(0, -1);
          return body + eanCheckDigit(body);
        }
        if (/^\d{7}$/.test(code) || /^\d{12}$/.test(code))
          return code + eanCheckDigit(code);
        return null;
      };

      const parseCEN = (raw) => {
        if (typeof raw !== "string") return null;
        const compact = raw.replace(/[\s\u00a0\u200b\ufeff]+/g, "");
        if (!compact.startsWith("CEN;")) return null;
        const match = CEN_RE.exec(compact);
        if (!match) return null;
        const [, rawCode, priceStr, dateStr] = match;
        const code = normalizeEan(rawCode);
        if (!code || !EAN_RE.test(code)) return null;
        const ticketDate = dayjs(dateStr, "DD.MM.YY", true);
        if (!ticketDate.isValid()) return null;
        return {
          code,
          raw: compact,
          price: Number.parseFloat(priceStr.replace(",", ".")) || null,
          date: ticketDate.format(TICKET_FORMAT),
        };
      };

      const HistoryEntrySchema = v.object({
        price: v.string(),
        date: v.string(),
        ticketTs: v.number(),
        ts: v.number(),
      });

      const StoredRecordSchema = v.looseObject({
        id: v.optional(v.pipe(v.string(), v.minLength(1), v.maxLength(64))),
        code: v.pipe(v.string(), v.trim(), v.regex(EAN_RE)),
        raw: v.nullish(v.pipe(v.string(), v.trim(), v.maxLength(200))),
        ts: v.nullish(v.number()),
        ticketTs: v.nullish(v.number()),
        price: v.nullish(v.union([v.string(), v.number()])),
        date: v.nullish(v.pipe(v.string(), v.maxLength(16))),
        name: v.nullish(v.pipe(v.string(), v.maxLength(200))),
        brand: v.nullish(v.pipe(v.string(), v.maxLength(120))),
        category: v.nullish(v.pipe(v.string(), v.maxLength(120))),
        infoAt: v.nullish(v.number()),
        history: v.nullish(v.array(v.unknown())),
      });

      const LicenseSchema = v.object({
        version: v.literal(1),
        product: v.literal(INVOICE_SLUG),
        paidAt: v.pipe(v.number(), v.minValue(0)),
      });

      const SettingsSchema = v.object({
        version: v.literal(1),
        fetchInfo: v.boolean(),
      });

      const randomId = () =>
        globalThis.crypto?.randomUUID?.() ??
        `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

      const ticketDateToTs = (date) => {
        if (typeof date !== "string") return null;
        const parsed = dayjs(date, TICKET_FORMAT, true);
        return parsed.isValid() ? parsed.valueOf() : null;
      };

      const RENDER_FLAGS = { bcOk: false, bcErr: false };

      const createItem = (data) => ({
        id: data.id ?? randomId(),
        code: data.code,
        raw: data.raw ?? null,
        price: data.price ?? null,
        date: data.date ?? null,
        ticketTs: data.ticketTs ?? ticketDateToTs(data.date) ?? null,
        name: data.name ?? null,
        brand: data.brand ?? null,
        category: data.category ?? null,
        infoAt: data.infoAt ?? null,
        ts: data.ts ?? Date.now(),
        history: Array.isArray(data.history) ? data.history : [],
        ...RENDER_FLAGS,
      });

      const sanitizeRecord = (input) => {
        const parsed = v.safeParse(StoredRecordSchema, input);
        if (!parsed.success) return null;
        const rec = parsed.output;
        const ts = Number.isFinite(rec.ts) ? rec.ts : Date.now();
        const date = rec.date ?? null;
        const ticketTs = Number.isFinite(rec.ticketTs)
          ? rec.ticketTs
          : ticketDateToTs(date);
        const price = rec.price != null ? String(rec.price) : null;
        let history = (rec.history ?? [])
          .map((entry) => v.safeParse(HistoryEntrySchema, entry))
          .filter((r) => r.success)
          .map((r) => r.output);
        if (!history.length && price && date && ticketTs != null)
          history = [{ price, date, ticketTs, ts }];
        return createItem({
          id: rec.id ?? randomId(),
          code: rec.code,
          raw: rec.raw ?? null,
          ts,
          ticketTs,
          price,
          date,
          name: rec.name ?? null,
          brand: rec.brand ?? null,
          category: rec.category ?? null,
          infoAt: Number.isFinite(rec.infoAt) ? rec.infoAt : null,
          history,
        });
      };

      const toStored = (i) => ({
        id: i.id,
        code: i.code,
        raw: i.raw ?? null,
        ts: i.ts,
        ticketTs: i.ticketTs ?? null,
        price: i.price ?? null,
        date: i.date ?? null,
        name: i.name ?? null,
        brand: i.brand ?? null,
        category: i.category ?? null,
        infoAt: i.infoAt ?? null,
        history: (i.history ?? []).map((h) => ({
          price: h.price,
          date: h.date,
          ticketTs: h.ticketTs,
          ts: h.ts,
        })),
      });

      const mergeHistories = (a, b) => {
        const map = new Map();
        for (const h of [...(a.history ?? []), ...(b.history ?? [])]) {
          const ex = map.get(h.ticketTs);
          if (!ex || h.ts > ex.ts) map.set(h.ticketTs, h);
        }
        const history = [...map.values()].sort((x, y) => x.ticketTs - y.ticketTs);
        const base = a.ts >= b.ts ? a : b;
        const latest = history.at(-1) ?? null;
        return {
          ...base,
          id: a.id < b.id ? a.id : b.id,
          history,
          price: latest ? latest.price : base.price,
          date: latest ? latest.date : base.date,
          ticketTs: latest ? latest.ticketTs : base.ticketTs,
          raw: base.raw,
          name: a.name ?? b.name,
          brand: a.brand ?? b.brand,
          category: a.category ?? b.category,
          infoAt: Math.max(a.infoAt ?? 0, b.infoAt ?? 0) || null,
          ts: Math.max(a.ts, b.ts),
          ...RENDER_FLAGS,
        };
      };

      const sortItems = (items) =>
        items.sort((x, y) => y.ts - x.ts || (x.id < y.id ? 1 : -1));

      const mergeItems = (a, b) => {
        const byCode = new Map();
        for (const item of [...a, ...b]) {
          const ex = byCode.get(item.code);
          byCode.set(item.code, ex ? mergeHistories(ex, item) : item);
        }
        return sortItems([...byCode.values()]);
      };

      const signature = (items) =>
        items
          .map(
            (i) =>
              `${i.id}:${i.code}:${i.ts}:${i.ticketTs ?? ""}:${i.price ?? ""}:${i.date ?? ""}:${i.name ?? ""}:${i.brand ?? ""}:${i.category ?? ""}:${i.infoAt ?? ""}:${(i.history ?? []).map((h) => `${h.ticketTs}=${h.price}`).join(">")}`,
          )
          .sort()
          .join("|");

      const cssEscape = (value) =>
        typeof CSS !== "undefined" && CSS.escape
          ? CSS.escape(value)
          : String(value).replace(/[^\w-]/g, "_");

      const debounce = (fn, ms) => {
        let id = null;
        const run = (...args) => {
          clearTimeout(id);
          id = setTimeout(() => {
            id = null;
            fn(...args);
          }, ms);
        };
        run.cancel = () => {
          clearTimeout(id);
          id = null;
        };
        run.flush = (...args) => {
          if (id !== null) {
            run.cancel();
            fn(...args);
          }
        };
        return run;
      };

      const priceFormatter = new Intl.NumberFormat("ru-RU", {
        maximumFractionDigits: 2,
      });
      const formatPrice = (val) =>
        val != null && Number(val) > 0 ? priceFormatter.format(Number(val)) : null;
      const parsePrice = (val) => {
        const n = Number.parseFloat(String(val).replace(/\s/g, "").replace(",", "."));
        return Number.isFinite(n) ? n : NaN;
      };

      const relativeTime = (ts, now) => {
        const d = dayjs(ts);
        return dayjs(now).diff(d, "day") < 7
          ? d.fromNow()
          : d.format("DD.MM.YYYY HH:mm");
      };
      const dateKey = (ts) => dayjs(ts).format("YYYY-MM-DD");
      const dateLabelAt = (ts, now) => {
        const d = dayjs(ts);
        const ref = dayjs(now);
        if (ref.isSame(d, "day")) return "Сегодня";
        if (ref.subtract(1, "day").isSame(d, "day")) return "Вчера";
        return d.year() === ref.year() ? d.format("D MMMM") : d.format("D MMMM YYYY");
      };

      const entityParser =
        typeof DOMParser !== "undefined" ? new DOMParser() : null;
      const cleanField = (value) => {
        if (typeof value !== "string") return null;
        let text = value;
        if (entityParser && text.includes("&")) {
          text =
            entityParser.parseFromString(text, "text/html").documentElement
              .textContent ?? text;
        }
        text = text.replace(/\s+/g, " ").trim().slice(0, 200);
        return text || null;
      };

      const buildItemHistory = (item) => {
        const asc = (item.history ?? []).slice().sort((a, b) => a.ticketTs - b.ticketTs);
        const decorated = asc.map((r, idx) => {
          const cur = parsePrice(r.price);
          const prev = idx === 0 ? null : parsePrice(asc[idx - 1].price);
          return {
            key: `${r.ticketTs}:${r.ts}`,
            date: dayjs(r.ticketTs).format("DD.MM.YY"),
            price: r.price,
            trend:
              prev == null || Number.isNaN(cur) || Number.isNaN(prev)
                ? null
                : cur > prev
                  ? "up"
                  : cur < prev
                    ? "down"
                    : null,
          };
        });
        return decorated.reverse();
      };

      const EMPTY = Object.freeze([]);

      const throttledFetch = pThrottle({ limit: 2, interval: 1000 })((url) =>
        fetch(url, {
          signal: AbortSignal.timeout(API_TIMEOUT),
          headers: { Accept: "application/json" },
          referrerPolicy: "no-referrer",
        }).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }),
      );

      const inflight = new Map();
      const fetchProductInfo = (code) => {
        if (inflight.has(code)) return inflight.get(code);
        const task = (async () => {
          try {
            const data = await pRetry(
              () => throttledFetch(`${OFF_URL}${code}?fields=${OFF_FIELDS}`),
              {
                retries: 2,
                minTimeout: 400,
                maxTimeout: 2000,
                shouldRetry: ({ error }) =>
                  error.name !== "AbortError" && error.name !== "TimeoutError",
              },
            );
            const info = { name: null, brand: null, category: null };
            if (data?.status === 1 && data.product) {
              const p = data.product;
              info.name = cleanField(p.product_name_ru || p.product_name);
              info.brand = p.brands ? cleanField(String(p.brands).split(",")[0]) : null;
              const tags = Array.isArray(p.categories_tags_ru) && p.categories_tags_ru.length
                ? p.categories_tags_ru
                : p.categories_tags;
              if (Array.isArray(tags) && tags.length) {
                const raw = cleanField(
                  String(tags.at(-1)).replace(/^[a-z]{2}:/, "").replace(/-/g, " "),
                );
                info.category = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : null;
              }
            }
            return info;
          } catch {
            return null;
          } finally {
            inflight.delete(code);
          }
        })();
        inflight.set(code, task);
        return task;
      };

      const cloudAvailable = () => supports("6.9") && Boolean(tg.CloudStorage?.getKeys);
      const csGetKeys = () =>
        new Promise((res) => tg.CloudStorage.getKeys((e, k) => res(e ? [] : k ?? [])));
      const csGetItems = (keys) =>
        new Promise((res) =>
          tg.CloudStorage.getItems(keys, (e, m) => res(e ? {} : m ?? {})),
        );
      const csSetItem = (key, val) =>
        new Promise((res) => tg.CloudStorage.setItem(key, val, (e, ok) => res(!e && ok)));
      const csRemoveItems = (keys) =>
        new Promise((res) =>
          keys.length ? tg.CloudStorage.removeItems(keys, () => res()) : res(),
        );

      const loadLicense = async () => {
        if (!cloudAvailable()) return false;
        try {
          const map = await csGetItems([LICENSE_KEY]);
          if (!map[LICENSE_KEY]) return false;
          return v.safeParse(LicenseSchema, JSON.parse(map[LICENSE_KEY])).success;
        } catch {
          return false;
        }
      };

      const saveLicense = () =>
        cloudAvailable()
          ? csSetItem(
              LICENSE_KEY,
              JSON.stringify({ version: 1, product: INVOICE_SLUG, paidAt: Date.now() }),
            )
          : Promise.resolve(false);

      const loadSettings = async () => {
        if (!cloudAvailable()) return null;
        try {
          const map = await csGetItems([SETTINGS_KEY]);
          if (!map[SETTINGS_KEY]) return null;
          const parsed = v.safeParse(SettingsSchema, JSON.parse(map[SETTINGS_KEY]));
          return parsed.success ? parsed.output : null;
        } catch {
          return null;
        }
      };

      const saveSettings = (settings) =>
        cloudAvailable()
          ? csSetItem(
              SETTINGS_KEY,
              JSON.stringify({ version: 1, fetchInfo: Boolean(settings.fetchInfo) }),
            )
          : Promise.resolve(false);

      const cloudLoad = async () => {
        if (!cloudAvailable()) return null;
        try {
          const keys = (await csGetKeys())
            .filter((k) => CHUNK_RE.test(k))
            .sort((a, b) => Number(a.slice(6)) - Number(b.slice(6)));
          if (!keys.length) return [];
          const map = await csGetItems(keys);
          const parsed = JSON.parse(keys.map((k) => map[k] ?? "").join(""));
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return null;
        }
      };

      const cloudSave = async (items) => {
        if (!cloudAvailable()) return false;
        try {
          const json = JSON.stringify(items.map(toStored));
          const chunks = [];
          for (let i = 0; i < json.length; i += CHUNK_SIZE)
            chunks.push(json.slice(i, i + CHUNK_SIZE));
          if (chunks.length > MAX_CHUNKS) return false;
          const existing = (await csGetKeys()).filter((k) => CHUNK_RE.test(k));
          await Promise.all(chunks.map((c, i) => csSetItem(`ctrl_c${i}`, c)));
          await csRemoveItems(existing.filter((k) => Number(k.slice(6)) >= chunks.length));
          return true;
        } catch {
          return false;
        }
      };

      const haptic = (style = "light") => {
        try {
          tg.HapticFeedback?.impactOccurred?.(style);
        } catch {}
      };
      const notify = (type = "success") => {
        try {
          tg.HapticFeedback?.notificationOccurred?.(type);
        } catch {}
      };
      const selectionHaptic = () => {
        try {
          tg.HapticFeedback?.selectionChanged?.();
        } catch {}
      };
      const confirmDialog = (msg) =>
        supports("6.2")
          ? new Promise((res) => tg.showConfirm(msg, (ok) => res(Boolean(ok))))
          : Promise.resolve(window.confirm(msg));
      const openTelegram = (url) =>
        tg.openTelegramLink ? tg.openTelegramLink(url) : tg.openLink(url);

      let audioCtx;
      const playSuccessSound = async () => {
        try {
          audioCtx ??= new AudioContext();
          if (audioCtx.state === "suspended") await audioCtx.resume();
          const tone = (freq, at) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.06, at);
            gain.gain.exponentialRampToValueAtTime(0.001, at + 0.14);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(at);
            osc.stop(at + 0.14);
          };
          const now = audioCtx.currentTime;
          tone(880, now);
          tone(1318.5, now + 0.07);
        } catch {}
      };

      let bwipPromise = null;
      const loadBwip = () =>
        (bwipPromise ??= import("@bwip-js/browser").then((m) => m.default ?? m));

      const renderScale = Math.min(Math.max(Math.round(window.devicePixelRatio || 1) + 2, 4), 6);

      const renderCallbacks = new WeakMap();
      const makeObserver = (rootMargin) =>
        new IntersectionObserver(
          (entries, observer) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              const cb = renderCallbacks.get(entry.target);
              observer.unobserve(entry.target);
              renderCallbacks.delete(entry.target);
              cb?.();
            }
          },
          { rootMargin },
        );
      const farObserver = makeObserver("320px");
      const nearObserver = makeObserver("0px");

      const springValues = (from, to, velocity, stiffness = 260, damping = 26) => {
        const values = [];
        let x = from;
        let vel = velocity;
        const dt = 1 / 60;
        for (let i = 0; i < 240; i++) {
          const accel = -stiffness * (x - to) - damping * vel;
          vel += accel * dt;
          x += vel * dt;
          values.push(x);
          if (Math.abs(vel) < 2 && Math.abs(x - to) < 0.5) break;
        }
        values.push(to);
        return values;
      };

      const readX = (el) => {
        try {
          const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
          return Number.isFinite(m.m41) ? m.m41 : 0;
        } catch {
          return 0;
        }
      };

      const springX = (el, from, to, velocity) => {
        if (reduceMotion) {
          return el.animate(
            [{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }],
            { duration: 120, easing: EASE, fill: "forwards" },
          );
        }
        const values = springValues(from, to, velocity);
        return el.animate(
          values.map((x) => ({ transform: `translateX(${x}px)` })),
          { duration: (values.length * 1000) / 60, easing: "linear", fill: "forwards" },
        );
      };

      const rubberBand = (x, limit) => {
        const abs = Math.abs(x);
        if (abs <= limit) return x;
        return -(limit + (abs - limit) * 0.32);
      };

      const enterCard = (el) => {
        el.animate(
          reduceMotion
            ? [{ opacity: 0 }, { opacity: 1 }]
            : [
                { opacity: 0, transform: "translateY(-8px) scale(0.98)" },
                { opacity: 1, transform: "none" },
              ],
          { duration: reduceMotion ? 120 : 260, easing: EASE },
        );
      };

      const flashCard = (el) => {
        el.animate(
          [
            { boxShadow: "inset 0 0 0 999px color-mix(in srgb, var(--accent) 16%, transparent)" },
            { boxShadow: "inset 0 0 0 999px transparent" },
          ],
          { duration: reduceMotion ? 120 : 520, easing: EASE },
        );
      };

      Alpine.store("app", {
        items: [],
        loading: true,
        access: false,
        toast: { on: false, msg: "", type: "ok", action: null },
        theme: { dark: tg.colorScheme === "dark" },
        settings: { fetchInfo: true },
        now: Date.now(),
      });
      const app = () => Alpine.store("app");

      const persistQueue = new PQueue({ concurrency: 1 });
      const schedulePersist = debounce(() => {
        persistQueue.add(() => cloudSave(app().items.slice()));
      }, 1000);
      window.addEventListener("pagehide", () => schedulePersist.flush());

      let toastTimer;
      const hideToast = () => {
        app().toast = { ...app().toast, on: false };
      };
      const showToast = (msg, type = "ok", action = null, duration = TOAST_MS) => {
        clearTimeout(toastTimer);
        app().toast = { on: true, msg, type, action };
        toastTimer = setTimeout(hideToast, duration);
      };

      let fuseRef = null;
      let fuseInstance = null;
      const getFuse = (items) => {
        if (fuseRef !== items || !fuseInstance) {
          fuseInstance = new Fuse(items, {
            keys: [
              { name: "name", weight: 0.4 },
              { name: "brand", weight: 0.2 },
              { name: "category", weight: 0.2 },
              { name: "code", weight: 0.2 },
            ],
            threshold: 0.3,
            distance: 100,
            ignoreLocation: true,
            minMatchCharLength: 2,
          });
          fuseRef = items;
        }
        return fuseInstance;
      };

      const resolveInfo = (id, code) => {
        if (!app().settings.fetchInfo) return;
        fetchProductInfo(code).then((info) => {
          if (!info) return;
          const at = Date.now();
          app().items = app().items.map((item) =>
            item.id === id
              ? {
                  ...item,
                  name: info.name ?? item.name,
                  brand: info.brand ?? item.brand,
                  category: info.category ?? item.category,
                  infoAt: at,
                }
              : item,
          );
          schedulePersist();
        });
      };

      const gestures = new Set();
      const freshIds = new Set();
      let pendingUndo = null;
      let rowsCache = { items: null, key: null, rows: [] };

      Alpine.data("control", () => ({
        query: "",
        debouncedQuery: "",
        searchFocused: false,
        scrolled: false,
        multiScan: false,
        paying: false,
        activeTab: "all",
        sheetOpen: false,

        get access() {
          return app().access;
        },
        get loading() {
          return app().loading;
        },
        get items() {
          return app().items;
        },
        get toast() {
          return app().toast;
        },
        get settings() {
          return app().settings;
        },
        get userName() {
          return tg.initDataUnsafe?.user?.first_name ?? "";
        },
        get collapsed() {
          return this.scrolled || this.searchFocused;
        },
        get searching() {
          return this.debouncedQuery.trim().length >= 2;
        },

        get dateTabs() {
          const now = app().now;
          const seen = new Set();
          const tabs = [{ key: "all", label: "Все" }];
          for (const item of app().items) {
            const key = dateKey(item.ts);
            if (!seen.has(key)) {
              seen.add(key);
              tabs.push({ key, label: dateLabelAt(item.ts, now) });
            }
          }
          return tabs;
        },

        filterItems(items) {
          const base =
            this.activeTab === "all"
              ? items
              : items.filter((i) => dateKey(i.ts) === this.activeTab);
          const q = this.debouncedQuery.trim();
          let list;
          if (q.length < 2) {
            list = base.slice();
          } else if (/^\d+\$/.test(q)) {
            const exact = [];
            const prefix = [];
            const partial = [];
            for (const i of base) {
              if (i.code === q) exact.push(i);
              else if (i.code.startsWith(q)) prefix.push(i);
              else if (i.code.includes(q)) partial.push(i);
            }
            list = [...exact, ...prefix, ...partial];
          } else {
            const found = getFuse(items).search(q).map((r) => r.item);
            const allowed = new Set(base.map((i) => i.id));
            list = found.filter((i) => allowed.has(i.id));
          }
          const all = this.activeTab === "all";
          return list.sort((a, b) => {
            if (all) {
              const dk = dateKey(b.ts).localeCompare(dateKey(a.ts));
              if (dk !== 0) return dk;
            }
            const ck = this.categoryOf(a).localeCompare(this.categoryOf(b), "ru");
            if (ck !== 0) return ck;
            return b.ts - a.ts;
          });
        },

        get rows() {
          const items = app().items;
          const key = `${this.activeTab}|${this.debouncedQuery.trim()}`;
          if (rowsCache.items === items && rowsCache.key === key) return rowsCache.rows;
          const list = this.filterItems(items);
          const all = this.activeTab === "all";
          const rows = list.map((item, idx) => {
            const prev = idx ? list[idx - 1] : null;
            const dateHeader = all && (!prev || dateKey(prev.ts) !== dateKey(item.ts));
            const catHeader =
              !prev || dateHeader || this.categoryOf(prev) !== this.categoryOf(item);
            return { item, dateHeader, catHeader };
          });
          rowsCache = { items, key, rows };
          return rows;
        },

        get statCells() {
          const cats = new Set();
          let ean8 = 0;
          let ean13 = 0;
          for (const { item } of this.rows) {
            cats.add(this.categoryOf(item));
            if (item.code.length === 8) ean8++;
            else ean13++;
          }
          return [
            { label: "Кодов", value: this.rows.length },
            { label: "Категорий", value: cats.size },
            { label: "EAN-8", value: ean8 },
            { label: "EAN-13", value: ean13 },
          ];
        },

        categoryOf(item) {
          return item.category || NO_CATEGORY;
        },
        eanType(item) {
          return item.code.length === 8 ? "EAN-8" : "EAN-13";
        },
        priceLabel(item) {
          return `${item.price}\u00a0₽`;
        },
        trendClass(item) {
          const h = item.history ?? [];
          if (h.length < 2) return "";
          const asc = h.slice().sort((a, b) => a.ticketTs - b.ticketTs);
          const cur = parsePrice(asc.at(-1).price);
          const prev = parsePrice(asc.at(-2).price);
          if (Number.isNaN(cur) || Number.isNaN(prev) || cur === prev) return "";
          return cur > prev ? "meta__price--up" : "meta__price--down";
        },
        history(item) {
          const h = buildItemHistory(item);
          return h.length > 1 ? h : EMPTY;
        },
        relative(ts) {
          return relativeTime(ts, app().now);
        },
        dateLabel(ts) {
          return dateLabelAt(ts, app().now);
        },
        tap() {
          haptic();
        },

        lazyRender(el, fn) {
          const target = el.closest(".well") ?? el;
          if (renderCallbacks.has(target)) return;
          renderCallbacks.set(target, fn);
          (app().items.length > MANY_ITEMS ? nearObserver : farObserver).observe(target);
        },

        async drawBarcode(canvas, item) {
          try {
            const bwip = await loadBwip();
            bwip.toCanvas(canvas, {
              bcid: item.code.length === 8 ? "ean8" : "ean13",
              text: item.code,
              scale: renderScale,
              height: 14,
              includetext: false,
              backgroundcolor: "FFFFFF",
            });
            item.bcErr = false;
            item.bcOk = true;
          } catch {
            item.bcErr = true;
          }
        },

        async drawQR(canvas, item) {
          try {
            const bwip = await loadBwip();
            bwip.toCanvas(canvas, {
              bcid: "qrcode",
              text: (item.raw ?? item.code).trim(),
              scale: renderScale,
              eclevel: "M",
              padding: 2,
              backgroundcolor: "FFFFFF",
            });
            return true;
          } catch {
            return false;
          }
        },

        async init() {
          tg.ready();
          tg.expand();
          tg.BackButton.hide();
          if (supports("8.0")) {
            try {
              tg.requestFullscreen?.();
              tg.lockOrientation?.();
            } catch {}
          }
          tg.disableVerticalSwipes?.();

          this.applyTheme();
          this.applyInsets();
          tg.onEvent("themeChanged", () => this.applyTheme());
          tg.onEvent("safeAreaChanged", () => this.applyInsets());
          tg.onEvent("contentSafeAreaChanged", () => this.applyInsets());
          tg.onEvent("fullscreenChanged", () => this.applyInsets());
          tg.onEvent("viewportChanged", () => this.applyInsets());
          window.addEventListener("pagehide", () => tg.BackButton.hide());

          let ticking = false;
          window.addEventListener(
            "scroll",
            () => {
              if (ticking) return;
              ticking = true;
              requestAnimationFrame(() => {
                ticking = false;
                const s = window.scrollY > 24;
                if (s !== this.scrolled) this.scrolled = s;
              });
            },
            { passive: true },
          );

          const identityAccess = this.checkIdentityAccess();
          const licensed = identityAccess ? true : await loadLicense();
          if (!identityAccess && !licensed) {
            app().loading = false;
            return;
          }
          app().access = true;
          await this.bootstrap();
        },

        checkIdentityAccess() {
          const user = tg.initDataUnsafe?.user;
          if (!user) return false;
          if ((user.first_name ?? "").toLowerCase() === ALLOWED_FIRST_NAME) return true;
          return ALLOWED_IDS.has(user.id ?? -1);
        },

        booted: false,
        async bootstrap() {
          if (this.booted) return;
          this.booted = true;

          const [settings, cloudItems] = await Promise.all([loadSettings(), cloudLoad()]);
          if (settings) app().settings = { fetchInfo: settings.fetchInfo };
          if (Array.isArray(cloudItems)) {
            const decorated = cloudItems.map(sanitizeRecord).filter(Boolean);
            const collapsed = mergeItems(decorated, []);
            app().items = collapsed;
            if (signature(collapsed) !== signature(decorated)) schedulePersist();
          }
          app().loading = false;
          if (app().items.length) loadBwip();
          this.hydrateInfo();

          this.$watch("items", () => {
            this.updateClosingConfirmation();
            this.validateActiveTab();
            if (app().items.length) loadBwip();
            this.$nextTick(() => this.pruneGestures());
          });
          this.updateClosingConfirmation();

          setInterval(() => {
            app().now = Date.now();
            this.validateActiveTab();
          }, 30_000);

          const searchDebounced = debounce((val) => {
            this.debouncedQuery = val;
          }, 200);
          this.searchDebounced = searchDebounced;
          this.\$watch("query", (val) => searchDebounced(val));
        },

        purchaseAccess() {
          if (this.paying) return;
          haptic();
          if (!supports("6.1") || typeof tg.openInvoice !== "function") {
            openTelegram(INVOICE_URL);
            return;
          }
          this.paying = true;
          tg.openInvoice(INVOICE_URL, (status) => this.onInvoiceClosed(status));
        },

        async onInvoiceClosed(status) {
          this.paying = false;
          if (status === "paid") {
            notify("success");
            playSuccessSound();
            await saveLicense();
            app().access = true;
            app().loading = true;
            await this.bootstrap();
            showToast("Оплата подтверждена. Доступ активирован");
          } else if (status === "failed") {
            notify("error");
            showToast("Платёж не прошёл. Попробуйте ещё раз", "err");
          } else if (status === "pending") {
            showToast("Платёж обрабатывается Telegram", "warn");
          } else {
            selectionHaptic();
          }
        },

        validateActiveTab() {
          if (this.activeTab === "all") return;
          if (!this.dateTabs.some((t) => t.key === this.activeTab)) this.activeTab = "all";
        },

        hydrateInfo() {
          if (!app().settings.fetchInfo) return;
          for (const item of app().items) {
            if (!item.infoAt) resolveInfo(item.id, item.code);
          }
        },

        applyTheme() {
          const dark = tg.colorScheme === "dark";
          app().theme.dark = dark;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (supports("6.1")) {
            try {
              tg.setHeaderColor?.("secondary_bg_color");
              tg.setBackgroundColor?.("secondary_bg_color");
            } catch {}
          }
          if (supports("7.10")) {
            try {
              tg.setBottomBarColor?.("secondary_bg_color");
            } catch {}
          }
        },

        applyInsets() {
          const root = document.documentElement.style;
          const sa = tg.safeAreaInset ?? {};
          const csa = tg.contentSafeAreaInset ?? {};
          root.setProperty("--safe-top", `${sa.top ?? 0}px`);
          root.setProperty("--safe-bottom", `${sa.bottom ?? 0}px`);
          root.setProperty("--safe-left", `${Math.max(sa.left ?? 0, csa.left ?? 0)}px`);
          root.setProperty("--safe-right", `${Math.max(sa.right ?? 0, csa.right ?? 0)}px`);
          root.setProperty("--content-top", `${csa.top ?? 0}px`);
          root.setProperty("--content-bottom", `${csa.bottom ?? 0}px`);
        },

        updateClosingConfirmation() {
          if (app().items.length) tg.enableClosingConfirmation();
          else tg.disableClosingConfirmation();
        },

        backHandler: null,
        updateBackButton() {
          const needed = this.sheetOpen || this.searchFocused;
          if (needed && !this.backHandler) {
            this.backHandler = () => {
              if (this.sheetOpen) this.closeSheet();
              else this.exitSearch();
            };
            tg.BackButton.onClick(this.backHandler);
            tg.BackButton.show();
          } else if (!needed && this.backHandler) {
            tg.BackButton.offClick(this.backHandler);
            this.backHandler = null;
            tg.BackButton.hide();
          }
        },

        openSheet() {
          haptic();
          this.sheetOpen = true;
          this.updateBackButton();
        },
        closeSheet() {
          this.sheetOpen = false;
          this.updateBackButton();
        },

        async toggleFetchInfo() {
          selectionHaptic();
          const next = !app().settings.fetchInfo;
          app().settings = { fetchInfo: next };
          await saveSettings(app().settings);
          if (next) this.hydrateInfo();
        },

        openChannel() {
          haptic();
          openTelegram(CHANNEL_URL);
        },

        withTransition(fn) {
          if (document.startViewTransition && !reduceMotion) {
            document.startViewTransition(() => {
              fn();
              return this.\$nextTick();
            });
          } else {
            fn();
          }
        },

        selectTab(key) {
          if (this.activeTab === key) return;
          selectionHaptic();
          window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
          this.withTransition(() => {
            this.activeTab = key;
          });
        },

        onSearchFocus() {
          this.searchFocused = true;
          window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
          this.updateBackButton();
        },

        onContentTap(event) {
          if (event.target.closest("button, input, a, canvas, .well")) return;
          if (this.searchFocused && document.activeElement === this.$refs.searchInput)
            this.$refs.searchInput.blur();
        },

        clearSearch() {
          this.query = "";
          this.debouncedQuery = "";
          this.searchDebounced?.cancel();
          this.\$refs.searchInput?.focus();
        },

        exitSearch() {
          this.query = "";
          this.debouncedQuery = "";
          this.searchDebounced?.cancel();
          this.searchFocused = false;
          this.\$refs.searchInput?.blur();
          this.updateBackButton();
        },

        toggleMultiScan() {
          selectionHaptic();
          this.multiScan = !this.multiScan;
        },

        pruneGestures() {
          for (const g of [...gestures]) {
            if (g.element && !g.element.isConnected) {
              try {
                g.destroy();
              } catch {}
              gestures.delete(g);
            }
          }
        },

        mountCard(wrapper, id) {
          if (freshIds.has(id)) {
            freshIds.delete(id);
            enterCard(wrapper);
          }
          const card = wrapper.querySelector(".card");
          if (!card || wrapper.hasAttribute("data-gesture")) return;
          wrapper.setAttribute("data-gesture", "");
          const gesture = new TinyGesture(card, {
            threshold: (type) => (type === "x" ? 10 : Infinity),
          });
          gestures.add(gesture);
          const state = { base: 0, x: 0, lastX: 0, lastT: 0, vel: 0, active: false };

          gesture.on("panstart", () => {
            const current = readX(card);
            for (const a of card.getAnimations()) a.cancel();
            state.base = current;
            state.x = current;
            state.lastX = current;
            state.lastT = performance.now();
            state.vel = 0;
            state.active = false;
            card.style.transform = current ? `translateX(${current}px)` : "";
          });

          gesture.on("panmove", () => {
            const mx = gesture.touchMoveX ?? 0;
            const my = gesture.touchMoveY ?? 0;
            if (!state.active) {
              if (Math.abs(mx) < 8 || Math.abs(my) > Math.abs(mx)) return;
              state.active = true;
              card.style.willChange = "transform";
            }
            const x = rubberBand(Math.min(0, state.base + mx), REVEAL);
            const now = performance.now();
            const dt = now - state.lastT;
            if (dt > 0) state.vel = state.vel * 0.6 + ((x - state.lastX) / dt) * 0.4;
            state.lastX = x;
            state.lastT = now;
            state.x = x;
            card.style.transform = `translateX(${x}px)`;
            wrapper.style.setProperty("--reveal", String(Math.min(1, Math.abs(x) / REVEAL)));
          });

          gesture.on("panend", () => {
            card.style.willChange = "";
            if (!state.active) {
              if (!state.base) card.style.transform = "";
              return;
            }
            const width = wrapper.getBoundingClientRect().width || 320;
            const flick = state.vel < -1 && state.x < -REVEAL * 0.5;
            if (state.x < -width * 0.4 || flick) {
              this.removeItem(id, state.vel);
              return;
            }
            const anim = springX(card, state.x, 0, state.vel * 1000);
            anim.finished
              .then(() => {
                anim.cancel();
                card.style.transform = "";
                wrapper.style.setProperty("--reveal", "0");
              })
              .catch(() => {});
          });
        },

        scannerOpen: false,
        onScannerClosed: null,
        openScanner() {
          if (this.scannerOpen) return;
          if (!supports("6.4")) {
            showToast("Сканер не поддерживается этой версией Telegram", "err");
            return;
          }
          this.scannerOpen = true;
          haptic();
          tg.showScanQrPopup(
            {
              text: this.multiScan
                ? "Мультискан. Наведите камеру на QR-код ценника"
                : "Наведите камеру на QR-код ценника",
            },
            (result) => {
              if (!result) {
                this.scannerOpen = false;
                return true;
              }
              return this.processScan(result);
            },
          );
          this.onScannerClosed = () => {
            this.scannerOpen = false;
            tg.offEvent("scanQrPopupClosed", this.onScannerClosed);
            this.onScannerClosed = null;
          };
          tg.onEvent("scanQrPopupClosed", this.onScannerClosed);
        },

        closeScanner() {
          try {
            tg.closeScanQrPopup();
          } catch {}
          this.scannerOpen = false;
        },

        processScan(raw) {
          const parsed = parseCEN(raw);
          if (!parsed) {
            notify("error");
            haptic("medium");
            if (this.multiScan) return false;
            showToast("Поддерживаются только коды в формате CEN", "err");
            this.closeScanner();
            return true;
          }

          const incomingPrice = formatPrice(parsed.price);
          const incomingTicketTs = ticketDateToTs(parsed.date);
          const existing = app().items.find((i) => i.code === parsed.code);

          if (!existing) {
            notify("success");
            haptic();
            playSuccessSound();
            this.insertItem(parsed, incomingPrice, incomingTicketTs);
            if (this.multiScan) return false;
            showToast(`Код ${parsed.code} добавлен`);
            this.closeScanner();
            return true;
          }

          const sameDate = (existing.ticketTs ?? null) === (incomingTicketTs ?? null);
          const samePrice = (existing.price ?? null) === (incomingPrice ?? null);
          const changed = this.updateItem(existing, parsed, incomingPrice, incomingTicketTs);

          if (!changed && sameDate && samePrice) {
            notify("warning");
            haptic("medium");
            if (this.multiScan) return false;
            showToast(`Код ${parsed.code} уже в списке`, "warn");
            this.closeScanner();
            return true;
          }

          notify("success");
          haptic();
          playSuccessSound();
          if (this.multiScan) return false;
          showToast(`Карточка ${parsed.code} обновлена`);
          this.closeScanner();
          return true;
        },

        updateItem(existing, parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history = (existing.history ?? []).slice();
          let changed = false;

          if (incomingPrice && parsed.date && incomingTicketTs != null) {
            const idx = history.findIndex((h) => h.ticketTs === incomingTicketTs);
            const entry = { price: incomingPrice, date: parsed.date, ticketTs: incomingTicketTs, ts: now };
            if (idx === -1) {
              history.push(entry);
              changed = true;
            } else if (history[idx].price !== incomingPrice) {
              history[idx] = entry;
              changed = true;
            }
          }

          history.sort((a, b) => a.ticketTs - b.ticketTs);
          const latest = history.at(-1) ?? null;
          const priceChanged = (existing.price ?? null) !== (latest ? latest.price : existing.price);
          const dateChanged = (existing.date ?? null) !== (latest ? latest.date : existing.date);
          const rawChanged = (existing.raw ?? null) !== parsed.raw;
          if (priceChanged || dateChanged || rawChanged) changed = true;
          if (!changed) return false;

          app().items = sortItems(
            app().items.map((i) =>
              i.id === existing.id
                ? {
                    ...i,
                    raw: parsed.raw,
                    history,
                    price: latest ? latest.price : i.price,
                    date: latest ? latest.date : i.date,
                    ticketTs: latest ? latest.ticketTs : i.ticketTs,
                    ts: now,
                  }
                : i,
            ),
          );
          schedulePersist();
          this.flash(existing.id);
          return true;
        },

        flash(id) {
          this.\$nextTick(() => {
            const card = document.querySelector(`.card[data-card-id="${cssEscape(id)}"]`);
            if (card) flashCard(card);
          });
        },

        insertItem(parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history =
            incomingPrice && parsed.date && incomingTicketTs != null
              ? [{ price: incomingPrice, date: parsed.date, ticketTs: incomingTicketTs, ts: now }]
              : [];
          const item = createItem({
            code: parsed.code,
            raw: parsed.raw,
            price: incomingPrice,
            date: parsed.date,
            ticketTs: incomingTicketTs,
            history,
            ts: now,
          });
          freshIds.add(item.id);
          app().items = [item, ...app().items];
          schedulePersist();
          resolveInfo(item.id, parsed.code);
          if (this.multiScan) this.flash(item.id);
        },

        async removeItem(id, velocity = 0) {
          const item = app().items.find((i) => i.id === id);
          if (!item) return;
          haptic("medium");
          const wrapper = document.querySelector(`.swipe[data-id="${cssEscape(id)}"]`);
          const card = wrapper?.querySelector(".card");
          if (wrapper && card) {
            const width = wrapper.getBoundingClientRect().width || 320;
            const current = readX(card);
            for (const a of card.getAnimations()) a.cancel();
            const distance = width + current;
            const speed = Math.max(0.9, Math.abs(velocity));
            const duration = reduceMotion ? 120 : Math.max(120, Math.min(240, distance / speed));
            await card
              .animate(
                [
                  { transform: `translateX(${current}px)`, opacity: 1 },
                  { transform: `translateX(${-width}px)`, opacity: 0.4 },
                ],
                { duration, easing: "cubic-bezier(0.2, 0, 0.6, 1)", fill: "forwards" },
              )
              .finished.catch(() => {});
            const height = wrapper.getBoundingClientRect().height;
            await wrapper
              .animate(
                [
                  { blockSize: `${height}px`, marginBlockStart: "10px", opacity: 1 },
                  { blockSize: "0px", marginBlockStart: "0px", opacity: 0 },
                ],
                { duration: reduceMotion ? 120 : 180, easing: EASE, fill: "forwards" },
              )
              .finished.catch(() => {});
          }
          const snapshot = createItem(toStored(item));
          app().items = app().items.filter((i) => i.id !== id);
          schedulePersist();
          pendingUndo = snapshot;
          showToast(
            "Удалено",
            "ok",
            { label: "Отменить", run: () => this.undoDelete() },
            UNDO_MS,
          );
        },

        undoDelete() {
          if (!pendingUndo) return;
          const item = pendingUndo;
          pendingUndo = null;
          clearTimeout(toastTimer);
          hideToast();
          haptic();
          freshIds.add(item.id);
          app().items = mergeItems(app().items, [item]);
          schedulePersist();
        },

        async clearAll() {
          haptic("medium");
          if (!(await confirmDialog("Удалить все записи?\nДействие необратимо."))) return;
          this.closeSheet();
          pendingUndo = null;
          this.withTransition(() => {
            this.activeTab = "all";
            app().items = [];
          });
          schedulePersist();
          showToast("История очищена");
          notify("success");
        },

        async copyText(text) {
          haptic();
          let success = false;
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              success = true;
            } catch {}
          }
          showToast(success ? "Скопировано" : "Не удалось скопировать", success ? "ok" : "err");
          notify(success ? "success" : "error");
        },

        async shareBarcode(item) {
          haptic();
          try {
            const bwip = await loadBwip();
            const canvas = document.createElement("canvas");
            bwip.toCanvas(canvas, {
              bcid: item.code.length === 8 ? "ean8" : "ean13",
              text: item.code,
              scale: 6,
              height: 20,
              includetext: true,
              textxalign: "center",
              paddingwidth: 16,
              paddingheight: 12,
              backgroundcolor: "FFFFFF",
            });
            const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
            if (!blob) throw new Error("render");
            const file = new File([blob], `${item.code}.png`, { type: "image/png" });
            if (navigator.canShare?.({ files: [file] }) && navigator.share) {
              await navigator.share({ files: [file] });
              return;
            }
            if (globalThis.ClipboardItem && navigator.clipboard?.write) {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              showToast("Изображение скопировано");
              notify("success");
              return;
            }
            await this.copyText(item.code);
          } catch (error) {
            if (error?.name === "AbortError") return;
            await this.copyText(item.code);
          }
        },
      }));

      Alpine.start();
    </script>
  </body>
</html>
