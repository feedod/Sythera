<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' https://telegram.org https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: mediastream:; connect-src 'self' https://*.supabase.co https://api.openai.com https://cdn.jsdelivr.net https://esm.sh blob: data:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>Sythera</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.min.js",
    "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/module.esm.js"
  }
}
</script>
<style>
  @layer reset, base, ui;

  @layer reset {
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; color: inherit; background: none; border: 0; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
  }

  @layer base {
    :root {
      --bg: #0B0B0F;
      --surface: #16161C;
      --line: #26262F;
      --text: #F2F2F5;
      --muted: #8A8A96;
      --live: oklch(0.78 0.17 155);
      --warn: oklch(0.70 0.19 25);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font: 400 17px/1.35 -apple-system, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
  }

  @layer ui {
    #app { position: fixed; inset: 0; display: grid; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .hud {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: calc(var(--safe-top) + 12px) 20px calc(var(--safe-bottom) + 24px);
      pointer-events: none;
    }
    .hud > * { pointer-events: auto; }

    .state {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px 7px 11px;
      border-radius: 999px;
      background: color-mix(in oklab, var(--surface) 82%, transparent);
      border: 1px solid var(--line);
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--muted);
      backdrop-filter: blur(12px);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .state[data-status="live"] { color: var(--text); }
    .state[data-status="live"] .dot { background: var(--live); animation: pulse 2s ease-in-out infinite; }
    .state[data-status="connecting"] .dot { background: var(--live); animation: pulse 0.9s ease-in-out infinite; }
    .state[data-status="error"] { color: var(--warn); }
    .state[data-status="error"] .dot { background: var(--warn); }

    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

    .fault {
      align-self: end;
      justify-self: center;
      max-width: 30ch;
      text-align: center;
      font-size: 15px;
      color: var(--warn);
      margin-bottom: 20px;
    }

    .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }

    .call {
      width: 68px; height: 68px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--text);
      color: var(--bg);
      transition: transform 140ms ease, background 200ms ease;
    }
    .call:active { transform: scale(0.93); }
    .call[data-live="true"] { background: var(--warn); color: var(--text); }
    .call:disabled { opacity: 0.4; }
    .call svg { width: 26px; height: 26px; }

    .mute {
      width: 52px; height: 52px;
      border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(12px);
      transition: transform 140ms ease, opacity 200ms ease;
    }
    .mute:active { transform: scale(0.93); }
    .mute[data-muted="true"] { opacity: 0.45; }
    .mute svg { width: 21px; height: 21px; }

    .boot {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: var(--bg);
      color: var(--muted);
      font-size: 15px;
      transition: opacity 400ms ease;
    }
    .boot[data-ready="true"] { opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>

<div id="app" x-data="app" x-cloak>
  <canvas id="stage"></canvas>
  <audio id="sink" autoplay playsinline></audio>

  <div class="hud">
    <div class="state" :data-status="status">
      <span class="dot"></span>
      <span x-text="label"></span>
    </div>

    <p class="fault" x-show="fault" x-text="fault"></p>

    <div class="controls">
      <button class="mute" :data-muted="muted" @click="toggleMute" x-show="status === 'live'" aria-label="Микрофон">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
          <path d="M4 4l16 16" x-show="muted"/>
        </svg>
      </button>

      <button class="call" :data-live="status === 'live'" :disabled="status === 'connecting' || !ready" @click="toggle" aria-label="Разговор">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 2.5 5.7 2 2 0 0 1 4.5 3.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="boot" :data-ready="ready">Загрузка</div>
</div>

<script type="module">
import Alpine from 'alpinejs'
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm'

const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co'
const SUPABASE_ANON = 'YOUR-PUBLISHABLE-KEY'
const AVATAR_URL = './avatar.vrm'

const tg = window.Telegram.WebApp
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v
const lerp = (a, b, t) => a + (b - a) * t

const compose = (...slices) => slices.reduce(
  (acc, slice) => Object.defineProperties(acc, Object.getOwnPropertyDescriptors(slice)),
  {}
)

const shell = () => ({
  ready: false,
  fault: '',
  get label() {
    return { idle: 'Готова к разговору', connecting: 'Соединение', live: 'В эфире', error: 'Сбой' }[this.status]
  },
  boot() {
    tg.ready()
    tg.expand()
    tg.disableVerticalSwipes?.()
    tg.setHeaderColor?.('#0B0B0F')
    tg.setBackgroundColor?.('#0B0B0F')
    tg.lockOrientation?.()
  },
  haptic(style) {
    tg.HapticFeedback?.impactOccurred?.(style)
  }
})

const avatar = () => ({
  renderer: null,
  scene: null,
  camera: null,
  vrm: null,
  clock: null,
  gaze: null,
  mouth: { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 },
  drive: { open: 0, bright: 0 },
  blinkAt: 0,
  blink: 0,

  async mount(canvas) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' })
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.05

    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20)
    camera.position.set(0, 1.34, 1.55)

    const key = new THREE.DirectionalLight(0xfff2e6, 2.4)
    key.position.set(1.2, 2.4, 1.8)
    const rim = new THREE.DirectionalLight(0x8fb6ff, 1.1)
    rim.position.set(-1.6, 1.4, -1.2)
    scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.85))

    const gaze = new THREE.Object3D()
    gaze.position.set(0, 0, -0.4)
    camera.add(gaze)
    scene.add(camera)

    const loader = new GLTFLoader()
    loader.register(parser => new VRMLoaderPlugin(parser))
    const gltf = await loader.loadAsync(AVATAR_URL)
    const vrm = gltf.userData.vrm

    VRMUtils.removeUnnecessaryVertices(gltf.scene)
    VRMUtils.combineSkeletons(gltf.scene)
    VRMUtils.rotateVRM0(vrm)
    vrm.scene.traverse(o => { o.frustumCulled = false })
    if (vrm.lookAt) vrm.lookAt.target = gaze
    scene.add(vrm.scene)

    Object.assign(this, { renderer, scene, camera, vrm, gaze, clock: new THREE.Clock() })

    this.resize()
    addEventListener('resize', () => this.resize(), { passive: true })
    renderer.setAnimationLoop(() => this.frame())
    this.ready = true
  },

  resize() {
    const w = innerWidth
    const h = innerHeight
    this.camera.aspect = w / h
    this.camera.updateProjectionMatrix()
    this.renderer.setSize(w, h, false)
  },

  frame() {
    const dt = this.clock.getDelta()
    const t = this.clock.elapsedTime
    const vrm = this.vrm
    if (!vrm) return

    this.sample()

    const { open, bright } = this.drive
    const target = {
      aa: open * (1 - bright) * 0.95,
      oh: open * (1 - bright) * 0.45,
      ou: open * (1 - bright) * 0.3,
      ih: open * bright * 0.7,
      ee: open * bright * 0.85
    }
    for (const k in this.mouth) {
      this.mouth[k] = lerp(this.mouth[k], target[k], 1 - Math.exp(-28 * dt))
      vrm.expressionManager?.setValue(k, this.mouth[k])
    }

    if (t > this.blinkAt) {
      this.blinkAt = t + 1.8 + Math.random() * 4
      this.blink = 1
    }
    this.blink = Math.max(0, this.blink - dt * 9)
    vrm.expressionManager?.setValue('blink', Math.sin(this.blink * Math.PI))

    const hips = vrm.humanoid?.getNormalizedBoneNode('hips')
    const chest = vrm.humanoid?.getNormalizedBoneNode('chest')
    const head = vrm.humanoid?.getNormalizedBoneNode('head')
    const breath = Math.sin(t * 1.15) * 0.012
    if (hips) hips.position.y = breath
    if (chest) chest.rotation.x = breath * 0.9
    if (head) {
      head.rotation.y = Math.sin(t * 0.37) * 0.06 + Math.sin(t * 0.13) * 0.03
      head.rotation.x = Math.sin(t * 0.29) * 0.035 - open * 0.05
      head.rotation.z = Math.sin(t * 0.21) * 0.025
    }

    vrm.update(dt)
    this.renderer.render(this.scene, this.camera)
  }
})

const voice = () => ({
  status: 'idle',
  muted: false,
  pc: null,
  mic: null,
  channel: null,
  audioCtx: null,
  analyser: null,
  bins: null,

  async toggle() {
    this.haptic('medium')
    this.status === 'live' ? this.hangUp() : await this.dial()
  },

  async dial() {
    this.fault = ''
    this.status = 'connecting'
    try {
      const secret = await this.mintSecret()
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
      this.pc = pc

      pc.onconnectionstatechange = () => {
        if (['failed', 'disconnected', 'closed'].includes(pc.connectionState) && this.status === 'live') {
          this.hangUp('Соединение потеряно')
        }
      }

      pc.ontrack = ({ streams }) => {
        const sink = document.getElementById('sink')
        sink.srcObject = streams[0]
        this.listen(streams[0])
      }

      this.mic = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      })
      pc.addTrack(this.mic.getAudioTracks()[0], this.mic)

      this.channel = pc.createDataChannel('oai-events')
      this.channel.onmessage = e => this.onEvent(JSON.parse(e.data))

      await pc.setLocalDescription(await pc.createOffer())
      await new Promise(done => {
        if (pc.iceGatheringState === 'complete') return done()
        pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && done()
        setTimeout(done, 1500)
      })

      const answer = await fetch(`https://api.openai.com/v1/realtime/calls?model=${encodeURIComponent(secret.model)}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${secret.value}`, 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp
      })
      if (!answer.ok) throw new Error('Realtime отклонил соединение')

      await pc.setRemoteDescription({ type: 'answer', sdp: await answer.text() })
      this.status = 'live'
      this.haptic('light')
    } catch (e) {
      this.hangUp(e.message || 'Не удалось начать разговор')
    }
  },

  async mintSecret() {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/realtime-token`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON,
        Authorization: `tma ${tg.initData}`
      },
      body: JSON.stringify({ persona: 'default' })
    })
    if (r.status === 401) throw new Error('Откройте приложение через Telegram')
    if (r.status === 429) throw new Error('Лимит разговоров исчерпан')
    if (!r.ok) throw new Error('Сервер недоступен')
    return r.json()
  },

  onEvent(event) {
    if (event.type === 'error') this.fault = 'Модель прервала разговор'
  },

  listen(stream) {
    const ctx = this.audioCtx ??= new AudioContext({ latencyHint: 'interactive' })
    ctx.resume()
    const analyser = ctx.createAnalyser()
    analyser.fftSize = 1024
    analyser.smoothingTimeConstant = 0.35
    ctx.createMediaStreamSource(stream).connect(analyser)
    this.analyser = analyser
    this.bins = new Float32Array(analyser.frequencyBinCount)
  },

  sample() {
    if (!this.analyser) return
    this.analyser.getFloatFrequencyData(this.bins)

    const hz = this.audioCtx.sampleRate / this.analyser.fftSize
    const band = (lo, hi) => {
      let sum = 0
      let n = 0
      for (let i = Math.round(lo / hz); i <= Math.round(hi / hz) && i < this.bins.length; i++) {
        sum += Math.pow(10, this.bins[i] / 20)
        n++
      }
      return n ? sum / n : 0
    }

    const f1 = band(280, 900)
    const f2 = band(900, 2600)
    const air = band(2600, 4800)
    const energy = f1 + f2 + air

    this.drive.open = lerp(this.drive.open, clamp((energy - 0.0015) * 260), 0.5)
    this.drive.bright = lerp(this.drive.bright, clamp(f2 / (f1 + f2 + 1e-9)), 0.25)
  },

  toggleMute() {
    this.muted = !this.muted
    this.mic?.getAudioTracks().forEach(t => { t.enabled = !this.muted })
    this.haptic('light')
  },

  hangUp(fault = '') {
    this.mic?.getTracks().forEach(t => t.stop())
    this.channel?.close()
    this.pc?.close()
    this.analyser = null
    this.mic = this.channel = this.pc = null
    this.drive.open = 0
    this.muted = false
    this.fault = fault
    this.status = fault ? 'error' : 'idle'
  }
})

Alpine.data('app', () => compose(shell(), avatar(), voice(), {
  async init() {
    this.boot()
    try {
      await this.mount(document.getElementById('stage'))
    } catch {
      this.status = 'error'
      this.fault = 'Аватар не загрузился'
      this.ready = true
    }
    addEventListener('pagehide', () => this.hangUp(), { once: true })
  }
}))

window.Alpine = Alpine
Alpine.start()
</script>
</body>
</html>
