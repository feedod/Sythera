    <style>
      @layer reset, tokens, stage, chrome, sheets;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        html,
        body {
          block-size: 100%;
          margin: 0;
          overflow: clip;
          overscroll-behavior: none;
          background: #000;
          color-scheme: dark;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
          font-size: clamp(0.9375rem, 4vw, 1.0625rem);
          font-synthesis: none;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
        }

        button {
          font: inherit;
          cursor: pointer;
        }

        [x-cloak] {
          display: none !important;
        }
      }

      @layer tokens {
        :root {
          --ease: linear(0, 0.22 7%, 0.63 17%, 0.87 26%, 0.98 35%, 1.02 45%, 1);
          --fast: 0.18s;
          --slow: 0.32s;

          --r-pill: 999px;
          --r-lg: 1.375rem;

          --gap-1: 0.375rem;
          --gap-2: 0.625rem;
          --gap-3: 1rem;
          --gap-4: 1.5rem;

          --edge: 1.25rem;
          --top: calc(var(--pad-top, 0px) + 0.75rem);
          --bottom: calc(var(--pad-bottom, 0px) + 1.5rem);
          --left: calc(var(--pad-left, 0px) + var(--edge));
          --right: calc(var(--pad-right, 0px) + var(--edge));

          --ink: oklch(0.96 0.003 285);
          --ink-dim: oklch(0.68 0.012 285);
          --ink-faint: oklch(0.48 0.014 285);
          --surface: oklch(0.19 0.008 285);
          --surface-hi: oklch(0.25 0.01 285);
          --hair: oklch(1 0 0 / 8%);

          --live: oklch(0.84 0.15 155);
          --wait: oklch(0.87 0.12 82);
          --hear: oklch(0.85 0.11 230);

          color: var(--ink);
        }
      }

      @layer stage {
        canvas {
          position: fixed;
          inset: 0;
          display: block;
          inline-size: 100%;
          block-size: 100%;
          touch-action: none;
        }

        .vignette {
          position: fixed;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(ellipse 80% 64% at 50% 43%, #0000 42%, #000000c4 100%);
        }

        audio {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          clip-path: inset(50%);
        }
      }

      @layer chrome {
        .hud {
          position: fixed;
          inset-block-start: var(--top);
          inset-inline-end: var(--right);
          display: flex;
          align-items: center;
          gap: var(--gap-1);
          padding-block: 0.4375rem;
          padding-inline: 0.625rem 0.8125rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-pill);
          background: oklch(0.16 0.008 285 / 78%);
          backdrop-filter: blur(20px) saturate(1.6);
          font-size: 0.8125rem;
          font-weight: 590;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.005em;
          white-space: nowrap;
          transition: opacity var(--slow) var(--ease);

          & .dot {
            flex: none;
            inline-size: 0.4375rem;
            block-size: 0.4375rem;
            border-radius: 50%;
            background: var(--ink-faint);
            transition: background var(--slow) var(--ease), box-shadow var(--slow) var(--ease);
          }

          &[data-state="listening"] .dot {
            background: var(--hear);
            box-shadow: 0 0 0.5rem color-mix(in oklch, var(--hear), transparent 62%);
          }

          &[data-state="connecting"] .dot {
            background: var(--wait);
            box-shadow: 0 0 0.5rem color-mix(in oklch, var(--wait), transparent 62%);
            animation: pulse 1.1s ease-in-out infinite;
          }

          &[data-state="live"] .dot {
            background: var(--live);
            box-shadow: 0 0 0.5rem color-mix(in oklch, var(--live), transparent 62%);
            animation: pulse 2.4s ease-in-out infinite;
          }
        }

        @keyframes pulse {
          50% {
            opacity: 0.22;
          }
        }

        .toast {
          position: fixed;
          inset-block-start: calc(var(--top) + 2.75rem);
          inset-inline: var(--left) var(--right);
          margin-inline: auto;
          max-inline-size: 20rem;
          padding: 0.6875rem 0.9375rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-lg);
          background: oklch(0.17 0.008 285 / 93%);
          backdrop-filter: blur(20px) saturate(1.6);
          box-shadow: 0 0.75rem 2.5rem #000a;
          font-size: 0.8125rem;
          line-height: 1.4;
          text-align: center;
          text-wrap: pretty;
          overflow-wrap: anywhere;
        }
      }

      @layer sheets {
        .sheet {
          position: fixed;
          inset: 0;
          display: grid;
          grid-template-rows: 1fr auto;
          align-items: center;
          justify-items: center;
          gap: var(--gap-4);
          padding: calc(var(--pad-top, 0px) + 4rem) var(--right)
            calc(var(--pad-bottom, 0px) + 2.5rem) var(--left);
          background: radial-gradient(ellipse 82% 62% at 50% 42%, #00000000, #000000e8 74%);
          text-align: center;

          &[data-solid] {
            background: #000;
          }

          &:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: -0.25rem;
          }
        }

        .body {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-2);
          min-inline-size: 0;
          max-inline-size: 21rem;
          max-block-size: 100%;
          overflow-y: auto;
          overscroll-behavior: contain;
          scrollbar-width: none;
        }

        .foot {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-3);
          inline-size: 100%;
          max-inline-size: 21rem;
        }

        .title {
          font-size: 1.1875rem;
          font-weight: 620;
          line-height: 1.25;
          letter-spacing: -0.02em;
          text-wrap: balance;
          overflow-wrap: anywhere;
        }

        .note {
          font-size: 0.875rem;
          line-height: 1.5;
          letter-spacing: 0.002em;
          color: var(--ink-dim);
          text-wrap: pretty;
          overflow-wrap: anywhere;
        }

        .row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: var(--gap-2);
          inline-size: 100%;
        }

        .pack,
        .action {
          border: 1px solid var(--hair);
          border-radius: var(--r-lg);
          background: var(--surface);
          color: var(--ink);
          font-weight: 620;
          letter-spacing: -0.01em;
          transition: scale var(--fast) var(--ease), background var(--fast) var(--ease),
            opacity var(--fast) var(--ease), box-shadow var(--fast) var(--ease);

          &:disabled {
            opacity: 0.4;
          }

          &:active:not(:disabled) {
            scale: 0.955;
            background: var(--surface-hi);
            box-shadow: inset 0 0 0 1px oklch(1 0 0 / 10%);
          }
        }

        .pack {
          flex: 1 1 5.25rem;
          max-inline-size: 7.5rem;
          min-block-size: 3.5rem;
          padding: 0.75rem 0.5rem;
          font-variant-numeric: tabular-nums;

          & small {
            display: block;
            margin-block-start: 0.1875rem;
            color: var(--ink-dim);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0;
            white-space: nowrap;
          }
        }

        .action {
          flex: 0 0 auto;
          min-block-size: 2.875rem;
          padding: 0.8125rem 1.75rem;
          white-space: nowrap;
        }

        .disclosure {
          inline-size: 100%;
          margin-block-start: var(--gap-1);
          text-align: center;

          & summary {
            display: inline-flex;
            align-items: center;
            gap: var(--gap-1);
            min-block-size: 2rem;
            padding: 0.375rem 0.75rem;
            border-radius: var(--r-pill);
            background: oklch(1 0 0 / 4%);
            color: var(--ink-dim);
            font-size: 0.75rem;
            font-weight: 500;
            list-style: none;
            cursor: pointer;
            transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
              scale var(--fast) var(--ease);

            &::-webkit-details-marker {
              display: none;
            }

            &:active {
              background: oklch(1 0 0 / 8%);
              color: var(--ink);
              scale: 0.96;
            }

            &::after {
              content: "";
              inline-size: 0.3125rem;
              block-size: 0.3125rem;
              border-inline-end: 1.5px solid currentColor;
              border-block-end: 1.5px solid currentColor;
              rotate: 45deg;
              translate: 0 -1px;
              transition: rotate var(--slow) var(--ease), translate var(--slow) var(--ease);
            }
          }

          &[open] summary::after {
            rotate: 225deg;
            translate: 0 1px;
          }

          &[open] .detail {
            @starting-style {
              opacity: 0;
              translate: 0 -0.375rem;
            }
            transition: opacity var(--slow) var(--ease), translate var(--slow) var(--ease);
          }
        }

        .detail {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          justify-content: center;
          gap: 0.1875rem 0.875rem;
          inline-size: fit-content;
          max-inline-size: 100%;
          margin: var(--gap-2) auto 0;
          padding-inline-start: 0.875rem;
          border-inline-start: 1px solid var(--surface-hi);
          text-align: start;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.6875rem;
          line-height: 1.6;
          letter-spacing: 0.01em;
          user-select: text;
          overflow-wrap: anywhere;

          & dt {
            color: var(--ink-faint);
          }

          & dd {
            margin: 0;
            color: var(--ink-dim);
          }
        }

        .spinner {
          inline-size: 1.625rem;
          block-size: 1.625rem;
          border-radius: 50%;
          background: conic-gradient(from 0deg, #0000, var(--ink));
          mask: radial-gradient(farthest-side, #0000 calc(100% - 2px), #000 0);
          animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
          to {
            rotate: 360deg;
          }
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .hud,
        .toast {
          backdrop-filter: none;
          background: oklch(0.16 0.008 285);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

        raf: 0,
        blinkAt: 0,
        blinkPhase: -1,
        blinkQueue: 0,
        weights: {},
        target: {},
        visemes: {},
        pointer: { x: 0, y: 0, active: false },
        aim: { x: 0, y: 0 },
        gaze: { x: 0, y: 0 },
        gazeAt: 0,
        nudge: { x: 0, y: 0, tx: 0, ty: 0 },
        clips: new Map(),
        base: null,
        baseKey: IDLE,
        overlay: null,
        unit: 1.6,
        bones: new Map(),
        fit: null,
        headY: 1.35,
        ready: false,
        parts: new Map(),
        hairSource: new Map(),
        backdrop: null,
        lips: null,
        oculus: {},
        speaking: false,
        voiceAt: 0,
      };

      /* ─── звук и липсинк ─────────────────────────────────────────────── */

      const audio = { ctx: null, node: null };

      const audioContext = () => (audio.ctx ??= new AudioContext());

      const unlockAudio = () => {
        const ctx = audioContext();
        if (ctx.state === "suspended") safe(() => ctx.resume());
      };

      let lipsyncReady = null;
      const ensureLipsync = (ctx) => {
        lipsyncReady ??= (async () => {
          const [mod] = await Promise.all([
            import(/* @vite-ignore */ LIPSYNC.cdn + LIPSYNC.node),
            ctx.audioWorklet.addModule(LIPSYNC.cdn + LIPSYNC.worklet),
          ]);
          return mod.HeadAudio ?? mod.HeadAudioNode ?? mod.default;
        })().catch((e) => {
          lipsyncReady = null;
          throw e;
        });
        return lipsyncReady;
      };

      const attachLipsync = async (el) => {
        const ctx = audioContext();
        if (ctx.state === "suspended") await ctx.resume();

        const deadline = Date.now() + STREAM_WAIT_MS;
        while (!(el.srcObject instanceof MediaStream) && Date.now() < deadline) await sleep(100);
        if (!(el.srcObject instanceof MediaStream)) throw new Fault("realtime");

        const HeadAudio = await ensureLipsync(ctx);

        const lips = new HeadAudio(ctx, {
          parameterData: { vadGateActiveDb: -45, vadGateInactiveDb: -58, speakerMeanHz: 210 },
        });
        await lips.loadModel(LIPSYNC.cdn + LIPSYNC.model);

        lips.onvalue = (key, value) => {
          gl.oculus[key] = value;
        };
        lips.onstarted = () => {
          gl.speaking = true;
          gl.voiceAt = Date.now();
        };
        lips.onended = () => {
          gl.speaking = false;
          gl.oculus = {};
        };

        audio.node = ctx.createMediaStreamSource(el.srcObject);
        audio.node.connect(lips);
        gl.lips = lips;
      };

      const detachLipsync = () => {
        safe(() => audio.node?.disconnect());
        safe(() => gl.lips?.disconnect());
        audio.node = null;
        gl.lips = null;
        gl.speaking = false;
        gl.oculus = {};
        for (const v of VISEMES) gl.visemes[v] = 0;
      };

      const closeAudio = () => {
        detachLipsync();
        safe(() => audio.ctx?.close());
        audio.ctx = null;
        lipsyncReady = null;
      };

      /* ─── мимика, взгляд, движения ───────────────────────────────────── */

      const applyMood = (key, intensity = 0.85) => {
        const mood = MOODS[key] ?? MOODS.neutral;
        for (const m of MOOD_KEYS) if (MOODS[m].vrm !== "neutral") gl.target[MOODS[m].vrm] = 0;
        if (mood.vrm !== "neutral") gl.target[mood.vrm] = clamp(intensity, 0, 1);
        store.mood = key in MOODS ? key : "neutral";
        gl.rim?.color.setHex(mood.rim);
      };

      const bone = (name) => gl.vrm?.humanoid.getNormalizedBoneNode(name);

      const nudgeHead = (x, y) => {
        gl.nudge.tx = clamp(x, -0.35, 0.35);
        gl.nudge.ty = clamp(y, -0.35, 0.35);
        setTimeout(() => {
          gl.nudge.tx = 0;
          gl.nudge.ty = 0;
        }, 700);
      };

      const DEG = THREE.MathUtils.degToRad;

      // Три слоя поверх друг друга: база задаёт позу целиком, hold добавляет
      // положение рук, жест накладывается сверху и растворяется сам.
      const buildClips = () => {
        gl.clips.clear();

        const hips = bone("hips");
        const hipsRest = hips ? hips.position.clone() : new THREE.Vector3();
        const euler = new THREE.Euler();
        const quaternion = new THREE.Quaternion();

        for (const [name, spec] of Object.entries(CLIPS)) {
          const tracks = [];

          for (const [boneName, keys] of Object.entries(spec.bones)) {
            const node = bone(boneName);
            if (!node) continue;

            const times = [];
            const values = [];

            for (const [t, x, y, z] of keys) {
              times.push(t);
              euler.set(DEG(x), DEG(y), DEG(z), "YXZ");
              quaternion.setFromEuler(euler);
              values.push(quaternion.x, quaternion.y, quaternion.z, quaternion.w);
            }
            if (times.length === 1) {
              times.push(spec.dur);
              values.push(...values);
            }

            tracks.push(new THREE.QuaternionKeyframeTrack(`${node.name}.quaternion`, times, values));
          }

          if (spec.move && hips) {
            const times = [];
            const values = [];
            for (const [t, dy] of spec.move) {
              times.push(t);
              values.push(hipsRest.x, hipsRest.y * (1 + dy), hipsRest.z);
            }
            if (times.length === 1) {
              times.push(spec.dur);
              values.push(...values);
            }
            tracks.push(new THREE.VectorKeyframeTrack(`${hips.name}.position`, times, values));
          }

          const clip = new THREE.AnimationClip(name, spec.dur, tracks);
          // Аддитивные клипы уже записаны как дельты от нуля, поэтому
          // makeClipAdditive не нужен — достаточно объявить режим смешивания.
          if (!spec.base) clip.blendMode = THREE.AdditiveAnimationBlendMode;
          gl.clips.set(name, clip);
        }
      };

      const actionOf = (name) => {
        const clip = gl.clips.get(name);
        return clip ? gl.mixer.clipAction(clip, gl.vrm.scene, clip.blendMode) : null;
      };

      const setBase = (name) => {
        if (gl.baseKey === name) return true;

        const next = actionOf(name);
        if (!next) return false;

        next.setLoop(THREE.LoopRepeat, Infinity);
        next.clampWhenFinished = false;
        next.reset().setEffectiveWeight(1).fadeIn(FADE).play();
        gl.baseAction?.fadeOut(FADE);

        gl.baseAction = next;
        gl.baseKey = name;
        return true;
      };

      const setHold = (name) => {
        if (gl.holdKey === name) return true;

        gl.holdAction?.fadeOut(FADE);
        gl.holdAction = null;
        gl.holdKey = null;
        if (!name) return true;

        const next = actionOf(name);
        if (!next) return false;

        next.setLoop(THREE.LoopRepeat, Infinity);
        next.clampWhenFinished = false;
        next.reset().setEffectiveWeight(1).fadeIn(FADE).play();

        gl.holdAction = next;
        gl.holdKey = name;
        return true;
      };

      const setPose = (name) => {
        const spec = CLIPS[name];
        if (!spec) return false;
        if (spec.base) return setBase(name) && (name === IDLE ? setHold(null) : true);
        if (!spec.hold) return false;
        setBase(gl.baseKey ?? IDLE);
        return setHold(name);
      };

      const playGesture = (name) => {
        const spec = CLIPS[name];
        if (!spec || spec.base || spec.hold) return false;

        const next = actionOf(name);
        if (!next) return false;
        if (gl.shotAction && gl.shotAction !== next) gl.shotAction.fadeOut(0.15);

        next.setLoop(THREE.LoopRepeat, spec.repeat ?? 1);
        next.clampWhenFinished = false;
        next.reset().setEffectiveWeight(1).play();

        gl.shotAction = next;
        return true;
      };

      const onClipFinished = (e) => {
        if (e.action === gl.shotAction) gl.shotAction = null;
      };

      const stepBlink = (now, delta) => {
        if (gl.blinkPhase < 0 && now >= gl.blinkAt) {
          gl.blinkPhase = 0;
          gl.blinkQueue = Math.random() < DOUBLE_BLINK_CHANCE ? 1 : 0;
          gl.blinkAt = now + rand(BLINK_MIN_MS, BLINK_MAX_MS);
        }
        if (gl.blinkPhase < 0) return;

        gl.blinkPhase += delta;
        const t = gl.blinkPhase / BLINK_DUR;
        gl.vrm.expressionManager.setValue("blink", t < 1 ? Math.sin(t * Math.PI) : 0);
        if (t < 1) return;

        if (gl.blinkQueue > 0) {
          gl.blinkQueue -= 1;
          gl.blinkPhase = -0.06;
        } else {
          gl.blinkPhase = -1;
        }
      };

      const stepGaze = (now, delta) => {
        if (gl.pointer.active) {
          gl.gaze.x = gl.pointer.x;
          gl.gaze.y = gl.pointer.y;
          gl.gazeAt = now + rand(SACCADE_MIN_MS, SACCADE_MAX_MS);
        } else if (now >= gl.gazeAt) {
          gl.gazeAt = now + rand(SACCADE_MIN_MS, SACCADE_MAX_MS);
          const wide = gl.speaking ? 0.14 : 0.32;
          gl.gaze.x = rand(-wide, wide);
          gl.gaze.y = rand(-wide * 0.6, wide * 0.5);
        }

        gl.aim.x = damp(gl.aim.x, gl.gaze.x, LAMBDA_LOOK, delta);
        gl.aim.y = damp(gl.aim.y, gl.gaze.y, LAMBDA_LOOK, delta);

        const reach = gl.fit.spanY;
        gl.look.position.set(
          gl.fit.x + gl.aim.x * reach * 0.4,
          gl.headY + gl.aim.y * reach * 0.25,
          gl.fit.z + reach,
        );
      };

      const stepNudge = (delta) => {
        gl.nudge.x = damp(gl.nudge.x, gl.nudge.tx, LAMBDA_NUDGE, delta);
        gl.nudge.y = damp(gl.nudge.y, gl.nudge.ty, LAMBDA_NUDGE, delta);
        if (Math.abs(gl.nudge.x) < 1e-4 && Math.abs(gl.nudge.y) < 1e-4) return;

        const head = bone("head");
        if (!head) return;
        head.rotation.z += gl.nudge.x;
        head.rotation.x += gl.nudge.y;
      };

      const stepMouth = (delta) => {
        const target = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };

        for (const [key, value] of Object.entries(gl.oculus)) {
          const rule = VISEME_MAP[key];
          if (!rule || !value) continue;
          const [shape, gain] = rule;
          target[shape] = Math.max(target[shape], value * gain);
        }

        for (const v of VISEMES) {
          gl.visemes[v] = damp(gl.visemes[v] ?? 0, target[v], LAMBDA_VISEME, delta);
          gl.vrm.expressionManager.setValue(v, gl.visemes[v]);
        }

        if (gl.speaking) gl.voiceAt = Date.now();
      };

      const tick = () => {
        gl.raf = requestAnimationFrame(tick);

        const delta = Math.min(0.05, gl.clock.getDelta());
        const now = performance.now();

        gl.lips?.update(delta * 1000);
        gl.mixer.update(delta);

        stepNudge(delta);
        stepBlink(now, delta);

        for (const name of Object.keys(gl.target)) {
          gl.weights[name] = damp(gl.weights[name] ?? 0, gl.target[name], LAMBDA_EXPRESSION, delta);
          gl.vrm.expressionManager.setValue(name, gl.weights[name]);
        }

        stepMouth(delta);
        stepGaze(now, delta);

        gl.vrm.update(delta);
        gl.renderer.render(gl.scene, gl.camera);
      };

      const startLoop = () => {
        if (gl.raf || !gl.ready) return;
        gl.clock.getDelta();
        tick();
      };

      const stopLoop = () => {
        cancelAnimationFrame(gl.raf);
        gl.raf = 0;
      };

      /* ─── внешность ──────────────────────────────────────────────────── */

      const classify = (name) => {
        for (const [part, pattern] of PARTS) if (pattern.test(name)) return part;
        return "other";
      };

      const catalogue = (vrm) => {
        gl.parts.clear();
        const seen = new Set();

        vrm.scene.traverse((o) => {
          if (!o.isMesh) return;
          for (const material of [o.material].flat()) {
            if (!material || seen.has(material.uuid)) continue;
            seen.add(material.uuid);

            const part = classify(`${material.name} ${o.name}`);
            material.userData.part = part;

            const list = gl.parts.get(part) ?? [];
            list.push(material);
            gl.parts.set(part, list);
          }
        });
      };

      // MToon умножает текстуру на цветовой фактор, поэтому цветная карта пачкает
      // любой оттенок. Один раз сводим её в яркость, дальше красим свободно.
      const flatten = (texture) => {
        const image = texture.image;
        if (!image?.width || !(image instanceof ImageBitmap || image instanceof HTMLImageElement))
          return null;

        const canvas = new OffscreenCanvas(image.width, image.height);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(image, 0, 0);

        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = pixels.data;
        for (let i = 0; i < d.length; i += 4) {
          const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
          d[i] = d[i + 1] = d[i + 2] = clamp(l * 1.25 + 46, 0, 255);
        }
        ctx.putImageData(pixels, 0, 0);

        const flat = new THREE.CanvasTexture(canvas);
        flat.colorSpace = texture.colorSpace;
        flat.flipY = texture.flipY;
        flat.wrapS = texture.wrapS;
        flat.wrapT = texture.wrapT;
        flat.needsUpdate = true;
        return flat;
      };

      const CSS_COLOR = /^#[0-9a-f]{3,8}$|^[a-z]{3,20}$/i;

      const setHairColor = (input) => {
        const hair = gl.parts.get("hair");
        if (!hair?.length || !CSS_COLOR.test(input.trim())) return null;

        const probe = new THREE.Color(0x000000);
        try {
          probe.setStyle(input.trim());
        } catch {
          return null;
        }

        for (const material of hair) {
          if (material.map && !gl.hairSource.has(material.uuid)) {
            gl.hairSource.set(material.uuid, material.map);
            const flat = safe(() => flatten(material.map));
            if (flat) material.map = flat;
          }

          material.color?.copy(probe);
          material.shadeColorFactor?.copy(probe).multiplyScalar(0.62);
          material.needsUpdate = true;
        }

        return `#${probe.getHexString()}`;
      };

      const setPartVisible = (part, visible) => {
        if (!REMOVABLE.includes(part)) return false;
        const list = gl.parts.get(part);
        if (!list?.length) return false;
        for (const material of list) material.visible = visible;
        return true;
      };

      /* ─── фон ────────────────────────────────────────────────────────── */

      const dropBackground = () => {
        gl.scene.background?.dispose?.();
        gl.scene.background = null;
        gl.backdrop = null;
      };

      const setBackground = (key) => {
        const preset = BACKGROUNDS[key] ?? BACKGROUNDS.void;

        const canvas = new OffscreenCanvas(2, 256);
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createLinearGradient(0, 0, 0, 256);
        gradient.addColorStop(0, preset[0]);
        gradient.addColorStop(1, preset[1]);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 2, 256);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;

        dropBackground();
        gl.scene.background = texture;
        gl.scene.backgroundIntensity = 1;
        return key in BACKGROUNDS ? key : "void";
      };

      const coverBackdrop = () => {
        const texture = gl.backdrop;
        if (!texture?.image?.width) return;

        const imageAspect = texture.image.width / texture.image.height;
        const screenAspect = gl.camera.aspect;

        if (screenAspect > imageAspect) {
          const scale = imageAspect / screenAspect;
          texture.repeat.set(1, scale);
          texture.offset.set(0, (1 - scale) / 2);
        } else {
          const scale = screenAspect / imageAspect;
          texture.repeat.set(scale, 1);
          texture.offset.set((1 - scale) / 2, 0);
        }
      };

      const backdropLoader = new THREE.TextureLoader().setCrossOrigin("anonymous");

      const setBackdropImage = async (url) => {
        const texture = await backdropLoader.loadAsync(url);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.anisotropy = gl.renderer.capabilities.getMaxAnisotropy();

        dropBackground();
        gl.backdrop = texture;
        gl.scene.background = texture;
        gl.scene.backgroundIntensity = 0.68;
        coverBackdrop();
      };

      const applyTraits = async (traits) => {
        if (!gl.ready || !traits) return;
        safe(() => traits.hair && setHairColor(traits.hair));
        for (const part of REMOVABLE) safe(() => setPartVisible(part, !traits.hidden?.includes(part)));
        if (traits.backdrop) await safe(() => setBackdropImage(traits.backdrop));
        else safe(() => setBackground(traits.background ?? "void"));
        if (traits.pose) await safe(() => setPose(traits.pose));
      };

      /* ─── сцена ──────────────────────────────────────────────────────── */

      const measureSubject = (vrm) => {
        const box = new THREE.Box3().setFromObject(vrm.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        if (!Number.isFinite(size.y) || size.y <= 0) throw new AbortError(new Fault("model"));

        const height = size.y;
        const top = box.min.y + height * FRAME_TOP;
        const bottom = box.min.y + height * FRAME_BOTTOM;
        const head = vrm.humanoid.getNormalizedBoneNode("head");

        gl.headY = head ? head.getWorldPosition(new THREE.Vector3()).y : box.min.y + height * 0.9;
        gl.fit = {
          x: center.x,
          y: (top + bottom) / 2,
          z: center.z,
          spanY: (top - bottom) * FRAME_PAD,
          spanX: size.x * FRAME_PAD,
        };
      };

      const fitCamera = () => {
        const { fit, camera } = gl;
        const vFov = (camera.fov * Math.PI) / 180;
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
        const distance = Math.max(
          fit.spanY / 2 / Math.tan(vFov / 2),
          fit.spanX / 2 / Math.tan(hFov / 2),
        );
        camera.position.set(fit.x, fit.y, fit.z + distance);
        camera.lookAt(fit.x, fit.y, fit.z);
        camera.near = distance / 100;
        camera.far = distance * 10;
        camera.updateProjectionMatrix();
      };

      const isGlb = (buffer) =>
        buffer.byteLength > 12 && new DataView(buffer).getUint32(0, true) === 0x46546c67;

      const cachedBuffer = async (url) => {
        const cache = await caches.open(ASSET_CACHE);
        const hit = await cache.match(url);

        if (hit) {
          const buffer = await hit.arrayBuffer();
          if (isGlb(buffer)) return buffer;
          await cache.delete(url);
        }

        const res = await fetch(url, { cache: "reload" });
        if (!res.ok) throw new AbortError(new Fault("model", res.status));

        const buffer = await res.arrayBuffer();
        if (!isGlb(buffer)) throw new AbortError(new Fault("model", res.status));

        await cache.put(
          url,
          new Response(buffer, { headers: { "content-type": "model/gltf-binary" } }),
        );
        return buffer;
      };

      const sweepCaches = async () => {
        for (const key of await caches.keys())
          if (key.startsWith("sythera-assets-") && key !== ASSET_CACHE) await caches.delete(key);
      };

      const buildStage = async (canvas) => {
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          powerPreference: "high-performance",
          stencil: false,
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.AgXToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.setClearColor(0x000000, 1);

        const scene = new THREE.Scene();
        gl.scene = scene;

        const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.01, 100);

        const key = new THREE.DirectionalLight(0xffffff, 2.1);
        key.position.set(1.2, 2.4, 2.2);
        const rim = new THREE.DirectionalLight(MOODS.neutral.rim, 1.6);
        rim.position.set(-1.8, 1.6, -1.4);
        const fill = new THREE.DirectionalLight(0x7fd6ff, 0.5);
        fill.position.set(-1.1, 0.4, 2.0);
        scene.add(key, rim, fill, new THREE.AmbientLight(0xffffff, 0.5));

        const ktx2 = new KTX2Loader()
          .setTranscoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/basis/")
          .detectSupport(renderer);

        const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
        loader.register((parser) => new VRMLoaderPlugin(parser));

        let gltf;
        try {
          gltf = await loader.parseAsync(await cachedBuffer(MODEL_URL), "/");
        } catch (e) {
          throw e instanceof AbortError ? e : new Fault("model");
        } finally {
          ktx2.dispose();
        }

        const vrm = gltf.userData.vrm;
        if (!vrm?.humanoid || !vrm.expressionManager || !vrm.lookAt)
          throw new AbortError(new Fault("model"));

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.combineMorphs(vrm);
        VRMUtils.rotateVRM0(vrm);

        const meshes = [];
        vrm.scene.traverse((o) => {
          o.frustumCulled = false;
          if (o.isMesh) meshes.push(o);
        });
        scene.add(vrm.scene);

        const look = new THREE.Object3D();
        scene.add(look);
        vrm.lookAt.target = look;

        const mixer = new THREE.AnimationMixer(vrm.scene);
        mixer.addEventListener("finished", onGestureEnd);

        Object.assign(gl, {
          renderer,
          scene,
          camera,
          vrm,
          mixer,
          look,
          rim,
          meshes,
          raycaster: new THREE.Raycaster(),
          clock: new THREE.Clock(),
          blinkAt: performance.now() + rand(BLINK_MIN_MS, BLINK_MAX_MS),
          gazeAt: performance.now() + rand(SACCADE_MIN_MS, SACCADE_MAX_MS),
          weights: {},
          target: {},
          visemes: Object.fromEntries(VISEMES.map((v) => [v, 0])),
          clips: new Map(),
          base: null,
          baseKey: null,
          overlay: null,
          ready: true,
        });

        catalogue(vrm);

        vrm.scene.updateMatrixWorld(true);
        measureSubject(vrm);
        gl.unit = gl.fit.spanY;
        look.position.set(gl.fit.x, gl.headY, gl.fit.z + gl.fit.spanY);
        applyMood(store.mood);

        gl.bones.clear();
        for (const [region, spec] of Object.entries(REGIONS)) {
          const node = vrm.humanoid.getNormalizedBoneNode(spec.bone);
          if (node) gl.bones.set(region, node);
        }

        await setPose(IDLE);
        mixer.update(0);
        vrm.update(0);
      };

      const resizeStage = (canvas) => {
        if (!gl.ready) return;
        const w = canvas.clientWidth || 1;
        const h = canvas.clientHeight || 1;
        gl.renderer.setSize(w, h, false);
        gl.camera.aspect = w / h;
        fitCamera();
        coverBackdrop();
      };

      const pickRegion = (canvas, clientX, clientY) => {
        if (!gl.ready) return null;

        const rect = canvas.getBoundingClientRect();
        const px = clientX - rect.left;
        const py = clientY - rect.top;

        gl.raycaster.setFromCamera(
          new THREE.Vector2((px / rect.width) * 2 - 1, -(py / rect.height) * 2 + 1),
          gl.camera,
        );
        if (!gl.raycaster.intersectObjects(gl.meshes, false).length) return null;

        const v = new THREE.Vector3();
        let best = null;
        let bestDist = PICK_RADIUS_PX;
        for (const [region, node] of gl.bones) {
          node.getWorldPosition(v).project(gl.camera);
          const d = Math.hypot(
            ((v.x + 1) / 2) * rect.width - px,
            ((1 - v.y) / 2) * rect.height - py,
          );
          if (d < bestDist) {
            bestDist = d;
            best = region;
          }
        }
        return best;
      };

      const disposeStage = () => {
        stopLoop();
        detachLipsync();
        if (!gl.renderer) return;

        gl.mixer?.removeEventListener("finished", onGestureEnd);
        gl.mixer?.stopAllAction();
        gl.mixer?.uncacheRoot(gl.vrm.scene);
        dropBackground();
        VRMUtils.deepDispose(gl.vrm.scene);
        gl.renderer.dispose();

        Object.assign(gl, {
          ready: false,
          renderer: null,
          scene: null,
          camera: null,
          vrm: null,
          mixer: null,
          look: null,
          rim: null,
          fit: null,
          base: null,
          baseKey: null,
          overlay: null,
          meshes: [],
        });
        gl.clips.clear();
        gl.parts.clear();
        gl.hairSource.clear();
        gl.bones.clear();
      };

      /* ─── сеть ───────────────────────────────────────────────────────── */

      const session = { token: "", exp: 0, initData: "", traits: {} };

      const http = ky.create({
        prefixUrl: API,
        timeout: TIMEOUT_MS,
        retry: 0,
        credentials: "omit",
        cache: "no-store",
        hooks: {
          beforeError: [
            async (error) => {
              const body = await error.response.json().catch(() => null);
              error.code = body?.error ?? "internal";
              return error;
            },
          ],
        },
      });

      let refreshing = null;

      const refresh = () => {
        refreshing ??= http
          .post("auth", { headers: { Authorization: `tma ${session.initData}` } })
          .json()
          .then((data) => {
            session.token = data.token;
            session.exp = data.expires_at;
            session.traits = data.traits ?? {};
            store.seconds = Number(data.seconds_balance) || 0;
            return data;
          })
          .finally(() => {
            refreshing = null;
          });
        return refreshing;
      };

      const api = http.extend({
        hooks: {
          beforeRequest: [
            async (request) => {
              if (Date.now() / 1000 > session.exp - TOKEN_SKEW_S) await refresh();
              request.headers.set("Authorization", `Bearer ${session.token}`);
            },
          ],
        },
      });

      /* ─── жизненный цикл ─────────────────────────────────────────────── */

      const lifecycle = () => ({
        status: "boot",
        phase: "scene",
        fault: null,
        toast: "",
        _abort: null,
        _observer: null,
        _hiddenTimer: null,
        _toastTimer: null,
        _bound: false,

        get loadingText() {
          return PHASES[this.phase];
        },

        get screen() {
          if (this.status === "outside") return "outside";
          if (this.status === "error") return "error";
          if (this.status === "boot") return "boot";
          if (this.live || this.connecting) return null;
          if (this.micDenied) return "mic";
          if (store.seconds <= 0) return "broke";
          if (this.needsMic || this.idle) return "prompt";
          return null;
        },

        get faultInfo() {
          return FAULTS[this.fault?.code] ?? FAULTS.internal;
        },

        get detail() {
          if (!this.fault) return [];
          return [
            ["code", this.fault.code],
            ["status", String(this.fault.status)],
            ["stage", this.phase],
            ["time", this.fault.at],
            ["online", String(navigator.onLine)],
          ];
        },

        async init() {
          try {
            retrieveLaunchParams();
          } catch {
            this.status = "outside";
            return;
          }

          this._abort = new AbortController();
          const { signal } = this._abort;

          initTelegram();
          miniApp.mountSync();
          miniApp.setHeaderColor("#000000");
          miniApp.setBackgroundColor("#000000");
          swipeBehavior.mount();
          swipeBehavior.disableVertical();
          closingBehavior.mount();
          await viewport.mount();
          viewport.expand();
          await safe(() => viewport.requestFullscreen());
          this.bindInsets();
          safe(() => postEvent("web_app_toggle_orientation_lock", { locked: true }));
          miniApp.ready();

          miniApp.isActive.sub(() => this.onActivity());
          viewport.isExpanded.sub((expanded) => {
            if (!expanded) return;
            viewport.expand();
            resizeStage(this.$refs.canvas);
            startLoop();
          });

          session.initData = safe(() => retrieveRawInitData());
          if (!session.initData) return this.fail(new Fault("unauthorized", 401));

          const canvas = this.$refs.canvas;
          canvas.addEventListener(
            "webglcontextlost",
            (e) => {
              e.preventDefault();
              stopLoop();
              this.phase = "graphics";
              this.status = "boot";
            },
            { signal },
          );
          canvas.addEventListener("webglcontextrestored", () => this.boot(), { signal });
          addEventListener("offline", () => this.hangUp(), { signal });
          addEventListener("online", () => this.listen(), { signal });
          addEventListener("unhandledrejection", (e) => this.flash(e.reason), { signal });

          safe(sweepCaches);
          await this.boot();
        },

        // Подписки ставятся один раз: повторный вызов только пересчитывает отступы.
        bindInsets() {
          const apply = () => {
            const safeArea = viewport.safeAreaInsets();
            const content = viewport.contentSafeAreaInsets();
            const root = document.documentElement.style;
            for (const side of ["top", "bottom", "left", "right"])
              root.setProperty(`--pad-${side}`, `${safeArea[side] + content[side]}px`);
          };
          apply();
          if (this._bound) return;
          this._bound = true;
          viewport.safeAreaInsets.sub(apply);
          viewport.contentSafeAreaInsets.sub(apply);
        },

        async reboot() {
          this.micDenied = false;
          await safe(() => caches.delete(ASSET_CACHE));
          await this.boot();
        },

        async boot() {
          this.status = "boot";
          this.fault = null;

          const attempt = (fn) =>
            pRetry(fn, {
              retries: BOOT_RETRIES,
              minTimeout: 1200,
              factor: 2,
              onFailedAttempt: (e) => {
                const { status } = faultOf(e);
                if (status === 401 || status === 403) throw new AbortError(e);
              },
            });

          try {
            this.phase = "scene";
            await attempt(() => this.mountStage());
            this.phase = "auth";
            await attempt(refresh);
            this.phase = "motion";
            await applyTraits(session.traits);
            this.status = "ready";
            this.needsMic = true;
            this.idle = false;
            this._failures = 0;
          } catch (e) {
            this.fail(e.originalError ?? e);
          }
        },

        fail(error) {
          const fault = faultOf(error);
          fault.at = new Date().toISOString().slice(11, 19);
          this.destroyListener();
          disposeStage();
          this.fault = fault;
          this.status = "error";
          haptic.notify("error");
        },

        flash(error) {
          clearTimeout(this._toastTimer);
          this.toast = (FAULTS[faultOf(error).code] ?? FAULTS.internal).title;
          this._toastTimer = setTimeout(() => (this.toast = ""), TOAST_MS);
        },

        async mountStage() {
          const canvas = this.$refs.canvas;
          disposeStage();
          await buildStage(canvas);
          resizeStage(canvas);
          this._observer?.disconnect();
          this._observer = new ResizeObserver(() => resizeStage(canvas));
          this._observer.observe(canvas);
          startLoop();
        },

        onActivity() {
          const away = document.hidden || !miniApp.isActive();
          clearTimeout(this._hiddenTimer);
          if (away) {
            stopLoop();
            this._hiddenTimer = setTimeout(() => this.hangUp(), HIDDEN_HANGUP_MS);
            return;
          }
          startLoop();
          unlockAudio();
        },

        destroy() {
          clearTimeout(this._hiddenTimer);
          clearTimeout(this._toastTimer);
          this._abort?.abort();
          this._observer?.disconnect();
          this.destroyListener();
          this.hangUp();
          disposeStage();
          closeAudio();
        },
      });

      /* ─── касания ────────────────────────────────────────────────────── */

      const pointer = () => ({
        _lastTouch: 0,

        onPointerMove(e) {
          const rect = this.$refs.canvas.getBoundingClientRect();
          gl.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          gl.pointer.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
          gl.pointer.active = true;
        },

        onPointerLeave() {
          gl.pointer.active = false;
        },

        onPointerDown(e) {
          unlockAudio();
          if (this.needsMic) return this.grantMic();

          const region = pickRegion(this.$refs.canvas, e.clientX, e.clientY);
          if (!region) return;

          const now = performance.now();
          if (now - this._lastTouch < TOUCH_COOLDOWN_MS) return;
          this._lastTouch = now;

          haptic.impact(REGIONS[region].haptic);
          nudgeHead(region === "head" ? 0.14 : -0.08, -0.1);
          gl.voiceAt = Date.now();
          this._rt?.sendMessage(`[touch:${region}]`);
        },
      });

      /* ─── голос ──────────────────────────────────────────────────────── */

      const voice = () => ({
        live: false,
        connecting: false,
        listening: false,
        needsMic: false,
        micDenied: false,
        buying: false,
        idle: false,
        packs: PACKS,
        _rt: null,
        _sessionId: "",
        _vad: null,
        _budget: 0,
        _startedAt: 0,
        _timer: null,
        _beat: null,
        _closing: false,
        _failures: 0,
        _coolUntil: 0,

        get state() {
          if (this.live) return "live";
          if (this.connecting) return "connecting";
          return this.listening ? "listening" : "idle";
        },

        get minutes() {
          return Math.ceil(store.seconds / 60);
        },

        async grantMic() {
          // getUserMedia должен быть первым await, иначе Safari теряет жест.
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            for (const track of stream.getTracks()) track.stop();
          } catch {
            this.needsMic = true;
            this.micDenied = true;
            haptic.notify("error");
            return;
          }
          this.micDenied = false;
          this.needsMic = false;
          this.idle = false;
          unlockAudio();
          await this.listen();
          await this.dial();
        },

        async listen() {
          if (this.live || this.connecting) return;
          if (this.status !== "ready" || store.seconds <= 0) return;
          if (this._failures >= MAX_DIAL_FAILURES) return;

          this.destroyListener();

          try {
            unlockAudio();
            this._vad = await MicVAD.new({
              positiveSpeechThreshold: 0.62,
              negativeSpeechThreshold: 0.42,
              redemptionFrames: 8,
              preSpeechPadFrames: 3,
              minSpeechFrames: 3,
              baseAssetPath: VAD_CDN,
              onnxWASMBasePath: ORT_CDN,
              onSpeechStart: () => this.onSpeech(),
            });
            this._vad.start();
            this.listening = true;
            this.needsMic = false;
            this.micDenied = false;
          } catch (e) {
            this.destroyListener();
            const denied = faultOf(e).code === "denied";
            this.needsMic = denied;
            this.micDenied = denied;
            if (!denied) this.flash(e);
          }
        },

        destroyListener() {
          const vad = this._vad;
          this._vad = null;
          this.listening = false;
          safe(() => vad?.destroy());
        },

        onSpeech() {
          if (Date.now() < this._coolUntil) return;
          this.dial();
        },

        async dial() {
          if (this.connecting || this.live || store.seconds <= 0) return;
          this.connecting = true;
          // Микрофон должен принадлежать только WebRTC: два потока ломают эхоподавление.
          this.destroyListener();

          let rt = null;
          let grant = null;

          try {
            grant = await api.post("voice/start").json();
            this._sessionId = grant.session_id;
            this._budget = Number(grant.seconds_balance) || 0;
            store.seconds = this._budget;

            const el = this.$refs.audio;
            const transport = new OpenAIRealtimeWebRTC({ audioElement: el });

            rt = new RealtimeSession(
              new RealtimeAgent({
                name: AGENT,
                instructions: INSTRUCTIONS,
                voice: VOICE,
                tools: this.tools(),
              }),
              {
                transport,
                config: {
                  voice: VOICE,
                  // Расшифровок нет вообще: ни на входе, ни на выходе.
                  inputAudioTranscription: null,
                  turnDetection: {
                    type: "semantic_vad",
                    eagerness: "medium",
                    interrupt_response: true,
                    create_response: true,
                  },
                },
              },
            );

            rt.on("error", () => this.hangUp());
            rt.on("transport_event", (event) => {
              const type = event?.type ?? "";
              if (type.endsWith("speech_started") || type.endsWith("speech_stopped"))
                gl.voiceAt = Date.now();
            });
            transport.on("connection_change", (state) => {
              if (state === "disconnected" && this.live) this.hangUp();
            });

            await rt.connect({ apiKey: grant.client_secret });

            this._rt = rt;
            this._startedAt = Date.now();
            gl.voiceAt = Date.now();
            this.live = true;
            this.connecting = false;
            this._failures = 0;
            haptic.impact("medium");
            closingBehavior.enableConfirmation();

            await safe(() => attachLipsync(el));
            this._timer = setInterval(() => this.onSecond(), 1000);
            this._beat = setInterval(() => this.ping(), HEARTBEAT_MS);
          } catch (e) {
            this.connecting = false;
            // Транспорт мог уже забрать микрофон — закрываем его вручную.
            safe(() => rt?.close());
            if (grant?.session_id) await this.release(grant.session_id, 0);

            const { code } = faultOf(e);
            this._failures += 1;
            this._coolUntil =
              Date.now() +
              (code === "rate_limited" ? 300000 : Math.min(60000, 2000 * 2 ** this._failures));

            if (code === "no_balance") store.seconds = 0;
            else this.flash(e);

            if (this._failures >= MAX_DIAL_FAILURES) this.idle = true;
            else await this.listen();
          }
        },

        async ping() {
          const res = await safe(() =>
            api.post("voice/ping", { json: { session_id: this._sessionId } }).json(),
          );
          if (res?.ok === false) this.hangUp();
        },

        // Счётчик идёт по календарному времени соединения и не зависит от того,
        // говорит кто-то или молчит: остановиться он не может.
        onSecond() {
          const elapsed = Math.floor((Date.now() - this._startedAt) / 1000);
          store.seconds = Math.max(0, this._budget - elapsed);

          if (store.seconds <= 0 || Date.now() - gl.voiceAt > IDLE_HANGUP_MS) this.hangUp();
        },

        release(session_id, seconds) {
          return safe(() =>
            api
              .post("voice/finish", { json: { session_id, seconds }, keepalive: true })
              .json()
              .then((done) => {
                if (done?.seconds_balance != null) store.seconds = Number(done.seconds_balance) || 0;
              }),
          );
        },

        async hangUp() {
          if (this._closing || !this._rt) return;
          this._closing = true;

          clearInterval(this._timer);
          clearInterval(this._beat);

          const rt = this._rt;
          const session_id = this._sessionId;
          const seconds = Math.ceil((Date.now() - this._startedAt) / 1000);

          this._rt = null;
          this._sessionId = "";
          this._startedAt = 0;
          this.live = false;

          detachLipsync();
          safe(() => rt.close());
          closingBehavior.disableConfirmation();
          applyMood("neutral");
          haptic.impact("soft");

          await this.release(session_id, seconds);

          this._closing = false;
          if (!document.hidden) await this.listen();
        },

        tools() {
          return [
            tool({
              name: "set_mood",
              description: "Сменить выражение лица, когда меняется эмоциональный тон разговора.",
              parameters: z.object({
                mood: z.enum(MOOD_KEYS),
                intensity: z.number().min(0).max(1).nullable(),
              }),
              execute: ({ mood, intensity }) => {
                applyMood(mood, intensity ?? 0.85);
                return "ok";
              },
            }),
            tool({
              name: "play_gesture",
              description:
                "Проиграть жест поверх текущей позы: wave — помахать, nod — кивнуть, shake — помотать головой, laugh — засмеяться, shy — смутиться, think — задуматься, point — показать пальцем, peace — знак мира, clap — похлопать, stretch — потянуться, dance — потанцевать.",
              parameters: z.object({ gesture: z.enum(GESTURE_KEYS) }),
              execute: async ({ gesture }) => {
                const ok = await safe(() => playGesture(gesture));
                if (ok) haptic.impact("soft");
                return ok ? "ok" : "fail";
              },
            }),
            tool({
              name: "set_pose",
              description:
                "Сменить позу тела: idle — обычная стойка, sit — сесть, kneel — встать на колени, arms_crossed — скрестить руки, hands_on_hips — руки на пояс, lean_back — откинуться назад, hug_knees — обнять колени.",
              parameters: z.object({ pose: z.enum(POSE_KEYS) }),
              execute: async ({ pose }) => {
                const ok = await safe(() => setPose(pose));
                if (!ok) return "fail";
                haptic.impact("soft");
                await this.saveTraits({ pose });
                return "ok";
              },
            }),
            tool({
              name: "set_hair_color",
              description:
                "Перекрасить волосы. Цвет — название на английском (silver, crimson, teal) или HEX вида #a0c4ff.",
              parameters: z.object({ color: z.string().max(24) }),
              execute: async ({ color }) => {
                const hex = safe(() => setHairColor(color));
                if (!hex) return "fail";
                await this.saveTraits({ hair: hex });
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "toggle_clothing",
              description:
                "Снять или надеть предмет: outer — жилет или куртка, bow — бант или галстук, hat — головной убор, glasses — очки, accessory — украшение, shoes — обувь, socks — носки или чулки.",
              parameters: z.object({
                item: z.enum(REMOVABLE),
                visible: z.boolean(),
              }),
              execute: async ({ item, visible }) => {
                if (!setPartVisible(item, visible)) return "missing";
                const hidden = new Set(session.traits.hidden ?? []);
                if (visible) hidden.delete(item);
                else hidden.add(item);
                await this.saveTraits({ hidden: [...hidden] });
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "set_background",
              description:
                "Поставить простой градиентный фон за собой. Быстро, без ожидания. Для конкретных мест лучше set_backdrop_image.",
              parameters: z.object({ background: z.enum(BACKGROUND_KEYS) }),
              execute: async ({ background }) => {
                const key = setBackground(background);
                await this.saveTraits({ background: key, backdrop: null });
                return "ok";
              },
            }),
            tool({
              name: "set_backdrop_image",
              description:
                "Нарисовать фон по описанию собеседника: любое место, погода, время суток. Описание на английском, подробное. Картинка появляется через несколько секунд.",
              parameters: z.object({ prompt: z.string().min(3).max(200) }),
              execute: async ({ prompt }) => {
                const url = BACKDROP_API(prompt, Math.floor(Math.random() * 1e6));
                const ok = await safe(() => setBackdropImage(url).then(() => true));
                if (!ok) return "fail";
                await this.saveTraits({ backdrop: url });
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "remember",
              description:
                "Сохранить долговременный факт о собеседнике. Только устойчивые сведения, не реплики разговора.",
              parameters: z.object({
                content: z.string().max(500),
                kind: z.enum(["fact", "preference", "event"]).nullable(),
                importance: z.number().int().min(1).max(5).nullable(),
              }),
              execute: async ({ content, kind, importance }) => {
                const res = await safe(() =>
                  api
                    .post("voice/remember", {
                      json: { content, kind: kind ?? "fact", importance: importance ?? 3 },
                    })
                    .json(),
                );
                return res ? "ok" : "fail";
              },
            }),
            tool({
              name: "recall",
              description: "Найти ранее сохранённые факты о собеседнике по смыслу запроса.",
              parameters: z.object({
                query: z.string().max(500),
                limit: z.number().int().min(1).max(10).nullable(),
              }),
              execute: async ({ query, limit }) => {
                const res = await safe(() =>
                  api.post("voice/recall", { json: { query, limit: limit ?? 5 } }).json(),
                );
                if (!res) return "fail";
                return res.memories.length ? res.memories.join("; ") : "пусто";
              },
            }),
            tool({
              name: "end_call",
              description: "Завершить разговор, когда собеседник попрощался.",
              parameters: z.object({}),
              execute: () => {
                queueMicrotask(() => this.hangUp());
                return "ok";
              },
            }),
          ];
        },

        async saveTraits(patch) {
          session.traits = { ...session.traits, ...patch };
          await safe(() => api.post("voice/traits", { json: patch }).json());
        },

        async retryMic() {
          this.micDenied = false;
          this.needsMic = true;
          await this.grantMic();
        },

        async buy(plan) {
          if (this.buying) return;
          this.buying = true;
          try {
            const { link } = await api.post("voice/invoice", { json: { plan } }).json();
            if (!invoice.open.isAvailable()) throw new Fault("invoice");
            if ((await invoice.open(link, "url")) !== "paid") return;
            await refresh();
            haptic.notify("success");
            this._failures = 0;
            await this.listen();
          } catch (e) {
            this.flash(e);
            haptic.notify("error");
          } finally {
            this.buying = false;
          }
        },
      });

      Alpine.data("app", () => compose(lifecycle(), pointer(), voice()));
      Alpine.start();
    </script>
  </head>

  <body x-data="app" @pagehide.window="destroy()" @visibilitychange.document="onActivity()">
    <canvas
      x-ref="canvas"
      @pointermove="onPointerMove($event)"
      @pointerdown="onPointerDown($event)"
      @pointerleave="onPointerLeave()"
      @pointercancel="onPointerLeave()"
    ></canvas>

    <div class="vignette" aria-hidden="true"></div>

    <div class="hud" x-show="status === 'ready' && !screen" :data-state="state" x-transition x-cloak>
      <span class="dot"></span>
      <span x-text="minutes + ' мин'"></span>
    </div>

    <div
      class="toast"
      role="status"
      x-show="toast"
      x-text="toast"
      x-transition.duration.220ms
      x-cloak
    ></div>

    <div class="sheet" data-solid x-show="screen === 'boot'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="spinner" role="progressbar" aria-label="Загрузка"></span>
        <span class="note" x-text="loadingText"></span>
      </div>
    </div>

    <div
      class="sheet"
      role="button"
      tabindex="0"
      x-show="screen === 'prompt'"
      x-cloak
      @pointerdown="grantMic()"
      @keydown.enter.prevent="grantMic()"
      @keydown.space.prevent="grantMic()"
    >
      <div class="body">
        <span class="title" x-text="idle ? 'Разговор завершён' : 'Коснитесь, чтобы начать'"></span>
        <span
          class="note"
          x-text="idle ? 'Коснитесь экрана, чтобы продолжить' : 'Sythera слышит вас и отвечает голосом. Нужен доступ к микрофону.'"
        ></span>
      </div>
    </div>

    <div class="sheet" x-show="screen === 'mic'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title">Микрофон заблокирован</span>
        <span class="note">
          Откройте настройки Telegram → Конфиденциальность → Микрофон, разрешите доступ и вернитесь
          сюда.
        </span>
      </div>
      <div class="foot">
        <button type="button" class="action" @click="retryMic()">Я разрешила доступ</button>
      </div>
    </div>

    <div class="sheet" x-show="screen === 'broke'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title">Голосовое время закончилось</span>
        <span class="note">Пополните баланс, чтобы продолжить разговор</span>
      </div>
      <div class="foot">
        <div class="row">
          <template x-for="pack in packs" :key="pack.id">
            <button type="button" class="pack" :disabled="buying" @click="buy(pack.id)">
              <span x-text="pack.stars + ' ★'"></span>
              <small x-text="pack.label"></small>
            </button>
          </template>
        </div>
      </div>
    </div>

    <div class="sheet" data-solid role="alert" x-show="screen === 'outside'" x-cloak>
      <div class="body">
        <span class="title">Sythera живёт внутри Telegram</span>
      </div>
    </div>

    <div
      class="sheet"
      data-solid
      role="alert"
      x-show="screen === 'error'"
      x-transition.opacity.duration.260ms
      x-cloak
    >
      <div class="body">
        <span class="title" x-text="faultInfo.title"></span>
        <span class="note" x-text="faultInfo.hint"></span>
        <details class="disclosure">
          <summary>Подробности</summary>
          <dl class="detail">
            <template x-for="[key, value] in detail" :key="key">
              <div style="display: contents">
                <dt x-text="key"></dt>
                <dd x-text="value"></dd>
              </div>
            </template>
          </dl>
        </details>
      </div>
      <div class="foot">
        <button type="button" class="action" x-text="faultInfo.retry" @click="reboot()"></button>
      </div>
    </div>

    <audio x-ref="audio" autoplay playsinline></audio>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  </body>
</html>
