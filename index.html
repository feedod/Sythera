      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        color: #f7f7f8;
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        font-size: clamp(0.9375rem, 4vw, 1.0625rem);
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 80% 64% at 50% 43%, #0000 42%, #000000c4 100%);
      }

      audio {
        position: absolute;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
      }

      [x-cloak] {
        display: none !important;
      }

      :root {
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --fast: 0.18s;
        --slow: 0.32s;

        --r-pill: 999px;
        --r-lg: 1.375rem;
        --r-md: 1rem;

        --gap-1: 0.375rem;
        --gap-2: 0.625rem;
        --gap-3: 1rem;
        --gap-4: 1.5rem;

        --edge: 1.25rem;
        --top: calc(var(--pad-top, 0px) + 0.75rem);
        --bottom: calc(var(--pad-bottom, 0px) + 1.5rem);
        --left: calc(var(--pad-left, 0px) + var(--edge));
        --right: calc(var(--pad-right, 0px) + var(--edge));

        --ink: #f4f4f6;
        --ink-dim: #9a9aa6;
        --ink-faint: #62626d;
        --surface: #141418;
        --surface-hi: #1e1e24;
        --hair: #ffffff14;
      }

      .hud {
        position: fixed;
        inset-block-start: var(--top);
        inset-inline-end: var(--right);
        display: flex;
        align-items: center;
        gap: var(--gap-1);
        padding-block: 0.4375rem;
        padding-inline: 0.625rem 0.8125rem;
        border: 1px solid var(--hair);
        border-radius: var(--r-pill);
        background: #0e0e12c4;
        backdrop-filter: blur(20px) saturate(1.6);
        font-size: 0.8125rem;
        font-weight: 590;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.005em;
        white-space: nowrap;
        transition: opacity var(--slow) var(--ease);
      }

      .dot {
        flex: none;
        inline-size: 0.4375rem;
        block-size: 0.4375rem;
        border-radius: 50%;
        background: var(--ink-faint);
        transition: background var(--slow) var(--ease), box-shadow var(--slow) var(--ease);
      }

      .hud[data-state="listening"] .dot {
        background: #7fd6ff;
        box-shadow: 0 0 0.5rem #7fd6ff5c;
      }

      .hud[data-state="connecting"] .dot {
        background: #ffd28a;
        box-shadow: 0 0 0.5rem #ffd28a5c;
        animation: pulse 1.1s ease-in-out infinite;
      }

      .hud[data-state="live"] .dot {
        background: #6ee7a8;
        box-shadow: 0 0 0.5rem #6ee7a85c;
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.22;
        }
      }

      .caption {
        position: fixed;
        inset-block-end: var(--bottom);
        inset-inline: var(--left) var(--right);
        margin: 0 auto;
        max-inline-size: 30rem;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
        block-size: 4.35em;
        font-size: 0.9375rem;
        font-weight: 450;
        line-height: 1.45;
        letter-spacing: 0.002em;
        text-align: center;
        text-wrap: pretty;
        overflow-wrap: anywhere;
        color: var(--ink);
        text-shadow: 0 1px 18px #000, 0 0 3px #000c;
      }

      .toast {
        position: fixed;
        inset-block-start: calc(var(--top) + 2.75rem);
        inset-inline: var(--left) var(--right);
        margin-inline: auto;
        max-inline-size: 20rem;
        padding: 0.6875rem 0.9375rem;
        border: 1px solid var(--hair);
        border-radius: var(--r-lg);
        background: #14141aee;
        backdrop-filter: blur(20px) saturate(1.6);
        box-shadow: 0 0.75rem 2.5rem #000a;
        font-size: 0.8125rem;
        line-height: 1.4;
        text-align: center;
        text-wrap: pretty;
        overflow-wrap: anywhere;
      }

      .sheet {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        align-items: center;
        justify-items: center;
        gap: var(--gap-4);
        padding: calc(var(--pad-top, 0px) + 4rem) var(--right)
          calc(var(--pad-bottom, 0px) + 2.5rem) var(--left);
        background: radial-gradient(ellipse 82% 62% at 50% 42%, #00000000, #000000e8 74%);
        text-align: center;
      }

      .sheet[data-solid] {
        background: #000;
      }

      .sheet:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -0.25rem;
      }

      .body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap-2);
        min-inline-size: 0;
        max-inline-size: 21rem;
        max-block-size: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }

      .body::-webkit-scrollbar {
        display: none;
      }

      .foot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap-3);
        inline-size: 100%;
        max-inline-size: 21rem;
      }

      .title {
        font-size: 1.1875rem;
        font-weight: 620;
        line-height: 1.25;
        letter-spacing: -0.02em;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }

      .note {
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.002em;
        color: var(--ink-dim);
        text-wrap: pretty;
        overflow-wrap: anywhere;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--gap-2);
        inline-size: 100%;
      }

      .pack,
      .action {
        border: 1px solid var(--hair);
        border-radius: var(--r-lg);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 620;
        letter-spacing: -0.01em;
        transition: transform var(--fast) var(--ease), background var(--fast) var(--ease),
          opacity var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
      }

      .pack:disabled,
      .action:disabled {
        opacity: 0.4;
      }

      .pack:active:not(:disabled),
      .action:active:not(:disabled) {
        transform: scale(0.955);
        background: var(--surface-hi);
        box-shadow: inset 0 0 0 1px #ffffff1a;
      }

      .pack {
        flex: 1 1 5.25rem;
        max-inline-size: 7.5rem;
        min-block-size: 3.5rem;
        padding: 0.75rem 0.5rem;
        font-variant-numeric: tabular-nums;
      }

      .pack small {
        display: block;
        margin-block-start: 0.1875rem;
        color: var(--ink-dim);
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .action {
        flex: 0 0 auto;
        min-block-size: 2.875rem;
        padding: 0.8125rem 1.75rem;
        white-space: nowrap;
      }

      .disclosure {
        inline-size: 100%;
        margin-block-start: var(--gap-1);
        text-align: center;
      }

      .disclosure summary {
        display: inline-flex;
        align-items: center;
        gap: var(--gap-1);
        min-block-size: 2rem;
        padding: 0.375rem 0.75rem;
        border-radius: var(--r-pill);
        background: #ffffff0a;
        color: var(--ink-dim);
        font-size: 0.75rem;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
        transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
          transform var(--fast) var(--ease);
      }

      .disclosure summary::-webkit-details-marker {
        display: none;
      }

      .disclosure summary:active {
        background: #ffffff14;
        color: var(--ink);
        transform: scale(0.96);
      }

      .disclosure summary::after {
        content: "";
        inline-size: 0.3125rem;
        block-size: 0.3125rem;
        border-inline-end: 1.5px solid currentColor;
        border-block-end: 1.5px solid currentColor;
        rotate: 45deg;
        translate: 0 -1px;
        transition: rotate var(--slow) var(--ease), translate var(--slow) var(--ease);
      }

      .disclosure[open] summary::after {
        rotate: 225deg;
        translate: 0 1px;
      }

      .disclosure[open] .detail {
        animation: reveal var(--slow) var(--ease);
      }

      @keyframes reveal {
        from {
          opacity: 0;
          translate: 0 -0.375rem;
        }
      }

      .detail {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        justify-content: center;
        gap: 0.1875rem 0.875rem;
        inline-size: fit-content;
        max-inline-size: 100%;
        margin: var(--gap-2) auto 0;
        padding-inline-start: 0.875rem;
        border-inline-start: 1px solid #26262d;
        text-align: start;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        line-height: 1.6;
        letter-spacing: 0.01em;
        user-select: text;
        overflow-wrap: anywhere;
      }

      .detail dt {
        color: var(--ink-faint);
      }

      .detail dd {
        margin: 0;
        color: var(--ink-dim);
      }

      .spinner {
        inline-size: 1.625rem;
        block-size: 1.625rem;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #0000, var(--ink));
        mask: radial-gradient(farthest-side, #0000 calc(100% - 2px), #000 0);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .hud,
        .toast {
          backdrop-filter: none;
          background: #0e0e12;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

        if (e instanceof HTTPError)
          return new Fault(e.code ?? "internal", e.response.status);
        if (e instanceof TimeoutError) return new Fault("timeout");
        if (/notallowed|permission|denied|security/i.test(`${e?.name ?? ""} ${e?.message ?? ""}`))
          return new Fault("denied");
        return new Fault(navigator.onLine ? "unreachable" : "offline");
      };

      const store = Alpine.reactive({ mood: "neutral", seconds: 0 });

      const noise2D = createNoise2D();

      const gl = {
        renderer: null,
        scene: null,
        camera: null,
        clock: null,
        vrm: null,
        look: null,
        rim: null,
        raycaster: null,
        meshes: [],
        raf: 0,
        blinkAt: 0,
        blinkPhase: -1,
        blinkQueue: 0,
        weights: {},
        target: {},
        visemes: {},
        pointer: { x: 0, y: 0, active: false },
        aim: { x: 0, y: 0 },
        gaze: { x: 0, y: 0 },
        gazeAt: 0,
        nudge: { x: 0, y: 0, decay: 0 },
        gesture: null,
        base: new Map(),
        pose: new Map(),
        poseNow: new Map(),
        lift: 0,
        liftNow: { v: 0 },
        sign: { armL: -1, armR: 1, leg: -1, elbowL: -1, elbowR: 1 },
        unit: 1.6,
        bones: new Map(),
        fit: null,
        headY: 1.35,
        ready: false,
        parts: new Map(),
        hairSource: new Map(),
        lips: null,
        oculus: {},
        speaking: false,
        energy: { v: 0 },
        voiceAt: 0,
      };

      const audio = { ctx: null, node: null };

      const audioContext = () => (audio.ctx ??= new AudioContext());

      const unlockAudio = () => {
        const ctx = audioContext();
        if (ctx.state === "suspended") safe(() => ctx.resume());
      };

      let lipsyncReady = null;
      const ensureLipsync = (ctx) => {
        lipsyncReady ??= (async () => {
          const [mod] = await Promise.all([
            import(/* @vite-ignore */ LIPSYNC.cdn + LIPSYNC.node),
            ctx.audioWorklet.addModule(LIPSYNC.cdn + LIPSYNC.worklet),
          ]);
          // The README names the export both HeadAudio and HeadAudioNode.
          return mod.HeadAudio ?? mod.HeadAudioNode ?? mod.default;
        })().catch((e) => {
          lipsyncReady = null;
          throw e;
        });
        return lipsyncReady;
      };

      const attachLipsync = async (el) => {
        const ctx = audioContext();
        if (ctx.state === "suspended") await ctx.resume();

        const deadline = Date.now() + STREAM_WAIT_MS;
        while (!(el.srcObject instanceof MediaStream) && Date.now() < deadline) await sleep(100);
        if (!(el.srcObject instanceof MediaStream)) throw new Fault("realtime");

        const HeadAudio = await ensureLipsync(ctx);

        const lips = new HeadAudio(ctx, {
          parameterData: { vadGateActiveDb: -45, vadGateInactiveDb: -58, speakerMeanHz: 210 },
        });
        await lips.loadModel(LIPSYNC.cdn + LIPSYNC.model);

        lips.onvalue = (key, value) => {
          gl.oculus[key] = value;
        };
        lips.onstarted = () => {
          gl.speaking = true;
          gl.voiceAt = Date.now();
        };
        lips.onended = () => {
          gl.speaking = false;
        };

        audio.node = ctx.createMediaStreamSource(el.srcObject);
        audio.node.connect(lips);
        gl.lips = lips;
      };

      const detachLipsync = () => {
        safe(() => audio.node?.disconnect());
        safe(() => gl.lips?.disconnect());
        audio.node = null;
        gl.lips = null;
        gl.speaking = false;
        gl.oculus = {};
        gl.energy.v = 0;
        for (const v of VISEMES) gl.visemes[v] = 0;
      };

      const closeAudio = () => {
        detachLipsync();
        safe(() => audio.ctx?.close());
        audio.ctx = null;
        lipsyncReady = null;
      };

      const applyMood = (key, intensity = 0.85) => {
        const mood = MOODS[key] ?? MOODS.neutral;
        for (const m of MOOD_KEYS)
          if (MOODS[m].vrm !== "neutral") gl.target[MOODS[m].vrm] = 0;
        if (mood.vrm !== "neutral") gl.target[mood.vrm] = clamp(intensity, 0, 1);
        store.mood = key in MOODS ? key : "neutral";
        gl.rim?.color.setHex(mood.rim);
      };

      const playGesture = (name) => {
        gl.gesture = { name, t: 0, dur: GESTURES[name] };
      };

      const nudgeHead = (x, y) => {
        gl.nudge.x = clamp(x, -0.4, 0.4);
        gl.nudge.y = clamp(y, -0.4, 0.4);
        gl.nudge.decay = 1;
      };

      const bone = (name) => gl.vrm.humanoid.getNormalizedBoneNode(name);

      // Rotation signs differ between VRM exports. Probe the rig instead of assuming.
      const probe = (name, axis, read) => {
        const node = bone(name);
        if (!node) return 1;
        const before = read();
        node.rotation[axis] += 0.25;
        gl.vrm.scene.updateMatrixWorld(true);
        const after = read();
        node.rotation[axis] -= 0.25;
        gl.vrm.scene.updateMatrixWorld(true);
        return after < before ? 1 : -1;
      };

      const calibrate = () => {
        const v = new THREE.Vector3();
        const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(
          gl.vrm.scene.getWorldQuaternion(new THREE.Quaternion()),
        );

        const height = (name) => () => bone(name)?.getWorldPosition(v).y ?? 0;
        const behind = (name) => () => -(bone(name)?.getWorldPosition(v).dot(forward) ?? 0);

        gl.sign.armL = probe("leftUpperArm", "z", height("leftHand"));
        gl.sign.armR = probe("rightUpperArm", "z", height("rightHand"));
        gl.sign.elbowL = probe("leftLowerArm", "y", behind("leftHand"));
        gl.sign.elbowR = probe("rightLowerArm", "y", behind("rightHand"));
        gl.sign.leg = probe("leftUpperLeg", "x", behind("leftFoot"));
      };

      const applyRestPose = () => {
        bone("leftUpperArm")?.rotation.set(0, 0, gl.sign.armL * ARM_DROP);
        bone("rightUpperArm")?.rotation.set(0, 0, gl.sign.armR * ARM_DROP);
        bone("leftLowerArm")?.rotation.set(0, gl.sign.elbowL * ELBOW_BEND, 0);
        bone("rightLowerArm")?.rotation.set(0, gl.sign.elbowR * ELBOW_BEND, 0);
        bone("leftShoulder")?.rotation.set(0, 0, gl.sign.armL * 0.04);
        bone("rightShoulder")?.rotation.set(0, 0, gl.sign.armR * 0.04);
      };

      const captureBase = () => {
        gl.base.clear();
        for (const name of LIMBS) {
          const node = bone(name);
          if (!node) continue;
          gl.base.set(name, {
            x: node.rotation.x,
            y: node.rotation.y,
            z: node.rotation.z,
            py: node.position.y,
          });
        }
      };

      const setPose = (key) => {
        const spec = POSES[key];
        if (!spec) return;

        gl.pose.clear();
        gl.lift = (spec.lift ?? 0) * gl.unit;

        const put = (name, axis, value) => {
          const entry = gl.pose.get(name) ?? { x: 0, y: 0, z: 0 };
          entry[axis] += value;
          gl.pose.set(name, entry);
        };

        const leg = (side, cfg) => {
          if (!cfg) return;
          put(`${side}UpperLeg`, "x", gl.sign.leg * THREE.MathUtils.degToRad(cfg.upper));
          put(`${side}LowerLeg`, "x", gl.sign.leg * THREE.MathUtils.degToRad(cfg.lower));
          put(`${side}Foot`, "x", gl.sign.leg * THREE.MathUtils.degToRad(cfg.foot));
        };

        if (spec.legs) {
          leg("left", spec.legs);
          leg("right", spec.legs);
        }
        leg("left", spec.left);
        leg("right", spec.right);

        if (spec.arms) {
          put("leftUpperArm", "z", gl.sign.armL * (spec.arms.drop - ARM_DROP));
          put("rightUpperArm", "z", gl.sign.armR * (spec.arms.drop - ARM_DROP));
          put("leftLowerArm", "y", gl.sign.elbowL * (spec.arms.elbow - ELBOW_BEND));
          put("rightLowerArm", "y", gl.sign.elbowR * (spec.arms.elbow - ELBOW_BEND));
        }

        if (spec.spine) put("spine", "x", gl.sign.leg * THREE.MathUtils.degToRad(spec.spine));
      };

      const moveBone = (name, axis, degrees) => {
        if (!BONES.includes(name)) return false;
        const entry = gl.pose.get(name) ?? { x: 0, y: 0, z: 0 };
        entry[axis] = THREE.MathUtils.degToRad(clamp(degrees, -160, 160));
        gl.pose.set(name, entry);
        return true;
      };

      const stepPose = (delta) => {
        damp(gl.liftNow, "v", gl.lift, 0.35, delta);

        for (const [name, target] of gl.pose) {
          const now = gl.poseNow.get(name) ?? { x: 0, y: 0, z: 0 };
          for (const axis of ["x", "y", "z"]) damp(now, axis, target[axis], 0.35, delta);
          gl.poseNow.set(name, now);
        }

        for (const [name, now] of gl.poseNow) {
          if (gl.pose.has(name)) continue;
          for (const axis of ["x", "y", "z"]) damp(now, axis, 0, 0.35, delta);
        }

        for (const [name, base] of gl.base) {
          const node = bone(name);
          const now = gl.poseNow.get(name);
          if (!node) continue;
          node.rotation.set(base.x + (now?.x ?? 0), base.y + (now?.y ?? 0), base.z + (now?.z ?? 0));
        }

        const hips = bone("hips");
        const hipBase = gl.base.get("hips");
        if (hips && hipBase) hips.position.y = hipBase.py + gl.liftNow.v;
      };

      const classify = (name) => {
        for (const [part, pattern] of PARTS) if (pattern.test(name)) return part;
        return "other";
      };

      const catalogue = (vrm) => {
        gl.parts.clear();
        const seen = new Set();

        vrm.scene.traverse((o) => {
          if (!o.isMesh) return;
          for (const material of [o.material].flat()) {
            if (!material || seen.has(material.uuid)) continue;
            seen.add(material.uuid);

            const part = classify(`${material.name} ${o.name}`);
            material.userData.part = part;
            material.userData.baseTransparent = material.transparent;

            const list = gl.parts.get(part) ?? [];
            list.push(material);
            gl.parts.set(part, list);
          }
        });

        return Object.fromEntries([...gl.parts].map(([part, list]) => [part, list.length]));
      };

      // MToon multiplies its map by the colour factor, so a coloured texture
      // muddies every tint. Flatten it to luminance once, then tint freely.
      const flatten = (texture) => {
        const image = texture.image;
        if (!image?.width) return null;

        const canvas = document.createElement("canvas");
        canvas.width = image.width;
        canvas.height = image.height;

        const ctx = canvas.getContext("2d", { willReadFrequently: false });
        ctx.drawImage(image, 0, 0);

        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = pixels.data;
        for (let i = 0; i < d.length; i += 4) {
          const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
          d[i] = d[i + 1] = d[i + 2] = clamp(l * 1.25 + 46, 0, 255);
        }
        ctx.putImageData(pixels, 0, 0);

        const flat = new THREE.CanvasTexture(canvas);
        flat.colorSpace = texture.colorSpace;
        flat.flipY = texture.flipY;
        flat.wrapS = texture.wrapS;
        flat.wrapT = texture.wrapT;
        flat.needsUpdate = true;
        return flat;
      };

      const setHairColor = (input) => {
        const hair = gl.parts.get("hair");
        if (!hair?.length) return null;

        const color = new THREE.Color(input);

        for (const material of hair) {
          if (material.map && !gl.hairSource.has(material.uuid)) {
            gl.hairSource.set(material.uuid, material.map);
            const flat = flatten(material.map);
            if (flat) material.map = flat;
          }

          material.color?.copy(color);
          if (material.shadeColorFactor) material.shadeColorFactor.copy(color).multiplyScalar(0.62);
          if (material.shadeColor) material.shadeColor.copy(color).multiplyScalar(0.62);
          material.needsUpdate = true;
        }

        return `#${color.getHexString()}`;
      };

      const setPartVisible = (part, visible) => {
        if (!REMOVABLE.includes(part)) return false;
        const list = gl.parts.get(part);
        if (!list?.length) return false;

        for (const material of list) {
          material.colorWrite = visible;
          material.depthWrite = visible;
          material.needsUpdate = true;
        }
        return true;
      };

      const setBackground = (key) => {
        const preset = BACKGROUNDS[key] ?? BACKGROUNDS.void;

        const canvas = document.createElement("canvas");
        canvas.width = 2;
        canvas.height = 256;

        const ctx = canvas.getContext("2d");
        const gradient = ctx.createLinearGradient(0, 0, 0, 256);
        gradient.addColorStop(0, preset[0]);
        gradient.addColorStop(1, preset[1]);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 2, 256);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;

        gl.scene.background?.dispose?.();
        gl.scene.background = texture;
        return key in BACKGROUNDS ? key : "void";
      };

      const applyTraits = (traits) => {
        if (!gl.ready || !traits) return;
        if (traits.hair) setHairColor(traits.hair);
        if (traits.background) setBackground(traits.background);
        for (const part of REMOVABLE) setPartVisible(part, !traits.hidden?.includes(part));
      };

      const measureSubject = (vrm) => {
        const box = new THREE.Box3().setFromObject(vrm.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        if (!Number.isFinite(size.y) || size.y <= 0) throw new AbortError(new Fault("model"));

        const height = size.y;
        const top = box.min.y + height * FRAME_TOP;
        const bottom = box.min.y + height * FRAME_BOTTOM;
        const head = vrm.humanoid.getNormalizedBoneNode("head");

        gl.headY = head
          ? head.getWorldPosition(new THREE.Vector3()).y
          : box.min.y + height * 0.9;
        gl.fit = {
          x: center.x,
          y: (top + bottom) / 2,
          z: center.z,
          spanY: (top - bottom) * FRAME_PAD,
          spanX: size.x * FRAME_PAD,
        };
      };

      const fitCamera = () => {
        const { fit, camera } = gl;
        const vFov = (camera.fov * Math.PI) / 180;
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
        const distance = Math.max(
          fit.spanY / 2 / Math.tan(vFov / 2),
          fit.spanX / 2 / Math.tan(hFov / 2),
        );
        camera.position.set(fit.x, fit.y, fit.z + distance);
        camera.lookAt(fit.x, fit.y, fit.z);
        camera.near = distance / 100;
        camera.far = distance * 10;
        camera.updateProjectionMatrix();
      };

      const swayBone = (name, dx, dy, dz, py = 0) => {
        const node = bone(name);
        if (!node) return;
        node.rotation.x += dx;
        node.rotation.y += dy;
        node.rotation.z += dz;
        if (py) node.position.y += py;
      };

      const addBone = (name, dx, dy, dz) => {
        const node = bone(name);
        if (!node) return;
        node.rotation.x += dx;
        node.rotation.y += dy;
        node.rotation.z += dz;
      };

      const stepBlink = (now, delta) => {
        if (gl.blinkPhase < 0 && now >= gl.blinkAt) {
          gl.blinkPhase = 0;
          gl.blinkQueue = Math.random() < DOUBLE_BLINK_CHANCE ? 1 : 0;
          gl.blinkAt = now + rand(BLINK_MIN_MS, BLINK_MAX_MS);
        }
        if (gl.blinkPhase < 0) return;

        gl.blinkPhase += delta;
        const t = gl.blinkPhase / BLINK_DUR;
        gl.vrm.expressionManager.setValue("blink", t < 1 ? Math.sin(t * Math.PI) : 0);
        if (t < 1) return;

        if (gl.blinkQueue > 0) {
          gl.blinkQueue -= 1;
          gl.blinkPhase = -0.06;
        } else {
          gl.blinkPhase = -1;
        }
      };

      const stepGaze = (now, delta) => {
        if (gl.pointer.active) {
          gl.gaze.x = gl.pointer.x;
          gl.gaze.y = gl.pointer.y;
          gl.gazeAt = now + rand(SACCADE_MIN_MS, SACCADE_MAX_MS);
        } else if (now >= gl.gazeAt) {
          gl.gazeAt = now + rand(SACCADE_MIN_MS, SACCADE_MAX_MS);
          const wide = gl.energy.v > VOICE_FLOOR ? 0.14 : 0.32;
          gl.gaze.x = rand(-wide, wide);
          gl.gaze.y = rand(-wide * 0.6, wide * 0.5);
        }
        damp(gl.aim, "x", gl.gaze.x + noise2D(now / 2600, 0) * 0.035, SMOOTH_LOOK, delta);
        damp(gl.aim, "y", gl.gaze.y + noise2D(0, now / 3100) * 0.035, SMOOTH_LOOK, delta);
        const reach = gl.fit.spanY;
        gl.look.position.set(
          gl.fit.x + gl.aim.x * reach * 0.4,
          gl.headY + gl.aim.y * reach * 0.25,
          gl.fit.z + reach,
        );
      };

      const stepBody = (now, delta) => {
        const seconds = now / 1000;
        const breath = Math.sin(seconds * BREATH_HZ * Math.PI * 2);
        const swayX = noise2D(seconds * 0.09, 11.3);
        const swayY = noise2D(19.7, seconds * 0.07);
        const alive = gl.energy.v > VOICE_FLOOR ? 1.35 : 1;

        swayBone("hips", 0, 0, swayX * 0.012, breath * 0.004);
        swayBone("spine", breath * 0.012, swayY * 0.02, 0);
        swayBone("chest", breath * 0.022, 0, swayX * 0.016);

        gl.nudge.decay = Math.max(0, gl.nudge.decay - delta * 1.6);
        swayBone(
          "head",
          gl.nudge.y * gl.nudge.decay + breath * 0.01 + swayY * 0.018 * alive,
          noise2D(seconds * 0.11, 5.1) * 0.03 * alive,
          gl.nudge.x * gl.nudge.decay + swayX * 0.026 * alive,
        );
      };

      const stepGesture = (delta) => {
        if (!gl.gesture) return;

        gl.gesture.t += delta;
        const p = gl.gesture.t / gl.gesture.dur;
        if (p >= 1) {
          gl.gesture = null;
          return;
        }

        const env = Math.sin(Math.PI * p);

        const { armL, armR, elbowR, leg } = gl.sign;

        switch (gl.gesture.name) {
          case "nod":
            addBone("head", Math.sin(p * Math.PI * 2) * 0.22 * leg, 0, 0);
            break;
          case "shake":
            addBone("head", 0, Math.sin(p * Math.PI * 4) * 0.18, 0);
            break;
          case "lean_in":
            addBone("spine", env * 0.14 * leg, 0, 0);
            break;
          case "shrug":
            addBone("leftUpperArm", 0, 0, -armL * env * 0.28);
            addBone("rightUpperArm", 0, 0, -armR * env * 0.28);
            break;
          case "wave":
            addBone("rightUpperArm", 0, 0, -armR * env * 1.05);
            addBone("rightLowerArm", 0, elbowR * (0.5 + Math.sin(p * Math.PI * 6) * 0.45) * env, 0);
            break;
          case "point":
            addBone("rightUpperArm", 0, 0, -armR * env * 0.75);
            addBone("rightLowerArm", 0, elbowR * env * 0.45, 0);
            break;
          case "think":
            addBone("rightUpperArm", 0, 0, -armR * env * 0.45);
            addBone("rightLowerArm", 0, elbowR * env * 1.35, 0);
            addBone("head", 0, 0, env * 0.09);
            break;
        }
      };

      const stepMouth = (delta) => {
        const target = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };

        for (const [key, value] of Object.entries(gl.oculus)) {
          const rule = VISEME_MAP[key];
          if (!rule || !value) continue;
          const [shape, gain] = rule;
          target[shape] = Math.max(target[shape], value * gain);
        }

        for (const v of VISEMES) {
          damp(gl.visemes, v, target[v], SMOOTH_VISEME, delta);
          gl.vrm.expressionManager.setValue(v, gl.visemes[v]);
        }

        damp(gl.energy, "v", gl.speaking ? 1 : 0, 0.12, delta);
        if (gl.speaking) gl.voiceAt = Date.now();
      };

      const tick = () => {
        gl.raf = requestAnimationFrame(tick);

        const delta = Math.min(0.05, gl.clock.getDelta());
        const now = performance.now();

        gl.lips?.update(delta * 1000);

        stepBlink(now, delta);

        for (const name of Object.keys(gl.target)) {
          damp(gl.weights, name, gl.target[name], SMOOTH_EXPRESSION, delta);
          gl.vrm.expressionManager.setValue(name, gl.weights[name]);
        }

        stepMouth(delta);
        stepGaze(now, delta);
        stepPose(delta);
        stepBody(now, delta);
        stepGesture(delta);

        gl.vrm.update(delta);
        gl.renderer.render(gl.scene, gl.camera);
      };

      const startLoop = () => {
        if (gl.raf || !gl.ready) return;
        gl.clock.getDelta();
        tick();
      };

      const stopLoop = () => {
        cancelAnimationFrame(gl.raf);
        gl.raf = 0;
      };

      const isGlb = (buffer) =>
        buffer.byteLength > 12 && new DataView(buffer).getUint32(0, true) === 0x46546c67;

      const cachedBuffer = async (url) => {
        const cache = await caches.open(ASSET_CACHE);
        const hit = await cache.match(url);

        if (hit) {
          const buffer = await hit.arrayBuffer();
          if (isGlb(buffer)) return buffer;
          await cache.delete(url);
        }

        const res = await fetch(url, { cache: "reload" });
        if (!res.ok) throw new AbortError(new Fault("model", res.status));

        const buffer = await res.arrayBuffer();
        if (!isGlb(buffer)) throw new AbortError(new Fault("model", res.status));

        await cache.put(url, new Response(buffer, { headers: res.headers }));
        return buffer;
      };

      const sweepCaches = async () => {
        for (const key of await caches.keys())
          if (key.startsWith("sythera-assets-") && key !== ASSET_CACHE) await caches.delete(key);
      };

      const buildStage = async (canvas) => {
        const renderer = new THREE.WebGLRenderer({
          canvas,
          alpha: false,
          antialias: true,
          powerPreference: "high-performance",
          stencil: false,
          depth: true,
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.info.autoReset = false;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.AgXToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.setClearColor(0x000000, 1);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        gl.scene = scene;
        const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.01, 100);

        const key = new THREE.DirectionalLight(0xffffff, 2.1);
        key.position.set(1.2, 2.4, 2.2);
        const rim = new THREE.DirectionalLight(MOODS.neutral.rim, 1.6);
        rim.position.set(-1.8, 1.6, -1.4);
        const fill = new THREE.DirectionalLight(0x7fd6ff, 0.5);
        fill.position.set(-1.1, 0.4, 2.0);
        scene.add(key, rim, fill, new THREE.AmbientLight(0xffffff, 0.5));

        const ktx2 = new KTX2Loader()
          .setTranscoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/basis/")
          .detectSupport(renderer);

        const loader = new GLTFLoader()
          .setKTX2Loader(ktx2)
          .setMeshoptDecoder(MeshoptDecoder);
        loader.register((parser) => new VRMLoaderPlugin(parser));

        let gltf;
        try {
          gltf = await loader.parseAsync(await cachedBuffer(MODEL_URL), "/");
        } catch (e) {
          throw e instanceof AbortError ? e : new Fault("model");
        } finally {
          ktx2.dispose();
        }

        const vrm = gltf.userData.vrm;
        if (!vrm?.humanoid || !vrm.expressionManager || !vrm.lookAt)
          throw new AbortError(new Fault("model"));

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.combineMorphs(vrm);
        VRMUtils.rotateVRM0(vrm);

        const meshes = [];
        vrm.scene.traverse((o) => {
          o.frustumCulled = false;
          if (!o.isMesh) return;
          meshes.push(o);
        });
        scene.add(vrm.scene);

        const look = new THREE.Object3D();
        scene.add(look);
        vrm.lookAt.target = look;

        Object.assign(gl, {
          renderer,
          scene,
          camera,
          vrm,
          look,
          rim,
          meshes,
          raycaster: new THREE.Raycaster(),
          clock: new THREE.Clock(),
          blinkAt: performance.now() + rand(BLINK_MIN_MS, BLINK_MAX_MS),
          gazeAt: performance.now() + rand(SACCADE_MIN_MS, SACCADE_MAX_MS),
          weights: {},
          target: {},
          visemes: Object.fromEntries(VISEMES.map((v) => [v, 0])),
          gesture: null,
          ready: true,
        });

        console.info("[sythera] материалы модели:", catalogue(vrm));

        calibrate();
        applyRestPose();
        vrm.scene.updateMatrixWorld(true);
        measureSubject(vrm);
        gl.unit = gl.fit.spanY;
        look.position.set(gl.fit.x, gl.headY, gl.fit.z + gl.fit.spanY);
        captureBase();
        gl.pose.clear();
        gl.poseNow.clear();
        gl.lift = 0;
        gl.liftNow.v = 0;
        applyMood(store.mood);

        gl.bones.clear();
        for (const [region, spec] of Object.entries(REGIONS)) {
          const node = bone(spec.bone);
          if (node) gl.bones.set(region, node);
        }
      };

      const resizeStage = (canvas) => {
        if (!gl.ready) return;
        const w = canvas.clientWidth || 1;
        const h = canvas.clientHeight || 1;
        gl.renderer.setSize(w, h, false);
        gl.camera.aspect = w / h;
        fitCamera();
      };

      const pickRegion = (canvas, clientX, clientY) => {
        if (!gl.ready) return null;

        const rect = canvas.getBoundingClientRect();
        const px = clientX - rect.left;
        const py = clientY - rect.top;

        gl.raycaster.setFromCamera(
          new THREE.Vector2((px / rect.width) * 2 - 1, -(py / rect.height) * 2 + 1),
          gl.camera,
        );
        if (!gl.raycaster.intersectObjects(gl.meshes, false).length) return null;

        const v = new THREE.Vector3();
        let best = null;
        let bestDist = PICK_RADIUS_PX;
        for (const [region, node] of gl.bones) {
          node.getWorldPosition(v).project(gl.camera);
          const d = Math.hypot(
            ((v.x + 1) / 2) * rect.width - px,
            ((1 - v.y) / 2) * rect.height - py,
          );
          if (d < bestDist) {
            bestDist = d;
            best = region;
          }
        }
        return best;
      };

      const disposeStage = () => {
        stopLoop();
        detachLipsync();
        if (!gl.renderer) return;

        gl.scene.background?.dispose?.();
        VRMUtils.deepDispose(gl.vrm.scene);
        gl.renderer.dispose();

        Object.assign(gl, {
          ready: false,
          renderer: null,
          scene: null,
          camera: null,
          vrm: null,
          look: null,
          rim: null,
          fit: null,
          gesture: null,
          meshes: [],
        });
        gl.parts.clear();
        gl.hairSource.clear();
        gl.base.clear();
        gl.pose.clear();
        gl.poseNow.clear();
        gl.bones.clear();
      };

      const loadScript = (src) =>
        new Promise((resolve, reject) => {
          const el = document.createElement("script");
          el.src = src;
          el.async = true;
          el.onload = resolve;
          el.onerror = () => reject(new Fault("mic"));
          document.head.append(el);
        });

      let vadRuntime = null;
      const ensureVadRuntime = () => {
        vadRuntime ??= (async () => {
          await loadScript(`${ORT_CDN}ort.wasm.min.js`);
          await loadScript(`${VAD_CDN}bundle.min.js`);
          return globalThis.vad;
        })().catch((e) => {
          vadRuntime = null;
          throw e;
        });
        return vadRuntime;
      };

      const session = { token: "", exp: 0, initData: "", traits: {} };

      const http = ky.create({
        prefixUrl: API,
        timeout: TIMEOUT_MS,
        retry: {
          limit: 2,
          methods: ["post"],
          statusCodes: [408, 500, 502, 503, 504],
          backoffLimit: 4000,
        },
        credentials: "omit",
        cache: "no-store",
        hooks: {
          beforeError: [
            async (error) => {
              const body = await error.response.json().catch(() => null);
              error.code = body?.error ?? "internal";
              return error;
            },
          ],
        },
      });

      const refresh = async () => {
        const data = await http
          .post("auth", { headers: { Authorization: `tma ${session.initData}` } })
          .json();
        session.token = data.token;
        session.exp = data.expires_at;
        session.traits = data.traits ?? {};
        store.seconds = data.seconds_balance;
        return data;
      };

      const api = http.extend({
        hooks: {
          beforeRequest: [
            async (request) => {
              if (Date.now() / 1000 > session.exp - TOKEN_SKEW_S) await refresh();
              request.headers.set("Authorization", `Bearer ${session.token}`);
            },
          ],
        },
      });

      const lifecycle = () => ({
        status: "boot",
        phase: "scene",
        fault: null,
        toast: "",
        _abort: null,
        _observer: null,
        _hiddenTimer: null,
        _toastTimer: null,

        get loadingText() {
          return PHASES[this.phase];
        },

        get screen() {
          if (this.status === "outside") return "outside";
          if (this.status === "error") return "error";
          if (this.status === "boot") return "boot";
          if (this.live || this.connecting) return null;
          if (store.seconds <= 0) return "broke";
          if (this.needsMic || this.idle) return "prompt";
          return null;
        },

        get message() {
          return MESSAGES[this.fault?.code] ?? MESSAGES.internal;
        },

        get detail() {
          if (!this.fault) return [];
          return [
            ["code", this.fault.code],
            ["status", String(this.fault.status)],
            ["stage", this.phase],
            ["time", this.fault.at],
            ["online", String(navigator.onLine)],
          ];
        },

        async init() {
          try {
            retrieveLaunchParams();
          } catch {
            this.status = "outside";
            return;
          }

          this._abort = new AbortController();
          const { signal } = this._abort;

          initTelegram();
          miniApp.mountSync();
          miniApp.setHeaderColor("#000000");
          miniApp.setBackgroundColor("#000000");
          swipeBehavior.mount();
          swipeBehavior.disableVertical();
          closingBehavior.mount();
          await viewport.mount();
          viewport.expand();
          await safe(() => viewport.requestFullscreen());
          this.bindInsets();
          safe(() => postEvent("web_app_toggle_orientation_lock", { locked: true }));
          miniApp.ready();
          miniApp.isActive.sub(() => this.onActivity());
          viewport.isExpanded.sub((expanded) => {
            if (!expanded) return;
            viewport.expand();
            this.bindInsets();
            resizeStage(this.$refs.canvas);
            startLoop();
          });

          session.initData = safe(() => retrieveRawInitData());
          if (!session.initData) return this.fail(new Fault("unauthorized", 401));

          const canvas = this.$refs.canvas;
          canvas.addEventListener(
            "webglcontextlost",
            (e) => {
              e.preventDefault();
              stopLoop();
              this.phase = "graphics";
              this.status = "boot";
            },
            { signal },
          );
          canvas.addEventListener("webglcontextrestored", () => this.boot(), { signal });
          addEventListener("offline", () => this.hangUp(), { signal });
          addEventListener("unhandledrejection", (e) => this.flash(e.reason), { signal });
          addEventListener("online", () => this.listen(), { signal });

          safe(sweepCaches);
          await this.boot();
        },

        bindInsets() {
          const apply = () => {
            const safeArea = viewport.safeAreaInsets();
            const content = viewport.contentSafeAreaInsets();
            const root = document.documentElement.style;
            for (const side of ["top", "bottom", "left", "right"])
              root.setProperty(`--pad-${side}`, `${safeArea[side] + content[side]}px`);
          };
          apply();
          viewport.safeAreaInsets.sub(apply);
          viewport.contentSafeAreaInsets.sub(apply);
        },

        async reboot() {
          await safe(() => caches.delete(ASSET_CACHE));
          await this.boot();
        },

        async boot() {
          this.status = "boot";
          this.fault = null;

          const attempt = (fn) =>
            pRetry(fn, {
              retries: BOOT_RETRIES,
              minTimeout: 1200,
              factor: 2,
              onFailedAttempt: (e) => {
                const { status } = faultOf(e);
                if (status === 401 || status === 403) throw new AbortError(e);
              },
            });

          try {
            this.phase = "scene";
            await attempt(() => this.mountStage());
            this.phase = "auth";
            await attempt(refresh);
            applyTraits(session.traits);
            this.status = "ready";
            this.needsMic = true;
            this.idle = false;
          } catch (e) {
            this.fail(e.originalError ?? e);
          }
        },

        fail(error) {
          const fault = faultOf(error);
          fault.at = new Date().toISOString().slice(11, 19);
          this.destroyListener();
          disposeStage();
          this.fault = fault;
          this.status = "error";
          haptic.notify("error");
        },

        flash(error) {
          clearTimeout(this._toastTimer);
          this.toast = MESSAGES[faultOf(error).code] ?? MESSAGES.internal;
          this._toastTimer = setTimeout(() => (this.toast = ""), TOAST_MS);
        },

        async mountStage() {
          const canvas = this.$refs.canvas;
          disposeStage();
          await buildStage(canvas);
          resizeStage(canvas);
          this._observer?.disconnect();
          this._observer = new ResizeObserver(() => resizeStage(canvas));
          this._observer.observe(canvas);
          startLoop();
        },

        onActivity() {
          const away = document.hidden || !miniApp.isActive();
          clearTimeout(this._hiddenTimer);
          if (away) {
            stopLoop();
            this._hiddenTimer = setTimeout(() => this.hangUp(), HIDDEN_HANGUP_MS);
            return;
          }
          startLoop();
          unlockAudio();
        },

        destroy() {
          clearTimeout(this._hiddenTimer);
          clearTimeout(this._toastTimer);
          this._abort?.abort();
          this._observer?.disconnect();
          this.destroyListener();
          this.hangUp();
          disposeStage();
          closeAudio();
        },
      });

      const pointer = () => ({
        _lastTouch: 0,

        onPointerMove(e) {
          const rect = this.$refs.canvas.getBoundingClientRect();
          gl.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          gl.pointer.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
          gl.pointer.active = true;
        },

        onPointerLeave() {
          gl.pointer.active = false;
        },

        onPointerDown(e) {
          unlockAudio();
          if (this.needsMic) return this.grantMic();

          const region = pickRegion(this.$refs.canvas, e.clientX, e.clientY);
          if (!region) return;

          const now = performance.now();
          if (now - this._lastTouch < TOUCH_COOLDOWN_MS) return;
          this._lastTouch = now;

          haptic.impact(REGIONS[region].haptic);
          nudgeHead(region === "head" ? 0.14 : -0.08, -0.1);
          this._rt?.sendMessage(`[touch:${region}]`);
        },
      });

      const voice = () => ({
        live: false,
        connecting: false,
        listening: false,
        needsMic: false,
        buying: false,
        caption: "",
        packs: PACKS,
        _rt: null,
        _sessionId: "",
        _vad: null,
        _budget: 0,
        _timer: null,
        _beat: null,
        _startedAt: 0,
        _history: [],
        _closing: false,
        _failures: 0,
        _coolUntil: 0,
        _ending: false,
        idle: false,

        get state() {
          if (this.live) return "live";
          if (this.connecting) return "connecting";
          return this.listening ? "listening" : "idle";
        },

        get minutes() {
          return Math.ceil(store.seconds / 60);
        },

        async grantMic() {
          // getUserMedia must be the first await, or Safari drops the gesture.
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            for (const track of stream.getTracks()) track.stop();
          } catch (e) {
            this.needsMic = true;
            haptic.notify("error");
            return;
          }
          this.needsMic = false;
          this.idle = false;
          unlockAudio();
          await this.listen();
          await this.dial();
        },

        async listen() {
          if (this.listening || this.live || this.connecting) return;
          if (this.status !== "ready" || store.seconds <= 0) return;

          try {
            const vad = await ensureVadRuntime();
            unlockAudio();
            this._vad = await vad.MicVAD.new({
              positiveSpeechThreshold: 0.62,
              negativeSpeechThreshold: 0.42,
              redemptionFrames: 8,
              preSpeechPadFrames: 3,
              minSpeechFrames: 3,
              baseAssetPath: VAD_CDN,
              onnxWASMBasePath: ORT_CDN,
              onSpeechStart: () => this.onSpeech(),
            });
            this._vad.start();
            this.listening = true;
            this.needsMic = false;
          } catch (e) {
            this.listening = false;
            this.needsMic = faultOf(e).code === "denied";
            if (!this.needsMic) this.flash(e);
          }
        },

        pauseListen() {
          this._vad?.pause();
          this.listening = false;
        },

        stopListening() {
          this.destroyListener();
          this.idle = true;
        },

        destroyListener() {
          const vad = this._vad;
          this._vad = null;
          this.listening = false;
          vad?.destroy();
        },

        onSpeech() {
          if (Date.now() < this._coolUntil) return;
          this.dial();
        },

        async dial() {
          if (this.connecting || this.live || store.seconds <= 0) return;
          this.connecting = true;
          this.pauseListen();

          try {
            const grant = await api.post("voice/start").json();
            this._sessionId = grant.session_id;
            this._budget = grant.seconds_balance;
            store.seconds = grant.seconds_balance;

            const el = this.$refs.audio;
            const transport = new OpenAIRealtimeWebRTC({ audioElement: el });
            const rt = new RealtimeSession(
              new RealtimeAgent({ name: AGENT, tools: this.tools() }),
              { transport },
            );

            rt.on("history_updated", (history) => this.onHistory(history));
            rt.on("error", () => this.hangUp());
            transport.on("connection_change", (state) => {
              if (state === "disconnected" && this.live) this.hangUp();
            });

            await rt.connect({ apiKey: grant.client_secret });

            this._rt = rt;
            this._startedAt = Date.now();
            this._history = [];
            gl.voiceAt = Date.now();
            this.live = true;
            this.connecting = false;
            this._failures = 0;
            haptic.impact("medium");
            closingBehavior.enableConfirmation();

            await safe(() => attachLipsync(el));
            this._timer = setInterval(() => this.onSecond(), 1000);
            this._beat = setInterval(() => this.ping(), HEARTBEAT_MS);
          } catch (e) {
            this.connecting = false;
            const { code } = faultOf(e);

            this._failures += 1;
            this._coolUntil =
              Date.now() +
              (code === "rate_limited" ? 300000 : Math.min(60000, 2000 * 2 ** this._failures));

            if (code === "no_balance") store.seconds = 0;
            else this.flash(e);

            await this.hangUp();
            if (this._failures < 5) await this.listen();
          }
        },

        async saveTraits(patch) {
          session.traits = { ...session.traits, ...patch };
          await safe(() => api.post("voice/traits", { json: patch }).json());
        },

        async ping() {
          const res = await safe(() =>
            api.post("voice/ping", { json: { session_id: this._sessionId } }).json(),
          );
          if (res?.ok === false) this.hangUp();
        },

        onSecond() {
          const spent = (Date.now() - this._startedAt) / 1000;
          store.seconds = Math.max(0, this._budget - Math.floor(spent));
          if (spent >= this._budget || Date.now() - gl.voiceAt > IDLE_HANGUP_MS)
            this.hangUp();
        },

        onHistory(history) {
          this._history = history;
          gl.voiceAt = Date.now();

          for (let i = history.length - 1; i >= 0; i--) {
            const item = history[i];
            if (item.type !== "message" || item.role !== "assistant") continue;
            const text = this.textOf(item);
            if (text) this.caption = text.slice(0, CAPTION_MAX);
            return;
          }
        },

        textOf(item) {
          return item.content
            .map((p) => p.transcript ?? p.text ?? "")
            .join(" ")
            .trim();
        },

        transcript() {
          return this._history
            .filter((i) => i.type === "message" && i.role !== "system")
            .map((i) => ({ role: i.role, content: this.textOf(i).slice(0, 4000) }))
            .filter((line) => line.content && !line.content.startsWith("[touch:"))
            .slice(-400);
        },

        async hangUp() {
          if (this._closing || !this._rt) return;
          this._closing = true;

          clearInterval(this._timer);
          clearInterval(this._beat);

          const rt = this._rt;
          const session_id = this._sessionId;
          const transcript = this.transcript();

          this._rt = null;
          this._sessionId = "";
          this._startedAt = 0;
          this._history = [];
          this.live = false;
          this.caption = "";

          detachLipsync();
          rt.close();
          closingBehavior.disableConfirmation();
          applyMood("neutral");
          haptic.impact("soft");

          const done = await safe(() =>
            api.post("voice/finish", { json: { session_id, transcript } }).json(),
          );
          if (done) store.seconds = done.seconds_balance;

          this._closing = false;
          if (!document.hidden) await this.listen();
        },

        tools() {
          return [
            tool({
              name: "set_mood",
              description: "Сменить выражение лица аватара при смене эмоционального тона.",
              parameters: z.object({
                mood: z.enum(MOOD_KEYS),
                intensity: z.number().min(0).max(1).nullable(),
              }),
              execute: ({ mood, intensity }) => {
                applyMood(mood, intensity ?? 0.85);
                return "ok";
              },
            }),
            tool({
              name: "play_gesture",
              description: "Проиграть жест аватара.",
              parameters: z.object({ gesture: z.enum(GESTURE_KEYS) }),
              execute: ({ gesture }) => {
                playGesture(gesture);
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "set_pose",
              description:
                "Принять позу телом: сесть, встать на колени, присесть, поднять ногу, скрестить руки, руки на пояс, поднять руки, поклониться, откинуться, встать прямо.",
              parameters: z.object({ pose: z.enum(POSE_KEYS) }),
              execute: ({ pose }) => {
                setPose(pose);
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "move_body",
              description:
                "Повернуть одну кость тела на заданный угол в градусах. Для точных просьб вроде «наклони голову вправо» или «согни левое колено».",
              parameters: z.object({
                bone: z.enum(BONES),
                axis: z.enum(["x", "y", "z"]),
                degrees: z.number().min(-160).max(160),
              }),
              execute: ({ bone: name, axis, degrees }) => (moveBone(name, axis, degrees) ? "ok" : "fail"),
            }),
            tool({
              name: "set_hair_color",
              description:
                "Перекрасить волосы. Цвет — название на английском (silver, crimson, teal) или HEX вида #a0c4ff.",
              parameters: z.object({ color: z.string().max(24) }),
              execute: async ({ color }) => {
                let hex;
                try {
                  hex = setHairColor(color);
                } catch {
                  return "fail";
                }
                if (!hex) return "fail";
                await this.saveTraits({ hair: hex });
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "toggle_clothing",
              description:
                "Снять или надеть верхний элемент одежды: жилет или куртку (outer), бант или галстук (bow), головной убор (hat), очки (glasses), украшение (accessory), обувь (shoes), носки или чулки (socks).",
              parameters: z.object({
                item: z.enum(REMOVABLE),
                visible: z.boolean(),
              }),
              execute: async ({ item, visible }) => {
                if (!setPartVisible(item, visible)) return "missing";
                const hidden = new Set(session.traits.hidden ?? []);
                visible ? hidden.delete(item) : hidden.add(item);
                await this.saveTraits({ hidden: [...hidden] });
                haptic.impact("soft");
                return "ok";
              },
            }),
            tool({
              name: "set_background",
              description: "Сменить фон сцены за аватаром.",
              parameters: z.object({ background: z.enum(BACKGROUND_KEYS) }),
              execute: async ({ background }) => {
                await this.saveTraits({ background: setBackground(background) });
                return "ok";
              },
            }),
            tool({
              name: "remember",
              description:
                "Сохранить долговременный факт о собеседнике. Только устойчивые сведения, не реплики диалога.",
              parameters: z.object({
                content: z.string().max(500),
                kind: z.enum(["fact", "preference", "event"]).nullable(),
                importance: z.number().int().min(1).max(5).nullable(),
              }),
              execute: async ({ content, kind, importance }) => {
                const res = await safe(() =>
                  api
                    .post("voice/remember", {
                      json: { content, kind: kind ?? "fact", importance: importance ?? 3 },
                    })
                    .json(),
                );
                return res ? "ok" : "fail";
              },
            }),
            tool({
              name: "recall",
              description: "Найти ранее сохранённые факты о собеседнике по смыслу запроса.",
              parameters: z.object({
                query: z.string().max(500),
                limit: z.number().int().min(1).max(10).nullable(),
              }),
              execute: async ({ query, limit }) => {
                const res = await safe(() =>
                  api.post("voice/recall", { json: { query, limit: limit ?? 5 } }).json(),
                );
                if (!res) return "fail";
                return res.memories.length ? res.memories.join("; ") : "пусто";
              },
            }),
            tool({
              name: "end_call",
              description: "Завершить разговор, когда собеседник прощается.",
              parameters: z.object({}),
              execute: () => {
                this._ending = true;
                queueMicrotask(() => this.hangUp());
                return "ok";
              },
            }),
          ];
        },

        async buy(plan) {
          if (this.buying) return;
          this.buying = true;
          try {
            const { link } = await api.post("voice/invoice", { json: { plan } }).json();
            if (!invoice.open.isAvailable()) throw new Fault("invoice");
            if ((await invoice.open(link, "url")) !== "paid") return;
            await refresh();
            haptic.notify("success");
            await this.listen();
          } catch (e) {
            this.flash(e);
            haptic.notify("error");
          } finally {
            this.buying = false;
          }
        },
      });

      Alpine.data("app", () => compose(lifecycle(), pointer(), voice()));
      Alpine.start();
    </script>
  </head>

  <body x-data="app" @pagehide.window="destroy()" @visibilitychange.document="onActivity()">
    <canvas
      x-ref="canvas"
      @pointermove="onPointerMove($event)"
      @pointerdown="onPointerDown($event)"
      @pointerleave="onPointerLeave()"
      @pointercancel="onPointerLeave()"
    ></canvas>

    <div class="vignette" aria-hidden="true"></div>

    <div class="hud" x-show="status === 'ready' && !screen" :data-state="state" x-transition x-cloak>
      <span class="dot"></span>
      <span x-text="minutes + ' мин'"></span>
    </div>

    <p class="caption" x-show="live && caption" x-text="caption" x-transition.opacity.duration.220ms x-cloak></p>

    <div
      class="toast"
      role="status"
      x-show="toast"
      x-text="toast"
      x-transition.duration.220ms
      x-cloak
    ></div>

    <div class="sheet" data-solid x-show="screen === 'boot'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="spinner" role="progressbar"></span>
        <span class="note" x-text="loadingText"></span>
      </div>
    </div>

    <div
      class="sheet"
      role="button"
      tabindex="0"
      x-show="screen === 'prompt'"
      x-cloak
      @pointerdown="grantMic()"
      @keydown.enter.prevent="grantMic()"
      @keydown.space.prevent="grantMic()"
    >
      <div class="body">
        <span class="title" x-text="idle ? 'Разговор завершён' : 'Коснитесь, чтобы начать'"></span>
        <span class="note" x-text="idle ? 'Коснитесь экрана, чтобы продолжить' : 'Sythera слушает и отвечает голосом. Нужен доступ к микрофону.'"></span>
      </div>
    </div>

    <div class="sheet" x-show="screen === 'broke'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title">Голосовое время закончилось</span>
        <span class="note">Пополните баланс, чтобы продолжить разговор</span>
      </div>
      <div class="foot">
        <div class="row">
          <template x-for="pack in packs" :key="pack.id">
            <button type="button" class="pack" :disabled="buying" @click="buy(pack.id)">
              <span x-text="pack.stars + ' ★'"></span>
              <small x-text="pack.label"></small>
            </button>
          </template>
        </div>
      </div>
    </div>

    <div class="sheet" data-solid role="alert" x-show="screen === 'outside'" x-cloak>
      <div class="body">
        <span class="title">Sythera живёт внутри Telegram</span>
      </div>
    </div>

    <div class="sheet" data-solid role="alert" x-show="screen === 'error'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title" x-text="message"></span>
        <span class="note">Проверьте соединение и попробуйте снова</span>
        <details class="disclosure">
          <summary>Подробности</summary>
          <dl class="detail">
            <template x-for="[key, value] in detail" :key="key">
              <div style="display: contents">
                <dt x-text="key"></dt>
                <dd x-text="value"></dd>
              </div>
            </template>
          </dl>
        </details>
      </div>
      <div class="foot">
        <button type="button" class="action" @click="reboot()">Повторить</button>
      </div>
    </div>

    <audio x-ref="audio" autoplay playsinline></audio>
  </body>
</html>
