<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://api.openai.com https://unpkg.com https://esm.sh blob: data:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>Sythera</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@layer tokens, base, layout, components;

@layer tokens {
  :root {
    --bg: oklch(0.16 0.012 275);
    --surface: oklch(0.22 0.016 275);
    --surface-2: oklch(0.27 0.02 275);
    --text: oklch(0.96 0.004 275);
    --muted: oklch(0.68 0.014 275);
    --accent: oklch(0.74 0.16 305);
    --danger: oklch(0.66 0.19 25);
    --live: oklch(0.78 0.17 155);
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
}

@layer base {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    user-select: none;
  }
  [x-cloak] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
}

@layer layout {
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
  #stage { position: absolute; inset: 0; z-index: 0; }
  header, main, footer { position: relative; z-index: 1; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(var(--safe-top) + 14px) 18px 10px; }
  main { display: flex; align-items: flex-end; justify-content: center; padding: 0 18px; pointer-events: none; }
  footer { display: grid; justify-items: center; gap: 14px; padding: 18px 18px calc(var(--safe-bottom) + 24px); }
}

@layer components {
  .name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .state { font-size: 13px; color: var(--muted); }
  .state[data-live="true"] { color: var(--live); }

  .balance {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--surface); font-size: 15px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .balance small { color: var(--muted); font-size: 13px; font-weight: 500; }

  .transcript {
    width: 100%; max-width: 520px; max-height: 38vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
    padding-bottom: 12px;
    mask-image: linear-gradient(180deg, transparent, #000 22%);
  }
  .line { font-size: 15px; line-height: 1.4; padding: 9px 13px; border-radius: 14px; max-width: 90%; }
  .line[data-role="user"] { align-self: flex-end; background: var(--surface-2); }
  .line[data-role="assistant"] { align-self: flex-start; background: color-mix(in oklab, var(--accent) 22%, var(--surface)); }
  @starting-style { .line { opacity: 0; transform: translateY(6px); } }
  .line { transition: opacity .25s, transform .25s; }

  .mic {
    width: 84px; height: 84px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: oklch(0.16 0.012 275);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent);
    transition: transform .18s, background .2s, box-shadow .4s;
  }
  .mic:active { transform: scale(0.94); }
  .mic[data-live="true"] { background: var(--danger); color: var(--text); }
  .mic[data-pulse="true"] { animation: pulse 2.2s ease-out infinite; }
  .mic:disabled { opacity: 0.4; }
  .mic svg { width: 34px; height: 34px; }

  @keyframes pulse {
    to { box-shadow: 0 0 0 26px transparent; }
  }

  .hint { font-size: 14px; color: var(--muted); min-height: 20px; text-align: center; }

  .plans { display: flex; gap: 10px; }
  .plan {
    padding: 10px 14px; border-radius: 14px; background: var(--surface);
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .plan span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }

  .fatal {
    position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; gap: 12px;
    padding: 32px; background: var(--bg); text-align: center;
  }
  .fatal p { color: var(--muted); font-size: 15px; }
  .fatal button { padding: 12px 22px; border-radius: 14px; background: var(--surface-2); font-weight: 600; }

  .boot { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; background: var(--bg); }
  .boot i {
    display: block; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--surface-2); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js",
    "alpinejs": "https://esm.sh/alpinejs@3.14.9"
  }
}
</script>
</head>
<body>

<div id="app" x-data="sythera" x-cloak>
  <canvas id="stage" x-ref="stage"></canvas>

  <header>
    <div>
      <div class="name" x-text="companion?.name ?? 'Sythera'"></div>
      <div class="state" :data-live="live" x-text="state"></div>
    </div>
    <div class="balance" x-show="entitlement">
      <span x-text="minutes"></span><small>мин</small>
    </div>
  </header>

  <main>
    <div class="transcript">
      <template x-for="line in tail" :key="line.id">
        <div class="line" :data-role="line.role" x-text="line.content"></div>
      </template>
    </div>
  </main>

  <footer>
    <div class="plans" x-show="!live && minutes < 2">
      <template x-for="plan in plans" :key="plan.id">
        <button class="plan" @click="buy(plan.id)" x-text="plan.stars + '★'">
          <span x-text="plan.label"></span>
        </button>
      </template>
    </div>

    <button class="mic" :data-live="live" :data-pulse="live" :disabled="busy || (!live && minutes < 1)" @click="toggle()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <template x-if="!live">
          <g><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></g>
        </template>
        <template x-if="live">
          <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
        </template>
      </svg>
    </button>

    <div class="hint" x-text="hint"></div>
  </footer>

  <div class="boot" x-show="stage === 'boot'" x-transition.opacity><i></i></div>

  <div class="fatal" x-show="fatal" x-transition.opacity>
    <div class="name" x-text="fatal"></div>
    <p x-text="fatalHint"></p>
    <button @click="location.reload()">Перезапустить</button>
  </div>
</div>

<audio id="sink" autoplay></audio>

<script type="module">
import Alpine from 'alpinejs';
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const API = 'https://YOUR_REF.supabase.co/functions/v1/api';
const VRM_FALLBACK = './assets/default.vrm';
const REALTIME = 'https://api.openai.com/v1/realtime/calls';

const compose = (...slices) =>
  slices.reduce((acc, slice) => Object.defineProperties(acc, Object.getOwnPropertyDescriptors(slice)), {});

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));

const VOWELS = [
  { key: 'aa', f1: 800, f2: 1200 },
  { key: 'ih', f1: 350, f2: 2200 },
  { key: 'ou', f1: 350, f2: 800 },
  { key: 'ee', f1: 500, f2: 1800 },
  { key: 'oh', f1: 500, f2: 950 },
];

const MOODS = { neutral: null, happy: 'happy', sad: 'sad', angry: 'angry', surprised: 'surprised', relaxed: 'relaxed' };

const GESTURES = {
  wave: 1.4, nod: 0.9, shake: 0.9, shrug: 1.1, point: 1.2, lean_in: 1.6, think: 2.0,
};

const lifecycle = () => ({
  stage: 'boot',
  fatal: '',
  fatalHint: '',
  tg: null,

  async init() {
    this.tg = window.Telegram.WebApp;
    this.tg.ready();
    this.tg.expand();
    this.tg.disableVerticalSwipes?.();
    this.tg.setHeaderColor?.('#191721');
    this.tg.setBackgroundColor?.('#191721');

    try {
      await this.authenticate();
      await this.mount(this.$refs.stage);
      this.stage = 'ready';
    } catch (err) {
      this.die(err);
    }

    addEventListener('pagehide', () => this.hangup('pagehide'), { once: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.live) this.hangup('hidden');
    });
  },

  die(err) {
    const code = String(err?.message ?? err);
    this.fatal = { unauthorized: 'Нет доступа', banned: 'Аккаунт заблокирован', no_companion: 'Компаньон не найден' }[code] ?? 'Что-то сломалось';
    this.fatalHint = code;
    this.stage = 'dead';
  },
});

const auth = () => ({
  token: '',
  expiresAt: 0,
  user: null,
  companion: null,
  entitlement: null,

  get minutes() {
    return Math.floor((this.entitlement?.seconds_balance ?? 0) / 60);
  },

  async authenticate() {
    const res = await fetch(`${API}/auth`, {
      method: 'POST',
      headers: { authorization: `tma ${this.tg.initData}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'unauthorized');

    this.token = data.token;
    this.expiresAt = data.expires_at;
    this.user = data.user;
    this.companion = data.companion;
    this.entitlement = data.entitlement;
  },

  async call(path, body) {
    if (Date.now() / 1000 > this.expiresAt - 60) await this.authenticate();

    const res = await fetch(`${API}${path}`, {
      method: 'POST',
      headers: { authorization: `Bearer ${this.token}`, 'content-type': 'application/json' },
      body: JSON.stringify(body ?? {}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'request_failed');
    return data;
  },
});

const avatar = () => ({
  renderer: null,
  scene: null,
  camera: null,
  vrm: null,
  clock: null,
  visemes: { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 },
  mood: 'neutral',
  moodWeight: 0,
  gesture: null,
  blink: 0,
  nextBlink: 2,
  loudness: 0,

  async mount(canvas) {
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20);
    this.camera.position.set(0, 1.32, 1.55);

    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(1.2, 2.4, 1.8);
    const rim = new THREE.DirectionalLight(0xb08cff, 1.5);
    rim.position.set(-1.6, 1.4, -1.2);
    this.scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.55));

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const path = this.companion?.vrm_path
      ? `${API.replace('/functions/v1/api', '')}/storage/v1/object/public/${this.companion.vrm_path}`
      : VRM_FALLBACK;

    const gltf = await loader.loadAsync(path);
    const vrm = gltf.userData.vrm;

    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons(gltf.scene);
    VRMUtils.rotateVRM0(vrm);

    vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
    this.scene.add(vrm.scene);
    this.vrm = vrm;
    this.clock = new THREE.Clock();

    this.resize();
    new ResizeObserver(() => this.resize()).observe(canvas);
    this.renderer.setAnimationLoop(() => this.frame());
  },

  resize() {
    const { clientWidth: w, clientHeight: h } = this.renderer.domElement;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.fov = w / h < 0.62 ? 32 : 26;
    this.camera.updateProjectionMatrix();
  },

  frame() {
    const dt = Math.min(this.clock.getDelta(), 0.05);
    const t = this.clock.elapsedTime;
    const vrm = this.vrm;
    if (!vrm) return;

    this.sampleVisemes(dt);

    const em = vrm.expressionManager;
    for (const { key } of VOWELS) em.setValue(key, this.visemes[key]);

    this.nextBlink -= dt;
    if (this.nextBlink <= 0) {
      this.blink = 1;
      this.nextBlink = 2.4 + Math.random() * 3.6;
    }
    this.blink = damp(this.blink, 0, 14, dt);
    em.setValue('blink', this.blink > 0.06 ? Math.min(1, this.blink * 1.6) : 0);

    const target = MOODS[this.mood];
    for (const name of Object.values(MOODS)) {
      if (!name) continue;
      const want = name === target ? this.moodWeight : 0;
      em.setValue(name, damp(em.getValue(name) ?? 0, want, 5, dt));
    }

    const bone = (name) => vrm.humanoid.getNormalizedBoneNode(name);
    const spine = bone('spine');
    const chest = bone('chest');
    const head = bone('head');
    const hips = bone('hips');
    const armL = bone('leftUpperArm');
    const armR = bone('rightUpperArm');
    const foreR = bone('rightLowerArm');

    const breath = Math.sin(t * 1.15) * 0.018;
    if (spine) spine.rotation.x = breath;
    if (chest) chest.rotation.x = breath * 0.6;
    if (hips) {
      hips.position.y = Math.sin(t * 1.15) * 0.004;
      hips.rotation.z = Math.sin(t * 0.42) * 0.012;
    }
    if (head) {
      head.rotation.y = Math.sin(t * 0.31) * 0.06;
      head.rotation.x = Math.sin(t * 0.53) * 0.03 + this.loudness * 0.06;
      head.rotation.z = Math.sin(t * 0.27) * 0.02;
    }
    if (armL) { armL.rotation.z = 1.22 + Math.sin(t * 0.6) * 0.02; }
    if (armR) { armR.rotation.z = -1.22 - Math.sin(t * 0.55) * 0.02; }

    if (this.gesture) {
      this.gesture.t += dt;
      const p = this.gesture.t / this.gesture.dur;
      if (p >= 1) this.gesture = null;
      else this.applyGesture(this.gesture.name, p, { head, spine, armR, foreR, armL });
    }

    vrm.update(dt);
    this.renderer.render(this.scene, this.camera);
  },

  applyGesture(name, p, b) {
    const env = Math.sin(Math.PI * p);
    if (name === 'nod' && b.head) b.head.rotation.x += Math.sin(p * Math.PI * 2) * 0.22;
    if (name === 'shake' && b.head) b.head.rotation.y += Math.sin(p * Math.PI * 4) * 0.18;
    if (name === 'lean_in' && b.spine) b.spine.rotation.x += env * 0.14;
    if (name === 'shrug') {
      if (b.armL) b.armL.rotation.z -= env * 0.28;
      if (b.armR) b.armR.rotation.z += env * 0.28;
    }
    if (name === 'wave' && b.armR && b.foreR) {
      b.armR.rotation.z += env * 0.95;
      b.foreR.rotation.x -= env * 0.5;
      b.foreR.rotation.y = Math.sin(p * Math.PI * 6) * 0.45 * env;
    }
    if (name === 'point' && b.armR && b.foreR) {
      b.armR.rotation.z += env * 0.7;
      b.foreR.rotation.y += env * 0.4;
    }
    if (name === 'think' && b.armR && b.foreR) {
      b.armR.rotation.z += env * 0.55;
      b.foreR.rotation.x -= env * 1.3;
      if (b.head) b.head.rotation.z += env * 0.08;
    }
  },

  sampleVisemes(dt) {
    const analyser = this.analyser;
    if (!analyser) {
      for (const { key } of VOWELS) this.visemes[key] = damp(this.visemes[key], 0, 12, dt);
      this.loudness = damp(this.loudness, 0, 8, dt);
      return;
    }

    analyser.getByteTimeDomainData(this.timeBuf);
    let sum = 0;
    for (let i = 0; i < this.timeBuf.length; i++) {
      const v = (this.timeBuf[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / this.timeBuf.length);
    this.loudness = damp(this.loudness, clamp(rms * 7, 0, 1), 18, dt);

    analyser.getFloatFrequencyData(this.freqBuf);
    const binHz = analyser.context.sampleRate / analyser.fftSize;
    const peak = (lo, hi) => {
      let best = -Infinity, at = lo;
      for (let i = Math.floor(lo / binHz); i < Math.ceil(hi / binHz) && i < this.freqBuf.length; i++) {
        if (this.freqBuf[i] > best) { best = this.freqBuf[i]; at = i * binHz; }
      }
      return at;
    };

    const open = clamp((rms - 0.012) * 9, 0, 1);
    if (open < 0.02) {
      for (const { key } of VOWELS) this.visemes[key] = damp(this.visemes[key], 0, 14, dt);
      return;
    }

    const f1 = peak(200, 1000);
    const f2 = peak(900, 3000);
    const sigma = 0.28;

    let total = 0;
    const weights = VOWELS.map(({ f1: a, f2: b }) => {
      const d = Math.log(f1 / a) ** 2 + Math.log(f2 / b) ** 2;
      const w = Math.exp(-d / (2 * sigma * sigma));
      total += w;
      return w;
    });

    VOWELS.forEach(({ key }, i) => {
      const want = total > 0 ? (weights[i] / total) * open : 0;
      this.visemes[key] = damp(this.visemes[key], want, 26, dt);
    });
  },
});

const voice = () => ({
  live: false,
  busy: false,
  sessionId: '',
  pc: null,
  dc: null,
  mic: null,
  analyser: null,
  timeBuf: null,
  freqBuf: null,
  audioCtx: null,
  beat: 0,
  transcript: [],
  seq: 0,
  hint: 'Нажмите, чтобы начать разговор',

  get state() {
    if (this.stage === 'boot') return 'загрузка';
    return this.live ? 'на связи' : 'офлайн';
  },

  get tail() {
    return this.transcript.slice(-6);
  },

  toggle() {
    return this.live ? this.hangup('user') : this.dial();
  },

  async dial() {
    this.busy = true;
    this.hint = 'Подключение…';
    try {
      this.mic = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
      });

      const started = await this.call('/voice/start');
      this.sessionId = started.session_id;
      this.entitlement = { ...this.entitlement, seconds_balance: started.seconds_balance };

      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      this.pc = pc;

      pc.addTrack(this.mic.getAudioTracks()[0], this.mic);
      pc.ontrack = (event) => this.attach(event.streams[0]);
      pc.onconnectionstatechange = () => {
        if (['failed', 'disconnected', 'closed'].includes(pc.connectionState) && this.live) this.hangup('dropped');
      };

      const dc = pc.createDataChannel('oai-events');
      this.dc = dc;
      dc.onmessage = (event) => this.receive(JSON.parse(event.data));

      await pc.setLocalDescription(await pc.createOffer());
      await new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') return resolve();
        pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && resolve();
        setTimeout(resolve, 1200);
      });

      const answer = await fetch(`${REALTIME}?model=${encodeURIComponent(started.model)}`, {
        method: 'POST',
        headers: { authorization: `Bearer ${started.client_secret}`, 'content-type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!answer.ok) throw new Error('sdp_failed');

      await pc.setRemoteDescription({ type: 'answer', sdp: await answer.text() });

      this.live = true;
      this.hint = '';
      this.tg.HapticFeedback?.impactOccurred('medium');
      this.beat = setInterval(() => this.call('/voice/ping', { session_id: this.sessionId }).catch(() => {}), 30000);
    } catch (err) {
      await this.teardown();
      this.hint = { no_balance: 'Минуты закончились', rate_limited: 'Слишком часто, подождите' }[String(err.message)] ?? 'Не удалось подключиться';
    } finally {
      this.busy = false;
    }
  },

  attach(stream) {
    const sink = document.getElementById('sink');
    sink.srcObject = stream;

    this.audioCtx = new AudioContext();
    const analyser = this.audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.35;
    this.audioCtx.createMediaStreamSource(stream).connect(analyser);

    this.timeBuf = new Uint8Array(analyser.fftSize);
    this.freqBuf = new Float32Array(analyser.frequencyBinCount);
    this.analyser = analyser;
  },

  receive(event) {
    if (event.type === 'response.function_call_arguments.done') {
      this.dispatch(event.name, event.call_id, event.arguments);
      return;
    }

    if (event.type === 'conversation.item.input_audio_transcription.completed') {
      this.push('user', event.transcript);
      return;
    }

    if (event.type === 'response.output_audio_transcript.done' || event.type === 'response.audio_transcript.done') {
      this.push('assistant', event.transcript);
      return;
    }

    if (event.type === 'error') {
      this.hint = 'Ошибка сессии';
    }
  },

  push(role, content) {
    const text = String(content ?? '').trim();
    if (!text) return;
    this.transcript.push({ id: ++this.seq, role, content: text });
    if (this.transcript.length > 400) this.transcript.shift();
  },

  send(payload) {
    if (this.dc?.readyState === 'open') this.dc.send(JSON.stringify(payload));
  },

  async hangup(reason) {
    if (!this.live && !this.pc) return;
    this.live = false;
    clearInterval(this.beat);

    const id = this.sessionId;
    const transcript = this.transcript.map(({ role, content }) => ({ role, content }));
    await this.teardown();

    this.hint = reason === 'dropped' ? 'Связь прервалась' : 'Нажмите, чтобы начать разговор';
    this.tg.HapticFeedback?.impactOccurred('rigid');

    if (!id) return;
    try {
      const done = await this.call('/voice/finish', { session_id: id, transcript });
      this.entitlement = { ...this.entitlement, seconds_balance: done.seconds_balance };
    } catch {
      this.hint = 'Сессия закрыта локально';
    }
  },

  async teardown() {
    this.dc?.close();
    this.pc?.close();
    this.mic?.getTracks().forEach((track) => track.stop());
    await this.audioCtx?.close().catch(() => {});
    this.dc = this.pc = this.mic = this.analyser = this.audioCtx = null;
    this.sessionId = '';
    this.mood = 'neutral';
    this.moodWeight = 0;
  },
});

const tools = () => ({
  async dispatch(name, callId, rawArgs) {
    let args = {};
    try { args = JSON.parse(rawArgs || '{}'); } catch { args = {}; }

    let output = { ok: true };

    if (name === 'set_mood') {
      this.mood = MOODS[args.mood] !== undefined ? args.mood : 'neutral';
      this.moodWeight = clamp(args.intensity ?? 0.7, 0, 1);
    } else if (name === 'play_gesture') {
      const dur = GESTURES[args.gesture];
      if (dur) this.gesture = { name: args.gesture, t: 0, dur };
    } else if (name === 'end_call') {
      this.send({ type: 'conversation.item.create', item: { type: 'function_call_output', call_id: callId, output: '{"ok":true}' } });
      queueMicrotask(() => this.hangup('agent'));
      return;
    } else if (name === 'remember') {
      output = await this.call('/voice/remember', args).catch((err) => ({ ok: false, error: err.message }));
    } else if (name === 'recall') {
      output = await this.call('/voice/recall', args).catch((err) => ({ ok: false, error: err.message }));
    } else {
      output = { ok: false, error: 'unknown_tool' };
    }

    this.send({ type: 'conversation.item.create', item: { type: 'function_call_output', call_id: callId, output: JSON.stringify(output) } });
    this.send({ type: 'response.create' });
  },
});

const store = () => ({
  plans: [
    { id: 'voice_900', stars: 99, label: '15 мин' },
    { id: 'voice_3600', stars: 349, label: '60 мин' },
    { id: 'voice_10800', stars: 899, label: '180 мин' },
  ],

  async buy(plan) {
    this.busy = true;
    try {
      const { link } = await this.call('/voice/invoice', { plan });
      this.tg.openInvoice(link, async (status) => {
        if (status !== 'paid') return;
        await this.authenticate();
        this.hint = 'Минуты начислены';
      });
    } catch {
      this.hint = 'Не удалось открыть счёт';
    } finally {
      this.busy = false;
    }
  },
});

Alpine.data('sythera', () => compose(lifecycle(), auth(), avatar(), voice(), tools(), store()));
Alpine.start();
</script>
