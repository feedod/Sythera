          hint: "Проверьте соединение и попробуйте снова",
          retry: "Повторить",
        },
      };

      const describe = (fault) => FAULTS[fault?.code] ?? FAULTS.internal;

      const RU = new Intl.NumberFormat("ru-RU");

      const clock = (seconds) => {
        const total = Math.max(0, Math.round(seconds));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const rest = total % 60;
        const pad = (value) => String(value).padStart(2, "0");
        return hours ? `${hours}:${pad(minutes)}:${pad(rest)}` : `${minutes}:${pad(rest)}`;
      };

      const balance = (seconds) => {
        const total = Math.max(0, Math.round(seconds));
        if (total < 60) return `${total} с`;
        if (total < 3600) return `${Math.floor(total / 60)} мин`;
        if (total < 36000) {
          const hours = Math.floor(total / 3600);
          const minutes = Math.round((total % 3600) / 60);
          return minutes ? `${hours} ч ${minutes} мин` : `${hours} ч`;
        }
        return `${RU.format(Math.floor(total / 3600))} ч`;
      };

      const ready = (component, method) => {
        const target = component?.[method];
        return typeof target === "function" && (target.isAvailable?.() ?? true) ? target : null;
      };

      const invoke = (component, method, ...args) => {
        const target = ready(component, method);
        if (!target) return false;
        target(...args);
        return true;
      };

      class Telegram {
        #bound = false;
        #main = null;
        #secondary = null;

        static outside() {
          try {
            tg.retrieveLaunchParams();
            return false;
          } catch {
            return true;
          }
        }

        static language() {
          return tg.retrieveLaunchParams().tgWebAppData?.user?.language_code || "ru";
        }

        static initData() {
          return tg.retrieveRawInitData();
        }

        async boot({ onExpand, onMain, onSecondary, onBack } = {}) {
          tg.init();

          invoke(tg.miniApp, "mountSync");
          invoke(tg.themeParams, "mountSync");
          invoke(tg.miniApp, "setHeaderColor", "#000000");
          invoke(tg.miniApp, "setBackgroundColor", "#000000");
          invoke(tg.miniApp, "setBottomBarColor", "#000000");
          invoke(tg.swipeBehavior, "mount");
          invoke(tg.swipeBehavior, "disableVertical");
          invoke(tg.closingBehavior, "mount");

          await tg.viewport.mount().catch(() => {});
          invoke(tg.viewport, "expand");
          await tg.viewport.requestFullscreen?.().catch(() => {});
          this.bindInsets();
          tg.postEvent("web_app_toggle_orientation_lock", { locked: true });

          if (invoke(tg.mainButton, "mount")) {
            this.#main = onMain;
            tg.mainButton.onClick(() => this.#main?.());
          }
          if (invoke(tg.secondaryButton, "mount")) {
            this.#secondary = onSecondary;
            tg.secondaryButton.onClick(() => this.#secondary?.());
          }
          if (invoke(tg.backButton, "mount")) tg.backButton.onClick(() => onBack?.());

          invoke(tg.miniApp, "ready");

          tg.viewport.isExpanded?.sub?.((expanded) => {
            if (!expanded) return;
            invoke(tg.viewport, "expand");
            onExpand?.();
          });
        }

        bindInsets() {
          const apply = () => {
            const safeArea = tg.viewport.safeAreaInsets?.() ?? { top: 0, bottom: 0, left: 0, right: 0 };
            const content = tg.viewport.contentSafeAreaInsets?.() ?? {
              top: 0,
              bottom: 0,
              left: 0,
              right: 0,
            };
            const root = document.documentElement.style;
            for (const side of ["top", "bottom", "left", "right"])
              root.setProperty(`--pad-${side}`, `${safeArea[side] + content[side]}px`);
          };
          apply();
          if (this.#bound) return;
          this.#bound = true;
          tg.viewport.safeAreaInsets?.sub?.(apply);
          tg.viewport.contentSafeAreaInsets?.sub?.(apply);
        }

        theme(key, fallback) {
          return tg.themeParams?.state?.()?.[key] ?? fallback;
        }

        setMain({ text, visible = true, enabled = true, loader = false, accent = true }) {
          if (!tg.mainButton?.isMounted?.()) return;
          invoke(tg.mainButton, "setParams", {
            text,
            isVisible: visible,
            isEnabled: enabled,
            isLoaderVisible: loader,
            hasShineEffect: accent,
            backgroundColor: this.theme("buttonColor", "#e5e5ea"),
            textColor: this.theme("buttonTextColor", "#000000"),
          });
        }

        setSecondary({ text, visible = false }) {
          if (!tg.secondaryButton?.isMounted?.()) return;
          invoke(tg.secondaryButton, "setParams", {
            text,
            isVisible: visible,
            isEnabled: true,
            position: "bottom",
            backgroundColor: this.theme("bottomBarBgColor", "#000000"),
            textColor: this.theme("buttonColor", "#e5e5ea"),
          });
        }

        setBack(visible) {
          if (!tg.backButton?.isMounted?.()) return;
          invoke(tg.backButton, visible ? "show" : "hide");
        }

        onActive(handler) {
          tg.miniApp.isActive?.sub?.(handler);
        }

        get active() {
          return tg.miniApp.isActive?.() ?? true;
        }

        get haptic() {
          const safely = (method, ...args) => {
            try {
              tg.hapticFeedback?.[method]?.(...args);
            } catch {}
          };
          return {
            impact: (style) => safely("impactOccurred", style),
            notify: (type) => safely("notificationOccurred", type),
            select: () => safely("selectionChanged"),
          };
        }

        get confirmClose() {
          return {
            on: () => invoke(tg.closingBehavior, "enableConfirmation"),
            off: () => invoke(tg.closingBehavior, "disableConfirmation"),
          };
        }

        async alert({ title, message, buttons }) {
          const open = ready(tg.popup, "open");
          if (!open) return null;
          return open({ title, message, buttons }).catch(() => null);
        }

        async sensor(onReading, { rate = 120 } = {}) {
          const sensor = tg.accelerometer;
          if (!ready(sensor, "mount")) return false;
          await sensor.mount().catch(() => {});
          if (!invoke(sensor, "start", { refreshRate: rate })) return false;
          sensor.x?.sub?.(() => onReading(sensor.x() ?? 0, sensor.y() ?? 0, sensor.z() ?? 0));
          return true;
        }

        stopSensor() {
          invoke(tg.accelerometer, "stop");
        }

        share(preparedMessageId) {
          tg.postEvent("web_app_send_prepared_message", { id: preparedMessageId });
        }

        shareLink(url, text) {
          invoke(tg, "shareURL", url, text);
        }

        pin() {
          return invoke(tg, "addToHomeScreen");
        }

        async pay(link) {
          const open = ready(tg.invoice, "open");
          if (!open) return "unavailable";
          return open(link, "url");
        }
      }

      const MODEL_URL = "/sythera.vrm";
      const TOAST_MS = 4000;
      const HIDDEN_HANGUP_MS = 15000;
      const POSTER_FADE_MS = 420;

      const PACKS = [
        { id: "voice_900", stars: 99, label: "15 мин" },
        { id: "voice_3600", stars: 349, label: "60 мин" },
        { id: "voice_10800", stars: 899, label: "180 мин" },
      ];

      class Shell {
        #bus;
        #api;
        #session;
        #stage;
        #call;
        #telegram;
        #telemetry;
        #poster;
        #model;
        #hiddenTimer = 0;
        #toastTimer = 0;
        #awayAt = 0;

        constructor({ bus, api, session, stage, call, telegram, telemetry, poster }) {
          this.#bus = bus;
          this.#api = api;
          this.#session = session;
          this.#stage = stage;
          this.#call = call;
          this.#telegram = telegram;
          this.#telemetry = telemetry;
          this.#poster = poster;
          this.#model = this.#build();
        }

        showPoster(url) {
          this.#poster.src = url;
          this.#poster.hidden = false;
          this.#poster.style.opacity = "1";
          this.#model.revealed = true;
        }

        hidePoster() {
          this.#poster.style.opacity = "0";
          setTimeout(() => {
            this.#poster.hidden = true;
            this.#poster.removeAttribute("src");
          }, POSTER_FADE_MS);
        }

        #build() {
          const shell = this;
          return Alpine.reactive({
            status: "boot",
            phase: "scene",
            progress: 0,
            seconds: 0,
            fault: null,
            toast: "",
            micDenied: false,
            buying: false,
            live: false,
            connecting: false,
            revealed: false,
            packs: PACKS,

            get loadingText() {
              return PHASES[this.phase];
            },

            get loadingPercent() {
              return this.progress > 0 && this.progress < 1 ? `${Math.round(this.progress * 100)}%` : "";
            },

            get state() {
              if (this.live) return "live";
              return this.connecting ? "connecting" : "idle";
            },

            get primary() {
              if (this.status === "error")
                return { text: describe(this.fault).retry, visible: true, accent: false };
              if (this.status !== "ready") return { text: "…", visible: false };
              if (this.connecting) return { text: "Соединяю", visible: true, enabled: false, loader: true };
              if (this.live) return { text: "Завершить", visible: true, accent: false };
              if (this.micDenied) return { text: "Я разрешила доступ", visible: true };
              if (this.seconds <= 0) return { text: "Пополнить время", visible: true };
              return { text: "Начать", visible: true };
            },

            get secondary() {
              return { text: "Пополнить", visible: this.status === "ready" && this.live === false && this.seconds > 0 && this.seconds < 120 };
            },

            get back() {
              return this.status === "ready" && this.seconds <= 0;
            },

            get remaining() {
              return this.live || this.connecting ? clock(this.seconds) : balance(this.seconds);
            },

            get faultInfo() {
              return describe(this.fault);
            },

            get detail() {
              if (!this.fault) return [];
              return [
                ["code", this.fault.code],
                ["status", String(this.fault.status)],
                ["stage", this.phase],
                ["time", this.fault.at],
                ["online", String(navigator.onLine)],
              ];
            },

            get screen() {
              if (this.status === "outside") return "outside";
              if (this.status === "error") return "error";
              if (this.status === "boot") return this.revealed ? "loading" : "boot";
              if (this.live || this.connecting) return null;
              if (this.micDenied) return "mic";
              if (this.seconds <= 0) return "broke";
              return "prompt";
            },

            init: () => shell.#init(),
            act: () => shell.#act(),
            topUp: () => shell.#model.seconds <= 0 || shell.#buy(PACKS[1].id),
            dismiss: () => shell.#dismiss(),
            destroy: () => shell.#destroy(),
            call: () => shell.#call.start(),
            reboot: () => shell.#reboot(),
            retryMic: () => shell.#retryMic(),
            buy: (plan) => shell.#buy(plan),
            onPointerDown: (event) => shell.#pointerDown(event),
            onPointerMove: (event) => shell.#stage.pointerAt(event.clientX, event.clientY),
            onPointerLeave: () => shell.#stage.face?.clearPointer(),
            onActivity: () => shell.#activity(),
          });
        }

        model() {
          return this.#model;
        }

        #listen() {
          const bus = this.#bus;
          bus.on("balance:changed", ({ seconds }) => (this.#model.seconds = seconds));
          bus.on("call:connecting", () => (this.#model.connecting = true));
          bus.on("call:failed", ({ code, fault, reason }) => {
            console.error("call:failed", reason ?? code, fault?.cause ?? "");
            this.#model.connecting = false;
            this.#model.live = false;
            if (code === "denied") this.#model.micDenied = true;
            if (code !== "no_balance") this.#flash(fault);
            this.#telemetry.track("call_failed", { code, reason });
          });
          bus.on("call:started", ({ sessionId }) => {
            this.#model.live = true;
            this.#model.connecting = false;
            this.#telegram.confirmClose.on();
            this.#telemetry.track("call_start", { sessionId });
          });
          bus.on("call:recovering", () => {
            this.#model.live = false;
            this.#model.connecting = true;
          });
          bus.on("call:ended", ({ elapsed }) => {
            this.#model.live = false;
            this.#model.connecting = false;
            this.#telegram.confirmClose.off();
            this.#telemetry.track("call_end", { elapsed });
          });
          bus.on("stage:ready", () => (this.#model.revealed = true));
          bus.on("stage:degraded", ({ tier }) => this.#telemetry.track("degraded", { tier }));
        }

        async #init() {
          if (this.#telegram.constructor.outside()) {
            this.#model.status = "outside";
            return;
          }

          this.#listen();
          await this.#telegram.boot({
            onExpand: () => this.#stage.resize(),
            onMain: () => this.#act(),
            onSecondary: () => this.#buy(PACKS[1].id),
            onBack: () => this.#dismiss(),
          });
          this.#telegram.onActive(() => this.#activity());

          const canvas = this.#stage;
          addEventListener("offline", () => this.#call.hangUp());
          addEventListener("unhandledrejection", (event) => this.#flash(event.reason));

          sweepCaches();
          await this.#boot();
          void canvas;
        }

        async #boot() {
          this.#model.status = "boot";
          this.#model.fault = null;

          try {
            this.#model.phase = "scene";
            await attempt(() =>
              this.#stage.mount(MODEL_URL, { onProgress: (value) => (this.#model.progress = value) }),
            );
            this.#model.progress = 0;

            this.#model.phase = "auth";
            await attempt(() => this.#api.refresh());
            this.#call.syncBalance(this.#session.balance);
            this.#bus.emit("session:ready", this.#session);

            this.#model.status = "ready";
          } catch (error) {
            this.#fail(error);
          }
        }

        #fail(error) {
          this.#model.revealed = false;
          const fault = faultOf(error);
          fault.at = new Date().toISOString().slice(11, 19);
          this.#telemetry.track("fault", {
            code: fault.code,
            status: fault.status,
            phase: this.#model.phase,
          });
          this.#stage.unmount();
          this.#model.fault = fault;
          this.#model.status = "error";
          this.#explain(fault);
        }

        #flash(error) {
          clearTimeout(this.#toastTimer);
          this.#model.toast = describe(faultOf(error)).title;
          this.#toastTimer = setTimeout(() => (this.#model.toast = ""), TOAST_MS);
        }

        async #explain(fault) {
          const copy = describe(fault);
          const answer = await this.#telegram.alert({
            title: copy.title,
            message: copy.hint,
            buttons: [
              { id: "retry", type: "default", text: copy.retry },
              { id: "close", type: "cancel" },
            ],
          });
          if (answer === "retry") await this.#reboot();
        }

        async #reboot() {
          const code = this.#model.fault?.code;
          this.#model.micDenied = false;
          if (code === "model" || code === "unsupported") await dropCache();
          await this.#boot();
        }

        #act() {
          const model = this.#model;
          if (model.status === "error") return this.#reboot();
          if (model.connecting) return;
          if (model.live) return this.#call.hangUp();
          if (model.micDenied) return this.#retryMic();
          if (model.seconds <= 0) return this.#buy(PACKS[1].id);
          return this.#call.start();
        }

        #dismiss() {
          if (this.#model.seconds <= 0) this.#model.seconds = 0;
        }

        async #retryMic() {
          this.#model.micDenied = false;
          await this.#call.start();
        }

        #pointerDown(event) {
          this.#bus.emit("pointer:down", { clientX: event.clientX, clientY: event.clientY });
          if (!this.#call.live) this.#call.start();
        }

        #activity() {
          const away = document.hidden || !this.#telegram.active;
          clearTimeout(this.#hiddenTimer);

          if (away) {
            this.#awayAt = Date.now();
            this.#stage.stop();
            this.#hiddenTimer = setTimeout(() => this.#call.hangUp(), HIDDEN_HANGUP_MS);
            return;
          }

          const asleep = this.#awayAt ? Date.now() - this.#awayAt : 0;
          this.#awayAt = 0;
          this.#stage.start();
          this.#call.resume(asleep);
        }

        async #buy(plan) {
          if (this.#model.buying) return;
          this.#model.buying = true;
          try {
            const { link } = await this.#api.post("voice/invoice", { plan });
            const status = await this.#telegram.pay(link);
            if (status !== "paid") return;
            await this.#api.refresh();
            this.#call.syncBalance(this.#session.balance);
            this.#bus.emit("purchase:done", { plan });
          } catch (error) {
            this.#flash(error);
          } finally {
            this.#model.buying = false;
          }
        }

        #destroy() {
          clearTimeout(this.#hiddenTimer);
          clearTimeout(this.#toastTimer);
          this.#call.dispose();
          this.#stage.dispose();
        }
      }

      const ERUDA = "https://esm.sh/eruda@3.4.3";
      const TAPS = 5;
      const TAP_WINDOW_MS = 1500;
      const TRACE = [
        "plugins:ready",
        "stage:ready",
        "stage:idle",
        "stage:degraded",
        "session:ready",
        "call:connecting",
        "call:started",
        "call:recovering",
        "call:ended",
        "call:failed",
        "balance:changed",
        "purchase:done",
        "vision:capture",
      ];

      const devtools = {
        name: "devtools",

        async setup({ bus, signal, use, has }) {
          const enabled =
            new URLSearchParams(location.search).has("debug") ||
            location.hash.includes("debug") ||
            (has("telegram") && use("telegram").startParam().includes("debug"));

          const log = [];
          const stamp = () => new Date().toISOString().slice(11, 23);

          for (const event of TRACE)
            bus.on(
              event,
              (detail) => {
                const line = `${stamp()} ${event}`;
                log.push(detail ? `${line} ${JSON.stringify(detail)}` : line);
                console.info(line, detail ?? "");
              },
              { signal },
            );

          const state = () => {
            const stage = has("stage") ? use("stage") : null;
            const call = has("call") ? use("call") : null;
            return {
              call: call?.state ?? "—",
              seconds: call?.meter.seconds ?? 0,
              stage: stage?.ready ?? false,
              pose: stage?.motion?.poseKey ?? "—",
              mood: stage?.face?.mood ?? "—",
              speaking: Boolean(stage?.face?.speaking),
              heapMb: performance.memory
                ? Math.round(performance.memory.usedJSHeapSize / 1048576)
                : null,
            };
          };

          let started = false;
          const open = async () => {
            if (started) return;
            started = true;
            const eruda = (await import(ERUDA)).default;
            eruda.init({ defaults: { displaySize: 45, theme: "Dark" } });
            eruda.show();
            console.info("sythera:", state());
          };

          globalThis.sythera = {
            state,
            log,
            open,
            get stage() {
              return has("stage") ? use("stage") : null;
            },
            get call() {
              return has("call") ? use("call") : null;
            },
            get session() {
              return has("session") ? use("session") : null;
            },
          };

          if (enabled) await open();

          let taps = 0;
          let first = 0;
          addEventListener(
            "pointerdown",
            (event) => {
              if (!event.target.closest(".hud")) return;
              const now = Date.now();
              if (now - first > TAP_WINDOW_MS) {
                first = now;
                taps = 0;
              }
              if (++taps >= TAPS) open();
            },
            { signal, capture: true },
          );

          return { open, log, state };
        },
      };

      const motion = {
        name: "motion",
        needs: ["stage", "session", "api", "haptic"],

        setup({ bus, use, signal }) {
          bus.on(
            "session:ready",
            ({ traits }) => traits.pose && use("stage").motion.setPose(traits.pose),
            { signal },
          );
          return {};
        },

        tools({ use }) {
          const stage = use("stage");
          const session = use("session");
          const api = use("api");
          const haptic = use("haptic");

          return [
            {
              name: "play_gesture",
              description:

            "pointer:down",
            ({ clientX, clientY }) => {
              const region = stage.pick(clientX, clientY, BONES);
              if (!region) return;

              const now = performance.now();
              if (now - state.last < TOUCH_COOLDOWN_MS) return;
              state.last = now;

              if (now - state.since > BURST_WINDOW_MS) {
                state.since = now;
                state.burst = 0;

              state.burst += 1;

              const spec = REGIONS[region];
              const level = Math.min(state.burst, BURST_LIMIT);

              haptic.impact(level >= BURST_LIMIT ? "medium" : spec.haptic);
              stage.face.nudge(...spec.nudge);

      const VISION_WIDTH = 768;

      const readDataUrl = (blob) =>

          reader.onload = () => resolve(reader.result);

      const firstFrame = (video) =>

          if (video.readyState >= 2) return requestAnimationFrame(() => resolve());

        });

      const grab = async (facing) => {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1280 } },
          audio: false,
        });

        const video = document.createElement("video");
        video.playsInline = true;
        video.muted = true;
        video.srcObject = stream;

        try {
          await video.play();
          await firstFrame(video);
          if (!video.videoWidth) throw new Error("no_frame");

          const scale = VISION_WIDTH / video.videoWidth;
          const canvas = new OffscreenCanvas(VISION_WIDTH, Math.round(video.videoHeight * scale));
          canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

          return await readDataUrl(await canvas.convertToBlob({ type: "image/jpeg", quality: VISION_QUALITY }));
        } finally {
          video.srcObject = null;
          for (const track of stream.getTracks()) track.stop();

      const FADE_S = 1.4;

      const noiseBuffer = (context, seconds = 4) => {
        const length = context.sampleRate * seconds;
        const buffer = context.createBuffer(1, length, context.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0;
        let b1 = 0;
        let b2 = 0;
        for (let i = 0; i < length; i += 1) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99765 * b0 + white * 0.099;
          b1 = 0.963 * b1 + white * 0.2965;
          b2 = 0.57 * b2 + white * 1.0526;
          data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.16;
        }
        return buffer;
      };

      const RECIPES = {
        rain: { type: "highpass", frequency: 900, q: 0.5, gain: 0.22, sweep: null },
        wind: { type: "bandpass", frequency: 420, q: 0.7, gain: 0.26, sweep: { depth: 220, rate: 0.07 } },
        fire: { type: "lowpass", frequency: 620, q: 1.6, gain: 0.2, sweep: { depth: 260, rate: 0.9 } },
        ocean: { type: "lowpass", frequency: 480, q: 0.6, gain: 0.28, sweep: { depth: 180, rate: 0.11 } },
        night: { type: "bandpass", frequency: 1800, q: 3.2, gain: 0.12, sweep: { depth: 400, rate: 0.5 } },
      };

      const SCENES = Object.keys(RECIPES);

      class Ambience {
        #context = null;
        #buffer = null;
        #nodes = null;
        #scene = null;

        prime() {
          this.#context ??= new AudioContext();
          if (this.#context.state === "suspended") this.#context.resume();
          this.#buffer ??= noiseBuffer(this.#context);
          return this.#context;
        }

        get scene() {
          return this.#scene;
        }

        play(scene, level = 1) {
          if (!SCENES.includes(scene)) return false;
          const context = this.prime();
          this.stop();

          const recipe = RECIPES[scene];
          const source = context.createBufferSource();
          source.buffer = this.#buffer;
          source.loop = true;

          const filter = context.createBiquadFilter();
          filter.type = recipe.type;
          filter.frequency.value = recipe.frequency;
          filter.Q.value = recipe.q;

          const gain = context.createGain();
          gain.gain.setValueAtTime(0.0001, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            Math.max(0.0002, recipe.gain * level),
            context.currentTime + FADE_S,
          );

          source.connect(filter).connect(gain).connect(context.destination);
          source.start();

          let lfo = null;
          if (recipe.sweep) {
            lfo = context.createOscillator();
            const depth = context.createGain();
            lfo.frequency.value = recipe.sweep.rate;
            depth.gain.value = recipe.sweep.depth;
            lfo.connect(depth).connect(filter.frequency);
            lfo.start();
          }

          this.#nodes = { source, gain, lfo };
          this.#scene = scene;
          return true;
        }

        stop() {
          if (!this.#nodes) return;
          const { source, gain, lfo } = this.#nodes;
          const now = this.#context.currentTime;
          gain.gain.cancelScheduledValues(now);
          gain.gain.setValueAtTime(Math.max(0.0001, gain.gain.value), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + FADE_S);
          source.stop(now + FADE_S + 0.1);
          lfo?.stop(now + FADE_S + 0.1);
          this.#nodes = null;
          this.#scene = null;
        }

        close() {
          this.stop();
          this.#context?.close();
          this.#context = null;
          this.#buffer = null;
        }
      }

                const result = await api.post("voice/snapshot", { image, caption }).catch(() => null);
                if (!result?.prepared_message_id) return "fail";

                telegram.share(result.prepared_message_id);
                haptic.notify("success");
                return "ok";
              },
            },
          ];
        },
      };

      const STIR_MS = 26000;
      const SETTLE_MS = 75000;
      const SLEEP_MS = 165000;
      const STIRS = ["stretch", "shy", "think", "nod"];

      const idle = {
        name: "idle",
        needs: ["stage", "call"],

        setup({ bus, use, signal }) {
          const state = { since: Date.now(), stage: "awake", timer: 0 };

          const face = () => use("stage").face;
          const motion = () => use("stage").motion;

          const wake = () => {
            if (state.stage === "awake") return;
            face()?.setSleeping(false);
            face()?.setMood("neutral");
            motion()?.setPose("idle");
            state.stage = "awake";
          };

          const reset = () => {
            state.since = Date.now();
            wake();
          };

          const step = () => {
            const stage = use("stage");
            if (!stage.ready || use("call").live) return;

            const quiet = Date.now() - state.since;

            if (quiet > SLEEP_MS && state.stage !== "asleep") {
              state.stage = "asleep";
              stage.motion.setPose("sit");
              stage.face.setMood("relaxed", 0.5);
              stage.face.setSleeping(true);
              return;
            }
            if (quiet > SETTLE_MS && state.stage === "awake") {
              state.stage = "settled";
              stage.motion.setPose("sit");
              stage.face.setMood("relaxed", 0.35);
              return;
            }
            if (quiet > STIR_MS && state.stage === "awake") {
              stage.motion.play(STIRS[Math.floor(Math.random() * STIRS.length)]);
              state.since = Date.now() - STIR_MS / 2;
            }
          };

          state.timer = setInterval(step, 4000);
          signal.addEventListener("abort", () => clearInterval(state.timer), { once: true });

          bus.on("pointer:down", reset, { signal });
          bus.on("call:connecting", reset, { signal });
          bus.on("call:started", reset, { signal });
          bus.on("call:ended", () => (state.since = Date.now()), { signal });
          bus.on("stage:ready", () => (state.since = Date.now()), { signal });

          return { ...state, wake, reset };
        },
      };

      const GAMES = {
        guess_number: {
          mood: "happy",
          gesture: "peace",
          rules:
            "Загадай число от 1 до 100 и держи его в уме. Собеседник называет числа, ты отвечаешь «больше» или «меньше», считаешь попытки и радуешься, когда он угадал.",
        },
        twenty_questions: {
          mood: "happy",
          gesture: "think",
          rules:
            "Загадай предмет и держи его в уме. Собеседник задаёт вопросы, на которые можно ответить только да или нет. Считай вопросы вслух каждые пять, максимум двадцать.",
        },
        riddles: {
          mood: "happy",
          gesture: "think",
          rules:
            "Загадывай короткие загадки по одной. Если собеседник не угадал с двух попыток, дай подсказку, с четырёх — ответ и следующую загадку.",
        },
        story: {
          mood: "relaxed",
          gesture: "shy",
          rules:
            "Сочиняйте историю по очереди: ты одно-два предложения, потом он. Подхватывай его повороты, не перехватывай сюжет целиком.",
        },
        rhymes: {
          mood: "happy",
          gesture: "clap",
          rules:
            "Играйте в рифмы: ты называешь слово, он подбирает рифму, потом наоборот. Если рифма неточная — подскажи мягко.",
        },
        tongue_twister: {
          mood: "happy",
          gesture: "laugh",
          rules:
            "Предложи скороговорку, послушай попытку и оцени по-доброму. Каждый раунд усложняй.",
        },
        would_you_rather: {
          mood: "happy",
          gesture: "point",
          rules:
            "Задавай выбор из двух вариантов, оба забавные. Выслушай ответ, обязательно скажи, что выбрала бы сама и почему.",
        },
      };

      const GAME_KEYS = Object.keys(GAMES);

      const games = {
        name: "games",
        needs: ["stage"],

        setup({ bus, signal }) {
          const state = { current: null };
          bus.on("call:ended", () => (state.current = null), { signal });
          return state;
        },

        tools({ use, state }) {
          const stage = use("stage");

          return [
            {
              name: "start_game",
              description:
                "Начать игру, когда собеседнику скучно или он сам просит. guess_number — угадай число, twenty_questions — двадцать вопросов, riddles — загадки, story — история по очереди, rhymes — рифмы, tongue_twister — скороговорки, would_you_rather — что бы ты выбрал. Инструмент вернёт правила: веди игру сама, состояние держи в голове.",
              parameters: z.object({ game: z.enum(GAME_KEYS) }),
              execute: ({ game }) => {
                const spec = GAMES[game];
                state.current = game;
                stage.face?.setMood(spec.mood, 0.8);
                stage.motion?.play(spec.gesture);
                return spec.rules;
              },
            },
            {
              name: "end_game",
              description: "Закончить игру и вернуться к обычному разговору.",
              parameters: z.object({}),
              execute: () => {
                state.current = null;
                stage.face?.setMood("neutral");
                return "ok";
              },
            },
          ];
        },
      };

      const THRESHOLD = 22;
      const COOLDOWN_MS = 2600;
      const SMOOTHING = 0.7;

      const shake = {
        name: "shake",
        needs: ["stage", "call", "haptic", "telegram"],

        async setup({ bus, use, signal }) {
          const state = { last: 0, level: 0, active: false };

          const onReading = (x, y, z) => {
            const force = Math.hypot(x, y, z);
            state.level = state.level * SMOOTHING + Math.abs(force - 9.81) * (1 - SMOOTHING);

            const now = Date.now();
            if (state.level < THRESHOLD || now - state.last < COOLDOWN_MS) return;
            state.last = now;
            state.level = 0;

            const stage = use("stage");
            if (!stage.ready) return;

            use("haptic").impact("heavy");
            stage.face.setMood("surprised", 0.9);
            stage.face.nudge(0.3, -0.2);
            stage.motion.play("shake");
            bus.emit("device:shake", {});
            use("call").notify("[shake]");
          };

          state.active = await use("telegram").sensor(onReading);
          signal.addEventListener("abort", () => use("telegram").stopSensor(), { once: true });

          return state;
        },
      };

      const mainbutton = {
        name: "mainbutton",
        needs: ["shell", "telegram"],

        setup({ use }) {
          const shell = use("shell");
          const telegram = use("telegram");
          const model = shell.model();

          const sync = () => {
            telegram.setMain(model.primary);
            telegram.setSecondary(model.secondary);
            telegram.setBack(model.back);
          };

          queueMicrotask(() => Alpine.effect(sync));
          return { sync };
        },
      };

      const API = "https://wwpuvfzegvpgcapeoyha.supabase.co/functions/v1/api";

      const canvas = document.querySelector("canvas");
      const audio = document.querySelector("audio");
      const posterElement = document.querySelector("#poster");

      const bus = new Bus();
      const host = new PluginHost({ bus });
      const telegram = new Telegram();
      const outside = Telegram.outside();

      const session = new Session(outside ? "outside" : Telegram.initData());
      if (!outside) session.lang = Telegram.language();

      const api = new Api({ prefixUrl: API, session });
      const telemetry = new Telemetry(api);
      const stage = new Stage(canvas, { bus });
      const call = new Call({ api, bus, host, stage, audio });
      const shell = new Shell({ bus, api, session, stage, call, telegram, telemetry, poster: posterElement });

      host.provide("bus", bus);
      host.provide("api", api);
      host.provide("session", session);
      host.provide("stage", stage);
      host.provide("call", call);
      host.provide("shell", shell);
      host.provide("telemetry", telemetry);
      host.provide("haptic", telegram.haptic);
      host.provide("telegram", telegram);

      host.register(
        devtools,
        motion,
        mood,
        appearance,
        backdrop,
        touch,
        memory,
        farewell,
        haptics,
        poster,
        vision,
        ambience,
        reminders,
        snapshot,
        idle,
        games,
        shake,
        mainbutton,
      );
      await host.start().catch((error) => {
        console.error("host", error);
      });

      Alpine.data("app", () => shell.model());
      Alpine.start();
    </script>
  </head>

  <body x-data="app" @pagehide.window="destroy()" @visibilitychange.document="onActivity()">
    <canvas
      @pointermove="onPointerMove($event)"
      @pointerdown="onPointerDown($event)"
      @pointerleave="onPointerLeave()"
      @pointercancel="onPointerLeave()"
    ></canvas>

    <img id="poster" alt="" aria-hidden="true" hidden />
    <div class="vignette" aria-hidden="true"></div>

    <div class="hud" x-show="status === 'ready'" :data-state="state" x-transition x-cloak>
      <span class="dot"></span>
      <span x-text="remaining"></span>
    </div>

    <div class="pill" role="status" x-show="screen === 'loading'" x-transition.duration.220ms x-cloak>
      <span class="spinner" aria-hidden="true"></span>
      <span x-text="loadingText"></span>
      <span class="progress" x-text="loadingPercent" x-show="loadingPercent"></span>
    </div>

    <div class="toast" role="status" x-show="toast" x-text="toast" x-transition.duration.220ms x-cloak></div>

    <div class="sheet" data-solid x-show="screen === 'boot'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="spinner" role="progressbar" aria-label="Загрузка"></span>
        <span class="note" x-text="loadingText"></span>
        <span class="progress" x-text="loadingPercent" x-show="loadingPercent"></span>
      </div>
    </div>

    <div
      class="sheet"
      data-dock
      x-show="screen === 'prompt'"
      x-transition.opacity.duration.260ms
      x-cloak
      @pointerdown="act()"
    >
      <div class="body">
        <span class="title">Она вас слышит</span>
        <span class="note">Говорите вслух — ответит голосом. Коснитесь её, чтобы потрогать.</span>
      </div>
    </div>

    <div class="sheet" data-dock x-show="screen === 'mic'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title">Нет доступа к микрофону</span>
        <span class="note">
          Настройки Telegram → Конфиденциальность → Микрофон. Разрешите и возвращайтесь.
        </span>
      </div>
    </div>

    <div class="sheet" data-dock x-show="screen === 'broke'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title">Время вышло</span>
        <span class="note">Выберите пакет — минуты зачислятся сразу</span>
      </div>
      <div class="foot">
        <div class="row">
          <template x-for="pack in packs" :key="pack.id">
            <button type="button" class="pack" :disabled="buying" @click="buy(pack.id)">
              <span x-text="pack.stars + ' ★'"></span>
              <small x-text="pack.label"></small>
            </button>
          </template>
        </div>
      </div>
    </div>

    <div class="sheet" data-solid role="alert" x-show="screen === 'outside'" x-cloak>
      <div class="body">
        <span class="title">Sythera живёт внутри Telegram</span>
      </div>
    </div>

    <div class="sheet" data-solid role="alert" x-show="screen === 'error'" x-transition.opacity.duration.260ms x-cloak>
      <div class="body">
        <span class="title" x-text="faultInfo.title"></span>
        <span class="note" x-text="faultInfo.hint"></span>
        <details class="disclosure">
          <summary>Подробности</summary>
          <dl class="detail">
            <template x-for="[key, value] in detail" :key="key">
              <div style="display: contents">
                <dt x-text="key"></dt>
                <dd x-text="value"></dd>
              </div>
            </template>
          </dl>
        </details>
      </div>

    </div>

    <audio autoplay playsinline></audio>
  </body>
</html>
