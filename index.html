    <style>
      @layer reset, tokens, stage, chrome, sheets;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        html,
        body {
          block-size: 100%;
          margin: 0;
          overflow: clip;
          overscroll-behavior: none;
          background: #000;
          color-scheme: dark;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
          font-size: clamp(0.9375rem, 4vw, 1.0625rem);
          font-synthesis: none;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
        }

        button {
          font: inherit;
          cursor: pointer;
        }

        [x-cloak] {
          display: none !important;
        }
      }

      @layer tokens {
        :root {
          --ease: linear(0, 0.22 7%, 0.63 17%, 0.87 26%, 0.98 35%, 1.02 45%, 1);
          --fast: 0.18s;
          --slow: 0.32s;
          --poster: 0.42s;

          --r-pill: 999px;
          --r-lg: 1.375rem;

          --gap-1: 0.375rem;
          --gap-2: 0.625rem;
          --gap-3: 1rem;
          --gap-4: 1.5rem;

          --edge: 1.25rem;
          --top: calc(var(--pad-top, 0px) + 0.75rem);
          --left: calc(var(--pad-left, 0px) + var(--edge));
          --right: calc(var(--pad-right, 0px) + var(--edge));

          --ink: oklch(0.96 0.003 285);
          --ink-dim: oklch(0.68 0.012 285);
          --ink-faint: oklch(0.48 0.014 285);
          --surface: oklch(0.19 0.008 285);
          --surface-hi: oklch(0.25 0.01 285);
          --hair: oklch(1 0 0 / 8%);

          --live: oklch(0.84 0.15 155);
          --wait: oklch(0.87 0.12 82);

          color: var(--ink);
        }
      }

      @layer stage {
        canvas,
        #poster {
          position: fixed;
          inset: 0;
          display: block;
          inline-size: 100%;
          block-size: 100%;
        }

        canvas {
          touch-action: none;
        }

        #poster {
          z-index: 1;
          object-fit: cover;
          pointer-events: none;
          transition: opacity var(--poster) var(--ease);
        }

        .vignette {
          position: fixed;
          inset: 0;
          z-index: 2;
          pointer-events: none;
          background: radial-gradient(ellipse 80% 64% at 50% 43%, #0000 42%, #000000c4 100%);
        }

        audio {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          clip-path: inset(50%);
        }
      }

      @layer chrome {
        .hud {
          position: fixed;
          z-index: 4;
          inset-block-start: var(--top);
          inset-inline-end: var(--right);
          display: flex;
          align-items: center;
          gap: var(--gap-1);
          padding-block: 0.4375rem;
          padding-inline: 0.625rem 0.8125rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-pill);
          background: oklch(0.16 0.008 285 / 78%);
          backdrop-filter: blur(20px) saturate(1.6);
          font-size: 0.8125rem;
          font-weight: 590;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.005em;
          white-space: nowrap;

          & .dot {
            flex: none;
            inline-size: 0.4375rem;
            block-size: 0.4375rem;
            border-radius: 50%;
            background: var(--ink-faint);
            transition: background var(--slow) var(--ease), box-shadow var(--slow) var(--ease);
          }

          &[data-state="connecting"] .dot {
            background: var(--wait);
            box-shadow: 0 0 0.5rem color-mix(in oklch, var(--wait), transparent 62%);
            animation: pulse 1.1s ease-in-out infinite;
          }

          &[data-state="live"] .dot {
            background: var(--live);
            box-shadow: 0 0 0.5rem color-mix(in oklch, var(--live), transparent 62%);
            animation: pulse 2.4s ease-in-out infinite;
          }
        }

        @keyframes pulse {
          50% {
            opacity: 0.22;
          }
        }

        .pill {
          position: fixed;
          z-index: 4;
          inset-block-end: calc(var(--pad-bottom, 0px) + 2rem);
          inset-inline: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: var(--gap-2);
          inline-size: fit-content;
          margin-inline: auto;
          padding: 0.5625rem 1rem 0.5625rem 0.75rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-pill);
          background: oklch(0.16 0.008 285 / 82%);
          backdrop-filter: blur(20px) saturate(1.6);
          font-size: 0.8125rem;
          font-weight: 560;
          letter-spacing: -0.005em;
          white-space: nowrap;

          & .spinner {
            inline-size: 0.9375rem;
            block-size: 0.9375rem;
          }
        }

        .toast {
          position: fixed;
          z-index: 5;
          inset-block-start: calc(var(--top) + 2.75rem);
          inset-inline: var(--left) var(--right);
          margin-inline: auto;
          max-inline-size: 20rem;
          padding: 0.6875rem 0.9375rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-lg);
          background: oklch(0.17 0.008 285 / 93%);
          backdrop-filter: blur(20px) saturate(1.6);
          box-shadow: 0 0.75rem 2.5rem #000a;
          font-size: 0.8125rem;
          line-height: 1.4;
          text-align: center;
          text-wrap: pretty;
          overflow-wrap: anywhere;
        }
      }

      @layer sheets {
        .sheet {
          position: fixed;
          z-index: 3;
          inset: 0;
          display: grid;
          grid-template-rows: 1fr auto auto;
          justify-items: center;
          padding-inline: var(--right) var(--left);
          padding-block: calc(var(--pad-top, 0px) + 4rem) calc(var(--pad-bottom, 0px) + 2rem);
          text-align: center;

          &[data-dock] {
            background: linear-gradient(
              to top,
              oklch(0.05 0 0 / 97%) 0%,
              oklch(0.05 0 0 / 92%) 22%,
              oklch(0.05 0 0 / 55%) 46%,
              #0000 70%
            );
          }

          &[data-solid] {
            grid-template-rows: 1fr auto auto 1fr;
            background: #000;
          }

        }

        .progress {
          font-size: 0.8125rem;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          color: var(--ink-faint);
        }

        .body {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-2);
          grid-row: 2;
          inline-size: 100%;
          max-inline-size: 22rem;
          max-block-size: 100%;
          overflow-y: auto;
          overscroll-behavior: contain;
          scrollbar-width: none;
        }

        .foot {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-3);
          grid-row: 3;
          inline-size: 100%;
          max-inline-size: 22rem;
          margin-block-start: var(--gap-4);
        }

        .title {
          font-size: clamp(1.25rem, 5.6vw, 1.5rem);
          font-weight: 680;
          line-height: 1.18;
          letter-spacing: -0.028em;
          text-wrap: balance;
          overflow-wrap: anywhere;
          text-shadow: 0 1px 1.25rem oklch(0.05 0 0 / 85%);
        }

        .note {
          max-inline-size: 19rem;
          font-size: 0.9375rem;
          line-height: 1.45;
          color: var(--ink-dim);
          text-wrap: pretty;
          overflow-wrap: anywhere;
          text-shadow: 0 1px 1rem oklch(0.05 0 0 / 85%);
        }

        .row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: var(--gap-2);
          inline-size: 100%;
        }

        .pack,
        .action {
          border: 1px solid var(--hair);
          border-radius: var(--r-lg);
          background: var(--surface);
          color: var(--ink);
          font-weight: 620;
          letter-spacing: -0.01em;
          transition: scale var(--fast) var(--ease), background var(--fast) var(--ease),
            opacity var(--fast) var(--ease), box-shadow var(--fast) var(--ease);

          &:disabled {
            opacity: 0.4;
          }

          &:active:not(:disabled) {
            scale: 0.955;
            background: var(--surface-hi);
            box-shadow: inset 0 0 0 1px oklch(1 0 0 / 10%);
          }
        }

        .pack {
          flex: 1 1 5.5rem;
          max-inline-size: 8rem;
          min-block-size: 3.75rem;
          padding: 0.8125rem 0.5rem;
          font-size: 1rem;
          font-variant-numeric: tabular-nums;

          & small {
            display: block;
            margin-block-start: 0.1875rem;
            color: var(--ink-dim);
            font-size: 0.75rem;
            font-weight: 400;
            white-space: nowrap;
          }
        }

        .action {
          flex: 0 0 auto;
          min-block-size: 3rem;
          padding: 0.8125rem 1.75rem;
          white-space: nowrap;
        }

        .disclosure {
          inline-size: 100%;
          margin-block-start: var(--gap-1);

          & summary {
            display: inline-flex;
            align-items: center;
            gap: var(--gap-1);
            min-block-size: 2rem;
            padding: 0.375rem 0.75rem;
            border-radius: var(--r-pill);
            background: oklch(1 0 0 / 5%);
            color: var(--ink-dim);
            font-size: 0.75rem;
            font-weight: 500;
            list-style: none;
            cursor: pointer;

            &::-webkit-details-marker {
              display: none;
            }

            &::after {
              content: "";
              inline-size: 0.3125rem;
              block-size: 0.3125rem;
              border-inline-end: 1.5px solid currentColor;
              border-block-end: 1.5px solid currentColor;
              rotate: 45deg;
              translate: 0 -1px;
              transition: rotate var(--slow) var(--ease);
            }
          }

          &[open] summary::after {
            rotate: 225deg;
          }

          &[open] .detail {
            @starting-style {
              opacity: 0;
              translate: 0 -0.375rem;
            }
            transition: opacity var(--slow) var(--ease), translate var(--slow) var(--ease);
          }
        }

        .detail {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          justify-content: center;
          gap: 0.1875rem 0.875rem;
          inline-size: fit-content;
          max-inline-size: 100%;
          margin: var(--gap-2) auto 0;
          padding-inline-start: 0.875rem;
          border-inline-start: 1px solid var(--surface-hi);
          text-align: start;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.6875rem;
          line-height: 1.6;
          user-select: text;
          overflow-wrap: anywhere;

          & dt {
            color: var(--ink-faint);
          }

          & dd {
            margin: 0;
            color: var(--ink-dim);
          }
        }

        .spinner {
          inline-size: 1.625rem;
          block-size: 1.625rem;
          border-radius: 50%;
          background: conic-gradient(from 0deg, #0000, var(--ink));
          mask: radial-gradient(farthest-side, #0000 calc(100% - 2px), #000 0);
          animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
          to {
            rotate: 360deg;
          }
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .hud,
        .pill {
          position: fixed;
          z-index: 4;
          inset-block-end: calc(var(--pad-bottom, 0px) + 2rem);
          inset-inline: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: var(--gap-2);
          inline-size: fit-content;
          margin-inline: auto;
          padding: 0.5625rem 1rem 0.5625rem 0.75rem;
          border: 1px solid var(--hair);
          border-radius: var(--r-pill);
          background: oklch(0.16 0.008 285 / 82%);
          backdrop-filter: blur(20px) saturate(1.6);
          font-size: 0.8125rem;
          font-weight: 560;
          letter-spacing: -0.005em;
          white-space: nowrap;

          & .spinner {
            inline-size: 0.9375rem;
            block-size: 0.9375rem;
          }
        }

        .toast {
          backdrop-filter: none;
          background: oklch(0.16 0.008 285);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <script type="module">
      import * as THREE from "three";
      import * as tg from "@telegram-apps/sdk";
      import Alpine from "alpinejs";
      import ky from "ky";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { HTTPError, TimeoutError } from "ky";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { Lipsync as Engine } from "wawa-lipsync";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { RealtimeAgent, RealtimeSession, OpenAIRealtimeWebRTC } from "@openai/agents-realtime";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
      import { z } from "zod";

      class Bus {
        #target = new EventTarget();

        on(type, handler, { signal, once = false } = {}) {
          const listener = (event) => handler(event.detail);
          this.#target.addEventListener(type, listener, { signal, once });
          return () => this.#target.removeEventListener(type, listener);
        }

        once(type, { signal } = {}) {
          return new Promise((resolve, reject) => {
            const off = this.on(type, resolve, { once: true });
            signal?.addEventListener(
              "abort",
              () => {
                off();
                reject(signal.reason);
              },
              { once: true },
            );
          });
        }

        emit(type, detail) {
          this.#target.dispatchEvent(new CustomEvent(type, { detail }));
        }
      }

      const sleep = (ms, signal) =>
        new Promise((resolve, reject) => {
          if (signal?.aborted) return reject(signal.reason);
          const timer = setTimeout(() => {
            signal?.removeEventListener("abort", onAbort);
            resolve();
          }, ms);
          const onAbort = () => {
            clearTimeout(timer);
            reject(signal.reason);
          };
          signal?.addEventListener("abort", onAbort, { once: true });
        });

      const defer = (task, { delay = 300, signal } = {}) => {
        const timer = setTimeout(() => {
          if (!signal?.aborted) task();
        }, delay);
        signal?.addEventListener("abort", () => clearTimeout(timer), { once: true });
      };

      class Fault extends Error {
        #code;
        #status;
        #fatal;

        constructor(code, { status = 0, fatal = false, cause } = {}) {
          super(code, { cause });
          this.name = "Fault";
          this.#code = code;
          this.#status = status;
          this.#fatal = fatal;
        }

        get code() {
          return this.#code;
        }

        get status() {
          return this.#status;
        }

        get fatal() {
          return this.#fatal;
        }
      }

      const DENIED = /notallowed|permission|denied|security/i;

      const faultOf = (error) => {
        if (error instanceof Fault) return error;
        if (error instanceof HTTPError)
          return new Fault(error.code ?? "internal", { status: error.response.status, cause: error });
        if (error instanceof TimeoutError || error?.name === "TimeoutError")
          return new Fault("timeout", { cause: error });
        if (error?.name === "AbortError") return new Fault("aborted", { fatal: true, cause: error });
        if (DENIED.test(`${error?.name ?? ""} ${error?.message ?? ""}`))
          return new Fault("denied", { cause: error });
        return new Fault(navigator.onLine ? "unreachable" : "offline", { cause: error });
      };

      const UNRECOVERABLE = new Set([401, 403, 404, 422]);

      const attempt = async (task, { retries = 4, base = 1200, cap = 8000, signal } = {}) => {
        for (let round = 0; ; round += 1) {
          signal?.throwIfAborted();
          try {
            return await task(round);
          } catch (error) {
            const fault = faultOf(error);
            if (fault.fatal || round >= retries || UNRECOVERABLE.has(fault.status)) throw error;
            const delay = Math.min(cap, base * 2 ** round) * (0.75 + Math.random() * 0.5);
            await sleep(delay, signal);
          }
        }
      };

      class PluginHost {
        #bus;
        #services = new Map();
        #plugins = new Map();
        #started = [];
        #abort = new AbortController();

        constructor({ bus = new Bus() } = {}) {
          this.#bus = bus;
        }

        get bus() {
          return this.#bus;
        }

        get signal() {
          return this.#abort.signal;
        }

        provide(name, service) {
          if (this.#services.has(name)) throw new Error(`service exists: ${name}`);
          this.#services.set(name, service);
          return service;
        }

        use(name) {
          const service = this.#services.get(name);
          if (!service) throw new Error(`missing service: ${name}`);
          return service;
        }

        has(name) {
          return this.#services.has(name);
        }

        register(...plugins) {
          for (const plugin of plugins) {
            if (this.#plugins.has(plugin.name)) throw new Error(`plugin exists: ${plugin.name}`);
            this.#plugins.set(plugin.name, plugin);
          }
          return this;
        }

        #order() {
          const active = new Set();
          const done = new Set();
          const sorted = [];

          const visit = (name, trail) => {
            if (done.has(name)) return;
            if (active.has(name)) throw new Error(`plugin cycle: ${[...trail, name].join(" -> ")}`);
            const plugin = this.#plugins.get(name);
            if (!plugin) return;
            active.add(name);
            for (const dep of plugin.needs ?? []) {
              if (this.#plugins.has(dep)) visit(dep, [...trail, name]);
              else if (!this.#services.has(dep)) throw new Error(`${name} needs ${dep}`);
            }
            active.delete(name);
            done.add(name);
            sorted.push(plugin);
          };

          for (const name of this.#plugins.keys()) visit(name, []);
          return sorted;
        }

        #context(plugin) {
          return {
            bus: this.#bus,
            signal: this.#abort.signal,
            use: (name) => this.use(name),
            has: (name) => this.has(name),
            config: plugin.config ?? {},
          };
        }

        async start() {
          const broken = [];

          for (const plugin of this.#order()) {
            const context = this.#context(plugin);
            try {
              const handle = (await plugin.setup?.(context)) ?? {};
              context.state = handle;
              if (plugin.provides) this.provide(plugin.provides, handle);
              this.#started.push({ plugin, handle, context });
            } catch (error) {
              if (plugin.required) throw error;
              broken.push(plugin.name);
              this.#bus.emit("plugin:failed", { name: plugin.name, error });
              console.error(`plugin ${plugin.name}`, error);
            }
          }

          this.#bus.emit("plugins:ready", {
            started: this.#started.map(({ plugin }) => plugin.name),
            broken,
          });
        }

        tool(name) {
          return this.tools().find((entry) => entry.name === name) ?? null;
        }

        tools() {
          return this.#started.flatMap(({ plugin, context }) => plugin.tools?.(context) ?? []);
        }

        async stop() {
          this.#abort.abort();
          for (const { plugin, handle } of this.#started.toReversed())
            await Promise.resolve(plugin.teardown?.(handle)).catch(() => {});
          this.#started.length = 0;
        }
      }

      const TOKEN_SKEW_S = 120;

      class Session {
        token = "";
        expiresAt = 0;
        traits = {};
        lang = "ru";
        balance = 0;
        #initData = "";
        #pendingTraits = 0;

        constructor(initData) {
          if (!initData) throw new Fault("unauthorized", { status: 401, fatal: true });
          this.#initData = initData;
        }

        get authHeader() {
          return this.token ? `Bearer ${this.token}` : `tma ${this.#initData}`;
        }

        get launchHeader() {
          return `tma ${this.#initData}`;
        }

        get stale() {
          return Date.now() / 1000 > this.expiresAt - TOKEN_SKEW_S;
        }

        adopt({ token, expires_at, traits, language, seconds_balance }) {
          this.token = token;
          this.expiresAt = expires_at;
          this.lang = language ?? this.lang;
          this.balance = Number(seconds_balance) || 0;
          if (!this.#pendingTraits) this.traits = traits ?? {};
        }

        async patchTraits(patch, write) {
          this.traits = { ...this.traits, ...patch };
          this.#pendingTraits += 1;
          try {
            await write(patch);
          } finally {
            this.#pendingTraits -= 1;
          }
        }
      }

      class Api {
        #raw;
        #authed;
        #session;
        #refreshing = null;

        constructor({ prefixUrl, session, timeout = 15000 }) {
          this.#session = session;
          this.#raw = ky.create({
            prefixUrl,
            timeout,
            retry: 0,
            credentials: "omit",
            cache: "no-store",
            hooks: {
              beforeError: [
                async (error) => {
                  const body = await error.response.json().catch(() => null);
                  error.code = body?.error ?? "internal";
                  return error;
                },
              ],
            },
          });

          this.#authed = this.#raw.extend({
            hooks: {
              beforeRequest: [
                async (request) => {
                  if (this.#session.stale) await this.refresh();
                  request.headers.set("Authorization", this.#session.authHeader);
                },
              ],
            },
          });
        }

        refresh() {
          this.#refreshing ??= this.#raw
            .post("auth", { headers: { Authorization: this.#session.launchHeader } })
            .json()
            .then((data) => {
              this.#session.adopt(data);
              return data;
            })
            .finally(() => {
              this.#refreshing = null;
            });
          return this.#refreshing;
        }

        post(path, json, options) {
          return this.#authed.post(path, { json, ...options }).json();
        }

        beacon(path, json) {
          return this.#authed
            .post(path, { json, keepalive: true, timeout: 4000 })
            .json()
            .catch(() => null);
        }
      }

      class Telemetry {
        #api;
        #queue = [];
        #flushing = false;

        constructor(api) {
          this.#api = api;
          addEventListener("pagehide", () => this.#flush(), { once: true });
        }

        track(event, data = {}) {
          this.#queue.push({ event, at: Date.now(), ...data });
          if (this.#queue.length >= 8) this.#flush();
        }

        async #flush() {
          if (this.#flushing || !this.#queue.length) return;
          this.#flushing = true;
          const batch = this.#queue.splice(0);
          await this.#api.beacon("telemetry", { batch });
          this.#flushing = false;
        }
      }

      const VERSION = "2";
      const ASSET_CACHE = `sythera-assets-${VERSION}`;
      const GLB_MAGIC = 0x46546c67;

      const isGlb = (buffer) =>
        buffer.byteLength > 12 && new DataView(buffer).getUint32(0, true) === GLB_MAGIC;

      const sweepCaches = async () => {
        for (const key of await caches.keys())
          if (key.startsWith("sythera-assets-") && key !== ASSET_CACHE) await caches.delete(key);
      };

      const loadModel = async (url, onProgress) => {
        const cache = await caches.open(ASSET_CACHE);
        const hit = await cache.match(url);

        if (hit) {
          const buffer = await hit.arrayBuffer();
          if (isGlb(buffer)) return buffer;
          await cache.delete(url);
        }

        const response = await fetch(url, { cache: "reload" });
        if (!response.ok) throw new Fault("model", { status: response.status });

        const total = Number(response.headers.get("content-length")) || 0;
        const chunks = [];
        let loaded = 0;

        for await (const chunk of response.body) {
          chunks.push(chunk);
          loaded += chunk.byteLength;
          if (total) onProgress?.(loaded / total);
        }

        const buffer = await new Blob(chunks).arrayBuffer();
        if (!isGlb(buffer)) throw new Fault("model", { status: response.status, fatal: true });

        await cache.put(url, new Response(buffer, { headers: { "content-type": "model/gltf-binary" } }));
        return buffer;
      };

        #onDegrade;

        constructor(canvas, { onDegrade } = {}) {
          this.#canvas = canvas;
          this.#onDegrade = onDegrade;
          this.#renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            powerPreference: "high-performance",
            stencil: false,
          });
          this.#renderer.setPixelRatio(Math.min(devicePixelRatio, MAX_PIXEL_RATIO));
          this.#renderer.outputColorSpace = THREE.SRGBColorSpace;
          this.#renderer.toneMapping = THREE.AgXToneMapping;
          this.#renderer.toneMappingExposure = 1.0;
          this.#renderer.setClearColor(0x000000, 1);
        }

        get raw() {
          return this.#renderer;
        }

        get tier() {
          return this.#tier;
        }

        environment() {
          if (this.#environment) return this.#environment;
          const pmrem = new THREE.PMREMGenerator(this.#renderer);
          this.#environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
          pmrem.dispose();
          return this.#environment;
        }

        attach(scene, camera) {
          scene.environment = this.environment();
          scene.environmentIntensity = ENVIRONMENT_INTENSITY;

          this.#composer = new EffectComposer(
            this.#renderer,
            new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }),
          );
          this.#bloom = new UnrealBloomPass(
            new THREE.Vector2(1, 1),
            BLOOM.strength,
            BLOOM.radius,
            BLOOM.threshold,
          );
          this.#composer.addPass(new RenderPass(scene, camera));
          this.#composer.addPass(this.#bloom);
          this.#composer.addPass(new OutputPass());
        }

        resize(width, height) {
          this.#size = { width, height };
          this.#renderer.setSize(width, height, false);
          this.#composer?.setPixelRatio(this.#renderer.getPixelRatio());
          this.#composer?.setSize(width, height);
        }

        render(frameMs) {
          this.#composer.render();
          if (frameMs !== undefined) this.#measure(frameMs);
        }

        #measure(ms) {
          if (this.#tier === 0) return;
          this.#elapsed += ms;
          this.#frames += 1;
          if (this.#frames < SAMPLE_FRAMES) return;
          if (this.#elapsed / this.#frames > BUDGET_MS) this.#degrade();
          this.#frames = 0;
          this.#elapsed = 0;
        }

        #degrade() {
          if (this.#tier === 2) {
            this.#tier = 1;
            this.#renderer.setPixelRatio(1);
            this.resize(this.#size.width, this.#size.height);
          } else {
            this.#tier = 0;
            this.#bloom.enabled = false;
          }
          this.#onDegrade?.(this.#tier);
        }

        snapshot(width) {
          this.#composer.render();
          const scale = width / this.#canvas.width;
          const canvas = new OffscreenCanvas(width, Math.round(this.#canvas.height * scale));
          canvas.getContext("2d").drawImage(this.#canvas, 0, 0, canvas.width, canvas.height);
          return canvas;
        }

        dispose() {
          this.#environment?.dispose();
          this.#composer?.dispose();
          this.#renderer.dispose();
          this.#environment = null;
          this.#composer = null;
        }
      }

      const BASIS_PATH = "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/basis/";
      const REQUIRED_EXPRESSIONS = ["blink", "aa", "happy"];

      const PARTS = [
        ["glasses", /glass|goggle|sunglass/i],
        ["accessory", /accessor|hairpin|hairclip|clip|pin|earring|ribbon|badge/i],
        ["hat", /hat|cap|beret|hood|headwear/i],
        ["bow", /bow|necktie|\btie\b|scarf|collar/i],
        ["outer", /outer|jacket|coat|cardigan|vest|blazer|hoodie/i],
        ["shoes", /shoe|boot|sneaker|sandal|footwear/i],
        ["socks", /sock|stocking|tights|legwear/i],
        ["hair", /hair/i],
        ["top", /top|shirt|blouse|onepiece|dress|uniform/i],
        ["bottom", /bottom|skirt|pants|trouser|shorts/i],
        ["body", /body|skin|face|eye|mouth|tooth|tongue|eyelash|eyebrow/i],
      ];

      const REMOVABLE = ["glasses", "accessory", "hat", "bow", "outer", "shoes", "socks"];

      const FRAME = { top: 1.06, bottom: 0.2, pad: 1.08 };

      const classify = (name) => {
        for (const [part, pattern] of PARTS) if (pattern.test(name)) return part;
        return "other";
      };

      const luminance = (texture) => {
        const image = texture.image;
        if (!image?.width || !(image instanceof ImageBitmap || image instanceof HTMLImageElement))
          return null;

        const canvas = new OffscreenCanvas(image.width, image.height);
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);

        const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        const data = pixels.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
          data[i] = data[i + 1] = data[i + 2] = Math.min(255, Math.max(0, value * 1.25 + 46));
        }
        context.putImageData(pixels, 0, 0);

        const flat = new THREE.CanvasTexture(canvas);
        flat.colorSpace = texture.colorSpace;
        flat.flipY = texture.flipY;
        flat.wrapS = texture.wrapS;
        flat.wrapT = texture.wrapT;
        flat.needsUpdate = true;
        return flat;
      };

      class Avatar {
        #vrm;
        #parts = new Map();
        #hairSource = new Map();
        #side = 1;
        #rest = {};
        #fit = null;
        #headY = 1.35;

        static async load(url, { renderer, onProgress }) {
          const ktx2 = new KTX2Loader().setTranscoderPath(BASIS_PATH).detectSupport(renderer);
          const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
          loader.register((parser) => new VRMLoaderPlugin(parser));

          let gltf;
          try {
            gltf = await loader.parseAsync(await loadModel(url, onProgress), "/");
          } catch (error) {
            throw error instanceof Fault ? error : new Fault("model", { fatal: true, cause: error });
          } finally {
            ktx2.dispose();
          }

          return new Avatar(gltf);
        }

        constructor(gltf) {
          const vrm = gltf.userData.vrm;
          if (!vrm?.humanoid || !vrm.expressionManager || !vrm.lookAt)
            throw new Fault("model", { fatal: true });
          for (const name of REQUIRED_EXPRESSIONS)
            if (!vrm.expressionManager.getExpression(name)) throw new Fault("unsupported", { fatal: true });

          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.combineSkeletons(gltf.scene);
          VRMUtils.combineMorphs(vrm);
          VRMUtils.rotateVRM0(vrm);
          vrm.scene.traverse((object) => {
            object.frustumCulled = false;
          });

          this.#vrm = vrm;
          this.#catalogue();
          vrm.scene.updateMatrixWorld(true);
          this.#calibrate();
          this.#measure();
        }

        get vrm() {
          return this.#vrm;
        }

        get scene() {
          return this.#vrm.scene;
        }

        get expressions() {
          return this.#vrm.expressionManager;
        }

        get side() {
          return this.#side;
        }

        get rest() {
          return this.#rest;
        }

        get fit() {
          return this.#fit;
        }

        get headY() {
          return this.#headY;
        }

        bone(name) {
          return this.#vrm.humanoid.getNormalizedBoneNode(name);
        }

        update(delta) {
          this.#vrm.update(delta);
        }

        #catalogue() {
          const seen = new Set();
          this.#vrm.scene.traverse((object) => {
            if (!object.isMesh) return;
            for (const material of [object.material].flat()) {
              if (!material || seen.has(material.uuid)) continue;
              seen.add(material.uuid);
              const part = classify(`${material.name} ${object.name}`);
              material.userData.part = part;
              this.#parts.set(part, [...(this.#parts.get(part) ?? []), material]);
            }
          });
        }

        #calibrate() {
          const root = this.#vrm.humanoid.normalizedHumanBonesRoot;
          root.updateWorldMatrix(true, true);

          const chain = ["leftUpperArm", "leftLowerArm", "leftHand"];
          this.#side = chain.reduce((sum, name) => sum + (this.bone(name)?.position.x ?? 0), 0) < 0 ? -1 : 1;

          const at = (name) => {
            const node = this.bone(name);
            if (!node) return null;
            const point = root.worldToLocal(node.getWorldPosition(new THREE.Vector3()));
            return point.set(this.#side * point.x, point.y, this.#side * point.z);
          };

          const swing = (from, to, right) => {
            const a = at(from);
            const b = at(to);
            if (!a || !b) return 0;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            return right ? Math.atan2(-dy, -dx) : Math.atan2(dy, dx);
          };

          const leftUpper = swing("leftUpperArm", "leftLowerArm", false);
          const leftLower = swing("leftLowerArm", "leftHand", false);
          const rightUpper = swing("rightUpperArm", "rightLowerArm", true);
          const rightLower = swing("rightLowerArm", "rightHand", true);

          this.#rest = {
            leftUpperArm: leftUpper,
            leftLowerArm: leftLower - leftUpper,
            rightUpperArm: rightUpper,
            rightLowerArm: rightLower - rightUpper,
          };
        }

        #measure() {
          const box = new THREE.Box3().setFromObject(this.#vrm.scene);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          if (!Number.isFinite(size.y) || size.y <= 0) throw new Fault("model", { fatal: true });

          const top = box.min.y + size.y * FRAME.top;
          const bottom = box.min.y + size.y * FRAME.bottom;
          const head = this.bone("head");

          this.#headY = head
            ? head.getWorldPosition(new THREE.Vector3()).y
            : box.min.y + size.y * 0.9;
          this.#fit = {
            x: center.x,
            y: (top + bottom) / 2,
            z: center.z,
            spanY: (top - bottom) * FRAME.pad,
            spanX: size.x * FRAME.pad,
          };
        }

        setHairColor(input) {
          const hair = this.#parts.get("hair");
          if (!hair?.length) return null;

          const color = new THREE.Color(0x000000);
          try {
            color.setStyle(input);
          } catch {
            return null;
          }

          for (const material of hair) {
            if (material.map && !this.#hairSource.has(material.uuid)) {
              this.#hairSource.set(material.uuid, material.map);
              const flat = luminance(material.map);
              if (flat) material.map = flat;
            }
            material.color?.copy(color);
            material.shadeColorFactor?.copy(color).multiplyScalar(0.62);
            material.needsUpdate = true;
          }

          return `#${color.getHexString()}`;
        }

        setPartVisible(part, visible) {
          if (!REMOVABLE.includes(part)) return false;
          const list = this.#parts.get(part);
          if (!list?.length) return false;
          for (const material of list) material.visible = visible;
          return true;
        }

        dispose() {
          VRMUtils.deepDispose(this.#vrm.scene);
          this.#parts.clear();
          this.#hairSource.clear();
        }
      }

      const FADE = 0.3;
      const DEG = THREE.MathUtils.degToRad;
      const SIDES = ["left", "right"];
      const SPREAD = { Thumb: 0, Index: 3.5, Middle: 1, Ring: -1.5, Little: -4 };
      const HAND_LEAD = 0.3;
      const HAND_TAIL = 0.35;

      const fingerAngles = (finger, curl, sign) =>
        finger === "Thumb"
          ? [0, sign * curl, sign * curl * 0.35]
          : [0, sign * SPREAD[finger] * (curl > 40 ? 0.2 : 1), sign * curl];

      class Motion {
        #avatar;
        #mixer;
        #clips = new Map();
        #base = null;
        #baseKey = null;
        #hold = null;
        #holdKey = null;
        #shot = null;
        #onFinished;

        constructor(avatar) {
          this.#avatar = avatar;
          this.#mixer = new THREE.AnimationMixer(avatar.scene);
          this.#onFinished = ({ action }) => {
            if (action === this.#shot) this.#shot = null;
          };
          this.#mixer.addEventListener("finished", this.#onFinished);
          this.#build();
          this.setPose(IDLE);
          this.#mixer.update(0);
        }

        get poseKey() {
          return this.#baseKey;
        }

        #build() {
          const hips = this.#avatar.bone("hips");
          const hipsRest = hips ? hips.position.clone() : new THREE.Vector3();
          const euler = new THREE.Euler();
          const quaternion = new THREE.Quaternion();
          const side = this.#avatar.side;

          for (const [name, spec] of Object.entries(CLIPS)) {
            const tracks = [];

            for (const [boneName, keys] of Object.entries(spec.bones)) {
              const node = this.#avatar.bone(boneName);
              if (!node) continue;

              const times = [];
              const values = [];
              const rest = spec.base ? (this.#avatar.rest[boneName] ?? 0) : 0;

              for (const [time, x, y, z] of keys) {
                times.push(time);
                euler.set(DEG(x), DEG(y), DEG(z) - rest, "YXZ");
                quaternion.setFromEuler(euler);
                values.push(
                  side * quaternion.x,
                  quaternion.y,
                  side * quaternion.z,
                  quaternion.w,
                );
              }
              if (times.length === 1) {
                times.push(spec.dur);
                values.push(...values);
              }
              tracks.push(new THREE.QuaternionKeyframeTrack(`${node.name}.quaternion`, times, values));
            }

            const profile = HANDS[spec.hands ?? (spec.base ? DEFAULT_HAND : null)];
            if (profile) {
              const rest = spec.base ? null : HANDS[DEFAULT_HAND];
              const stops = spec.base
                ? [[0], [spec.dur]]
                : [[0, true], [HAND_LEAD], [Math.max(HAND_LEAD, spec.dur - HAND_TAIL)], [spec.dur, true]];

              for (const hand of SIDES) {
                const sign = hand === "left" ? -1 : 1;

                for (const [finger, segments] of Object.entries(FINGER_SEGMENTS)) {
                  segments.forEach((segment, index) => {
                    const node = this.#avatar.bone(`${hand}${finger}${segment}`);
                    if (!node) return;

                    const curl = profile[finger][index] - (rest ? rest[finger][index] : 0);
                    const times = [];
                    const values = [];

                    for (const [time, zero] of stops) {
                      const [x, y, z] = fingerAngles(finger, zero ? 0 : curl, sign);
                      euler.set(DEG(x), DEG(y), DEG(z), "YXZ");
                      quaternion.setFromEuler(euler);
                      times.push(time);
                      values.push(
                        side * quaternion.x,
                        quaternion.y,
                        side * quaternion.z,
                        quaternion.w,
                      );
                    }
                    tracks.push(new THREE.QuaternionKeyframeTrack(`${node.name}.quaternion`, times, values));
                  });
                }
              }
            }

            if (spec.move && hips) {
              const times = [];
              const values = [];
              for (const [time, dy] of spec.move) {
                times.push(time);
                values.push(hipsRest.x, hipsRest.y * (1 + dy), hipsRest.z);
              }
              if (times.length === 1) {
                times.push(spec.dur);
                values.push(...values);
              }
              tracks.push(new THREE.VectorKeyframeTrack(`${hips.name}.position`, times, values));
            }

            const clip = new THREE.AnimationClip(name, spec.dur, tracks);
            if (!spec.base) clip.blendMode = THREE.AdditiveAnimationBlendMode;
            this.#clips.set(name, clip);
          }
        }

        #action(name) {
          const clip = this.#clips.get(name);
          return clip ? this.#mixer.clipAction(clip, this.#avatar.scene, clip.blendMode) : null;
        }

        #loop(action) {
          action.setLoop(THREE.LoopRepeat, Infinity);
          action.clampWhenFinished = false;
          action.reset().setEffectiveWeight(1).fadeIn(FADE).play();
        }

        #setBase(name) {
          if (this.#baseKey === name) return true;
          const next = this.#action(name);
          if (!next) return false;
          this.#loop(next);
          this.#base?.fadeOut(FADE);
          this.#base = next;
          this.#baseKey = name;
          return true;
        }

        #setHold(name) {
          if (this.#holdKey === name) return true;
          this.#hold?.fadeOut(FADE);
          this.#hold = null;
          this.#holdKey = null;
          if (!name) return true;
          const next = this.#action(name);
          if (!next) return false;
          this.#loop(next);
          this.#hold = next;
          this.#holdKey = name;
          return true;
        }

        setPose(name) {
          const spec = CLIPS[name];
          if (!spec) return false;
          if (spec.base) return this.#setBase(name) && (name === IDLE ? this.#setHold(null) : true);
          if (!spec.hold) return false;
          this.#setBase(this.#baseKey ?? IDLE);
          return this.#setHold(name);
        }

        play(name) {
          const spec = CLIPS[name];
          if (!spec || spec.base || spec.hold) return false;
          const next = this.#action(name);
          if (!next) return false;
          if (this.#shot && this.#shot !== next) this.#shot.fadeOut(0.15);
          next.setLoop(THREE.LoopRepeat, spec.repeat ?? 1);
          next.clampWhenFinished = false;
          next.reset().setEffectiveWeight(1).play();
          this.#shot = next;
          return true;
        }

        update(delta) {
          this.#mixer.update(delta);
        }

        dispose() {
          this.#mixer.removeEventListener("finished", this.#onFinished);
          this.#mixer.stopAllAction();
          this.#mixer.uncacheRoot(this.#avatar.scene);
          this.#clips.clear();
        }
      }

      const damp = THREE.MathUtils.damp;
      const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
      const between = (low, high) => low + Math.random() * (high - low);

      const MOODS = {
        neutral: { vrm: "neutral", rim: 0xbba7ff },
        happy: { vrm: "happy", rim: 0xffe6a3 },
        relaxed: { vrm: "relaxed", rim: 0xffc2b0 },
        sad: { vrm: "sad", rim: 0x9fb6ff },
        angry: { vrm: "angry", rim: 0xff9d8a },
        surprised: { vrm: "surprised", rim: 0xa5e8ff },
      };

      const MOOD_KEYS = Object.keys(MOODS);

      const VISEMES = ["aa", "ih", "ou", "ee", "oh"];
      const SILENCE = "viseme_sil";

      const VISEME_MAP = {
        viseme_aa: ["aa", 1],
        viseme_E: ["ee", 1],
        viseme_I: ["ih", 1],
        viseme_O: ["oh", 1],
        viseme_U: ["ou", 1],
        viseme_CH: ["ih", 0.5],
        viseme_SS: ["ih", 0.4],
        viseme_TH: ["aa", 0.25],
        viseme_DD: ["aa", 0.3],
        viseme_FF: ["ou", 0.3],
        viseme_kk: ["aa", 0.35],
        viseme_nn: ["ih", 0.2],
        viseme_RR: ["oh", 0.35],
      };

      const BLINK = { min: 2200, max: 6200, duration: 0.12, doubleChance: 0.22 };
      const SACCADE = { min: 1400, max: 4200 };
      const LAMBDA = { expression: 7, viseme: 22, look: 5, nudge: 4 };

      class Face {
        #avatar;
        #target = new THREE.Object3D();
        #rim;
        #weights = {};
        #goals = {};
        #visemes = Object.fromEntries(VISEMES.map((v) => [v, 0]));
        #viseme = SILENCE;
        #blinkAt;
        #blinkPhase = -1;
        #blinkQueue = 0;
        #gaze = { x: 0, y: 0 };
        #aim = { x: 0, y: 0 };
        #gazeAt;
        #pointer = { x: 0, y: 0, active: false };
        #nudge = { x: 0, y: 0, toX: 0, toY: 0 };
        #nudgeTimer = 0;
        #mood = "neutral";
        #sleeping = false;

        constructor(avatar, { rim } = {}) {
          this.#avatar = avatar;
          this.#rim = rim;
          const now = performance.now();
          this.#blinkAt = now + between(BLINK.min, BLINK.max);
          this.#gazeAt = now + between(SACCADE.min, SACCADE.max);
          avatar.vrm.lookAt.target = this.#target;
          this.#target.position.set(avatar.fit.x, avatar.headY, avatar.fit.z + avatar.fit.spanY);
          this.setMood("neutral");
        }

        get lookTarget() {
          return this.#target;
        }

        get mood() {
          return this.#mood;
        }

        get speaking() {
          return this.#viseme !== SILENCE;
        }

        get sleeping() {
          return this.#sleeping;
        }

        setSleeping(value) {
          this.#sleeping = value;
          this.#blinkPhase = -1;
          this.#blinkAt = performance.now() + between(BLINK.min, BLINK.max);
        }

        setMood(key, intensity = 0.85) {
          const mood = MOODS[key] ?? MOODS.neutral;
          for (const name of MOOD_KEYS)
            if (MOODS[name].vrm !== "neutral") this.#goals[MOODS[name].vrm] = 0;
          if (mood.vrm !== "neutral") this.#goals[mood.vrm] = clamp(intensity, 0, 1);
          this.#mood = key in MOODS ? key : "neutral";
          this.#rim?.color.setHex(mood.rim);
        }

        setViseme(name) {
          this.#viseme = name ?? SILENCE;
        }

        setPointer(x, y) {
          this.#pointer = { x, y, active: true };
        }

        clearPointer() {
          this.#pointer.active = false;
        }

        nudge(x, y, duration = 700) {
          this.#nudge.toX = clamp(x, -0.35, 0.35);
          this.#nudge.toY = clamp(y, -0.35, 0.35);
          this.#nudgeTimer = performance.now() + duration;
        }

        update(delta, now) {
          this.#stepNudge(delta, now);
          this.#stepBlink(delta, now);
          this.#stepExpressions(delta);
          this.#stepMouth(delta);
          this.#stepGaze(delta, now);
        }

        #stepNudge(delta, now) {
          if (this.#nudgeTimer && now > this.#nudgeTimer) {
            this.#nudge.toX = 0;
            this.#nudge.toY = 0;
            this.#nudgeTimer = 0;
          }
          this.#nudge.x = damp(this.#nudge.x, this.#nudge.toX, LAMBDA.nudge, delta);
          this.#nudge.y = damp(this.#nudge.y, this.#nudge.toY, LAMBDA.nudge, delta);
          if (Math.abs(this.#nudge.x) < 1e-4 && Math.abs(this.#nudge.y) < 1e-4) return;

          const head = this.#avatar.bone("head");
          if (!head) return;
          head.rotation.z += this.#avatar.side * this.#nudge.x;
          head.rotation.x += this.#avatar.side * this.#nudge.y;
        }

        #stepBlink(delta, now) {
          if (this.#sleeping) {
            this.#avatar.expressions.setValue("blink", 1);
            return;
          }
          if (this.#blinkPhase < 0 && now >= this.#blinkAt) {
            this.#blinkPhase = 0;
            this.#blinkQueue = Math.random() < BLINK.doubleChance ? 1 : 0;
            this.#blinkAt = now + between(BLINK.min, BLINK.max);
          }
          if (this.#blinkPhase < 0) return;

          this.#blinkPhase += delta;
          const progress = this.#blinkPhase / BLINK.duration;
          this.#avatar.expressions.setValue("blink", progress < 1 ? Math.sin(progress * Math.PI) : 0);
          if (progress < 1) return;

          if (this.#blinkQueue > 0) {
            this.#blinkQueue -= 1;
            this.#blinkPhase = -0.06;
          } else {
            this.#blinkPhase = -1;
          }
        }

        #stepExpressions(delta) {
          for (const name of Object.keys(this.#goals)) {
            this.#weights[name] = damp(
              this.#weights[name] ?? 0,
              this.#goals[name],
              LAMBDA.expression,
              delta,
            );
            this.#avatar.expressions.setValue(name, this.#weights[name]);
          }
        }

        #stepMouth(delta) {
          const goal = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
          const rule = VISEME_MAP[this.#viseme];
          if (rule) goal[rule[0]] = rule[1];

          for (const name of VISEMES) {
            this.#visemes[name] = damp(this.#visemes[name], goal[name], LAMBDA.viseme, delta);
            this.#avatar.expressions.setValue(name, this.#visemes[name]);
          }
        }

        #stepGaze(delta, now) {
          if (this.#sleeping) {
            this.#gaze.x = 0;
            this.#gaze.y = -0.22;
          } else if (this.#pointer.active) {
            this.#gaze.x = this.#pointer.x;
            this.#gaze.y = this.#pointer.y;
            this.#gazeAt = now + between(SACCADE.min, SACCADE.max);
          } else if (!this.#sleeping && now >= this.#gazeAt) {
            this.#gazeAt = now + between(SACCADE.min, SACCADE.max);
            const spread = this.speaking ? 0.14 : 0.32;
            this.#gaze.x = between(-spread, spread);
            this.#gaze.y = between(-spread * 0.6, spread * 0.5);
          }

          this.#aim.x = damp(this.#aim.x, this.#gaze.x, LAMBDA.look, delta);
          this.#aim.y = damp(this.#aim.y, this.#gaze.y, LAMBDA.look, delta);

          const fit = this.#avatar.fit;
          this.#target.position.set(
            fit.x + this.#aim.x * fit.spanY * 0.4,
            this.#avatar.headY + this.#aim.y * fit.spanY * 0.25,
            fit.z + fit.spanY,
          );
        }

        reset() {
          this.#viseme = SILENCE;
          for (const name of VISEMES) this.#visemes[name] = 0;
        }
      }

      const TIMEOUT_MS = 30000;
      const IMAGE_INTENSITY = 0.68;

      const GRADIENTS = {
        void: ["#000000", "#000000"],
        night: ["#0b1020", "#000000"],
        dusk: ["#2a1435", "#080610"],
        sunset: ["#3d1f18", "#0d0709"],
        ocean: ["#062a3a", "#020a12"],
        forest: ["#0d2418", "#040a08"],
        rose: ["#3a1626", "#0c0509"],
        studio: ["#232329", "#0a0a0c"],
      };

      const GRADIENT_KEYS = Object.keys(GRADIENTS);

      class Backdrop {
        #scene;
        #renderer;
        #image = null;
        #run = null;

        constructor(scene, renderer) {
          this.#scene = scene;
          this.#renderer = renderer;
        }

        cancel() {
          this.#run?.abort();
          this.#run = null;
        }

        #drop() {
          const current = this.#scene.background;
          current?.dispose?.();
          current?.image?.close?.();
          this.#scene.background = null;
          this.#image = null;
        }

        setGradient(key) {
          this.cancel();
          const preset = GRADIENTS[key] ?? GRADIENTS.void;

          const canvas = new OffscreenCanvas(2, 256);
          const context = canvas.getContext("2d");
          const gradient = context.createLinearGradient(0, 0, 0, 256);
          gradient.addColorStop(0, preset[0]);
          gradient.addColorStop(1, preset[1]);
          context.fillStyle = gradient;
          context.fillRect(0, 0, 2, 256);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;

          this.#drop();
          this.#scene.background = texture;
          this.#scene.backgroundIntensity = 1;
          return key in GRADIENTS ? key : "void";
        }

        async setImage(url, aspect) {
          this.cancel();
          const run = new AbortController();
          this.#run = run;

          const response = await fetch(url, {
            signal: AbortSignal.any([run.signal, AbortSignal.timeout(TIMEOUT_MS)]),
            mode: "cors",
            credentials: "omit",
            cache: "force-cache",
          });
          if (!response.ok) throw new Fault("backdrop", { status: response.status });

          const bitmap = await createImageBitmap(await response.blob(), { imageOrientation: "flipY" });
          if (this.#run !== run) {
            bitmap.close();
            return false;
          }
          this.#run = null;

          const texture = new THREE.Texture(bitmap);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
          texture.anisotropy = this.#renderer.capabilities.getMaxAnisotropy();
          texture.flipY = false;
          texture.needsUpdate = true;

          this.#drop();
          this.#image = texture;
          this.#scene.background = texture;
          this.#scene.backgroundIntensity = IMAGE_INTENSITY;
          this.fit(aspect);
          return true;
        }

        fit(aspect) {
          const texture = this.#image;
          if (!texture?.image?.width) return;

          const imageAspect = texture.image.width / texture.image.height;
          if (aspect > imageAspect) {
            const scale = imageAspect / aspect;
            texture.repeat.set(1, scale);
            texture.offset.set(0, (1 - scale) / 2);
          } else {
            const scale = aspect / imageAspect;
            texture.repeat.set(scale, 1);
            texture.offset.set((1 - scale) / 2, 0);
          }
        }

        dispose() {
          this.cancel();
          this.#drop();
        }
      }

      const FOV = 22;
      const IDLE_AFTER_MS = 1500;
      const PICK_RADIUS_PX = 130;
      const MAX_DELTA = 0.05;

      class Stage {
        #canvas;
        #bus;
        #renderer;
        #scene = new THREE.Scene();
        #camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);
        #rim;
        #avatar = null;
        #motion = null;
        #face = null;
        #backdrop = null;
        #clock = new THREE.Clock();
        #raf = 0;
        #observer = null;
        #idleTimer = 0;
        #announced = false;
        #visemeSource = null;

        constructor(canvas, { bus }) {
          this.#canvas = canvas;
          this.#bus = bus;
          this.#renderer = new Renderer(canvas, {
            onDegrade: (tier) => bus.emit("stage:degraded", { tier }),
          });
          this.#buildLights();
        }

        get avatar() {
          return this.#avatar;
        }

        get motion() {
          return this.#motion;
        }

        get face() {
          return this.#face;
        }

        get backdrop() {
          return this.#backdrop;
        }

        get aspect() {
          return this.#camera.aspect;
        }

        get ready() {
          return Boolean(this.#avatar);
        }

        #buildLights() {
          const key = new THREE.DirectionalLight(0xffffff, 1.75);
          key.position.set(1.2, 2.4, 2.2);
          this.#rim = new THREE.DirectionalLight(0xbba7ff, 0.85);
          this.#rim.position.set(-1.8, 1.6, -1.4);
          const fill = new THREE.DirectionalLight(0x7fd6ff, 0.38);
          fill.position.set(-1.1, 0.4, 2.0);
          this.#scene.add(key, this.#rim, fill, new THREE.AmbientLight(0xffffff, 0.42));
        }

        async mount(modelUrl, { onProgress } = {}) {
          this.unmount();

          this.#avatar = await Avatar.load(modelUrl, {
            renderer: this.#renderer.raw,
            onProgress,
          });
          this.#scene.add(this.#avatar.scene);
          this.#scene.add(new THREE.Object3D());

          this.#motion = new Motion(this.#avatar);
          this.#face = new Face(this.#avatar, { rim: this.#rim });
          this.#scene.add(this.#face.lookTarget);
          this.#backdrop = new Backdrop(this.#scene, this.#renderer.raw);

          this.#renderer.attach(this.#scene, this.#camera);
          this.resize();

          this.#observer = new ResizeObserver(() => this.resize());
          this.#observer.observe(this.#canvas);

          this.#avatar.update(0);
          this.start();
        }

        resize() {
          const width = this.#canvas.clientWidth || 1;
          const height = this.#canvas.clientHeight || 1;
          this.#renderer.resize(width, height);
          this.#camera.aspect = width / height;
          this.#frame();
          this.#backdrop?.fit(this.#camera.aspect);
        }

        #frame() {
          const fit = this.#avatar?.fit;
          if (!fit) return;
          const vertical = (this.#camera.fov * Math.PI) / 180;
          const horizontal = 2 * Math.atan(Math.tan(vertical / 2) * this.#camera.aspect);
          const distance = Math.max(
            fit.spanY / 2 / Math.tan(vertical / 2),
            fit.spanX / 2 / Math.tan(horizontal / 2),
          );
          this.#camera.position.set(fit.x, fit.y, fit.z + distance);
          this.#camera.lookAt(fit.x, fit.y, fit.z);
          this.#camera.near = distance / 100;
          this.#camera.far = distance * 10;
          this.#camera.updateProjectionMatrix();
        }

        setVisemeSource(source) {
          this.#visemeSource = source;
          if (!source) this.#face?.reset();
        }

        start() {
          if (this.#raf || !this.ready) return;
          this.#clock.getDelta();
          this.#tick();
        }

        stop() {
          cancelAnimationFrame(this.#raf);
          clearTimeout(this.#idleTimer);
          this.#raf = 0;
        }

        #tick = () => {
          this.#raf = requestAnimationFrame(this.#tick);
          const started = performance.now();
          const delta = Math.min(MAX_DELTA, this.#clock.getDelta());

          if (this.#visemeSource) this.#face.setViseme(this.#visemeSource());
          this.#motion.update(delta);
          this.#face.update(delta, started);
          this.#avatar.update(delta);
          this.#renderer.render(performance.now() - started);

          if (this.#announced) return;
          this.#announced = true;
          this.#bus.emit("stage:ready");
          this.#idleTimer = setTimeout(() => this.#bus.emit("stage:idle"), IDLE_AFTER_MS);
        };

        pick(clientX, clientY, regions) {
          if (!this.ready) return null;

          const rect = this.#canvas.getBoundingClientRect();
          const x = clientX - rect.left;
          const y = clientY - rect.top;
          const point = new THREE.Vector3();

          let best = null;
          let distance = PICK_RADIUS_PX;

          for (const [region, boneName] of Object.entries(regions)) {
            const node = this.#avatar.bone(boneName);
            if (!node) continue;
            node.getWorldPosition(point).project(this.#camera);
            const spread = Math.hypot(
              ((point.x + 1) / 2) * rect.width - x,
              ((1 - point.y) / 2) * rect.height - y,
            );
            if (spread < distance) {
              distance = spread;
              best = region;
            }
          }
          return best;
        }

        pointerAt(clientX, clientY) {
          const rect = this.#canvas.getBoundingClientRect();
          this.#face?.setPointer(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            -(((clientY - rect.top) / rect.height) * 2 - 1),
          );
        }

        snapshot(width = 720) {
          return this.ready ? this.#renderer.snapshot(width) : null;
        }

        unmount() {
          this.stop();
          this.#observer?.disconnect();
          this.#observer = null;
          this.#announced = false;

          this.#backdrop?.dispose();
          this.#motion?.dispose();
          if (this.#avatar) {
            this.#scene.remove(this.#avatar.scene);
            this.#avatar.dispose();
          }
          this.#backdrop = null;
          this.#motion = null;
          this.#face = null;
          this.#avatar = null;
        }

        dispose() {
          this.unmount();
          this.#renderer.dispose();
        }
      }

      const CONSTRAINTS = {
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      };
      const GRACE_MS = 2500;

      class Mic {
        #stream = null;
        #badAt = 0;
        #onLost;

        constructor({ onLost } = {}) {
          this.#onLost = onLost;
        }

        static async probe() {
          const stream = await navigator.mediaDevices.getUserMedia(CONSTRAINTS);
          for (const track of stream.getTracks()) track.stop();
        }

        get stream() {
          return this.#stream;
        }

        get track() {
          return this.#stream?.getAudioTracks()[0] ?? null;
        }

        async open() {
          this.close();
          this.#stream = await navigator.mediaDevices.getUserMedia(CONSTRAINTS);
          this.#badAt = 0;
          this.track?.addEventListener("ended", () => this.#onLost?.(new Fault("mic_lost")), {
            once: true,
          });
          return this.#stream;
        }

        healthy() {
          const track = this.track;
          if (!track) return true;
          if (track.readyState === "live" && !track.muted) {
            this.#badAt = 0;
            return true;
          }
          this.#badAt ||= Date.now();
          return Date.now() - this.#badAt < GRACE_MS;
        }

        close() {
          for (const track of this.#stream?.getTracks() ?? []) track.stop();
          this.#stream = null;
          this.#badAt = 0;
        }
      }

      class Meter {
        #left = 0;
        #at = 0;
        #bus;

        constructor(bus) {
          this.#bus = bus;
        }

        sync(seconds) {
          if (seconds == null) return;
          this.#left = Number(seconds) || 0;
          this.#at = Date.now();
          this.#bus.emit("balance:changed", { seconds: this.#left });
        }

        get seconds() {
          if (!this.#at) return this.#left;
          return Math.max(0, Math.round(this.#left - (Date.now() - this.#at) / 1000));
        }

        get empty() {
          return this.seconds <= 0;
        }

        freeze() {
          this.#left = this.seconds;
          this.#at = Date.now();
        }
      }

      const STREAM_WAIT_MS = 4000;
      const POLL_MS = 100;

      class Lipsync {
        #engine = null;
        #active = false;

        prime() {
          this.#engine ??= new Engine();
          return this.#engine;
        }

        async attach(element) {
          const deadline = Date.now() + STREAM_WAIT_MS;
          while (!(element.srcObject instanceof MediaStream) && Date.now() < deadline)
            await sleep(POLL_MS);
          if (!(element.srcObject instanceof MediaStream)) throw new Fault("realtime");

          this.prime().connectAudio(element);
          this.#active = true;
        }

        read = () => {
          if (!this.#active) return SILENCE;
          this.#engine.processAudio();
          return this.#engine.viseme ?? SILENCE;
        };

        detach() {
          this.#active = false;
        }
      }

      const HEARTBEAT_MS = 30000;
      const IDLE_HANGUP_MS = 28000;
      const RECONNECT_GRACE_MS = 1200;
      const AWAY_RESET_MS = 3000;
      const MAX_FAILURES = 5;
      const RATE_COOLDOWN_MS = 300000;
      const TAB_CHANNEL = "sythera-call";

      class Call {
        #api;
        #bus;
        #host;
        #stage;
        #audio;
        #meter;
        #mic;
        #lipsync = new Lipsync();

        #rt = null;
        #sessionId = "";
        #startedAt = 0;
        #voiceAt = 0;
        #timer = 0;
        #beat = 0;
        #closing = false;
        #recovering = false;
        #connecting = false;
        #failures = 0;
        #coolUntil = 0;
        #tabs = null;

        constructor({ api, bus, host, stage, audio }) {
          this.#api = api;
          this.#bus = bus;
          this.#host = host;
          this.#stage = stage;
          this.#audio = audio;
          this.#meter = new Meter(bus);
          this.#mic = new Mic({ onLost: () => this.#lost() });
        }

        get live() {
          return Boolean(this.#rt);
        }

        get connecting() {
          return this.#connecting;
        }

        get meter() {
          return this.#meter;
        }

        get state() {
          if (this.live) return "live";
          return this.#connecting ? "connecting" : "idle";
        }

        syncBalance(seconds) {
          this.#meter.sync(seconds);
        }

        async start() {
          if (this.live || this.#connecting || this.#meter.empty) return;
          if (Date.now() < this.#coolUntil) return;
          this.#lipsync.prime();
          await this.#dial();
        }

        async #dial(resume = "") {
          if (this.live || this.#connecting || this.#meter.empty) return;
          this.#connecting = true;
          this.#bus.emit("call:connecting", { resume: Boolean(resume) });

          let rt = null;
          let grant = null;

          try {
            grant = await this.#api.post(
              resume ? "voice/resume" : "voice/start",
              resume ? { session_id: resume } : {},
            );

            this.#sessionId = grant.session_id;
            this.#meter.sync(grant.seconds_balance);

            await this.#mic.open();
            const transport = new OpenAIRealtimeWebRTC({
              audioElement: this.#audio,
              mediaStream: this.#mic.stream,
            });

            rt = new RealtimeSession(
              new RealtimeAgent({
                name: grant.agent ?? "Sythera",
                instructions: grant.instructions,
                voice: grant.voice,
                tools: this.#host.tools(),
              }),
              { transport, config: grant.session },
            );

            rt.on("error", () => this.hangUp());
            rt.on("transport_event", ({ type = "" }) => {
              if (type.endsWith("speech_started") || type.endsWith("speech_stopped"))
                this.#voiceAt = Date.now();
            });
            transport.on("connection_change", (state) => {
              if (state !== "disconnected" || !this.live || this.#closing) return;
              setTimeout(() => this.recover(), RECONNECT_GRACE_MS);
            });

            await rt.connect({ apiKey: grant.client_secret });

            this.#rt = rt;
            this.#startedAt = Date.now();
            this.#voiceAt = Date.now();
            this.#connecting = false;
            this.#failures = 0;
            this.#claimTab();

            await this.#lipsync.attach(this.#audio).catch(() => {});
            this.#stage.setVisemeSource(this.#lipsync.read);

            this.#timer = setInterval(() => this.#onSecond(), 1000);
            this.#beat = setInterval(() => this.#ping(), HEARTBEAT_MS);
            this.#bus.emit("call:started", { sessionId: this.#sessionId, resume: Boolean(resume) });
          } catch (error) {
            this.#connecting = false;
            rt?.close();
            this.#mic.close();

            const fault = faultOf(error);
            const reason = `${fault.code}:${error?.name ?? ""}:${String(error?.message ?? "").slice(0, 160)}`;
            if (grant?.session_id && !resume) await this.abort(grant.session_id, reason);

            this.#failures += 1;
            this.#coolUntil =
              Date.now() +
              (fault.code === "rate_limited"
                ? RATE_COOLDOWN_MS
                : Math.min(60000, 2000 * 2 ** this.#failures));

            if (fault.code === "no_balance") this.#meter.sync(0);
            this.#bus.emit("call:failed", { code: fault.code, status: fault.status, fault, reason });
          }
        }

        async recover() {
          if (this.#recovering || this.#closing || !this.live) return;
          this.#recovering = true;

          const sessionId = this.#sessionId;
          const rt = this.#rt;
          this.#rt = null;

          clearInterval(this.#timer);
          clearInterval(this.#beat);
          this.#stage.setVisemeSource(null);
          this.#lipsync.detach();
          rt.close();
          this.#mic.close();
          this.#meter.freeze();
          this.#bus.emit("call:recovering", { sessionId });

          await this.#dial(sessionId);
          this.#recovering = false;
          if (!this.live) await this.release(sessionId);
        }

        #claimTab() {
          this.#tabs ??= new BroadcastChannel(TAB_CHANNEL);
          this.#tabs.onmessage = ({ data }) => {
            if (data === "call") this.hangUp();
          };
          this.#tabs.postMessage("call");
        }

        async #ping() {
          const result = await this.#api.post("voice/ping", { session_id: this.#sessionId }).catch(
            () => null,
          );
          if (!result) return;
          if (result.ok === false) return void this.hangUp();
          this.#meter.sync(result.seconds_left);
        }

        #onSecond() {
          if (!this.#mic.healthy()) return void this.#lost();
          if (this.#meter.empty || Date.now() - this.#voiceAt > IDLE_HANGUP_MS) this.hangUp();
        }

        async #lost() {
          if (!this.live) return;
          await this.hangUp();
          this.#bus.emit("call:failed", { code: "mic_lost", fault: new Fault("mic_lost") });
        }

        notify(text) {
          if (!this.live) return false;
          this.#voiceAt = Date.now();
          this.#rt.sendMessage(text);
          return true;
        }

        send(event) {
          if (!this.live) return false;
          this.#voiceAt = Date.now();
          this.#rt.transport.sendEvent(event);
          return true;
        }

        offer(content) {
          return (
            this.send({
              type: "conversation.item.create",
              item: { type: "message", role: "user", content },
            }) && this.send({ type: "response.create" })
          );
        }

        async resume(asleep) {
          this.#audio.play().catch(() => {});
          if (!this.live) return;
          if (asleep > AWAY_RESET_MS || !this.#mic.healthy()) await this.#lost();
        }

        abort(sessionId, reason) {
          return this.#api.beacon("voice/abort", { session_id: sessionId, reason });
        }

        release(sessionId, clientSeconds = 0) {
          return this.#api
            .beacon("voice/finish", { session_id: sessionId, client_seconds: clientSeconds })
            .then((done) => this.#meter.sync(done?.seconds_balance));
        }

        async hangUp() {
          if (this.#closing || !this.live) return;
          this.#closing = true;

          clearInterval(this.#timer);
          clearInterval(this.#beat);

          const rt = this.#rt;
          const sessionId = this.#sessionId;
          const elapsed = Math.ceil((Date.now() - this.#startedAt) / 1000);

          this.#rt = null;
          this.#sessionId = "";
          this.#startedAt = 0;

          this.#stage.setVisemeSource(null);
          this.#lipsync.detach();
          rt.close();
          this.#mic.close();
          this.#meter.freeze();

          this.#bus.emit("call:ended", { sessionId, elapsed });
          await this.release(sessionId, elapsed);
          this.#closing = false;
        }

        get exhausted() {
          return this.#failures >= MAX_FAILURES;
        }

        dispose() {
          this.hangUp();
          this.#tabs?.close();
          this.#tabs = null;
        }
      }

      const PHASES = {
        scene: "Загружаю аватар",
        auth: "Проверяю доступ",
        graphics: "Перезапускаю графику",
      };

      const FAULTS = {
        denied: {
          title: "Микрофон заблокирован",
          hint: "Откройте настройки Telegram → Конфиденциальность → Микрофон и разрешите доступ, затем вернитесь сюда",
          retry: "Я разрешила",
        },
        mic_lost: {
          title: "Микрофон отключился",
          hint: "Так бывает после блокировки экрана или звонка. Коснитесь экрана, чтобы продолжить",
          retry: "Продолжить",
        },
        offline: { title: "Нет интернета", hint: "Включите Wi-Fi или мобильную сеть", retry: "Повторить" },
        unreachable: {
          title: "Сервер не отвечает",
          hint: "Проверьте соединение и попробуйте снова",
          retry: "Повторить",
        },
        timeout: {

        misconfigured: { title: "Сервер не настроен", hint: "Мы уже чиним. Попробуйте позже", retry: "Повторить" },
        internal: {
