<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Control" />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="importmap">
      {
        "imports": {
          "alpinejs": "https://esm.sh/alpinejs@3.15.8",
          "valibot": "https://esm.sh/valibot@1.1.0",
          "p-retry": "https://esm.sh/p-retry@7.1.1",
          "p-queue": "https://esm.sh/p-queue@9.1.0",
          "p-throttle": "https://esm.sh/p-throttle@8.1.0",
          "fuse.js": "https://esm.sh/fuse.js@7.1.0",
          "dayjs": "https://esm.sh/dayjs@1.11.20",
          "dayjs/plugin/relativeTime": "https://esm.sh/dayjs@1.11.20/plugin/relativeTime",
          "dayjs/plugin/customParseFormat": "https://esm.sh/dayjs@1.11.20/plugin/customParseFormat",
          "dayjs/locale/ru": "https://esm.sh/dayjs@1.11.20/locale/ru",
          "@bwip-js/browser": "https://esm.sh/@bwip-js/browser@4.8.0",
          "tinygesture": "https://esm.sh/tinygesture@3.0.0"
        }
      }
    </script>
    <style>
      @layer reset, tokens, base, layout, components, utilities, keyframes;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          -webkit-user-select: none;
          user-select: none;
        }
        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
          }
        }
      }

      @layer tokens {
        :root {
          --color-surface: var(--tg-theme-bg-color, #07080a);
          --color-surface-container: var(
            --tg-theme-secondary-bg-color,
            #101111
          );
          --color-surface-container-high: color-mix(
            in srgb,
            var(--color-surface-container) 88%,
            #fff 12%
          );
          --color-on-surface: var(--tg-theme-text-color, #f7f8f8);
          --color-on-surface-variant: var(--tg-theme-hint-color, #8a8f98);
          --color-primary: var(--tg-theme-button-color, #8b95ff);
          --color-on-primary: var(--tg-theme-button-text-color, #0b0c10);
          --color-error: var(--tg-theme-destructive-text-color, #ff6b6b);
          --color-success: #5fd68a;
          --color-warning: #e9d890;
          --color-outline: color-mix(
            in srgb,
            var(--color-on-surface) 10%,
            transparent
          );
          --color-outline-variant: color-mix(
            in srgb,
            var(--color-on-surface) 6%,
            transparent
          );
          --state-pressed: color-mix(
            in srgb,
            var(--color-on-surface) 8%,
            transparent
          );
          --color-stat-codes: var(--color-primary);
          --color-stat-category: var(--color-warning);
          --color-stat-ean8: #9aa3ff;
          --color-stat-ean13: var(--color-success);
          --radius-xs: 8px;
          --radius-sm: 12px;
          --radius-md: 16px;
          --radius-lg: 22px;
          --radius-xl: 28px;
          --radius-2xl: 34px;
          --radius-full: 9999px;
          --motion-standard: cubic-bezier(0.2, 0, 0, 1);
          --motion-decelerate: cubic-bezier(0, 0, 0, 1);
          --motion-spring: cubic-bezier(0.22, 1.2, 0.32, 1);
          --shadow-float:
            0 10px 32px color-mix(in srgb, #000 28%, transparent),
            0 1px 0 color-mix(in srgb, #fff 8%, transparent) inset;
          --font-sans: "Inter", "SF Pro Text", "SF Pro Display", system-ui,
            sans-serif;
          --font-mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
          --safe-top: 0px;
          --safe-bottom: 0px;
          --safe-left: 0px;
          --safe-right: 0px;
          --content-top: 0px;
          --content-bottom: 0px;
          --header-inset: max(var(--safe-top), env(safe-area-inset-top, 0px));
          --footer-inset: max(
            var(--content-bottom),
            env(safe-area-inset-bottom, 0px)
          );
          --inset-left: max(var(--safe-left), env(safe-area-inset-left, 0px));
          --inset-right: max(
            var(--safe-right),
            env(safe-area-inset-right, 0px)
          );
          --action-bar-height: 72px;
          --content-gap: 1rem;
        }
        body.is-search {
          --header-inset: max(
            var(--content-top),
            var(--safe-top),
            env(safe-area-inset-top, 0px)
          );
        }
      }

      @layer base {
        html {
          background: var(--color-surface);
          color: var(--color-on-surface);
          font-family: var(--font-sans);
          font-feature-settings: "cv01", "ss03", "cv11";
          letter-spacing: -0.011em;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
        }
        body {
          display: flex;
          flex-direction: column;
          min-block-size: var(--tg-viewport-stable-height, 100dvh);
          padding-inline: var(--inset-left) var(--inset-right);
          overflow-x: clip;
          overscroll-behavior-y: none;
          scrollbar-width: none;
          background:
            radial-gradient(
              120% 70% at 50% -10%,
              color-mix(in srgb, var(--color-primary) 16%, transparent),
              transparent 52%
            ),
            var(--color-surface);
        }
        body::-webkit-scrollbar {
          display: none;
        }
        [x-cloak] {
          display: none !important;
        }
      }

      @layer layout {
        .page {
          display: flex;
          flex-direction: column;
          flex: 1;
          inline-size: 100%;
          max-inline-size: 28rem;
          margin-inline: auto;
          padding-inline: 1rem;
        }
        .page--center {
          align-items: center;
          justify-content: center;
          min-block-size: var(--tg-viewport-stable-height, 100dvh);
          padding-block: var(--header-inset) var(--footer-inset);
        }
      }

      @layer components {
        .top-bar {
          position: sticky;
          inset-block-start: 0;
          z-index: 30;
          margin-inline: -1rem;
          padding-block-start: var(--header-inset);
          padding-inline: 1rem;
          background: color-mix(in srgb, var(--color-surface) 58%, transparent);
          backdrop-filter: blur(36px) saturate(1.8);
          -webkit-backdrop-filter: blur(36px) saturate(1.8);
          border-block-end: 1px solid
            color-mix(in srgb, var(--color-on-surface) 8%, transparent);
          transition: padding-block-start 300ms var(--motion-standard);
        }

        .app-header {
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-block: 1.15rem 0.75rem;
          overflow: hidden;
          max-block-size: 160px;
          opacity: 1;
          transition:
            max-block-size 300ms var(--motion-standard),
            opacity 200ms var(--motion-standard),
            padding-block 300ms var(--motion-standard);
        }
        .app-header--hidden {
          max-block-size: 0;
          opacity: 0;
          padding-block: 0;
          pointer-events: none;
        }
        .app-header__title {
          font-size: 1.375rem;
          font-weight: 590;
          letter-spacing: -0.04em;
          line-height: 1;
        }
        .app-header__subtitle {
          margin-block-start: 0.3rem;
          font-family: var(--font-mono);
          font-size: 0.625rem;
          font-weight: 500;
          letter-spacing: 0.14em;
          color: var(--color-on-surface-variant);
          text-transform: uppercase;
        }

        .search-bar {
          position: relative;
          padding-block-end: 0.625rem;
          transition: padding-block-start 300ms var(--motion-standard);
        }
        .top-bar--search .search-bar {
          padding-block-start: 0.625rem;
        }
        .search-bar__field {
          position: relative;
          display: flex;
          align-items: center;
        }
        .search-bar__icon {
          position: absolute;
          inset-block-start: 50%;
          inset-inline-start: 0.75rem;
          translate: 0 -50%;
          color: var(--color-on-surface-variant);
          pointer-events: none;
        }
        .search-bar__input {
          inline-size: 100%;
          padding: 0.7rem 2.85rem 0.7rem 2.45rem;
          border: 1px solid color-mix(in srgb, var(--color-on-surface) 10%, transparent);
          border-radius: var(--radius-full);
          background: color-mix(
            in srgb,
            var(--color-surface-container) 70%,
            transparent
          );
          box-shadow: 0 1px 0 color-mix(in srgb, #fff 6%, transparent) inset;
          color: var(--color-on-surface);
          font-family: var(--font-sans);
          font-size: 0.875rem;
          letter-spacing: -0.016em;
          outline: none;
          -webkit-user-select: text;
          user-select: text;
          transition:
            border-color 200ms var(--motion-standard),
            background 200ms var(--motion-standard);
        }
        .search-bar__input::placeholder {
          color: var(--color-on-surface-variant);
        }
        .search-bar__input:focus {
          border-color: var(--color-primary);
        }
        .search-bar__input::-webkit-search-cancel-button {
          display: none;
        }
        .search-bar__clear {
          position: absolute;
          inset-block-start: 50%;
          inset-inline-end: 0.375rem;
          translate: 0 -50%;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          inline-size: 28px;
          block-size: 28px;
          border: none;
          border-radius: var(--radius-full);
          background: transparent;
          color: var(--color-on-surface-variant);
          cursor: pointer;
          touch-action: manipulation;
        }
        .search-bar__clear:active {
          background: var(--state-pressed);
        }

        .tabs {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          scrollbar-width: none;
          padding-block-end: 0.625rem;
          margin-inline: -1rem;
          padding-inline: 1rem;
          scroll-snap-type: x proximity;
          -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar {
          display: none;
        }
        .tab {
          flex-shrink: 0;
          padding: 8px 14px;
          border: 1px solid var(--color-outline-variant);
          border-radius: var(--radius-full);
          min-block-size: 34px;
          background: transparent;
          color: var(--color-on-surface-variant);
          font-family: var(--font-sans);
          font-size: 0.75rem;
          font-weight: 500;
          letter-spacing: -0.01em;
          white-space: nowrap;
          cursor: pointer;
          touch-action: manipulation;
          scroll-snap-align: start;
          transition:
            background 160ms var(--motion-standard),
            color 160ms var(--motion-standard),
            border-color 160ms var(--motion-standard),
            transform 100ms var(--motion-spring);
        }
        .tab:active {
          transform: scale(0.92);
        }
        .tab--active {
          background: color-mix(in srgb, var(--color-on-surface) 14%, transparent);
          border-color: color-mix(in srgb, var(--color-on-surface) 20%, transparent);
          color: var(--color-on-surface);
          box-shadow: 0 1px 0 color-mix(in srgb, #fff 10%, transparent) inset;
        }

        .content-area {
          flex: 1;
          padding-block-start: var(--content-gap);
          padding-block-end: calc(
            var(--footer-inset) + var(--action-bar-height) + 8px
          );
        }

        .paywall {
          display: flex;
          flex-direction: column;
          align-items: center;
          inline-size: 100%;
          padding: 2.25rem 1.25rem 2rem;
          border: 1px solid color-mix(in srgb, var(--color-on-surface) 10%, transparent);
          border-radius: var(--radius-2xl);
          background: color-mix(
            in srgb,
            var(--color-surface-container) 72%,
            transparent
          );
          box-shadow: var(--shadow-float);
          backdrop-filter: blur(24px) saturate(1.4);
          text-align: center;
        }
        .paywall__icon {
          display: flex;
          align-items: center;
          justify-content: center;
          inline-size: 64px;
          block-size: 64px;
          border: 1px solid var(--color-outline);
          border-radius: 22px;
          background: color-mix(in srgb, var(--color-on-surface) 4%, transparent);
          color: var(--color-on-surface);
        }
        .paywall__greeting {
          margin-block-start: 1.5rem;
          font-size: 0.75rem;
          font-weight: 500;
          letter-spacing: 0.02em;
          color: var(--color-on-surface-variant);
        }
        .paywall__title {
          margin-block-start: 0.375rem;
          font-size: 1.125rem;
          font-weight: 700;
          letter-spacing: -0.01em;
          text-wrap: balance;
        }
        .paywall__description {
          margin-block-start: 0.625rem;
          max-inline-size: 18rem;
          font-size: 0.875rem;
          line-height: 1.5;
          color: var(--color-on-surface-variant);
          text-wrap: balance;
        }
        .paywall__features {
          display: flex;
          flex-direction: column;
          gap: 0.625rem;
          margin-block-start: 1.5rem;
          list-style: none;
          text-align: start;
        }
        .paywall__features li {
          display: flex;
          align-items: flex-start;
          gap: 0.625rem;
          font-size: 0.8125rem;
          line-height: 1.45;
          color: var(--color-on-surface-variant);
        }
        .paywall__features li::before {
          content: "✓";
          flex-shrink: 0;
          font-weight: 700;
          color: var(--color-success);
        }
        .paywall__action {
          margin-block-start: 1.75rem;
          inline-size: 100%;
          max-inline-size: 16rem;
          padding-block: 14px;
        }
        .paywall__note {
          margin-block-start: 1rem;
          max-inline-size: 17rem;
          font-size: 0.6875rem;
          line-height: 1.45;
          color: var(--color-on-surface-variant);
          opacity: 0.8;
          text-wrap: balance;
        }

        .empty-state {
          display: flex;
          flex-direction: column;
          align-items: center;
          inline-size: 100%;
          padding: 2.75rem 1.5rem;
          border: 1px solid color-mix(in srgb, var(--color-on-surface) 10%, transparent);
          border-radius: var(--radius-2xl);
          background: color-mix(
            in srgb,
            var(--color-surface-container) 68%,
            transparent
          );
          box-shadow: var(--shadow-float);
          text-align: center;
        }
        .empty-state__icon {
          display: flex;
          align-items: center;
          justify-content: center;
          inline-size: 84px;
          block-size: 84px;
          border-radius: 28px;
        }
        .empty-state__icon--muted {
          border: 1px solid var(--color-outline-variant);
          background: var(--color-surface);
        }
        .empty-state__title {
          margin-block-start: 1.75rem;
          font-size: 1.0625rem;
          font-weight: 600;
          overflow-wrap: anywhere;
          text-wrap: balance;
        }
        .empty-state__description {
          margin-block-start: 0.5rem;
          max-inline-size: 16rem;
          font-size: 0.875rem;
          line-height: 1.45;
          color: var(--color-on-surface-variant);
          text-wrap: balance;
        }
        .empty-state__badges {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          margin-block-start: 1.5rem;
        }
        .empty-state--compact {
          padding: 2.5rem 2rem;
        }

        .stats-card {
          margin-block-end: 0.85rem;
          padding: 0.75rem 0.2rem 0.15rem;
          border: none;
          border-radius: 0;
          background: transparent;
          animation: card-in 260ms var(--motion-spring) both;
        }
        .stats-card__head {
          display: flex;
          align-items: center;
          gap: 7px;
          margin-block-end: 0.75rem;
          color: var(--color-on-surface);
          font-size: 0.75rem;
          font-weight: 600;
          letter-spacing: 0.01em;
        }
        .stats-card__head svg {
          flex-shrink: 0;
          color: var(--color-primary);
        }
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr));
          gap: 0.5rem;
        }
        .stat {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          gap: 0.3rem;
          padding: 0.15rem 0.55rem;
          border: none;
          border-inline-start: 1px solid var(--color-outline-variant);
          border-radius: 0;
          background: transparent;
          text-align: start;
          animation: card-in 320ms var(--motion-spring) var(--stat-d, 0ms) both;
        }
        .stat:first-child {
          border-inline-start: none;
          padding-inline-start: 0.15rem;
        }
        .stat__value {
          font-family: var(--font-mono);
          font-size: 1.125rem;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
          line-height: 1;
          letter-spacing: -0.03em;
          color: var(--color-on-surface);
        }
        .stat__label {
          font-size: 0.5625rem;
          font-weight: 600;
          letter-spacing: 0.04em;
          line-height: 1.1;
          color: var(--color-on-surface-variant);
          text-transform: uppercase;
        }
        .stat--accent {
          border-color: var(--color-outline-variant);
          background: transparent;
        }
        .stat--accent .stat__value {
          color: var(--color-stat-codes);
        }
        .stat--category {
          border-color: var(--color-outline-variant);
          background: transparent;
        }
        .stat--category .stat__value {
          color: var(--color-stat-category);
        }
        .stat--ean8 {
          border-color: var(--color-outline-variant);
          background: transparent;
        }
        .stat--ean8 .stat__value {
          color: var(--color-stat-ean8);
        }
        .stat--ean13 {
          border-color: var(--color-outline-variant);
          background: transparent;
        }
        .stat--ean13 .stat__value {
          color: var(--color-stat-ean13);
        }

        .item-list {
          list-style: none;
        }
        .item-list > li + li > .swipe-wrapper {
          margin-block-start: 0.75rem;
        }

        .swipe-wrapper {
          position: relative;
          overflow: hidden;
          border-radius: var(--radius-xl);
        }
        .swipe-wrapper__delete {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
          padding-inline-end: 1.5rem;
          border-radius: var(--radius-xl);
          background: color-mix(
            in srgb,
            var(--color-error) 15%,
            var(--color-surface-container)
          );
          color: var(--color-error);
          font-size: 0.8125rem;
          font-weight: 500;
          pointer-events: none;
        }

        .barcode-card {
          position: relative;
          z-index: 1;
          overflow: hidden;
          border: 1px solid color-mix(in srgb, var(--color-on-surface) 10%, transparent);
          border-radius: var(--radius-xl);
          background: color-mix(
            in srgb,
            var(--color-surface-container) 78%,
            transparent
          );
          box-shadow:
            0 10px 28px color-mix(in srgb, #000 18%, transparent),
            0 1px 0 color-mix(in srgb, #fff 7%, transparent) inset;
          transition:
            transform 180ms var(--motion-spring),
            box-shadow 180ms var(--motion-standard),
            border-color 180ms var(--motion-standard);
        }
        .barcode-card:active {
          transform: scale(0.985);
          border-color: color-mix(in srgb, var(--color-primary) 28%, transparent);
        }
        .barcode-card--swiping {
          will-change: transform;
        }
        .barcode-card__header {
          display: flex;
          align-items: flex-start;
          gap: 0.625rem;
          padding: 0.875rem 0.5rem 0.75rem 1rem;
        }
        .barcode-card__body {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-inline-size: 0;
          gap: 0.25rem;
        }
        .barcode-card__actions {
          display: flex;
          align-items: center;
          flex-shrink: 0;
        }
        .barcode-card__title {
          display: block;
          inline-size: 100%;
          padding: 0;
          border: none;
          background: none;
          cursor: pointer;
          text-align: start;
          font-family: var(--font-mono);
          font-size: 1.05rem;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.01em;
          line-height: 1.3;
          color: var(--color-on-surface);
          touch-action: manipulation;
          transition: opacity 120ms var(--motion-standard);
        }
        .barcode-card__title:active {
          opacity: 0.5;
        }
        .barcode-card__title--name {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          overflow: hidden;
          overflow-wrap: anywhere;
          font-family: var(--font-sans);
          font-size: 0.9375rem;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        .barcode-card__subcode {
          padding: 0;
          border: none;
          background: none;
          cursor: pointer;
          text-align: start;
          font-family: var(--font-mono);
          font-size: 0.8125rem;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.03em;
          line-height: 1.3;
          color: var(--color-on-surface-variant);
          touch-action: manipulation;
          transition: opacity 120ms var(--motion-standard);
        }
        .barcode-card__subcode:active {
          opacity: 0.5;
        }
        .barcode-card__meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 0.3rem;
          margin-block-start: 0.125rem;
        }
        .barcode-card__timestamp {
          margin-block-start: 0.125rem;
          font-family: var(--font-mono);
          font-size: 0.625rem;
          font-variant-numeric: tabular-nums;
          color: var(--color-on-surface-variant);

          font-weight: 650;
          letter-spacing: 0.06em;

          color: var(--color-on-surface-variant);
        }
        .debug-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .debug-chip {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 8px 12px;
          border: 1px solid var(--color-outline);
          border-radius: var(--radius-full);
          background: transparent;
          color: var(--color-on-surface);

          font-weight: 550;

          touch-action: manipulation;

          border-color: color-mix(in srgb, var(--color-success) 30%, transparent);

        }

          color: var(--color-warning);
        }
        .debug-chip--err {
          border-color: color-mix(in srgb, var(--color-error) 28%, transparent);
          color: var(--color-error);
        }
        .debug-textarea,
        .debug-log {
          inline-size: 100%;
          min-block-size: 5.5rem;
          padding: 0.7rem 0.75rem;
          border: 1px solid var(--color-outline);
          border-radius: var(--radius-md);
          background: var(--color-surface);
          color: var(--color-on-surface);
          font-family: var(--font-mono);
          font-size: 0.6875rem;
          line-height: 1.45;

          outline: none;

          min-block-size: 7rem;
          max-block-size: 12rem;
          overflow: auto;
          white-space: pre-wrap;
          word-break: break-word;
        }
        .module-row {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 10px;
          padding-block: 0.55rem;
        }
        .module-row + .module-row {
          border-block-start: 1px solid var(--color-outline-variant);
        }
        .module-row__name {
          font-size: 0.8125rem;
          font-weight: 600;
        }
        .module-row__desc {
          margin-block-start: 0.15rem;
          font-size: 0.6875rem;
          line-height: 1.35;
          color: var(--color-on-surface-variant);
        }
        .switch {
          position: relative;
          flex-shrink: 0;
          inline-size: 42px;
          block-size: 26px;
          border: none;
          border-radius: var(--radius-full);
          background: color-mix(in srgb, var(--color-on-surface) 16%, transparent);
          cursor: pointer;
        }
        .switch--on {
          background: var(--color-primary);
        }
        .switch::after {
          content: "";
          position: absolute;
          inset-block-start: 3px;
          inset-inline-start: 3px;
          inline-size: 20px;
          block-size: 20px;
          border-radius: var(--radius-full);
          background: #fff;
          transition: translate 180ms var(--motion-spring);
        }
        .switch--on::after {
          translate: 16px 0;
        }
      }

      @layer utilities {
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
          outline: 2px solid color-mix(in srgb, var(--color-primary) 70%, transparent);
          outline-offset: 2px;
        }
        .anim-fade {
          animation: fade-in 200ms var(--motion-standard) both;
        }
        .anim-slide {
          animation: slide-up 280ms var(--motion-decelerate) both;
        }
        .anim-breathe {
          animation: breathe 3.5s ease-in-out infinite;
        }
        .anim-card-in {
          animation: card-in 260ms var(--motion-spring) var(--d, 0ms) both;
        }
        .transition-enter,
        .transition-leave {
          transition:
            opacity 180ms var(--motion-standard),
            transform 180ms var(--motion-spring);
        }
        .transition-from {
          opacity: 0;
          transform: scale(0.92) translateY(6px);
        }
        .transition-to {
          opacity: 1;
          transform: none;
        }
      }

      @layer keyframes {
        @keyframes fade-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes slide-up {
          from {
            opacity: 0;
            transform: translateY(16px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        @keyframes slide-down {
          from {
            opacity: 0;
            transform: translateY(-8px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        @keyframes shimmer {
          from {
            background-position: 200% 0;
          }
          to {
            background-position: -200% 0;
          }
        }
        @keyframes breathe {
          0%,
          100% {
            opacity: 1;
            scale: 1;
          }
          50% {
            opacity: 0.6;
            scale: 0.9;
          }
        }
        @keyframes card-in {
          from {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        @keyframes card-out {
          to {
            opacity: 0;
            transform: translateX(-20px) scale(0.95);
          }
        }
      }
    </style>

      const bwip = bwipModule.default ?? bwipModule;
      const tg = window.Telegram.WebApp;

      const supports = (ver) => {

      const ALLOWED_IDS = new Set([]);

      const INVOICE_SLUG = "mGr3ACeugEhDEwAAB4X854X26EY";
      const INVOICE_URL = `https://t.me/$${INVOICE_SLUG}`;
      const LICENSE_KEY = "ctrl_license";
      const APP_VERSION = "2.0.0";

      const CLOUD_CHUNK_RE = /^ctrl_c\d+$/;
