      const CLOUD_MAX_CHUNKS = 22;
      const SKELETON_DURATION = 600;
      const TOAST_DURATION = 2400;
      const API_TIMEOUT = 3000;
      const MAX_ITEMS = 400;
      const MAX_RAW_LENGTH = 512;
      const MAX_FIELD_LENGTH = 180;
      const LOCAL_ITEMS_KEY = "ctrl_items_v2";
      const LOCAL_LICENSE_KEY = "ctrl_license_v2";
      const LOCAL_SETTINGS_KEY = "ctrl_settings_v2";
      const LOCAL_DEBUG_KEY = "ctrl_debug";
      const EAN_PATTERN = /^(?:\d{8}|\d{13})$/;
      const TICKET_DATE_FORMAT = "DD.MM.YYYY";
      const NO_CATEGORY = "Без категории";
      const SETTINGS_VERSION = 1;

      const HistoryEntrySchema = v.object({
        price: v.string(),
        date: v.string(),
        ticketTs: v.number(),
        ts: v.number(),
      });

      const BoundedString = (max) =>
        v.pipe(v.string(), v.trim(), v.maxLength(max));

      const StoredRecordSchema = v.looseObject({
        id: v.optional(v.pipe(v.string(), v.minLength(1), v.maxLength(80))),
        code: v.pipe(v.string(), v.trim(), v.regex(EAN_PATTERN)),
        raw: v.nullish(BoundedString(MAX_RAW_LENGTH)),
        ts: v.nullish(v.number()),
        ticketTs: v.nullish(v.number()),
        price: v.nullish(v.union([v.string(), v.number()])),
        date: v.nullish(v.string()),
        name: v.nullish(BoundedString(MAX_FIELD_LENGTH)),
        brand: v.nullish(BoundedString(MAX_FIELD_LENGTH)),
        category: v.nullish(BoundedString(MAX_FIELD_LENGTH)),
        moduleId: v.nullish(BoundedString(32)),
        moduleLabel: v.nullish(BoundedString(24)),
        history: v.nullish(v.array(v.unknown())),
      });

      const SettingsSchema = v.object({
        version: v.literal(SETTINGS_VERSION),
        modules: v.record(v.string(), v.boolean()),
      });

      const LicenseSchema = v.object({
        version: v.literal(1),
        product: v.literal(INVOICE_SLUG),
        paidAt: v.pipe(v.number(), v.minValue(0)),
      });

      const checkIdentityAccess = () => {
        const user = tg.initDataUnsafe?.user;
        if (!user) return false;
        if ((user.first_name ?? "").toLowerCase() === ALLOWED_FIRST_NAME)
          return true;
        return ALLOWED_IDS.has(user.id ?? -1);
      };

      const randomId = () =>
        globalThis.crypto?.randomUUID?.() ??
        `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

      const cssEscape = (value) =>
        typeof CSS !== "undefined" && CSS.escape
          ? CSS.escape(value)
          : String(value).replace(/[^\w-]/g, "_");

      const debounce = (fn, ms) => {
        let id;
        const wrapped = (...args) => {
          clearTimeout(id);
          id = setTimeout(() => fn(...args), ms);
        };
        wrapped.cancel = () => clearTimeout(id);
        return wrapped;
      };

      const bus = new EventTarget();
      const emit = (type, detail) =>
        bus.dispatchEvent(new CustomEvent(type, { detail }));
      const on = (type, fn) => bus.addEventListener(type, (e) => fn(e.detail));

      const throttledFetch = pThrottle({ limit: 2, interval: 1000 })((url) =>
        fetch(url, {
          signal: AbortSignal.timeout(API_TIMEOUT),
          headers: { Accept: "application/json" },
        }).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }),
      );

      const priceFormatter = new Intl.NumberFormat("ru-RU", {
        maximumFractionDigits: 2,
      });

      const htmlEntityDecoder =
        typeof DOMParser !== "undefined" ? new DOMParser() : null;

      const decodeEntities = (value) => {
        if (typeof value !== "string" || value.indexOf("&") === -1)
          return value;
        if (htmlEntityDecoder) {
          return (
            htmlEntityDecoder.parseFromString(value, "text/html")
              .documentElement.textContent ?? value
          );
        }
        return value;
      };

      const clampText = (value, max = MAX_FIELD_LENGTH) => {
        if (typeof value !== "string") return value;
        return value.length > max ? value.slice(0, max) : value;
      };

      const cleanField = (value) => {
        if (typeof value !== "string") return value;
        const decoded = clampText(decodeEntities(value).trim());
        return decoded || null;
      };

      const safeJsonParse = (raw) => {
        if (typeof raw !== "string" || !raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      };

      const normalizeScanText = (raw) => {
        if (typeof raw !== "string") return "";
        return clampText(
          raw.replace(/[\s\u00a0\u200b\ufeff]+/g, ""),
          MAX_RAW_LENGTH,
        );
      };

      const parsePrice = (val) => {
        const n = Number.parseFloat(
          String(val).replace(/\s/g, "").replace(",", "."),
        );
        return Number.isFinite(n) ? n : NaN;
      };

      const relativeTime = (ts, now = Date.now()) => {
        const d = dayjs(ts);
        return dayjs(now).diff(d, "day") < 7
          ? d.fromNow()
          : d.format("DD.MM.YYYY HH:mm");
      };

      const dateKey = (ts) => dayjs(ts).format("YYYY-MM-DD");

      const dateLabelAt = (ts, now) => {
        const d = dayjs(ts);
        const ref = dayjs(now);
        if (ref.isSame(d, "day")) return "Сегодня";
        if (ref.subtract(1, "day").isSame(d, "day")) return "Вчера";
        return d.year() === ref.year()
          ? d.format("D MMMM")
          : d.format("D MMMM YYYY");
      };

      const formatPrice = (val) =>
        val != null && Number(val) > 0
          ? priceFormatter.format(Number(val))
          : null;

      const ticketDateToTs = (date) => {
        if (typeof date !== "string") return null;
        const parsed = dayjs(date, TICKET_DATE_FORMAT, true);
        return parsed.isValid() ? parsed.valueOf() : null;
      };

      const eanCheckDigit = (digits) => {
        const sum = [...digits].reduce((acc, ch, i) => {
          const weight =
            digits.length % 2 === 0
              ? i % 2 === 0
                ? 1
                : 3
              : i % 2 === 0
                ? 3
                : 1;
          return acc + Number(ch) * weight;
        }, 0);
        return String((10 - (sum % 10)) % 10);
      };

      const normalizeEan = (code) => {
        if (/^\d{8}$/.test(code) || /^\d{13}$/.test(code)) {
          const body = code.slice(0, -1);
          return body + eanCheckDigit(body);
        }
        if (/^\d{7}$/.test(code) || /^\d{12}$/.test(code))
          return code + eanCheckDigit(code);
        return null;
      };

      // Новый формат: добавьте объект в SCAN_MODULE_DEFS или
      // ControlScan.register({ id, label, description, priority, pattern, parse(raw) })
      const SCAN_MODULE_DEFS = [
        {
          id: "cen",
          label: "CEN",
          description: "Российские ценники CEN;EAN;цена;…;дата",
          enabled: true,
          priority: 100,
          pattern:
            /^CEN;(\d{7,8}|\d{12,13});(\d+(?:[.,]\d{1,2})?);\d+;\d+;(\d{2}\.\d{2}\.\d{2})(?:;[\d.]*)?$/,
          parse(raw) {
            const compact = normalizeScanText(raw);
            if (!compact.startsWith("CEN;")) return null;
            const match = this.pattern.exec(compact);
            if (!match) return null;
            const [, rawCode, priceStr, dateStr] = match;
            const code = normalizeEan(rawCode);
            if (!code || !EAN_PATTERN.test(code)) return null;
            const ticketDate = dayjs(dateStr, "DD.MM.YY", true);
            if (!ticketDate.isValid()) return null;
            return {
              code,
              raw: compact,
              price: Number.parseFloat(priceStr.replace(",", ".")) || null,
              date: ticketDate.format(TICKET_DATE_FORMAT),
            };
          },
        },
        {
          id: "gs1",
          label: "GS1",
          description: "GS1 AI (01) GTIN, FNC1 / ]C1 / скобки",
          enabled: true,
          priority: 80,
          pattern:
            /(?:^|[^0-9])01(\d{8}|\d{12,14})(?:[^0-9]|$)|\]C1.?01(\d{8}|\d{12,14})|\(01\)(\d{8}|\d{12,14})/,
          parse(raw) {
            const compact = normalizeScanText(raw);
            const match = this.pattern.exec(compact);
            if (!match) return null;
            let digits = match[1] || match[2] || match[3];
            if (!digits) return null;
            if (digits.length === 14) digits = digits.slice(1);
            if (digits.length === 12) digits = `0${digits}`;
            const code = normalizeEan(digits);
            if (!code || !EAN_PATTERN.test(code)) return null;
            return { code, raw: compact, price: null, date: null };
          },
        },
        {
          id: "ean",
          label: "EAN",
          description: "Голый EAN-8 / EAN-13 из QR или штрих-кода",
          enabled: true,
          priority: 20,
          pattern: /(?:^|[^0-9])(\d{8}|\d{12,13})(?:[^0-9]|$)/,
          parse(raw) {
            const compact = normalizeScanText(raw);
            if (compact.startsWith("CEN;")) return null;
            const match = this.pattern.exec(compact);
            if (!match) return null;
            let digits = match[1];
            if (digits.length === 12) digits = normalizeEan(digits);
            const code = normalizeEan(digits);
            if (!code || !EAN_PATTERN.test(code)) return null;
            return { code, raw: compact, price: null, date: null };
          },
        },
      ];

      const cloneModules = (overrides = {}) =>
        SCAN_MODULE_DEFS.map((mod) => ({
          id: mod.id,
          label: mod.label,
          description: mod.description,
          enabled: overrides[mod.id] ?? mod.enabled,
          priority: mod.priority,
          pattern: mod.pattern,
          parse: mod.parse,
        })).sort((a, b) => b.priority - a.priority);

      let activeModules = cloneModules();

      const parseScanPayload = (raw, modules = activeModules) => {
        if (typeof raw !== "string" || raw.length > MAX_RAW_LENGTH * 2)
          return null;
        const enabled = modules.filter((m) => m.enabled);
        for (const mod of enabled) {
          try {
            const parsed = mod.parse(raw);
            if (!parsed?.code || !EAN_PATTERN.test(parsed.code)) continue;
            return {
              code: parsed.code,
              raw: clampText(parsed.raw ?? normalizeScanText(raw), MAX_RAW_LENGTH),
              price: Number.isFinite(parsed.price) ? parsed.price : null,
              date: parsed.date ?? null,
              name: parsed.name ?? null,
              brand: parsed.brand ?? null,
              category: parsed.category ?? null,
              moduleId: mod.id,
              moduleLabel: mod.label,
            };
          } catch {
            continue;
          }
        }
        return null;
      };

      const PARSER_SAMPLES = [
        "CEN;4600605021084;129.99;1;1;28.09.26",
        "CEN;4600605;89;1;1;01.01.26",
        "4600605021084",
        "(01)04600605021084",
        "]C10104600605021084",
      ];

      const registerScanModule = (definition) => {
        if (!definition?.id || typeof definition.parse !== "function")
          throw new Error("Scan module requires id and parse()");
        const idx = SCAN_MODULE_DEFS.findIndex((m) => m.id === definition.id);
        const next = {
          enabled: true,
          priority: 50,
          label: definition.id,
          description: "",
          pattern: definition.pattern ?? /.^/,
          ...definition,
        };
        if (idx >= 0) SCAN_MODULE_DEFS[idx] = { ...SCAN_MODULE_DEFS[idx], ...next };
        else SCAN_MODULE_DEFS.push(next);
        activeModules = cloneModules(
          Object.fromEntries(activeModules.map((m) => [m.id, m.enabled])),
        );
        return next.id;
      };

      globalThis.ControlScan = {
        version: APP_VERSION,
        modules: () => activeModules.map(({ parse, ...rest }) => rest),
        register: registerScanModule,
        parse: (raw) => parseScanPayload(raw, activeModules),
        samples: PARSER_SAMPLES,
      };

      const RENDER_FLAGS = {
        qrOk: false,
        qrErr: false,
        bcOk: false,
        bcErr: false,
      };

      const createItem = (data) => ({
        id: data.id ?? randomId(),
        code: data.code,
        raw: data.raw ?? null,
        price: data.price ?? null,
        date: data.date ?? null,
        ticketTs: data.ticketTs ?? ticketDateToTs(data.date) ?? null,
        name: data.name ?? null,
        brand: data.brand ?? null,
        category: data.category ?? null,
        moduleId: data.moduleId ?? "cen",
        moduleLabel: data.moduleLabel ?? "CEN",
        ts: data.ts ?? Date.now(),
        history: Array.isArray(data.history) ? data.history : [],
        ...RENDER_FLAGS,
      });

      const sanitizeRecord = (input) => {
        const parsed = v.safeParse(StoredRecordSchema, input);
        if (!parsed.success) return null;
        const rec = parsed.output;
        const ts = Number.isFinite(rec.ts) ? rec.ts : Date.now();
        const date = rec.date ?? null;
        const ticketTs = Number.isFinite(rec.ticketTs)
          ? rec.ticketTs
          : ticketDateToTs(date);
        const price = rec.price != null ? String(rec.price) : null;
        let history = (rec.history ?? [])
          .map((entry) => v.safeParse(HistoryEntrySchema, entry))
          .filter((r) => r.success)
          .map((r) => r.output);
        if (!history.length && price && date && ticketTs != null)
          history = [{ price, date, ticketTs, ts }];
        return createItem({
          id: rec.id ?? randomId(),
          code: rec.code,
          raw: rec.raw ?? null,
          ts,
          ticketTs,
          price,
          date,
          name: rec.name ?? null,
          brand: rec.brand ?? null,
          category: rec.category ?? null,
          moduleId: rec.moduleId ?? "cen",
          moduleLabel: rec.moduleLabel ?? "CEN",
          history,
        });
      };

      const stripFlags = ({ qrOk, qrErr, bcOk, bcErr, ...rest }) => rest;

      const historySignature = (history) =>
        Array.isArray(history)
          ? history.map((h) => `${h.ticketTs}:${h.price}`).join(">")
          : "";

      const mergeHistories = (a, b) => {
        const map = new Map();
        for (const h of [...(a.history ?? []), ...(b.history ?? [])]) {
          const ex = map.get(h.ticketTs);
          if (!ex || h.ts > ex.ts) map.set(h.ticketTs, h);
        }
        const history = [...map.values()].sort(
          (x, y) => x.ticketTs - y.ticketTs,
        );
        const base = a.ts >= b.ts ? a : b;
        const latest = history.at(-1) ?? null;
        return {
          ...base,
          id: a.id < b.id ? a.id : b.id,
          history,
          price: latest ? latest.price : base.price,
          date: latest ? latest.date : base.date,
          ticketTs: latest ? latest.ticketTs : base.ticketTs,
          raw: base.raw,
          name: a.name ?? b.name,
          brand: a.brand ?? b.brand,
          category: a.category ?? b.category,
          moduleId: base.moduleId ?? a.moduleId ?? b.moduleId ?? "cen",
          moduleLabel:
            base.moduleLabel ?? a.moduleLabel ?? b.moduleLabel ?? "CEN",
          ts: Math.max(a.ts, b.ts),
          ...RENDER_FLAGS,
        };
      };

      const mergeItems = (a, b) => {
        const byCode = new Map();
        for (const item of [...a, ...b]) {
          const ex = byCode.get(item.code);
          byCode.set(item.code, ex ? mergeHistories(ex, item) : item);
        }
        return [...byCode.values()]
          .sort((x, y) => y.ts - x.ts || (x.id < y.id ? 1 : -1))
          .slice(0, MAX_ITEMS);
      };

      const signature = (items) =>
        items
          .map(
            (i) =>
              `${i.id}:${i.code}:${i.ts}:${i.ticketTs ?? ""}:${i.price ?? ""}:${i.date ?? ""}:${i.name ?? ""}:${i.brand ?? ""}:${i.category ?? ""}:${i.moduleId ?? ""}:${historySignature(i.history)}`,
          )
          .sort()
          .join("|");

      const EMPTY_HISTORY = Object.freeze([]);

      const categoryColorCache = new Map();
      const categoryColorFor = (name) => {
        if (name === NO_CATEGORY) return "var(--color-on-surface-variant)";
        const cached = categoryColorCache.get(name);
        if (cached) return cached;
        let hash = 0;
        for (let i = 0; i < name.length; i++)
          hash = (Math.imul(hash, 31) + name.charCodeAt(i)) | 0;
        const hue = ((hash % 360) + 360) % 360;
        const sat = 58 + (Math.abs(hash >> 9) % 18);
        const light = 60 + (Math.abs(hash >> 17) % 12);
        const color = `hsl(${hue} ${sat}% ${light}%)`;
        categoryColorCache.set(name, color);
        return color;
      };

      const buildItemHistory = (item) => {
        const asc = (item.history ?? [])
          .slice()
          .sort((a, b) => a.ticketTs - b.ticketTs);
        const decorated = asc.map((r, idx) => {
          const priceNum = parsePrice(r.price);
          const prevNum = idx === 0 ? null : parsePrice(asc[idx - 1].price);
          return {
            key: `${r.ticketTs}:${r.ts}`,
            date: dayjs(r.ticketTs).format("DD.MM.YY"),
            price: r.price,
            trend:
              prevNum == null || Number.isNaN(priceNum) || Number.isNaN(prevNum)
                ? null
                : priceNum > prevNum
                  ? "up"
                  : priceNum < prevNum
                    ? "down"
                    : null,
          };
        });
        const reversed = decorated.reverse();
        if (reversed.length) reversed[0].latest = true;
        return reversed;
      };

      const inflight = new Map();
      const fetchProductInfo = async (code) => {
        if (inflight.has(code)) return inflight.get(code);
        const task = (async () => {
          try {
            const data = await pRetry(
              () =>
                throttledFetch(
                  `https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,product_name_ru,brands,categories_tags_ru,categories_tags`,
                ),
              {
                retries: 2,
                minTimeout: 400,
                maxTimeout: 2000,
                shouldRetry: ({ error }) =>
                  error.name !== "AbortError" && error.name !== "TimeoutError",
              },
            );
            const info = { name: null, brand: null, category: null };
            if (data.status === 1 && data.product) {
              const p = data.product;
              info.name = cleanField(p.product_name_ru || p.product_name);
              info.brand = p.brands
                ? cleanField(String(p.brands).split(",")[0])
                : null;
              const tags = p.categories_tags_ru?.length
                ? p.categories_tags_ru
                : p.categories_tags;
              if (Array.isArray(tags) && tags.length) {
                const raw = cleanField(
                  String(tags.at(-1))
                    .replace(/^[a-z]{2}:/, "")
                    .replace(/-/g, " "),
                );
                info.category = raw
                  ? raw.charAt(0).toUpperCase() + raw.slice(1)
                  : null;
              }
            }
            return info;
          } catch {
            return { name: null, brand: null, category: null };
          } finally {
            inflight.delete(code);
          }
        })();
        inflight.set(code, task);
        return task;
      };

      const cloudAvailable = () =>
        supports("6.9") && Boolean(tg.CloudStorage?.getKeys);
      const csGetKeys = () =>
        new Promise((res) =>
          tg.CloudStorage.getKeys((e, k) => res(e ? [] : (k ?? []))),
        );
      const csGetItems = (keys) =>
        new Promise((res) =>
          tg.CloudStorage.getItems(keys, (e, m) => res(e ? {} : (m ?? {}))),
        );
      const csSetItem = (key, val) =>
        new Promise((res) =>
          tg.CloudStorage.setItem(key, val, (e, ok) => res(!e && ok)),
        );
      const csRemoveItems = (keys) =>
        new Promise((res) =>
          keys.length ? tg.CloudStorage.removeItems(keys, () => res()) : res(),
        );

      const localRead = (key) => {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      };
      const localWrite = (key, value) => {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      };
      const localRemove = (key) => {
        try {
          localStorage.removeItem(key);
          return true;
        } catch {
          return false;
        }
      };

      const licensePayload = () =>
        JSON.stringify({
          version: 1,
          product: INVOICE_SLUG,
          paidAt: Date.now(),
        });

      const isValidLicense = (raw) =>
        v.safeParse(LicenseSchema, safeJsonParse(raw)).success;

      const loadLicense = async () => {
        if (isValidLicense(localRead(LOCAL_LICENSE_KEY))) return true;
        if (!cloudAvailable()) return false;
        try {
          const map = await csGetItems([LICENSE_KEY]);
          const rawValue = map[LICENSE_KEY];
          if (!isValidLicense(rawValue)) return false;
          localWrite(LOCAL_LICENSE_KEY, rawValue);
          return true;
        } catch {
          return false;
        }
      };

      const saveLicense = async () => {
        const payload = licensePayload();
        localWrite(LOCAL_LICENSE_KEY, payload);
        if (!cloudAvailable()) return true;
        return csSetItem(LICENSE_KEY, payload);
      };

      const localLoadItems = () => {
        const parsed = safeJsonParse(localRead(LOCAL_ITEMS_KEY));
        return Array.isArray(parsed) ? parsed : null;
      };

      const localSaveItems = (items) =>
        localWrite(LOCAL_ITEMS_KEY, JSON.stringify(items.map(stripFlags)));

      const loadSettings = () => {
        const parsed = v.safeParse(
          SettingsSchema,
          safeJsonParse(localRead(LOCAL_SETTINGS_KEY)),
        );
        return parsed.success ? parsed.output : null;
      };

      const saveSettings = (modules) => {
        const payload = {
          version: SETTINGS_VERSION,
          modules: Object.fromEntries(modules.map((m) => [m.id, m.enabled])),
        };
        localWrite(LOCAL_SETTINGS_KEY, JSON.stringify(payload));
      };

      const cloudLoad = async () => {
        if (!cloudAvailable()) return null;
        try {
          const chunkKeys = (await csGetKeys())
            .filter((k) => CLOUD_CHUNK_RE.test(k))
            .sort((a, b) => Number(a.slice(6)) - Number(b.slice(6)));
          if (!chunkKeys.length) return null;
          const map = await csGetItems(chunkKeys);
          const json = chunkKeys.map((k) => map[k] ?? "").join("");
          const parsed = safeJsonParse(json);
          return Array.isArray(parsed) ? parsed : null;
        } catch {
          return null;
        }
      };

      const cloudSave = async (items) => {
        if (!cloudAvailable()) return false;
        try {
          const json = JSON.stringify(items.map(stripFlags));
          const chunks = [];
          for (let i = 0; i < json.length; i += CLOUD_CHUNK_SIZE)
            chunks.push(json.slice(i, i + CLOUD_CHUNK_SIZE));
          if (chunks.length > CLOUD_MAX_CHUNKS) return false;
          const existing = (await csGetKeys()).filter((k) =>
            CLOUD_CHUNK_RE.test(k),
          );
          await Promise.all(chunks.map((c, i) => csSetItem(`ctrl_c${i}`, c)));
          await csRemoveItems(
            existing.filter((k) => Number(k.slice(6)) >= chunks.length),
          );
          return true;
        } catch {
          return false;
        }
      };

      const haptic = (style = "light") => {
        try {
          tg.HapticFeedback?.impactOccurred?.(style);
        } catch {}
      };
      const notify = (type = "success") => {
        try {
          tg.HapticFeedback?.notificationOccurred?.(type);
        } catch {}
      };
      const selectionHaptic = () => {
        try {
          tg.HapticFeedback?.selectionChanged?.();
        } catch {}
      };
      const confirmDialog = (msg) =>
        supports("6.2")
          ? new Promise((res) => tg.showConfirm(msg, (ok) => res(Boolean(ok))))
          : Promise.resolve(window.confirm(msg));
      const openTelegram = (url) =>
        tg.openTelegramLink ? tg.openTelegramLink(url) : tg.openLink(url);

      let audioCtx;
      const playSuccessSound = async () => {
        try {
          audioCtx ??= new AudioContext();
          if (audioCtx.state === "suspended") await audioCtx.resume();
          const trigger = (freq, time) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.15);
          };
          const now = audioCtx.currentTime;
          trigger(880, now);
          trigger(1318.5, now + 0.07);
        } catch {}
      };

      const renderScale = Math.min(
        Math.max(Math.round(window.devicePixelRatio || 1) + 2, 4),
        6,
      );

      const renderQR = (canvas, item) => {
        try {
          bwip.toCanvas(canvas, {
            bcid: "qrcode",
            text: clampText((item.raw ?? item.code).trim(), MAX_RAW_LENGTH),
            scale: renderScale,
            eclevel: "M",
            padding: 2,
          });
          canvas.style.inlineSize = "128px";
          canvas.style.blockSize = "128px";
          return true;
        } catch {
          return false;
        }
      };

      const renderBarcode = (canvas, item) => {
        try {
          bwip.toCanvas(canvas, {
            bcid: item.code.length === 8 ? "ean8" : "ean13",
            text: item.code,
            scale: renderScale,
            height: 14,
            includetext: false,
          });
          canvas.style.inlineSize = "100%";
          canvas.style.maxInlineSize = "280px";
          canvas.style.blockSize = "auto";
          return true;
        } catch {
          return false;
        }
      };

      const renderCallbacks = new WeakMap();
      const renderObserver = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const cb = renderCallbacks.get(entry.target);
            renderObserver.unobserve(entry.target);
            renderCallbacks.delete(entry.target);
            cb?.();
          }
        },
        { rootMargin: "300px" },
      );
      const lazyRender = (el, fn) => {
        const target = el.closest(".render-zone") ?? el;
        if (renderCallbacks.has(target)) return;
        renderCallbacks.set(target, fn);
        renderObserver.observe(target);
      };

      Alpine.store("state", {
        items: [],
        toast: { on: false, msg: "", type: "ok" },
        isLoading: true,
        hasAccess: false,
        isDarkScheme: tg.colorScheme === "dark",
      });
      Alpine.store("clock", {
        now: Date.now(),
        day: dayjs().format("YYYY-MM-DD"),
      });

      const store = () => Alpine.store("state");
      const persistQueue = new PQueue({ concurrency: 1 });

      let toastTimer;
      let fuseInstance = null;
      let fuseSig = null;

      const buildFuse = (items) => {
        const sig = signature(items);
        if (fuseInstance && fuseSig === sig) return fuseInstance;
        fuseInstance = new Fuse(items, {
          keys: [
            { name: "code", weight: 0.42 },
            { name: "name", weight: 0.28 },
            { name: "brand", weight: 0.14 },
            { name: "category", weight: 0.1 },
            { name: "moduleLabel", weight: 0.06 },
          ],
          threshold: 0.3,
          distance: 100,
          ignoreLocation: true,
          minMatchCharLength: 2,
        });
        fuseSig = sig;
        return fuseInstance;
      };

      const showToast = (msg, type = "ok") => {
        clearTimeout(toastTimer);
        store().toast = { on: true, msg, type };
        toastTimer = setTimeout(() => {
          store().toast = { ...store().toast, on: false };
        }, TOAST_DURATION);
      };

      const cloudSync = debounce((items) => {
        cloudSave(items).catch(() => {});
      }, 1200);

      const persistItems = async (items) => {
        localSaveItems(items);
        cloudSync(items);
      };

      on("info:resolved", ({ id, info }) => {
        store().items = store().items.map((item) =>
          item.id === id
            ? {
                ...item,
                name: info.name ?? item.name,
                brand: info.brand ?? item.brand,
                category: info.category ?? item.category,
              }
            : item,
        );
        persistQueue.add(() => persistItems(store().items.slice()));
      });

      const resolveInfo = (id, code) => {
        fetchProductInfo(code).then((info) => {
          if (info && (info.name || info.brand || info.category))
            emit("info:resolved", { id, info });
        });
      };

      Alpine.data("control", () => ({
        searchQuery: "",
        debouncedQuery: "",
        isSearchFocused: false,
        isMultiScan: false,
        isRenderFlipped: false,
        isPaying: false,
        activeTab: "all",
        scanModules: cloneModules(),
        debug: {
          enabled: false,
          open: false,
          playground: "",
          log: "",
          taps: 0,
          meta: {
            tgVersion: tg.version ?? "n/a",
            platform: tg.platform ?? "web",
          },
        },
        _debugTapTimer: null,

        get hasAccess() {
          return store().hasAccess;
        },
        get isLoading() {
          return store().isLoading;
        },
        get items() {
          return store().items;
        },
        get toast() {
          return store().toast;
        },
        get isDarkScheme() {
          return store().isDarkScheme;
        },
        get userName() {
          return tg.initDataUnsafe?.user?.first_name ?? "";
        },

        get dateTabs() {
          const now = Alpine.store("clock").now;
          const seen = new Set();
          const tabs = [{ key: "all", label: "Все" }];
          for (const item of store().items) {
            const key = dateKey(item.ts);
            if (!seen.has(key)) {
              seen.add(key);
              tabs.push({ key, label: dateLabelAt(item.ts, now) });
            }
          }
          return tabs;
        },

        get activeTabLabel() {
          return (
            this.dateTabs.find((t) => t.key === this.activeTab)?.label ?? "Все"
          );
        },

        get tabItems() {
          if (this.activeTab === "all") return store().items;
          return store().items.filter((i) => dateKey(i.ts) === this.activeTab);
        },

        get filteredItems() {
          const base = this.tabItems;
          const query = this.debouncedQuery.trim();

          let result;
          if (query.length < 2) {
            result = base.slice();
          } else {
            const found = buildFuse(store().items)
              .search(query)
              .map((r) => r.item);
            if (this.activeTab === "all") {
              result = found;
            } else {
              const allowed = new Set(base.map((i) => i.id));
              result = found.filter((i) => allowed.has(i.id));
            }
          }

          return result.sort((a, b) => {
            if (this.activeTab === "all") {
              const dk = dateKey(b.ts).localeCompare(dateKey(a.ts));
              if (dk !== 0) return dk;
            }
            const ck = this.categoryOf(a).localeCompare(
              this.categoryOf(b),
              "ru",
            );
            if (ck !== 0) return ck;
            return b.ts - a.ts;
          });
        },

        get isSearching() {
          return this.debouncedQuery.trim().length >= 2;
        },

        get statsTitle() {
          if (this.isSearching) return "Статистика • Поиск";
          return this.activeTab === "all"
            ? "Статистика • Все"
            : `Статистика • ${this.activeTabLabel}`;
        },

        _statsCache: null,
        _statsSig: null,

        get stats() {
          const items = this.filteredItems;
          const sig = `${this.activeTab}|${this.debouncedQuery.trim()}|${signature(items)}`;
          if (this._statsSig === sig && this._statsCache)
            return this._statsCache;

          const cats = new Set();
          let ean8 = 0;
          let ean13 = 0;
          for (const i of items) {
            cats.add(this.categoryOf(i));
            if (i.code.length === 8) ean8++;
            else ean13++;
          }
          this._statsCache = {
            total: items.length,
            categories: cats.size,
            ean8,
            ean13,
          };
          this._statsSig = sig;
          return this._statsCache;
        },

        get statCells() {
          const s = this.stats;
          return [
            { label: "Кодов", value: s.total, variant: "accent" },
            { label: "Категорий", value: s.categories, variant: "category" },
            { label: "EAN-8", value: s.ean8, variant: "ean8" },
            { label: "EAN-13", value: s.ean13, variant: "ean13" },
          ].map((cell, i) => ({ ...cell, delay: i * 35 }));
        },

        categoryOf(item) {
          return item.category || NO_CATEGORY;
        },

        categoryColor(item) {
          return categoryColorFor(this.categoryOf(item));
        },

        needsCategoryHeader(idx) {
          const items = this.filteredItems;
          const item = items[idx];
          if (idx === 0) return true;
          const prev = items[idx - 1];
          if (this.activeTab === "all" && dateKey(item.ts) !== dateKey(prev.ts))
            return true;
          return this.categoryOf(item) !== this.categoryOf(prev);
        },

        priceHistory(item) {
          const history = buildItemHistory(item);
          return history.length > 1 ? history : EMPTY_HISTORY;
        },

        relativeTime(ts) {
          return relativeTime(ts, Alpine.store("clock").now);
        },
        dateKey,
        dateLabel(ts) {
          return dateLabelAt(ts, Alpine.store("clock").now);
        },
        lazyRender,

        drawQR(canvas, item) {
          if (renderQR(canvas, item)) item.qrOk = true;
          else item.qrErr = true;
        },
        drawBarcode(canvas, item) {
          if (renderBarcode(canvas, item)) item.bcOk = true;
          else item.bcErr = true;
        },

        _searchDebounced: null,
        _swipeObserver: null,
        _gestures: new Set(),
        _scannerOpen: false,
        _backHandler: null,
        _clockInterval: null,
        _easing: "cubic-bezier(0.2, 0, 0, 1)",
        _onClosedScanner: null,
        _booted: false,

        async init() {
          tg.ready();
          tg.expand();
          tg.BackButton.hide();

          if (supports("8.0")) {
            tg.requestFullscreen?.();
            tg.lockOrientation?.();
          }
          tg.disableVerticalSwipes?.();

          this._applyTheme();
          this._applyInsets();
          tg.onEvent("themeChanged", () => this._applyTheme());
          tg.onEvent("safeAreaChanged", () => this._applyInsets());
          tg.onEvent("contentSafeAreaChanged", () => this._applyInsets());
          tg.onEvent("fullscreenChanged", () => this._applyInsets());
          tg.onEvent("viewportChanged", () => this._applyInsets());
          window.addEventListener("pagehide", () => tg.BackButton.hide());

          this._restoreModules();
          this._restoreDebugFlag();

          const identityAccess = checkIdentityAccess();
          const licensed = identityAccess ? true : await loadLicense();
          const granted = OPEN_TO_EVERYONE || identityAccess || licensed;
          if (!granted) {
            store().isLoading = false;
            return;
          }

          store().hasAccess = true;
          await this._bootstrap();
        },

        async _bootstrap() {
          if (this._booted) return;
          this._booted = true;

          const startedAt = performance.now();
          const [cloudItems, localItems] = await Promise.all([
            cloudLoad(),
            Promise.resolve(localLoadItems()),
          ]);
          const incoming = [
            ...(Array.isArray(cloudItems) ? cloudItems : []),
            ...(Array.isArray(localItems) ? localItems : []),
          ]
            .map(sanitizeRecord)
            .filter(Boolean);
          if (incoming.length) {
            const collapsed = mergeItems(incoming, []);
            store().items = collapsed;
            persistQueue.add(() => persistItems(store().items.slice()));
            this._hydrateInfo(collapsed);
          }

          const elapsed = performance.now() - startedAt;
          if (elapsed < SKELETON_DURATION)
            await new Promise((r) =>
              setTimeout(r, SKELETON_DURATION - elapsed),
            );

          store().isLoading = false;

          this.$watch("items", () => {
            this._updateClosingConfirmation();
            this._validateActiveTab();
            this.$nextTick(() => this._initSwipeGestures());
          });
          this._updateClosingConfirmation();

          this._clockInterval = setInterval(() => {
            const c = Alpine.store("clock");
            c.now = Date.now();
            const today = dayjs().format("YYYY-MM-DD");
            if (today !== c.day) {
              c.day = today;
              this._validateActiveTab();
            }
          }, 30_000);

          this._searchDebounced = debounce((val) => {
            this.debouncedQuery = val;
          }, 200);
          this.$watch("searchQuery", (val) => this._searchDebounced(val));

          const easing = getComputedStyle(document.documentElement)
            .getPropertyValue("--motion-standard")
            .trim();
          if (easing) this._easing = easing;

          this.$nextTick(() => this._initSwipeGestures());
        },

        destroy() {
          clearInterval(this._clockInterval);
          this._searchDebounced?.cancel();
          this._swipeObserver?.disconnect();
          this._destroyGestures();
          if (this._onClosedScanner)
            tg.offEvent("scanQrPopupClosed", this._onClosedScanner);
          if (this._backHandler) {
            tg.BackButton.offClick(this._backHandler);
            this._backHandler = null;
          }
        },

        purchaseAccess() {
          if (this.isPaying) return;
          haptic();
          if (!supports("6.1") || typeof tg.openInvoice !== "function") {
            openTelegram(INVOICE_URL);
            return;
          }
          this.isPaying = true;
          tg.openInvoice(INVOICE_URL, (status) =>
            this._onInvoiceClosed(status),
          );
        },

        async _onInvoiceClosed(status) {
          this.isPaying = false;
          if (status === "paid") {
            notify("success");
            playSuccessSound();
            await saveLicense();
            store().hasAccess = true;
            store().isLoading = true;
            await this._bootstrap();
            showToast("Оплата подтверждена. Доступ активирован");
          } else if (status === "failed") {
            notify("error");
            showToast("Платёж не прошёл. Попробуйте ещё раз", "err");
          } else if (status === "pending") {
            showToast("Платёж обрабатывается Telegram", "warn");
          } else {
            selectionHaptic();
          }
        },

        _validateActiveTab() {
          if (this.activeTab === "all") return;
          if (!this.dateTabs.some((t) => t.key === this.activeTab))
            this.activeTab = "all";
        },

        _hydrateInfo(items) {
          for (const item of items) {
            if (!item.name || !item.brand || !item.category)
              resolveInfo(item.id, item.code);
          }
        },

        _applyTheme() {
          const bg = tg.themeParams?.bg_color ?? "#0f1115";
          if (supports("6.9")) {
            tg.setHeaderColor?.(bg);
            tg.setBackgroundColor?.(bg);
          } else {
            tg.setHeaderColor?.("bg_color");
            tg.setBackgroundColor?.("bg_color");
          }
          store().isDarkScheme = tg.colorScheme === "dark";
          document.documentElement.style.colorScheme = tg.colorScheme;
          try {
            tg.setBottomBarColor?.(bg);
          } catch {}
          try {
            if (supports("8.0")) {
              tg.requestSafeArea?.();
              tg.requestContentSafeArea?.();
            }
          } catch {}
        },

        _applyInsets() {
          const root = document.documentElement.style;
          const sa = tg.safeAreaInset ?? {};
          const csa = tg.contentSafeAreaInset ?? {};
          const fsTop = supports("8.0") && tg.isFullscreen ? 56 : 0;
          root.setProperty("--safe-top", `${Math.max(sa.top ?? 0, fsTop)}px`);
          root.setProperty("--safe-bottom", `${sa.bottom ?? 0}px`);
          root.setProperty("--safe-left", `${sa.left ?? 0}px`);
          root.setProperty("--safe-right", `${sa.right ?? 0}px`);
          root.setProperty(
            "--content-top",
            `${(sa.top ?? 0) + (csa.top ?? 0)}px`,
          );
          root.setProperty(
            "--content-bottom",
            `${(sa.bottom ?? 0) + (csa.bottom ?? 0)}px`,
          );
          root.setProperty(
            "--inset-left",
            `${Math.max(sa.left ?? 0, csa.left ?? 0)}px`,
          );
          root.setProperty(
            "--inset-right",
            `${Math.max(sa.right ?? 0, csa.right ?? 0)}px`,
          );
        },

        _updateClosingConfirmation() {
          if (store().items.length) tg.enableClosingConfirmation();
          else tg.disableClosingConfirmation();
        },

        scrollToTop() {
          window.scrollTo({ top: 0, behavior: "smooth" });
        },

        openLink(url) {
          haptic();
          openTelegram(url);
        },

        selectTab(key) {
          if (this.activeTab === key) return;
          selectionHaptic();
          this.activeTab = key;
          this.scrollToTop();
          this.$nextTick(() => this._initSwipeGestures());
        },

        onSearchFocus() {
          this.isSearchFocused = true;
          this.scrollToTop();
          if (!this._backHandler) {
            this._backHandler = () => this.exitSearch();
            tg.BackButton.onClick(this._backHandler);
            tg.BackButton.show();
          }
        },

        onContentTap(event) {
          if (event.target.closest("button, input, a, canvas, .render-zone"))
            return;
          if (
            this.isSearchFocused &&
            document.activeElement === this.$refs.searchInput
          )
            this.$refs.searchInput.blur();
        },

        clearSearch() {
          this.searchQuery = "";
          this.debouncedQuery = "";
          this._searchDebounced?.cancel();
          this.$refs.searchInput?.focus();
        },

        exitSearch() {
          this.searchQuery = "";
          this.debouncedQuery = "";
          this._searchDebounced?.cancel();
          this.isSearchFocused = false;
          this.$refs.searchInput?.blur();
          tg.BackButton.hide();
          if (this._backHandler) {
            tg.BackButton.offClick(this._backHandler);
            this._backHandler = null;
          }
        },

        toggleMultiScan() {
          selectionHaptic();
          this.isMultiScan = !this.isMultiScan;
        },

        toggleRenderMode() {
          selectionHaptic();
          this.isRenderFlipped = !this.isRenderFlipped;
        },

        _destroyGestures() {
          for (const g of this._gestures) {
            try {
              g.destroy();
            } catch {}
          }
          this._gestures.clear();
        },

        _initSwipeGestures() {
          this._swipeObserver?.disconnect();
          this._swipeObserver = null;

          const list = document.querySelector(".item-list");
          if (!list) {
            this._destroyGestures();
            return;
          }

          const easing = this._easing;
          const removeItem = (id) => this.removeItem(id);
          const gestures = this._gestures;

          const attach = (wrapper) => {
            if (wrapper.hasAttribute("data-gesture")) return;
            wrapper.setAttribute("data-gesture", "");
            const card = wrapper.querySelector(".barcode-card");
            if (!card) return;
            const gesture = new TinyGesture(card, {
              threshold: (type) => (type === "x" ? 25 : Infinity),
            });
            gestures.add(gesture);
            let offset = 0;

            gesture.on("panmove", () => {
              if (gesture.touchMoveX === null) return;
              offset = Math.min(0, gesture.touchMoveX);
              card.classList.add("barcode-card--swiping");
              card.style.transform = `translateX(${offset}px)`;
              card.style.transition = "none";
            });

            gesture.on("panend", () => {
              card.style.transition = `transform 200ms ${easing}`;
              card.classList.remove("barcode-card--swiping");
              if (offset < -80) {
                const id = wrapper.dataset.id;
                if (id) removeItem(id);
              } else {
                card.style.transform = "";
              }
              offset = 0;
            });
          };

          this._swipeObserver = new MutationObserver(() => {
            for (const g of [...gestures]) {
              if (g.element && !g.element.isConnected) {
                try {
                  g.destroy();
                } catch {}
                gestures.delete(g);
              }
            }
            list
              .querySelectorAll(".swipe-wrapper:not([data-gesture])")
              .forEach(attach);
          });
          this._swipeObserver.observe(list, { childList: true, subtree: true });
          list.querySelectorAll(".swipe-wrapper").forEach(attach);
        },

        openScanner() {
          if (this._scannerOpen) return;
          if (!supports("6.4")) {
            showToast("Сканер не поддерживается этой версией Telegram", "err");
            return;
          }
          this._scannerOpen = true;
          haptic();

          tg.showScanQrPopup(
            {
              text: this.isMultiScan
                ? "Мультискан • Наведите камеру на QR-код ценника"
                : "Наведите камеру на QR-код ценника",
            },
            (result) => {
              if (!result) {
                this._scannerOpen = false;
                return true;
              }
              return this._processScan(result);
            },
          );

          this._onClosedScanner = () => {
            this._scannerOpen = false;
            tg.offEvent("scanQrPopupClosed", this._onClosedScanner);
            this._onClosedScanner = null;
          };
          tg.onEvent("scanQrPopupClosed", this._onClosedScanner);
        },

        _closeScanner() {
          tg.closeScanQrPopup();
          this._scannerOpen = false;
        },

        _processScan(raw) {
          const parsed = parseScanPayload(raw, this.scanModules);

          if (!parsed) {
            notify("error");
            haptic("medium");
            if (this.isMultiScan) return false;
            const labels = this.scanModules
              .filter((m) => m.enabled)
              .map((m) => m.label)
              .join(", ");
            showToast(
              labels
                ? `Формат не распознан. Вкл.: ${labels}`
                : "Все модули распознавания выключены",
              "err",
            );
            this._closeScanner();
            return true;
          }

          const incomingPrice = formatPrice(parsed.price);
          const incomingTicketTs = ticketDateToTs(parsed.date);
          const existing = store().items.find((i) => i.code === parsed.code);

          if (!existing) {
            notify("success");
            haptic();
            playSuccessSound();
            this._insertItem(parsed, incomingPrice, incomingTicketTs);
            if (this.isMultiScan) return false;
            showToast(`Код ${parsed.code} добавлен`);
            this._closeScanner();
            return true;
          }

          const sameDate =
            (existing.ticketTs ?? null) === (incomingTicketTs ?? null);
          const samePrice =
            (existing.price ?? null) === (incomingPrice ?? null);
          const changed = this._updateItem(
            existing,
            parsed,
            incomingPrice,
            incomingTicketTs,
          );

          if (!changed && sameDate && samePrice) {
            notify("warning");
            haptic("medium");
            if (this.isMultiScan) return false;
            showToast(`Код ${parsed.code} уже в списке`, "warn");
            this._closeScanner();
            return true;
          }

          notify("success");
          haptic();
          playSuccessSound();
          if (this.isMultiScan) return false;
          showToast(`Карточка ${parsed.code} обновлена`);
          this._closeScanner();
          return true;
        },

        _updateItem(existing, parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history = (existing.history ?? []).slice();
          let changed = false;

          if (incomingPrice && parsed.date && incomingTicketTs != null) {
            const idx = history.findIndex(
              (h) => h.ticketTs === incomingTicketTs,
            );
            if (idx === -1) {
              history.push({
                price: incomingPrice,
                date: parsed.date,
                ticketTs: incomingTicketTs,
                ts: now,
              });
              changed = true;
            } else if (history[idx].price !== incomingPrice) {
              history[idx] = {
                price: incomingPrice,
                date: parsed.date,
                ticketTs: incomingTicketTs,
                ts: now,
              };
              changed = true;
            }
          }

          history.sort((a, b) => a.ticketTs - b.ticketTs);
          const latest = history.at(-1) ?? null;

          const priceChanged =
            (existing.price ?? null) !==
            (latest ? latest.price : existing.price);
          const dateChanged =
            (existing.date ?? null) !== (latest ? latest.date : existing.date);
          const rawChanged = (existing.raw ?? null) !== parsed.raw;
          if (priceChanged || dateChanged || rawChanged) changed = true;

          if (!changed) return false;

          store().items = store()
            .items.map((i) =>
              i.id === existing.id
                ? {
                    ...i,
                    raw: parsed.raw,
                    history,
                    price: latest ? latest.price : i.price,
                    date: latest ? latest.date : i.date,
                    ticketTs: latest ? latest.ticketTs : i.ticketTs,
                    moduleId: parsed.moduleId ?? i.moduleId,
                    moduleLabel: parsed.moduleLabel ?? i.moduleLabel,
                    ts: now,
                  }
                : i,
            )
            .sort((a, b) => b.ts - a.ts || (a.id < b.id ? 1 : -1));
          persistQueue.add(() => persistItems(store().items.slice()));
          this._flashCard(existing.id);
          return true;
        },

        _flashCard(id) {
          this.$nextTick(() => {
            const card = document.querySelector(
              `.barcode-card[data-card-id="${cssEscape(id)}"]`,
            );
            card?.animate(
              [
                {
                  boxShadow:
                    "0 0 0 0 color-mix(in srgb, var(--color-primary) 55%, transparent)",
                },
                { boxShadow: "0 0 0 8px transparent" },
              ],
              { duration: 650, easing: this._easing },
            );
          });
        },

        _insertItem(parsed, incomingPrice, incomingTicketTs) {
          const now = Date.now();
          const history =
            incomingPrice && parsed.date && incomingTicketTs != null
              ? [
                  {
                    price: incomingPrice,
                    date: parsed.date,
                    ticketTs: incomingTicketTs,
                    ts: now,
                  },
                ]
              : [];
          const item = createItem({
            code: parsed.code,
            raw: parsed.raw,
            price: incomingPrice,
            date: parsed.date,
            ticketTs: incomingTicketTs,
            name: parsed.name ?? null,
            brand: parsed.brand ?? null,
            category: parsed.category ?? null,
            moduleId: parsed.moduleId,
            moduleLabel: parsed.moduleLabel,
            history,
            ts: now,
          });
          store().items = [item, ...store().items].slice(0, MAX_ITEMS);
          persistQueue.add(() => persistItems(store().items.slice()));
          resolveInfo(item.id, parsed.code);
        },

        async removeItem(id) {
          haptic("medium");
          const wrapper = document.querySelector(
            `.swipe-wrapper[data-id="${cssEscape(id)}"]`,
          );
          const card = wrapper?.querySelector(".barcode-card");
          if (card) {
            try {
              await card.animate(
                [
                  { opacity: 1, transform: "translateX(0) scale(1)" },
                  { opacity: 0, transform: "translateX(-30px) scale(0.95)" },
                ],
                { duration: 180, easing: this._easing, fill: "forwards" },
              ).finished;
            } catch {}
          }
          store().items = store().items.filter((i) => i.id !== id);
          persistQueue.add(() => persistItems(store().items.slice()));
        },

        async clearAll() {
          haptic("medium");
          if (
            !(await confirmDialog("Удалить все записи?\nДействие необратимо."))
          )
            return;

          const wrappers = [
            ...document.querySelectorAll(".swipe-wrapper[data-id]"),
          ];
          wrappers.forEach((el, i) => {
            el.style.animation = `card-out 120ms var(--motion-standard) ${i * 20}ms forwards`;
          });
          if (wrappers.length)
            await new Promise((r) => setTimeout(r, wrappers.length * 20 + 120));

          this.activeTab = "all";
          store().items = [];
          persistQueue.add(() => persistItems([]));
          showToast("История очищена");
          notify("success");
        },

        async copyText(text) {
          haptic();
          let success = false;
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              success = true;
            } catch {}
          }
          showToast(
            success ? "Скопировано в буфер обмена" : "Не удалось скопировать",
            success ? "ok" : "err",
          );
          notify(success ? "success" : "error");
        },

        downloadBarcode(item) {
          haptic();
          if (!supports("8.0") || !tg.downloadFile) {
            showToast(
              "Скачивание не поддерживается этой версией Telegram",
              "err",
            );
            return;
          }
          tg.downloadFile({
            url: `https://barcodeapi.org/api/${item.code.length === 8 ? "EAN8" : "EAN13"}/${item.code}`,
            file_name: `${item.code}.png`,
          });
        },

        _restoreModules() {
          const saved = loadSettings();
          this.scanModules = cloneModules(saved?.modules ?? {});
          activeModules = this.scanModules;
        },

        _persistModules() {
          activeModules = this.scanModules;
          saveSettings(this.scanModules);
        },

        _restoreDebugFlag() {
          const start = String(tg.initDataUnsafe?.start_param ?? "").toLowerCase();
          const query = new URLSearchParams(location.search);
          const hash = location.hash.replace("#", "").toLowerCase();
          const stored = localRead(LOCAL_DEBUG_KEY) === "1";
          this.debug.enabled =
            stored ||
            start === "debug" ||
            start === "dev" ||
            query.has("debug") ||
            hash === "debug";
        },

        _debugWrite(line) {
          const stamp = dayjs().format("HH:mm:ss");
          const next = `[${stamp}] ${line}`;
          this.debug.log = this.debug.log
            ? `${next}\n${this.debug.log}`.slice(0, 4000)
            : next;
        },

        enabledModuleSummary() {
          return this.scanModules
            .filter((m) => m.enabled)
            .map((m) => m.label)
            .join(" · ") || "нет";
        },

        toggleScanModule(id) {
          selectionHaptic();
          this.scanModules = this.scanModules.map((m) =>
            m.id === id ? { ...m, enabled: !m.enabled } : m,
          );
          this._persistModules();
          this._debugWrite(
            `module ${id} → ${this.scanModules.find((m) => m.id === id)?.enabled ? "on" : "off"}`,
          );
        },

        nudgeDebugUnlock() {
          clearTimeout(this._debugTapTimer);
          this.debug.taps += 1;
          this._debugTapTimer = setTimeout(() => {
            this.debug.taps = 0;
          }, 900);
          if (this.debug.taps < 5) return;
          this.debug.taps = 0;
          this.debug.enabled = true;
          localWrite(LOCAL_DEBUG_KEY, "1");
          haptic();
          showToast("Режим отладки включён");
          this.openDebug();
        },

        openDebug() {
          this.debug.open = true;
          this.debug.meta = {
            tgVersion: `${tg.version ?? "n/a"} · v${APP_VERSION}`,
            platform: `${tg.platform ?? "web"} · ${tg.colorScheme ?? "?"}`,
          };
          if (!this.debug.log) this._debugWrite("debug console ready");
        },

        closeDebug() {
          this.debug.open = false;
        },

        debugDisable() {
          this.debug.open = false;
          this.debug.enabled = false;
          localRemove(LOCAL_DEBUG_KEY);
          showToast("Debug выключен", "warn");
        },

        debugFillSamples() {
          this.debug.playground = PARSER_SAMPLES.join("\n");
          this._debugWrite("samples loaded");
        },

        debugParsePlayground() {
          const lines = this.debug.playground
            .split(/\n+/)
            .map((s) => s.trim())
            .filter(Boolean);
          if (!lines.length) {
            this._debugWrite("playground empty");
            return;
          }
          for (const line of lines) {
            const parsed = parseScanPayload(line, this.scanModules);
            this._debugWrite(
              parsed
                ? `${parsed.moduleLabel} → ${parsed.code} ${parsed.price ?? "—"} ${parsed.date ?? ""}`
                : `FAIL ← ${line.slice(0, 48)}`,
            );
          }
        },

        debugIngestPlayground() {
          const lines = this.debug.playground
            .split(/\n+/)
            .map((s) => s.trim())
            .filter(Boolean);
          let added = 0;
          for (const line of lines) {
            const keepOpen = this._processScan(line);
            if (keepOpen !== true || parseScanPayload(line, this.scanModules))
              added += 1;
          }
          this._closeScanner();
          this._debugWrite(`ingest attempted on ${lines.length} line(s)`);
          showToast("Песочница прогнана через сканер");
        },

        debugToastMatrix() {
          showToast("OK тост", "ok");
          setTimeout(() => showToast("Предупреждение", "warn"), 700);
          setTimeout(() => showToast("Ошибка", "err"), 1400);
          this._debugWrite("toast matrix");
        },

        debugHaptics() {
          haptic("light");
          setTimeout(() => haptic("medium"), 180);
          setTimeout(() => haptic("heavy"), 360);
          setTimeout(() => notify("success"), 540);
          setTimeout(() => notify("warning"), 720);
          setTimeout(() => notify("error"), 900);
          this._debugWrite("haptic sequence");
        },

        async debugSound() {
          await playSuccessSound();
          this._debugWrite("sound ok");
        },

        async debugCopy() {
          await this.copyText(`ctrl-debug-${Date.now()}`);
          this._debugWrite("clipboard called");
        },

        async debugCloudRoundtrip() {
          if (!cloudAvailable()) {
            this._debugWrite("cloud unavailable");
            showToast("Cloud Storage недоступен", "warn");
            return;
          }
          const ok = await cloudSave(store().items.slice());
          const back = await cloudLoad();
          this._debugWrite(
            `cloud save=${ok} load=${Array.isArray(back) ? back.length : "null"}`,
          );
          showToast(ok ? "Cloud I/O ок" : "Cloud I/O ошибка", ok ? "ok" : "err");
        },

        debugLocalRoundtrip() {
          const ok = localSaveItems(store().items.slice());
          const back = localLoadItems();
          this._debugWrite(
            `local save=${ok} load=${Array.isArray(back) ? back.length : "null"}`,
          );
          showToast(ok ? "Local I/O ок" : "Local I/O ошибка", ok ? "ok" : "err");
        },

        async debugFetchProduct() {
          const code = store().items[0]?.code ?? "4600605021084";
          const info = await fetchProductInfo(code);
          this._debugWrite(
            `OFF ${code} → ${info.name ?? "—"} / ${info.brand ?? "—"} / ${info.category ?? "—"}`,
          );
        },

        debugSeedItems() {
          for (const sample of PARSER_SAMPLES) {
            const parsed = parseScanPayload(sample, this.scanModules);
            if (!parsed) continue;
            const incomingPrice = formatPrice(parsed.price);
            const incomingTicketTs = ticketDateToTs(parsed.date);
            const existing = store().items.find((i) => i.code === parsed.code);
            if (existing)
              this._updateItem(
                existing,
                parsed,
                incomingPrice,
                incomingTicketTs,
              );
            else this._insertItem(parsed, incomingPrice, incomingTicketTs);
          }
          this._debugWrite("seed applied");
          showToast("Тестовые карточки добавлены");
        },

        debugRenderStress() {
          for (const item of store().items) {
            item.qrOk = false;
            item.qrErr = false;
            item.bcOk = false;
            item.bcErr = false;
          }
          store().items = store().items.slice();
          this._debugWrite("render flags reset");
        },

        debugCapabilities() {
          const flags = {
            scanner: supports("6.4"),
            cloud: cloudAvailable(),
            invoice: supports("6.1") && typeof tg.openInvoice === "function",
            download: supports("8.0") && Boolean(tg.downloadFile),
            fullscreen: supports("8.0"),
            confirm: supports("6.2"),
            items: store().items.length,
            modules: this.enabledModuleSummary(),
          };
          this._debugWrite(JSON.stringify(flags));
        },

        async debugRunSuite() {
          this._debugWrite(`suite start v${APP_VERSION}`);
          this.debugCapabilities();
          this.debugFillSamples();
          this.debugParsePlayground();
          this.debugSeedItems();
          await this.debugSound();
          this.debugHaptics();
          this.debugLocalRoundtrip();
          await this.debugCloudRoundtrip();
          await this.debugFetchProduct();
          this._debugWrite("suite done");
          showToast("Полный suite выполнен");
        },
      }));

      Alpine.start();
    </script>
  </body>
</html>
